ad es una de las propiedades ACID que asegura que una vez que una transacción ha sido confirmada, sus efectos son permanentes y persistirán incluso en caso de fallos del sistema, como cortes de energía o errores del software."},{"i":"DATA-ALG-014","k":"3.3","d":"Básico","q":"Cuando se ejecuta la instrucción `db.profesor.insertOne({Profesor:\"Raúl Martinez\", Materia:\"Control Digital\"})` en MongoDB, ¿cuál es el resultado de la inserción?","o":["Se crea un documento solo con el campo `_id` y `Profesor`.","Se crea un documento con un `_id` autogenerado y los campos `Profesor` y `Materia`.","Se crea un documento solo con el campo `_id` y `Materia`."],"a":1,"h":"MongoDB es una base de datos NoSQL orientada a documentos, que almacena datos en un formato similar a JSON (llamado BSON).","e":"La operación `insertOne` inserta un único documento en una colección. MongoDB añade automáticamente un campo `_id` único si no se provee, y todos los pares clave-valor del objeto pasado como argumento se incluyen en el documento almacenado."},{"i":"DATA-ALG-015","k":"3.3","d":"Medio","q":"Un DBA novato se conecta a una base de datos Oracle y observa la existencia de dos tablespaces llamados `DATOS` e `INDX`. ¿Cuál es la razón técnica más probable para esta configuración?","o":["Mejorar el rendimiento del manejador al separar físicamente los datos y los índices.","Es la configuración por defecto de todas las instalaciones de Oracle.","Es simplemente una cuestión de estándar de nomenclatura sin impacto técnico."],"a":0,"h":"Piensa en cómo el disco duro accede a la información. ¿Ayudaría separar los tipos de datos que se leen de forma diferente?","e":"Separar los datos y los índices en diferentes tablespaces (e idealmente en diferentes discos físicos) es una práctica común de optimización. Permite que el sistema realice operaciones de I/O en paralelo: por ejemplo, leer un índice en un disco mientras escribe datos en otro, reduciendo la contención del disco y mejorando el rendimiento.","f":1},{"i":"DATA-ALG-016","k":"3.3","d":"Medio","q":"Durante una transferencia bancaria, el sistema descuenta $500 de la cuenta A. Justo antes de depositarlos en la cuenta B, otra transacción deposita $10,000 en la cuenta B. La primera transacción finaliza y deposita los $500. El resultado final es correcto gracias a que las transacciones no interfieren entre sí. ¿Qué propiedad ACID garantiza este comportamiento?","o":["Atomicidad","Aislamiento (Isolation)","Consistencia"],"a":1,"h":"Esta propiedad asegura que las transacciones concurrentes no se 'vean' entre sí hasta que hayan finalizado.","e":"El aislamiento garantiza que las operaciones de una transacción estén ocultas de otras transacciones concurrentes. Aunque ambas transacciones operan sobre la cuenta B, se ejecutan de forma aislada, como si ocurrieran una después de la otra, evitando inconsistencias."},{"i":"DATA-ALG-017","k":"3.3","d":"Medio","q":"Se necesita desarrollar un sistema de recomendaciones para deportistas extremos, basándose en sus perfiles, conexiones con otros deportistas y preferencias. ¿Qué tipo de base de datos NoSQL es ideal para modelar y consultar este tipo de relaciones complejas?","o":["Columnar","Clave-Valor","Grafo"],"a":2,"h":"Este tipo de base de datos se especializa en almacenar entidades y las relaciones entre ellas.","e":"Las bases de datos de grafos están diseñadas específicamente para gestionar datos altamente conectados. Son ideales para sistemas de recomendación, redes sociales y detección de fraudes, ya que las consultas para navegar relaciones (ej. 'amigos de mis amigos que prefieren el paracaidismo') son extremadamente eficientes."},{"i":"DATA-ALG-018","k":"3.3","d":"Avanzado","q":"El concepto que define un ordenamiento global de las operaciones de múltiples transacciones concurrentes, de tal forma que se respete el orden interno de cada una, se conoce como:","o":["Nivel de aislamiento","Modo de acceso","Planificación de Transacciones (Schedule)"],"a":2,"h":"Es el resultado de intercalar las operaciones de varias transacciones a lo largo del tiempo.","e":"Una planificación (schedule) es una secuencia de las operaciones de un conjunto de transacciones concurrentes. El DBMS se encarga de ejecutar una planificación que sea serializable, es decir, que el resultado sea equivalente al de ejecutar las transacciones una después de otra en algún orden, garantizando así la consistencia."},{"i":"DATA-ALG-019","k":"3.3","d":"Básico","q":"En un sistema de base de datos donde múltiples aplicaciones y usuarios acceden a los datos simultáneamente, ¿qué componente central se encarga de arbitrar todas las peticiones para mantener la integridad y consistencia?","o":["El Sistema de Gestión de Bases de Datos (DBMS)","El sistema operativo del servidor","El middleware de la aplicación"],"a":0,"h":"Este software actúa como un intermediario entre el usuario y la base de datos física.","e":"El DBMS es el software que gestiona toda la interacción con la base de datos. Se encarga del control de concurrencia, la seguridad, la ejecución de consultas y la garantía de las propiedades ACID, coordinando todas las peticiones para evitar conflictos."},{"i":"DATA-ALG-020","k":"3.3","d":"Medio","q":"En una base de datos NoSQL orientada a documentos como MongoDB, ¿cómo se denomina la estructura que almacena un conjunto de documentos relacionados?","o":["Colección (Collection)","Tabla (Table)","Índice (Index)"],"a":0,"h":"A diferencia de las bases de datos relacionales, este término no implica una estructura rígida con filas y columnas.","e":"En MongoDB, una colección es un grupo de documentos almacenados en la base de datos. A diferencia de las tablas en bases de datos relacionales, las colecciones no requieren un esquema fijo, permitiendo que los documentos dentro de ellas tengan estructuras variadas."},{"i":"DATA-ALG-021","k":"3.3","d":"Básico","q":"Los usuarios de un sistema reportan lentitud generalizada. ¿Cuál es el rol principal cuya función es monitorear el rendimiento, identificar consultas ineficientes y asegurar que la base de datos opere de forma óptima?","o":["El Administrador de la Base de Datos (DBA)","El desarrollador backend","El administrador de redes"],"a":0,"h":"Esta persona es la responsable de la salud y el mantenimiento general de la base de datos.","e":"Una de las funciones clave de un DBA es la optimización y el monitoreo del rendimiento (performance tuning). Esto incluye revisar planes de ejecución de consultas, gestionar índices, y ajustar la configuración del DBMS para garantizar tiempos de respuesta adecuados."},{"i":"DATA-ALG-022","k":"3.3","d":"Avanzado","q":"En una base de datos relacional, ¿qué técnica se utiliza para mejorar el rendimiento de las consultas mediante la creación de estructuras adicionales que permiten un acceso más rápido a los datos?","o":["Indexación","Normalización","Particionamiento"],"a":0,"h":"Esta técnica crea una estructura separada que apunta a las filas en una tabla, similar al índice de un libro.","e":"La indexación es una técnica que crea índices sobre una o más columnas de una tabla para acelerar las operaciones de búsqueda y consulta. Los índices permiten al DBMS localizar rápidamente las filas que cumplen con ciertos criterios sin tener que escanear toda la tabla."},{"i":"DATA-ALG-023","k":"3.3","d":"Avanzado","q":"En un sistema de base de datos relacional, ¿qué proceso implica dividir una tabla grande en tablas más pequeñas y relacionadas para reducir la redundancia y mejorar la integridad de los datos?","o":["Desnormalización","Normalización","Indexación"],"a":1,"h":"Este proceso sigue un conjunto de reglas conocidas como formas normales.","e":"La normalización es el proceso de organizar los datos en una base de datos para minimizar la redundancia y dependencia. Se logra dividiendo tablas grandes en tablas más pequeñas y definiendo relaciones entre ellas, siguiendo reglas conocidas como formas normales (1NF, 2NF, 3NF, etc.)."},{"i":"DATA-ALG-024","k":"3.3","d":"Medio","q":"Al recibir una consulta SQL como `SELECT * FROM clientes;`, ¿cuál es el primer paso que realiza el DBMS en su proceso de compilación?","o":["Verificar la sintaxis de la consulta (análisis léxico y sintáctico).","Validar que la tabla 'clientes' y sus columnas existan en el diccionario de datos.","Crear el plan de ejecución para acceder a los datos de la forma más eficiente."],"a":0,"h":"Antes de entender el significado de una frase, primero debes asegurarte de que las palabras y la gramática son correctas.","e":"El primer paso es siempre el análisis (parsing). El DBMS descompone la cadena de texto de la consulta en componentes individuales (tokens) y verifica que la secuencia siga las reglas gramaticales de SQL. Si la sintaxis es incorrecta, el proceso se detiene aquí con un error."},{"i":"DATA-ALG-025","k":"3.3","d":"Básico","q":"En un esquema con las tablas `Facturas` (hijo) y `Clientes` (padre), unidas por una llave foránea. ¿En qué situación se produce una violación de la integridad referencial?","o":["Al insertar una factura para un cliente que sí existe en la tabla `Clientes`.","Al definir la llave foránea en `Facturas` para que permita valores nulos.","Al intentar insertar una factura con un `cve_cliente` que no existe en la tabla `Clientes`."],"a":2,"h":"La integridad referencial asegura que una fila 'hija' no puede existir sin su correspondiente fila 'padre'.","e":"La regla de integridad referencial dicta que el valor de una llave foránea debe coincidir con un valor de la llave primaria de la tabla padre, o ser nulo (si se permite). Intentar insertar un valor en la tabla hija que no tiene correspondencia en la tabla padre es la violación clásica de esta regla."},{"i":"DATA-ALG-026","k":"3.3","d":"Medio","q":"Un desarrollador de software está implementando la funcionalidad 'deshacer' (undo) en un editor de texto. Cada acción del usuario (escribir, borrar, etc.) debe poder revertirse en el orden inverso al que se realizó. ¿Qué estructura de datos es la más adecuada para gestionar estas acciones?","o":["Cola (Queue)","Pila (Stack)","Lista Doblemente Enlazada"],"a":1,"h":"El último en entrar es el primero en salir.","e":"Una Pila (Stack) sigue el principio LIFO (Last-In, First-Out), lo que permite que la acción más reciente sea la primera en ser deshecha, modelando perfectamente el comportamiento de la funcionalidad 'undo'."},{"i":"DATA-ALG-027","k":"3.3","d":"Medio","q":"En una empresa de logística, se necesita procesar los pedidos de envío en el orden exacto en que fueron recibidos para garantizar la equidad. Si un nuevo pedido llega, debe esperar a que todos los pedidos anteriores sean despachados. ¿Qué estructura de datos debería usar el sistema para gestionar la cola de envíos?","o":["Pila (Stack)","Árbol Binario de Búsqueda","Cola (Queue)"],"a":2,"h":"El primero que llega es el primero en ser atendido.","e":"Una Cola (Queue) utiliza el principio FIFO (First-In, First-Out), asegurando que los elementos se procesen en el orden de llegada, lo cual es ideal para un sistema de gestión de pedidos."},{"i":"DATA-ALG-028","k":"3.3","d":"Avanzado","q":"Un ingeniero está diseñando una base de datos para una aplicación de e-commerce y crea una tabla 'Pedidos' con las columnas: PedidoID, ClienteID, ClienteNombre, ProductoID, ProductoNombre, Cantidad. Este diseño causa redundancia de datos, ya que el nombre del cliente y del producto se repiten en múltiples filas. ¿Qué Forma Normal (FN) se está violando principalmente?","o":["Primera Forma Normal (1NF)","Segunda Forma Normal (2NF)","Tercera Forma Normal (3NF)"],"a":1,"h":"Dependencia parcial de la clave primaria.","e":"Se viola la 2NF porque los atributos 'ClienteNombre' y 'ProductoNombre' no dependen de la clave primaria completa (que sería una combinación de PedidoID, ClienteID, ProductoID), sino solo de una parte de ella (ClienteID y ProductoID, respectivamente). Para cumplir 2NF, estos datos deberían estar en tablas separadas ('Clientes' y 'Productos')."},{"i":"DATA-ALG-029","k":"3.3","d":"Medio","q":"El equipo de marketing necesita un reporte que muestre todos los clientes y, si han realizado una compra, el ID de su pedido más reciente. Es crucial que en el reporte aparezcan también los clientes que nunca han comprado. ¿Qué tipo de JOIN en SQL se debe utilizar entre la tabla 'Clientes' y 'Pedidos'?","o":["INNER JOIN","LEFT JOIN","RIGHT JOIN"],"a":1,"h":"Traer todo de la tabla izquierda, y lo que coincida de la derecha.","e":"Un LEFT JOIN desde la tabla 'Clientes' hacia 'Pedidos' devolverá todos los registros de la tabla de clientes, y los registros coincidentes de la tabla de pedidos. Si no hay coincidencia (el cliente no tiene pedidos), las columnas de 'Pedidos' aparecerán como NULL."},{"i":"DATA-ALG-030","k":"3.3","d":"Avanzado","q":"Una aplicación de red social necesita sugerir 'amigos de amigos'. Para encontrar la cadena de conexión más corta entre dos usuarios, el sistema debe explorar la red de contactos nivel por nivel a partir del usuario de origen. ¿Qué algoritmo de recorrido de grafos es el más adecuado para esta tarea?","o":["Búsqueda en Profundidad (DFS)","Recorrido Inorder","Búsqueda en Amplitud (BFS)"],"a":2,"h":"Explora por niveles de 'cercanía'.","e":"La Búsqueda en Amplitud (BFS) explora los vecinos más cercanos primero (nivel 1), luego los vecinos de esos vecinos (nivel 2), y así sucesivamente. Esto garantiza que la primera vez que se encuentra al usuario destino, se habrá hecho a través del camino más corto."},{"i":"DATA-ALG-031","k":"3.3","d":"Medio","q":"Un sistema de autocompletado de texto debe buscar rápidamente palabras en un diccionario. El diccionario está almacenado en una lista ordenada alfabéticamente. Para optimizar el tiempo de respuesta, ¿qué algoritmo de búsqueda ofrece la mejor complejidad temporal?","o":["Búsqueda Lineal","Búsqueda Binaria","Búsqueda por Hash"],"a":1,"h":"Divide y vencerás en un conjunto ordenado.","e":"Dado que la lista está ordenada, la Búsqueda Binaria es la más eficiente. Reduce el espacio de búsqueda a la mitad en cada paso, logrando una complejidad de O(log n), muy superior a la búsqueda lineal O(n)."},{"i":"DATA-ALG-032","k":"3.3","d":"Medio","q":"Una empresa está migrando su sistema de gestión de blogs. La estructura de los artículos puede variar mucho: algunos tienen encuestas, otros galerías de video y otros solo texto. Quieren una base de datos que no les obligue a definir una estructura rígida y que facilite añadir nuevos campos en el futuro. ¿Qué tipo de base de datos es más recomendable?","o":["Relacional (SQL) como MySQL","Documental (NoSQL) como MongoDB","De Grafos como Neo4j"],"a":1,"h":"Esquemas flexibles y datos en formato similar a JSON.","e":"Las bases de datos documentales (NoSQL) son ideales para este caso de uso. Permiten esquemas flexibles donde cada documento (artículo) puede tener una estructura diferente, facilitando la evolución del modelo de datos sin migraciones complejas."},{"i":"DATA-ALG-033","k":"3.3","d":"Medio","q":"Un desarrollador necesita modificar una tabla existente llamada 'Productos' para añadir una columna 'Stock' de tipo entero que no puede ser nula y debe tener un valor por defecto de 0. ¿Qué comando DDL de SQL debe utilizar?","o":["CREATE TABLE Productos ...","UPDATE TABLE Productos SET Stock = 0;","ALTER TABLE Productos ADD Stock INT NOT NULL DEFAULT 0;"],"a":2,"h":"Modificar la estructura de una tabla existente.","e":"El comando 'ALTER TABLE' se utiliza para modificar la estructura de una tabla existente. 'ADD' permite añadir una nueva columna con sus respectivas restricciones y valores por defecto. CREATE es para crear tablas y UPDATE es un comando DML para modificar datos."},{"i":"DATA-ALG-034","k":"3.3","d":"Avanzado","q":"Un algoritmo de ordenamiento procesa una lista de `n` elementos. En el peor de los casos, realiza una cantidad de comparaciones proporcional a `n * n`. ¿Cuál es la notación Big O que representa esta complejidad temporal?","o":["O(n log n)","O(n)","O(n²)"],"a":2,"h":"Típico de algoritmos que comparan cada elemento con todos los demás.","e":"Una complejidad de O(n²) (cuadrática) es característica de algoritmos que utilizan bucles anidados para comparar cada elemento con todos los demás, como Bubble Sort, Selection Sort o Insertion Sort en su peor caso."},{"i":"DATA-ALG-035","k":"3.3","d":"Medio","q":"Se está construyendo una aplicación de música que necesita una playlist donde el usuario pueda añadir y quitar canciones eficientemente desde cualquier posición, y navegar entre la canción 'siguiente' y 'anterior'. Un arreglo (array) resulta lento para las inserciones y eliminaciones en medio de la lista. ¿Qué estructura de datos sería más eficiente?","o":["Pila (Stack)","Lista Doblemente Enlazada","Arreglo dinámico"],"a":1,"h":"Nodos con punteros hacia adelante y hacia atrás.","e":"Una Lista Doblemente Enlazada es ideal. Cada nodo (canción) tiene una referencia al siguiente y al anterior, permitiendo inserciones/eliminaciones en O(1) (si se tiene el nodo) y una navegación bidireccional eficiente."},{"i":"DATA-ALG-036","k":"3.3","d":"Avanzado","q":"Para mostrar el contenido de un sistema de archivos (carpetas y subcarpetas) en una vista de árbol jerárquica, un programador necesita procesar cada nodo (directorio o archivo). El objetivo es listar un directorio y luego, recursivamente, listar el contenido de todos sus subdirectorios antes de pasar al siguiente directorio en el mismo nivel. ¿Qué tipo de recorrido de árbol se asemeja a este proceso?","o":["Inorder","Postorder","Preorder"],"a":2,"h":"Procesar el nodo raíz, luego el subárbol izquierdo, luego el derecho.","e":"El recorrido Preorder (Raíz, Izquierda, Derecha) procesa el nodo actual (el directorio) primero, y luego explora recursivamente sus hijos (subdirectorios). Esto coincide con la lógica de listar una carpeta y luego adentrarse en su contenido."},{"i":"DATA-ALG-037","k":"3.3","d":"Medio","q":"Una empresa necesita eliminar todos los registros de empleados que fueron contratados antes del año 2020 de la tabla 'Empleados'. ¿Cuál es la consulta DML de SQL correcta para realizar esta acción?","o":["DROP TABLE Empleados WHERE anio_contratacion < 2020;","DELETE FROM Empleados WHERE anio_contratacion < 2020;","UPDATE Empleados SET status = 'inactivo' WHERE anio_contratacion < 2020;"],"a":1,"h":"Eliminar filas que cumplen una condición.","e":"El comando 'DELETE FROM' se utiliza para eliminar filas de una tabla. La cláusula 'WHERE' especifica la condición que deben cumplir las filas para ser eliminadas. DROP TABLE eliminaría la tabla completa y UPDATE solo modificaría los registros."},{"i":"DATA-ALG-038","k":"3.3","d":"Medio","q":"Al diseñar el diagrama Entidad-Relación para una base de datos de una biblioteca, se debe modelar que un 'Libro' puede ser escrito por 'Muchos' autores, y un 'Autor' puede escribir 'Muchos' libros. ¿Qué tipo de cardinalidad representa esta relación?","o":["Uno a Muchos (1:N)","Muchos a Muchos (N:M)","Uno a Uno (1:1)"],"a":1,"h":"Se necesita una tabla intermedia para resolver esta relación.","e":"Esta es una relación de Muchos a Muchos (N:M). En el modelo relacional, este tipo de relación se implementa generalmente creando una tabla asociativa o intermedia que conecta las claves primarias de las tablas 'Libros' y 'Autores'."},{"i":"DATA-ALG-039","k":"3.3","d":"Medio","q":"Un desarrollador está trabajando con una lista de notificaciones que ya está casi ordenada por fecha. Para ordenarla completamente, necesita un algoritmo que sea muy eficiente en este escenario de 'casi ordenado'. ¿Cuál de los siguientes algoritmos de ordenamiento tiene un rendimiento cercano a O(n) en este caso?","o":["Quick Sort","Insertion Sort","Merge Sort"],"a":1,"h":"Este algoritmo simple funciona bien cuando los elementos están cerca de su posición final.","e":"Insertion Sort (Ordenamiento por Inserción) es un algoritmo adaptativo. Si la lista está casi ordenada, realizará muy pocas comparaciones e intercambios, logrando una complejidad temporal cercana a O(n), lo que lo hace muy eficiente para este caso específico."},{"i":"DATA-ALG-040","k":"3.3","d":"Avanzado","q":"Un sistema de caché necesita almacenar datos temporalmente para un acceso ultrarrápido, usando una clave única para cada dato guardado. La estructura de los datos es simple y no se requieren relaciones complejas ni consultas avanzadas, solo recuperación por clave. ¿Qué tipo de base de datos NoSQL es la más adecuada?","o":["Documental","De Grafos","Clave-Valor"],"a":2,"h":"Como un diccionario gigante y persistente.","e":"Las bases de datos Clave-Valor (ej. Redis) están diseñadas para este propósito. Ofrecen un rendimiento extremadamente alto para operaciones de lectura y escritura basadas en una clave única, lo que las hace perfectas para implementaciones de caché."},{"i":"DATA-ALG-041","k":"3.3","d":"Medio","q":"Un ingeniero necesita obtener una lista de productos junto con el nombre de su categoría correspondiente. Los datos están en dos tablas: 'Productos' (con 'categoria_id') y 'Categorias' (con 'id' y 'nombre'). Si un producto tiene una 'categoria_id' que no existe en la tabla 'Categorias', no debe aparecer en el resultado. ¿Qué tipo de JOIN es el más apropiado?","o":["LEFT JOIN","FULL OUTER JOIN","INNER JOIN"],"a":2,"h":"Solo filas donde la clave de unión existe en ambas tablas.","e":"Un INNER JOIN es la elección correcta porque solo devuelve las filas que tienen valores coincidentes en ambas tablas. De esta manera, se excluyen los productos cuya 'categoria_id' no tiene una correspondencia en la tabla 'Categorias'."},{"i":"DATA-ALG-042","k":"3.3","d":"Avanzado","q":"Una aplicación necesita ordenar un conjunto de datos tan grande que no cabe en la memoria RAM principal y debe permanecer en el disco. El algoritmo debe ser capaz de dividir el archivo en trozos más pequeños, ordenarlos en memoria y luego combinarlos de nuevo en el disco. ¿Qué algoritmo de ordenamiento es fundamental para esta estrategia de 'ordenamiento externo'?","o":["Bubble Sort","Merge Sort","Insertion Sort"],"a":1,"h":"Su naturaleza de 'divide y vencerás' se presta a la combinación de segmentos ordenados.","e":"Merge Sort (Ordenamiento por Mezcla) es ideal para el ordenamiento externo. Su método consiste en dividir la lista hasta tener sublistas de un elemento, y luego mezclarlas (merge) de forma ordenada. Este proceso de mezcla se puede aplicar eficientemente a trozos de datos ordenados desde el disco."},{"i":"DATA-ALG-043","k":"3.3","d":"Medio","q":"Un sistema debe representar un mapa de carreteras como una red de ciudades y las autopistas que las conectan. Se necesita una estructura de datos que modele eficientemente las ciudades (nodos) y las autopistas (aristas). ¿Cuál es la estructura de datos no lineal diseñada para este tipo de problema?","o":["Árbol Binario de Búsqueda","Grafo","Pila"],"a":1,"h":"Vértices y aristas.","e":"Un Grafo es la estructura de datos perfecta para modelar redes. Los vértices (o nodos) representan las ciudades y las aristas (o arcos) representan las autopistas que las conectan, permitiendo aplicar algoritmos para encontrar rutas, conexiones, etc."},{"i":"DATA-ALG-044","k":"3.3","d":"Medio","q":"Un desarrollador implementa un Árbol Binario de Búsqueda (BST) para almacenar números enteros. Para verificar si la estructura es correcta, necesita imprimir todos los elementos en orden ascendente. ¿Qué recorrido debe aplicar al árbol?","o":["Preorder","Inorder","Postorder"],"a":1,"h":"Visita izquierda, luego raíz, luego derecha.","e":"El recorrido Inorder (Izquierda, Raíz, Derecha) en un Árbol Binario de Búsqueda siempre visita los nodos en orden ascendente de sus claves. Es la propiedad fundamental que hace a los BSTs útiles para mantener datos ordenados."},{"i":"DATA-ALG-045","k":"3.3","d":"Medio","q":"En una base de datos de una universidad, la tabla 'Estudiantes' tiene una columna 'direccion_completa'. Un consultor señala que esto viola la Primera Forma Normal (1NF). ¿Por qué razón?","o":["La dirección contiene datos que no son atómicos y pueden dividirse.","La dirección depende de otra columna que no es la clave primaria.","La tabla contiene filas duplicadas."],"a":0,"h":"Los valores de las columnas deben ser indivisibles.","e":"La Primera Forma Normal (1NF) estipula que todos los atributos (columnas) de una tabla deben contener valores atómicos (indivisibles). Una dirección completa se puede dividir en calle, número, ciudad, código postal, etc., por lo que viola este principio."},{"i":"DATA-ALG-046","k":"3.3","d":"Avanzado","q":"Una función recursiva calcula el n-ésimo número de Fibonacci. Su complejidad temporal es O(2^n), lo cual es muy ineficiente. Un colega sugiere optimizarla guardando los resultados ya calculados en un arreglo para no repetir cómputos. ¿Cuál es la complejidad aproximada de la versión optimizada con memorización?","o":["O(log n)","O(n)","O(n²)"],"a":1,"h":"Cada número de Fibonacci solo se calculará una vez.","e":"Con memorización (una forma de programación dinámica), cada número de la secuencia de Fibonacci hasta `n` se calcula una sola vez. Después, se recupera del almacenamiento en tiempo O(1). Por lo tanto, el costo total se reduce a recorrer la secuencia una vez, lo que da una complejidad lineal O(n)."},{"i":"DATA-ALG-047","k":"3.3","d":"Medio","q":"Un administrador de base de datos necesita renombrar la tabla 'TempUsers' a 'UsuariosRegistrados'. ¿Qué comando SQL y de qué sublenguaje (DDL o DML) debería usar?","o":["UPDATE TempUsers RENAME TO UsuariosRegistrados; (DML)","ALTER TABLE TempUsers RENAME TO UsuariosRegistrados; (DDL)","SELECT * INTO UsuariosRegistrados FROM TempUsers; (DML)"],"a":1,"h":"La modificación de la estructura de la base de datos es parte del Lenguaje de Definición de Datos.","e":"El comando para renombrar una tabla es 'ALTER TABLE ... RENAME TO ...'. Como esta operación modifica el esquema (la definición) de la base de datos, pertenece al Lenguaje de Definición de Datos (DDL)."},{"i":"DATA-ALG-048","k":"3.3","d":"Medio","q":"Una aplicación web gestiona un historial de navegación por usuario. Para permitir que el usuario retroceda página por página, se guarda cada URL visitada. Al presionar el botón 'atrás', se debe mostrar la URL visitada inmediatamente antes. ¿Qué estructura de datos es idónea para gestionar este historial para la función 'atrás'?","o":["Cola (Queue)","Lista Enlazada Simple","Pila (Stack)"],"a":2,"h":"El último sitio visitado es el primero al que se regresa.","e":"Una Pila (Stack) es perfecta para esto. Cada vez que se visita una nueva página, se hace 'push' de su URL a la pila. Al presionar 'atrás', se hace 'pop', obteniendo la última página visitada (principio LIFO)."},{"i":"DATA-ALG-049","k":"3.3","d":"Avanzado","q":"Al analizar un sistema, un ingeniero nota que una consulta para buscar un cliente por su email (que no está indexado) en una tabla con millones de registros es muy lenta. El sistema gestor de base de datos debe revisar cada fila, una por una, hasta encontrar la coincidencia. ¿Cuál es la complejidad temporal (Big O) de esta operación de búsqueda?","o":["O(1)","O(log n)","O(n)"],"a":2,"h":"Revisión exhaustiva de todos los elementos.","e":"Sin un índice, la base de datos no tiene más opción que realizar una búsqueda lineal (table scan), examinando cada uno de los `n` registros en el peor de los casos. Por lo tanto, la complejidad es O(n)."},{"i":"DATA-ALG-050","k":"3.3","d":"Avanzado","q":"En el diseño de una base de datos, se tiene una tabla 'Empleados' con las columnas: EmpleadoID, Nombre, DepartamentoID, NombreDepartamento, UbicacionDepartamento. Se observa que 'UbicacionDepartamento' depende de 'NombreDepartamento', el cual a su vez depende de 'DepartamentoID'. Esto introduce anomalías de actualización. ¿Qué forma normal se está violando debido a esta dependencia transitiva?","o":["Primera Forma Normal (1NF)","Segunda Forma Normal (2NF)","Tercera Forma Normal (3NF)"],"a":2,"h":"Un atributo que no es clave no debe depender de otro atributo que tampoco es clave.","e":"Se viola la Tercera Forma Normal (3NF). La 3NF prohíbe las dependencias transitivas. En este caso, el atributo no-clave 'UbicacionDepartamento' depende de otro atributo no-clave 'NombreDepartamento', en lugar de depender directamente y únicamente de la clave primaria. La solución es mover 'NombreDepartamento' y 'UbicacionDepartamento' a una tabla 'Departamentos'."},{"i":"DATA-ALG-051","k":"3.3","d":"Medio","q":"Un sistema de planificación de procesos debe atender tareas en el orden exacto de llegada. Si una tarea A llega antes que una tarea B, A debe ser procesada primero. ¿Qué estructura de datos lineal es la más apropiada para administrar estas tareas?","o":["Pila (Stack)","Cola (Queue)","Lista Doblemente Enlazada"],"a":1,"h":"Primero en entrar, primero en salir (FIFO).","e":"Una Cola (Queue) sigue el principio FIFO (First-In, First-Out), lo que garantiza que las tareas se procesen en el orden en que se recibieron, siendo el modelo ideal para este escenario."},{"i":"DATA-ALG-052","k":"3.3","d":"Avanzado","q":"Un ingeniero está depurando una función recursiva que causa un 'stack overflow'. Este error ocurre porque la función se llama a sí misma demasiadas veces sin llegar a un caso base. ¿Qué estructura de datos subyacente, gestionada por el sistema operativo, se ha desbordado?","o":["El Heap","La Pila de Llamadas (Call Stack)","La Cola de Mensajes"],"a":1,"h":"Cada llamada a función ocupa un espacio en esta estructura.","e":"La Pila de Llamadas (Call Stack) es una estructura de datos LIFO que almacena información sobre las subrutinas activas de un programa. Cada llamada recursiva añade un nuevo 'marco' a la pila, y una recursión infinita o muy profunda agota el espacio asignado a esta, causando un desbordamiento."},{"i":"DATA-ALG-053","k":"3.3","d":"Medio","q":"Un programador necesita almacenar una colección de elementos cuyo tamaño cambiará dinámicamente con frecuentes inserciones y eliminaciones en medio de la lista. Usar un arreglo (array) sería ineficiente debido al costo de desplazar elementos. ¿Qué estructura de datos lineal ofrece una mayor eficiencia para estas operaciones?","o":["Arreglo Estático","Lista Enlazada","Cola (Queue)"],"a":1,"h":"Los elementos no son contiguos en memoria.","e":"Una Lista Enlazada es ideal para inserciones y eliminaciones frecuentes en cualquier parte de la lista. Solo requiere actualizar los punteros de los nodos adyacentes (una operación O(1)), a diferencia de un arreglo que requeriría desplazar elementos (una operación O(n))."},{"i":"DATA-ALG-054","k":"3.3","d":"Avanzado","q":"Un algoritmo de ordenamiento es conocido por su excelente rendimiento promedio O(n log n), pero en su peor caso, cuando los datos de entrada ya están ordenados o inversamente ordenados y se elige un mal pivote, su rendimiento se degrada a O(n²). ¿A qué algoritmo nos referimos?","o":["Merge Sort","Quick Sort","Insertion Sort"],"a":1,"h":"Su eficiencia depende en gran medida de la elección del pivote.","e":"Quick Sort es famoso por su rapidez, pero su rendimiento depende crucialmente de la selección del pivote. Si el pivote es consistentemente el elemento más pequeño o más grande, el algoritmo se desequilibra y degenera a una complejidad cuadrática O(n²)."},{"i":"DATA-ALG-055","k":"3.3","d":"Medio","q":"Un desarrollador está implementando una búsqueda binaria para encontrar un valor en un arreglo de 1,000,000 de elementos. Sin embargo, la función a veces no encuentra elementos que sí existen. ¿Cuál es el prerrequisito más probable que el desarrollador olvidó cumplir para que el algoritmo funcione correctamente?","o":["El arreglo no debe tener elementos duplicados.","El arreglo debe estar ordenado.","El tamaño del arreglo debe ser una potencia de dos."],"a":1,"h":"Este algoritmo se basa en 'dividir y vencer' en un espacio de búsqueda reducido.","e":"La condición fundamental para que la búsqueda binaria funcione es que la colección (en este caso, el arreglo) debe estar previamente ordenada. El algoritmo se basa en descartar la mitad del conjunto de datos en cada paso, lo cual solo es posible si los datos están ordenados."},{"i":"DATA-ALG-056","k":"3.3","d":"Medio","q":"Se necesita modelar la jerarquía de una empresa, donde cada empleado (excepto el CEO) tiene un único jefe, y un jefe puede tener varios subordinados. La estructura debe permitir encontrar rápidamente la línea de mando. ¿Qué estructura de datos no lineal es la más intuitiva para representar esta organización?","o":["Grafo","Árbol","Cola"],"a":1,"h":"Es una estructura jerárquica sin ciclos.","e":"Un Árbol es la estructura de datos ideal para representar jerarquías. El CEO sería el nodo raíz, y los empleados serían nodos hijos de sus respectivos jefes. Los grafos podrían representarlo, pero un árbol es más específico y restrictivo para una jerarquía estricta."},{"i":"DATA-ALG-057","k":"3.3","d":"Avanzado","q":"Un sistema de gestión de dependencias entre módulos de software necesita detectar si existe una dependencia circular (ej. Módulo A depende de B, y B depende de A). Esto se modela como un grafo dirigido. ¿Qué algoritmo de recorrido es el más adecuado para detectar ciclos en este grafo?","o":["Búsqueda en Amplitud (BFS)","Algoritmo de Dijkstra","Búsqueda en Profundidad (DFS)"],"a":2,"h":"Este algoritmo permite rastrear los nodos visitados en la ruta de recursión actual.","e":"La Búsqueda en Profundidad (DFS) es excelente para la detección de ciclos. Se puede mantener un registro de los nodos actualmente en la 'pila de recursión'. Si durante el recorrido DFS se encuentra un nodo que ya está en esa pila, se ha detectado un ciclo."},{"i":"DATA-ALG-058","k":"3.3","d":"Avanzado","q":"Al analizar un algoritmo, se determina que su tiempo de ejecución se describe por la función T(n) = 5n² + 100n + 200. En términos de notación Big O, ¿cuál es la forma correcta de expresar su complejidad asintótica para valores grandes de n?","o":["O(n)","O(n²)","O(n log n)"],"a":1,"h":"En el análisis asintótico, solo importa el término de mayor crecimiento.","e":"En la notación Big O, se ignoran las constantes y los términos de orden inferior. El término que crece más rápidamente es n². Por lo tanto, la complejidad del algoritmo es O(n²), ya que dominará el tiempo de ejecución a medida que n se vuelve muy grande."},{"i":"DATA-ALG-059","k":"3.3","d":"Medio","q":"Un desarrollador inserta una serie de números ya ordenados (ej. 1, 2, 3, 4, 5) en un Árbol Binario de Búsqueda (BST) estándar. ¿Qué estructura resultante se formará y cuál será la complejidad para buscar un elemento en ella?","o":["Un árbol balanceado con complejidad O(log n)","Un árbol degenerado (similar a una lista enlazada) con complejidad O(n)","Un árbol completo con complejidad O(log n)"],"a":1,"h":"Cada nuevo elemento se insertará como el hijo derecho del anterior.","e":"Insertar elementos ordenados en un BST provoca que el árbol se degenere en una estructura similar a una lista enlazada, donde cada nodo solo tiene un hijo (derecho en este caso). La altura del árbol se vuelve 'n', y la búsqueda se degrada al peor caso: O(n)."},{"i":"DATA-ALG-060","k":"3.3","d":"Avanzado","q":"Se necesita un algoritmo de ordenamiento que sea 'estable', es decir, que si dos elementos tienen claves de ordenación iguales, su orden relativo en la salida sea el mismo que en la entrada. Esta propiedad es crucial para ordenar una lista de clientes por ciudad, y luego por nombre, sin alterar el orden alfabético dentro de cada ciudad. ¿Cuál de estos algoritmos garantiza estabilidad?","o":["Quick Sort (implementación estándar)","Merge Sort","Heap Sort"],"a":1,"h":"Este algoritmo de 'divide y vencerás' puede ser implementado para mantener el orden relativo.","e":"Merge Sort es un algoritmo de ordenamiento estable por naturaleza. Durante el paso de 'mezcla' (merge), si dos elementos son iguales, se puede priorizar el que provenía de la sublista izquierda, preservando así el orden original."},{"i":"DATA-ALG-061","k":"3.3","d":"Medio","q":"Un sistema de videojuegos necesita gestionar el turno de 4 jugadores. Cuando un jugador termina su turno, el turno pasa al siguiente, y al llegar al último, debe regresar al primero, en un ciclo continuo. ¿Qué estructura de datos modela este comportamiento de forma natural?","o":["Lista Doblemente Enlazada","Pila (Stack)","Lista Circular"],"a":2,"h":"El último elemento apunta al primero.","e":"Una Lista Circular es perfecta para este caso. Es una lista enlazada donde el puntero 'siguiente' del último nodo apunta al primer nodo, creando un bucle. Esto facilita pasar de un jugador a otro de forma indefinida."},{"i":"DATA-ALG-062","k":"3.3","d":"Avanzado","q":"Un programador necesita liberar toda la memoria ocupada por un árbol binario. Para hacerlo correctamente, debe eliminar primero los nodos hijos antes de eliminar el nodo padre, para no perder la referencia a ellos. ¿Qué recorrido de árbol debe seguir para realizar esta operación de borrado de forma segura?","o":["Preorder (Raíz, Izquierda, Derecha)","Inorder (Izquierda, Raíz, Derecha)","Postorder (Izquierda, Derecha, Raíz)"],"a":2,"h":"Procesar el nodo raíz al final.","e":"El recorrido Postorder es el indicado. Procesa recursivamente el subárbol izquierdo, luego el subárbol derecho, y finalmente el nodo raíz. Esto asegura que cuando se procesa (elimina) un nodo, todos sus descendientes ya han sido procesados (eliminados)."},{"i":"DATA-ALG-063","k":"3.3","d":"Medio","q":"Se está decidiendo cómo representar un grafo que modela una red social con millones de usuarios pero donde cada usuario tiene, en promedio, solo unos cientos de amigos. El grafo es 'disperso' o 'escaso'. ¿Qué representación de grafos es más eficiente en términos de uso de memoria en este caso?","o":["Matriz de Adyacencia","Lista de Adyacencia","Matriz de Incidencia"],"a":1,"h":"Solo se almacena la información de las conexiones existentes.","e":"Para grafos dispersos, la Lista de Adyacencia es mucho más eficiente en memoria. Solo almacena los vértices a los que cada vértice está conectado. Una Matriz de Adyacencia requeriría un espacio de V² (Vértices al cuadrado), lo cual sería prohibitivo para millones de usuarios."},{"i":"DATA-ALG-064","k":"3.3","d":"Avanzado","q":"Se necesita implementar una caché LRU (Least Recently Used), que almacena un número fijo de elementos y, cuando está llena, descarta el elemento que ha sido accedido hace más tiempo. Para lograr una alta eficiencia, se necesita poder mover un elemento al 'frente' (recién usado) y quitar un elemento del 'final' (menos usado) en tiempo O(1). ¿Qué combinación de estructuras de datos es la ideal para esto?","o":["Un Arreglo y una Pila","Una Tabla Hash y una Lista Doblemente Enlazada","Un Árbol Binario y una Cola"],"a":1,"h":"Una estructura para acceso rápido O(1) y otra para ordenamiento/movimiento O(1).","e":"La combinación de una Tabla Hash y una Lista Doblemente Enlazada es la solución clásica. La tabla hash proporciona acceso O(1) a cualquier elemento. La lista doblemente enlazada mantiene el orden de uso, permitiendo mover nodos al frente y quitar del final en O(1) al tener referencias directas."},{"i":"DATA-ALG-065","k":"3.3","d":"Medio","q":"Un algoritmo tiene una complejidad temporal O(log n). Si para una entrada de 1,000 elementos el algoritmo tarda 10 milisegundos, ¿qué tiempo aproximado se esperaría para una entrada de 2,000,000 de elementos (2000 veces más grande)?","o":["Aproximadamente 20,000 milisegundos (2000 veces más)","Aproximadamente 110 milisegundos","Aproximadamente 21 milisegundos (un poco más del doble)"],"a":2,"h":"La complejidad logarítmica crece muy lentamente. log(1000) ≈ 10, log(2,000,000) ≈ 21.","e":"La complejidad logarítmica significa que el tiempo de ejecución crece muy lentamente. Mientras la entrada se multiplica por 2000, el logaritmo del tamaño apenas se duplica. log₂(1000) es aprox. 10. log₂(2,000,000) es aprox. 21. El tiempo debería ser aproximadamente el doble (10 ms * (21/10) ≈ 21 ms)."},{"i":"DATA-ALG-066","k":"3.3","d":"Medio","q":"Un desarrollador necesita escribir una función que acceda al primer y al último elemento de un arreglo (array) de `n` elementos. Asumiendo que el arreglo está almacenado en memoria contigua, ¿cuál es la complejidad temporal de estas dos operaciones de acceso?","o":["O(n)","O(log n)","O(1)"],"a":2,"h":"El acceso a un elemento por su índice es una operación directa.","e":"En un arreglo, el acceso a cualquier elemento a través de su índice (incluyendo el primero, índice 0, y el último, índice n-1) es una operación de tiempo constante, O(1). Esto se debe a que la dirección de memoria del elemento se puede calcular directamente a partir de la dirección base del arreglo y el índice."},{"i":"DATA-ALG-067","k":"3.3","d":"Avanzado","q":"Al eliminar un nodo con dos hijos de un Árbol Binario de Búsqueda (BST), una estrategia común para mantener la propiedad del BST es reemplazar el nodo a eliminar con otro nodo del árbol. ¿Cuál de los siguientes nodos es un candidato válido para este reemplazo?","o":["Cualquier nodo hoja del subárbol izquierdo.","El sucesor in-order (el nodo más a la izquierda del subárbol derecho).","El nodo raíz del árbol."],"a":1,"h":"El nodo de reemplazo debe ser el siguiente valor más grande (o el anterior más grande).","e":"Para mantener la propiedad del BST, el nodo eliminado debe ser reemplazado por su sucesor in-order (el valor más pequeño en su subárbol derecho) o su predecesor in-order (el valor más grande en su subárbol izquierdo). Esto asegura que todos los nodos a la izquierda sigan siendo menores y los de la derecha sigan siendo mayores."},{"i":"DATA-ALG-068","k":"3.3","d":"Medio","q":"Un sistema GPS necesita encontrar la ruta con el menor número de tramos (calles) entre dos puntos en un mapa. El mapa se representa como un grafo no ponderado. ¿Qué algoritmo es el más adecuado para garantizar que se encuentra la ruta más corta en este escenario?","o":["Búsqueda en Profundidad (DFS)","Búsqueda en Amplitud (BFS)","Recorrido Preorder"],"a":1,"h":"Este algoritmo explora el grafo por capas o niveles de distancia.","e":"La Búsqueda en Amplitud (BFS) siempre encuentra el camino más corto en términos de número de aristas (tramos) en un grafo no ponderado. Explora todos los vecinos a distancia 1, luego todos a distancia 2, y así sucesivamente, garantizando que la primera vez que llega al destino, es por la ruta más corta."},{"i":"DATA-ALG-069","k":"3.3","d":"Medio","q":"Un programador junior utiliza el algoritmo de Ordenamiento Burbuja (Bubble Sort) para ordenar una lista grande de datos críticos. Un programador senior le advierte que, aunque es fácil de implementar, su rendimiento es inaceptable para esa cantidad de datos. ¿Cuál es la complejidad temporal promedio y en el peor caso de Bubble Sort?","o":["O(n log n)","O(n)","O(n²)"],"a":2,"h":"Implica comparar repetidamente pares de elementos adyacentes.","e":"Tanto en el caso promedio como en el peor, Bubble Sort tiene una complejidad de O(n²). Realiza pasadas a través de la lista, comparando y intercambiando elementos adyacentes, lo cual es muy ineficiente para grandes conjuntos de datos."},{"i":"DATA-ALG-070","k":"3.3","d":"Medio","q":"Se tiene un arreglo de enteros de 32 bits (4 bytes) que comienza en la dirección de memoria 1000. Suponiendo que los índices del arreglo comienzan en 0, ¿en qué dirección de memoria se encontrará el elemento en el índice 5?","o":["1005","1020","1024"],"a":1,"h":"Dirección = Dirección Base + (índice * tamaño del tipo de dato).","e":"La dirección se calcula como: Dirección Base + (índice * tamaño_elemento). En este caso, es 1000 + (5 * 4 bytes) = 1000 + 20 = 1020. El acceso directo a la memoria es una característica clave de los arreglos."},{"i":"DATA-ALG-071","k":"3.3","d":"Avanzado","q":"Un analizador de código fuente construye un Árbol de Sintaxis Abstracta (AST) para representar la estructura del código. Para evaluar una expresión matemática como '(5 + 3) * 2', el evaluador necesita procesar los operandos antes que el operador. ¿Qué recorrido del árbol de expresión realizaría esta evaluación de forma natural?","o":["Inorder","Postorder","Preorder"],"a":1,"h":"Izquierda, Derecha, Raíz. (Operando, Operando, Operador).","e":"El recorrido Postorder (Izquierda, Derecha, Raíz) es ideal para evaluar expresiones. Visita los operandos izquierdo y derecho primero, y luego el nodo raíz que contiene el operador. Para '(5+3)*2', procesaría 5, 3, '+', luego el resultado (8), 2, y finalmente '*'."},{"i":"DATA-ALG-072","k":"3.3","d":"Medio","q":"Se está escribiendo una función que recibe un arreglo de `n` elementos y debe verificar si el primer elemento es un número par. ¿Cuál es la complejidad temporal de esta función?","o":["O(1)","O(n)","O(log n)"],"a":0,"h":"La operación no depende del tamaño total del arreglo.","e":"La función solo necesita acceder al primer elemento (índice 0) y realizar una operación de módulo. El número de operaciones es constante y no cambia sin importar si el arreglo tiene 10 o 10 millones de elementos. Por lo tanto, la complejidad es O(1) (tiempo constante)."},{"i":"DATA-ALG-073","k":"3.3","d":"Medio","q":"Se necesita encontrar un elemento específico en un conjunto de datos que no tiene ningún orden particular y no puede ser ordenado. ¿Qué algoritmo de búsqueda es la única opción viable en este escenario?","o":["Búsqueda Binaria","Búsqueda por Interpolación","Búsqueda Lineal"],"a":2,"h":"El único método que no requiere que los datos estén ordenados.","e":"Cuando los datos no están ordenados, no hay más remedio que utilizar la Búsqueda Lineal. Este algoritmo consiste en revisar cada elemento uno por uno desde el principio hasta encontrar el elemento buscado o llegar al final de la colección."},{"i":"DATA-ALG-074","k":"3.3","d":"Medio","q":"Una función tiene tres bucles `for` anidados. Cada bucle itera desde 0 hasta `n-1`. Dentro del bucle más interno, se realiza una operación de tiempo constante. ¿Cuál es la complejidad Big O de esta función?","o":["O(n²)","O(3n)","O(n³)"],"a":2,"h":"El número de operaciones es proporcional a n * n * n.","e":"Con tres bucles anidados que dependen de `n`, el número total de operaciones ejecutadas en el bucle interno será n * n * n, lo que resulta en una complejidad cúbica, o O(n³)."},{"i":"DATA-ALG-075","k":"3.3","d":"Avanzado","q":"Un sistema operativo debe gestionar procesos con diferentes niveles de prioridad (ej. 'alta', 'media', 'baja'). Un proceso de alta prioridad debe ejecutarse antes que cualquier proceso de prioridad media o baja, sin importar cuándo haya llegado. ¿Qué estructura de datos abstracta es la más adecuada para implementar este tipo de planificador?","o":["Una Cola (Queue) estándar","Una Pila (Stack)","Una Cola de Prioridad (Priority Queue)"],"a":2,"h":"Una variación de la cola donde el orden de salida no es FIFO, sino basado en un valor.","e":"Una Cola de Prioridad es la estructura de datos diseñada para este fin. Aunque los elementos se encolan, la operación de desencolar (dequeue) siempre devuelve el elemento con la mayor prioridad, independientemente de su orden de llegada. A menudo se implementa con un Heap."}]},R=[{"key":"1.1","q":"En un circuito RC en serie se usa un resistor de 10 kΩ y un capacitor de 100 µF. ¿Cuánto vale aproximadamente la constante de tiempo y qué significa?","o":["0.1 s; el capacitor está totalmente cargado a ese tiempo","1 s; en ese tiempo el capacitor alcanza cerca del 63% de su carga final","10 s; en ese tiempo el capacitor se descarga por completo"],"a":1,"h":"τ = R · C","e":"τ = 10 kΩ × 100 µF = 1 s. Al cabo de una constante de tiempo, el capacitor alcanza cerca del 63% de su valor final."},{"key":"1.1","q":"Una señal senoidal de 10 V de pico pasa por un rectificador ideal de media onda. ¿Qué voltaje promedio (DC) aproximado se obtiene en la salida?","o":["6.37 V","10 V","3.18 V"],"a":2,"h":"Vdc = Vp / π en media onda.","e":"En un rectificador ideal de media onda, Vdc = Vp/π = 10/3.1416 ≈ 3.18 V. En onda completa sería el doble."},{"key":"1.1","q":"Un transistor NPN se usa como interruptor para encender un relé desde un microcontrolador. ¿En qué región debe operar cuando el relé está encendido?","o":["Corte","Región activa lineal","Saturación"],"a":2,"h":"Como interruptor cerrado, la caída entre colector y emisor debe ser mínima.","e":"Como interruptor, el transistor trabaja en corte (apagado) o en saturación (encendido), donde VCE es muy pequeño y entrega la corriente al relé."},{"key":"1.1","q":"Un amplificador operacional inversor tiene Rf = 100 kΩ y Rin = 10 kΩ. Si la entrada es de 0.5 V, ¿cuál es el voltaje de salida ideal?","o":["+5 V","−5 V","−0.05 V"],"a":1,"h":"Ganancia inversora = −Rf / Rin.","e":"La ganancia es −100k/10k = −10, por lo que Vout = −10 × 0.5 V = −5 V."},{"key":"1.1","q":"Se diseña un filtro pasa bajas RC con R = 1.6 kΩ y C = 100 nF. ¿Cuál es su frecuencia de corte aproximada?","o":["≈ 10 kHz","≈ 1 kHz","≈ 100 Hz"],"a":1,"h":"fc = 1 / (2πRC)","e":"fc = 1/(2π × 1600 × 100×10⁻⁹) ≈ 995 Hz, es decir, cerca de 1 kHz."},{"key":"1.1","q":"En un nodo llegan corrientes de 3 A y 2 A. Salen una corriente de 4 A y otra desconocida I. Según la ley de corrientes de Kirchhoff, ¿cuánto vale I?","o":["1 A","5 A","9 A"],"a":0,"h":"La suma de corrientes que entran es igual a la que sale.","e":"Entran 3 + 2 = 5 A, por lo que salen 4 A + I = 5 A y I = 1 A."},{"key":"1.2","q":"Un procesador con pipeline de 5 etapas, sin riesgos ni burbujas, ejecuta 100 instrucciones. ¿Cuántos ciclos de reloj se necesitan en total?","o":["500","100","104"],"a":2,"h":"El primer resultado tarda k ciclos y luego sale uno por ciclo.","e":"Ciclos = k + (n − 1) = 5 + 99 = 104. Sin pipeline serían 500."},{"key":"1.2","q":"Una caché de mapeo directo de 16 KiB usa bloques de 64 bytes. ¿Cuántos bits de índice utiliza?","o":["6 bits","8 bits","10 bits"],"a":1,"h":"Número de bloques = capacidad / tamaño de bloque.","e":"16 KiB / 64 B = 256 bloques = 2⁸, por lo que se necesitan 8 bits de índice."},{"key":"1.2","q":"La instrucción I2 lee un registro que la instrucción anterior I1 todavía no ha escrito. ¿Qué tipo de riesgo de datos es?","o":["RAW (lectura después de escritura)","WAR (escritura después de lectura)","WAW (escritura después de escritura)"],"a":0,"h":"I2 necesita el resultado de I1.","e":"Es una dependencia verdadera: I2 debe leer después de que I1 escriba, es decir, RAW."},{"key":"1.2","q":"Un sistema usa direcciones virtuales de 32 bits y páginas de 4 KiB. ¿Cuántos bits forman el número de página virtual?","o":["12 bits","32 bits","20 bits"],"a":2,"h":"El desplazamiento dentro de la página usa log2(4096) bits.","e":"4 KiB = 2¹², así que el desplazamiento usa 12 bits y quedan 32 − 12 = 20 bits para el número de página."},{"key":"1.2","q":"¿Qué característica es típica de una arquitectura RISC?","o":["Instrucciones de longitud fija y acceso a memoria solo mediante carga y almacenamiento","Instrucciones de longitud variable con operandos directamente en memoria","Un conjunto muy amplio de instrucciones complejas implementadas en microcódigo"],"a":0,"h":"Piensa en simplicidad y regularidad para facilitar el pipeline.","e":"RISC usa instrucciones simples de longitud fija y una arquitectura carga/almacenamiento, lo que facilita segmentar el pipeline."},{"key":"1.2","q":"Cuando llega una interrupción externa, ¿qué hace normalmente la CPU?","o":["Ignora la señal hasta que termine el programa en ejecución","Reinicia el sistema para atender el evento","Termina la instrucción actual, guarda el contador de programa y salta a la rutina de servicio"],"a":2,"h":"Debe poder volver al programa interrumpido.","e":"La CPU completa la instrucción en curso, guarda el estado mínimo (PC y banderas) y salta a la rutina de servicio; al terminar, retoma el programa."},{"key":"1.3","q":"Un sistema embebido se queda colgado por un error de firmware y debe recuperarse solo. ¿Qué periférico se usa para eso?","o":["ADC","Watchdog timer","Comparador analógico"],"a":1,"h":"Reinicia el sistema si nadie lo refresca a tiempo.","e":"El watchdog reinicia el microcontrolador si el firmware no lo refresca dentro de su ventana, lo que recupera al sistema de bloqueos."},{"key":"1.3","q":"Un botón conectado a un microcontrolador registra varias pulsaciones cuando se presiona una sola vez. ¿Cuál es la causa más probable?","o":["Desbordamiento del temporizador","Rebote mecánico de los contactos","Baja resolución del ADC"],"a":1,"h":"Los contactos metálicos vibran durante unos milisegundos.","e":"Los contactos mecánicos rebotan al cerrarse y generan varios flancos. Se corrige con retardo (antirrebote) por software o con un filtro RC."},{"key":"1.3","q":"Un nodo con batería mide temperatura cada 10 minutos. ¿Qué estrategia reduce más el consumo?","o":["Dejar la CPU activa a máxima frecuencia","Usar modo de bajo consumo y despertar con un temporizador RTC","Aumentar la velocidad del bus de comunicación"],"a":1,"h":"El sistema está inactivo la mayor parte del tiempo.","e":"Permanecer dormido y despertar por RTC solo para medir y transmitir reduce el consumo promedio en órdenes de magnitud."},{"key":"1.3","q":"Se necesita un bus full-duplex rápido con una línea de selección de esclavo por cada dispositivo. ¿Qué protocolo corresponde?","o":["I2C","UART","SPI"],"a":2,"h":"Líneas MOSI, MISO, SCK y CS.","e":"SPI usa MOSI, MISO, SCK y una línea CS por esclavo, y permite transmisión simultánea en ambos sentidos."},{"key":"1.3","q":"Una señal analógica tiene componentes hasta 2 kHz. ¿Cuál es la frecuencia de muestreo mínima teórica para reconstruirla?","o":["4 kHz","2 kHz","1 kHz"],"a":0,"h":"Teorema de Nyquist.","e":"Según Nyquist, fs ≥ 2·fmax = 4 kHz. En la práctica se usa un margen mayor y un filtro antialiasing."},{"key":"1.3","q":"En un RTOS con planificador expulsivo, una tarea de baja prioridad se está ejecutando y una de alta prioridad pasa a estar lista. ¿Qué ocurre?","o":["La tarea de alta prioridad espera a que la otra termine","La tarea de alta prioridad expulsa a la de baja y toma la CPU","Ambas se ejecutan en paralelo en un solo núcleo"],"a":1,"h":"Expulsivo significa que puede interrumpir.","e":"En un planificador expulsivo por prioridades, la tarea lista de mayor prioridad desplaza de inmediato a la de menor prioridad."},{"key":"1.4","q":"Un tostador apaga el calentador tras un tiempo fijo sin medir qué tan tostado está el pan. ¿Qué tipo de sistema de control es?","o":["Lazo cerrado","Lazo abierto","Control adaptativo"],"a":1,"h":"No hay retroalimentación de la variable controlada.","e":"Al no medir la salida para corregir la acción, es un sistema de lazo abierto."},{"key":"1.4","q":"Un termostato ON/OFF enciende y apaga el calefactor muy seguido cerca de la temperatura deseada. ¿Qué se agrega para evitarlo?","o":["Histéresis","Un filtro pasa altas","Mayor ganancia derivativa"],"a":0,"h":"Se usan dos umbrales distintos de encendido y apagado.","e":"La histéresis define umbrales separados para encender y apagar, lo que reduce conmutaciones rápidas y desgaste del actuador."},{"key":"1.4","q":"En lógica Ladder, dos contactos normalmente abiertos en serie alimentan una bobina. ¿Qué función lógica realizan?","o":["OR","NOT","AND"],"a":2,"h":"La bobina se activa solo si ambos contactos conducen.","e":"En serie, ambos contactos deben cerrarse para energizar la bobina: es una función AND."},{"key":"1.4","q":"Un encoder incremental de 1000 pulsos por revolución cuenta 2500 pulsos. ¿Qué ángulo giró el eje?","o":["90°","900°","2500°"],"a":1,"h":"Pulsos / pulsos por vuelta = vueltas.","e":"2500/1000 = 2.5 vueltas, y 2.5 × 360° = 900°."},{"key":"1.4","q":"En un sistema de control lineal, uno de los polos de lazo cerrado está en el semiplano derecho del plano s. ¿Qué se concluye?","o":["El sistema es inestable","El sistema es críticamente amortiguado","El sistema tiene error cero en estado estable"],"a":0,"h":"Estabilidad requiere parte real negativa.","e":"Un polo con parte real positiva genera una respuesta que crece con el tiempo, por lo que el sistema es inestable."},{"key":"1.4","q":"Un motor a pasos tiene 200 pasos por vuelta. ¿Cuántos grados gira con 50 pasos?","o":["45°","180°","90°"],"a":2,"h":"Cada paso equivale a 360° / 200.","e":"Cada paso son 1.8°, así que 50 pasos equivalen a 90°."},{"key":"2.1","q":"En una red con topología en estrella, el switch central deja de funcionar. ¿Qué ocurre?","o":["Solo se pierde la comunicación del equipo más lejano","Se pierde la comunicación entre todos los equipos conectados a él","La red sigue operando porque cada equipo se conecta con sus vecinos"],"a":1,"h":"Todo el tráfico pasa por el nodo central.","e":"En una estrella todo el tráfico pasa por el nodo central; si falla, los equipos quedan incomunicados."},{"key":"2.1","q":"¿Cuántos bits tiene una dirección IPv6?","o":["32 bits","128 bits","64 bits"],"a":1,"h":"Escrita en 8 grupos hexadecimales de 16 bits.","e":"IPv6 usa direcciones de 128 bits (8 grupos de 16 bits), frente a los 32 bits de IPv4."},{"key":"2.1","q":"Un host tiene la dirección 172.16.5.37/24. ¿Cuál es la dirección de difusión (broadcast) de su subred?","o":["172.16.5.255","172.16.255.255","172.16.5.0"],"a":0,"h":"Con /24 los primeros tres octetos son la red.","e":"Con máscara /24 solo cambia el último octeto; el broadcast pone todos los bits de host en 1: 172.16.5.255."},{"key":"2.1","q":"Una sucursal pequeña tiene un único enlace hacia Internet y no cambia de proveedor. ¿Qué configuración de enrutamiento es más simple y adecuada?","o":["Una ruta estática por defecto hacia el proveedor","Un protocolo de estado de enlace con áreas múltiples","Intercambio BGP con varios sistemas autónomos"],"a":0,"h":"Una sola salida no necesita decisiones dinámicas.","e":"Con una única salida, una ruta estática por defecto es simple, estable y no consume recursos de protocolos dinámicos."},{"key":"2.1","q":"Un switch de acceso tiene 24 puertos de 1 Gbps y un enlace de subida de 10 Gbps. ¿Cuál es la relación de sobresuscripción?","o":["24:1","2.4:1","1:2.4"],"a":1,"h":"Capacidad total de acceso / capacidad del enlace de subida.","e":"24 Gbps de acceso entre 10 Gbps de subida da 2.4:1."},{"key":"2.1","q":"¿Qué dispositivo opera principalmente en la capa 3 del modelo OSI y decide la ruta de los paquetes entre redes?","o":["Concentrador (hub)","Switch de capa 2","Router"],"a":2,"h":"Trabaja con direcciones IP.","e":"El router toma decisiones de reenvío con base en direcciones IP, es decir, en la capa de red."},{"key":"2.2","q":"Varias computadoras de una oficina muestran direcciones del tipo 169.254.x.x. ¿Qué indica esto?","o":["No lograron contactar un servidor DHCP y se autoasignaron una dirección","El servidor DNS tiene un registro duplicado","El router está aplicando NAT"],"a":0,"h":"Es el rango de autoconfiguración APIPA.","e":"Las direcciones 169.254.0.0/16 se autoasignan cuando el equipo no recibe respuesta de un servidor DHCP."},{"key":"2.2","q":"Al configurar el correo de una empresa en DNS, ¿qué tipo de registro indica los servidores que reciben el correo del dominio?","o":["A","CNAME","MX"],"a":2,"h":"Mail eXchanger.","e":"El registro MX indica qué servidores aceptan correo para el dominio y su prioridad."},{"key":"2.2","q":"Un usuario no llega a un servidor remoto y el administrador quiere saber en qué salto se detiene el tráfico. ¿Qué herramienta usa?","o":["traceroute","nslookup","arp -a"],"a":0,"h":"Muestra cada router en el camino.","e":"traceroute (tracert en Windows) lista los saltos hacia el destino y permite ubicar dónde se pierde la comunicación."},{"key":"2.2","q":"¿Por qué es importante sincronizar el reloj de los equipos de una red mediante NTP?","o":["Para aumentar el ancho de banda disponible","Para que los registros y eventos de distintos equipos se puedan correlacionar","Para evitar que se repitan direcciones IP"],"a":1,"h":"Piensa en investigar un incidente con logs de varios equipos.","e":"Con relojes sincronizados los logs de distintos dispositivos pueden ordenarse en el tiempo, lo que es clave en diagnóstico y auditoría."},{"key":"2.2","q":"La regla de respaldo 3-2-1 recomienda…","o":["3 copias en 2 medios distintos, con 1 copia fuera del sitio","3 servidores, 2 usuarios y 1 administrador","3 respaldos diarios, 2 semanales y 1 mensual en el mismo disco"],"a":0,"h":"Se trata de diversificar copias, medios y ubicación.","e":"Tener tres copias, en dos tipos de medios, con una fuera del sitio, protege contra fallas de hardware y desastres locales."},{"key":"2.2","q":"En una red con telefonía IP, las llamadas se entrecortan cuando alguien descarga archivos grandes. ¿Qué mecanismo ayuda a resolverlo?","o":["QoS que prioriza el tráfico de voz","Aumentar el tiempo de concesión de DHCP","Desactivar el protocolo SNMP"],"a":0,"h":"La voz es sensible a latencia y variación del retardo.","e":"La calidad de servicio (QoS) pone el tráfico de voz en una cola prioritaria para que no se vea afectado por transferencias masivas."},{"key":"2.3","q":"Un administrador configura el firewall para bloquear todo el tráfico y permitir solo los servicios necesarios. ¿Qué principio aplica?","o":["Seguridad por oscuridad","Denegar por defecto y mínimo privilegio","Redundancia activa-activa"],"a":1,"h":"Se parte de cero accesos y se abren solo los requeridos.","e":"Denegar por defecto, y permitir únicamente lo necesario, reduce la superficie de ataque y aplica el mínimo privilegio."},{"key":"2.3","q":"Una empresa quiere que el tráfico entre su oficina y su sucursal viaje cifrado por Internet. ¿Qué solución es la adecuada?","o":["Una VPN de sitio a sitio con IPsec","Un servidor DHCP seguro","Un conmutador con puertos en modo espejo"],"a":0,"h":"Crea un túnel cifrado entre ambas redes.","e":"Una VPN IPsec de sitio a sitio cifra y autentica el tráfico entre las dos redes sobre un medio no confiable."},{"key":"2.3","q":"Un sistema pide una contraseña y un código generado por una aplicación en el celular. ¿Qué factores combina?","o":["Algo que sabes y algo que eres","Algo que sabes y algo que tienes","Algo que tienes y algo que eres"],"a":1,"h":"La contraseña se sabe; el celular se posee.","e":"La contraseña es algo que sabes y el código del dispositivo es algo que tienes: autenticación de dos factores."},{"key":"2.3","q":"Un navegador muestra un candado al abrir un sitio HTTPS. ¿Qué garantiza principalmente el certificado TLS?","o":["Que el sitio no tiene vulnerabilidades","Que el servidor es quien dice ser, según una autoridad certificadora, y que el canal va cifrado","Que el contenido del sitio es legalmente verdadero"],"a":1,"h":"Identidad más cifrado del canal.","e":"El certificado, firmado por una CA de confianza, autentica al servidor y permite establecer un canal cifrado; no asegura que el sitio sea seguro en todo lo demás."},{"key":"2.3","q":"¿Qué diferencia a un IPS de un IDS?","o":["El IPS solo genera alertas y el IDS bloquea","El IPS puede bloquear el tráfico malicioso en línea y el IDS normalmente solo detecta y alerta","No hay diferencia práctica"],"a":1,"h":"Uno está en línea y actúa; el otro observa.","e":"Un IPS se coloca en línea y puede descartar tráfico malicioso; un IDS monitorea y notifica."},{"key":"2.3","q":"Una aplicación web muestra en pantalla comentarios de usuarios sin filtrarlos, y un atacante logra ejecutar scripts en el navegador de otros usuarios. ¿Qué medida lo previene mejor?","o":["Aumentar el tamaño de la base de datos","Validar la entrada y escapar la salida antes de mostrarla","Cambiar el puerto del servidor web"],"a":1,"h":"Tratar los datos del usuario como texto, no como código.","e":"Es XSS. Se previene validando la entrada, codificando o escapando la salida y aplicando políticas como CSP."},{"key":"3.1","q":"El requisito \"el sistema debe responder cada consulta en menos de 2 segundos\" es de tipo…","o":["Funcional","No funcional (rendimiento)","Una restricción legal"],"a":1,"h":"Describe una cualidad, no una función específica.","e":"Los requisitos de tiempo de respuesta son no funcionales, porque describen réstamo que se paga con intereses.","e":"Los atajos que sacrifican calidad generan deuda técnica, que encarece los cambios futuros hasta que se paga con refactorización."},{"key":"3.2","q":"En C, una función recibe un entero por valor, le suma 10 y termina. ¿Qué pasa con la variable original de quien llama?","o":["Se queda sin cambios","Aumenta en 10","Se vuelve cero"],"a":0,"h":"La función trabaja con una copia.","e":"En el paso por valor se copia el argumento; modificar la copia local no altera la variable original."},{"key":"3.2","q":"Una función recursiva define f(0) = 0 y f(n) = n + f(n−1). ¿Cuánto vale f(5)?","o":["10","120","15"],"a":2,"h":"Suma los enteros de 1 a 5.","e":"f(5) = 5+4+3+2+1+0 = 15."},{"key":"3.2","q":"Un programa reserva memoria dinámica en un ciclo y nunca la libera. Con el tiempo el consumo de memoria crece sin parar. ¿Cómo se llama este problema?","o":["Desbordamiento de búfer","Fuga de memoria","Condición de carrera"],"a":1,"h":"La memoria queda reservada pero inalcanzable.","e":"Es una fuga de memoria (memory leak): se reserva memoria que ya no se usa y no se devuelve al sistema."},{"key":"3.2","q":"Durante la compilación, ¿qué fase detecta un paréntesis sin cerrar en el código fuente?","o":["Análisis sintáctico","Optimización de código","Enlazado"],"a":0,"h":"Verifica que el código siga la gramática del lenguaje.","e":"El analizador sintáctico (parser) comprueba la estructura según la gramática y reporta errores como paréntesis sin cerrar."},{"key":"3.2","q":"Varias clases implementan el mismo método dibujar(), y al invocarlo sobre una referencia genérica se ejecuta la versión de la clase real del objeto. ¿Qué concepto de POO es?","o":["Encapsulamiento","Polimorfismo","Sobrecarga de constructores"],"a":1,"h":"Misma interfaz, comportamientos distintos.","e":"El polimorfismo permite invocar el mismo mensaje y que cada tipo concreto responda con su propia implementación."},{"key":"3.2","q":"En C, con las variables enteras x = 7 y y = 2, ¿cuánto vale x % y?","o":["3","1","3.5"],"a":1,"h":"El operador % entrega el residuo.","e":"7 dividido entre 2 da 3 con residuo 1, por lo que x % y = 1."},{"key":"3.3","q":"Se necesita saber cuántos pedidos tiene cada cliente en una tabla pedidos(cliente_id, ...). ¿Qué consulta SQL lo logra?","o":["SELECT cliente_id, COUNT(*) FROM pedidos GROUP BY cliente_id","SELECT * FROM pedidos ORDER BY cliente_id DESC","DELETE FROM pedidos WHERE cliente_id IS NULL"],"a":0,"h":"Agrupar y contar.","e":"GROUP BY agrupa las filas por cliente y COUNT(*) cuenta los pedidos de cada grupo."},{"key":"3.3","q":"Se crea un índice sobre una columna que se consulta muy seguido en una tabla grande. ¿Qué efecto tiene?","o":["Acelera las búsquedas y hace algo más lentas las escrituras","Hace más lentas las búsquedas y más rápidas las escrituras","No tiene efecto sobre el rendimiento"],"a":0,"h":"El índice debe mantenerse actualizado.","e":"El índice acelera las lecturas por esa columna, pero cada inserción o actualización debe actualizarlo, lo que cuesta algo de rendimiento."},{"key":"3.3","q":"En un árbol binario de búsqueda razonablemente balanceado con n elementos, ¿cuál es la complejidad promedio de buscar un valor?","o":["O(n)","O(log n)","O(1)"],"a":1,"h":"Cada comparación descarta aproximadamente la mitad.","e":"Con el árbol balanceado, cada paso descarta una rama, por lo que la búsqueda es O(log n). En el peor caso degenerado sería O(n)."},{"key":"3.3","q":"Una aplicación almacena documentos con campos distintos entre sí y su esquema cambia con frecuencia. ¿Qué tipo de base de datos es más natural?","o":["Relacional con esquema rígido","De documentos (NoSQL)","De columna única"],"a":1,"h":"Esquema flexible por registro.","e":"Las bases de documentos guardan registros semiestructurados con esquema flexible, lo que facilita datos heterogéneos y cambiantes."},{"key":"3.3","q":"¿Qué restricción tiene el algoritmo de Dijkstra para caminos más cortos?","o":["El grafo debe ser un árbol","Los pesos de las aristas no pueden ser negativos","El grafo debe ser no dirigido"],"a":1,"h":"Una arista negativa puede mejorar un camino ya cerrado.","e":"Dijkstra asume que agregar aristas no reduce el costo; con pesos negativos puede dar resultados incorrectos."},{"key":"3.3","q":"Para calcular fib(40) se guarda cada valor ya calculado y se reutiliza en lugar de recalcularlo. ¿Qué técnica es?","o":["Fuerza bruta","Programación dinámica (memoización)","Búsqueda binaria"],"a":1,"h":"Evita resolver los mismos subproblemas repetidos.","e":"Guardar y reutilizar resultados de subproblemas repetidos es programación dinámica con memoización: reduce el costo de exponencial a lineal."}],of=window.fetch;window.fetch=function(u){var d=(u==="bank.json")?B:(u==="reserve.json")?R:null;if(d!==null)return Promise.resolve({ok:true,json:function(){return Promise.resolve(d)}});return of.apply(this,arguments)}})();</script>

/* ===== Selección de preguntas ===== */
function alloc(n,subs){
  const tot=subs.reduce((a,s)=>a+s.goal,0);
  const raw=subs.map(s=>n*s.goal/tot),base=raw.map(Math.floor);
  const left=n-base.reduce((a,b)=>a+b,0);
  raw.map((r,i)=>[r-Math.floor(r),i]).sort((a,b)=>b[0]-a[0]).slice(0,left).forEach(x=>base[x[1]]++);
  return base;
}
const FIXED=/anteriores|ninguna de|todas las|ambas|ambos/i;
function shufOpts(o,a,fixed){
  const idx=o.map((_,i)=>i),ord=fixed?idx:shuf(idx);
  return {o:ord.map(i=>o[i]),a:ord.indexOf(a)};
}
function fromBank(q){
  const r=shufOpts(q.o,q.a,q.f);
  return {uid:'b'+q.i,key:q.k,d:q.d,q:q.q,s:q.s||null,o:r.o,a:r.a,h:q.h,e:q.e,src:'bank'};
}
function fromPool(p){
  const r=shufOpts(p.o,p.a,p.o.some(x=>FIXED.test(x)));
  return {uid:p.uid,key:p.key,d:'',q:p.q,s:null,o:r.o,a:r.a,h:p.h,e:p.e,src:'claude'};
}
function build(n,areaSel,o){
  const subs=SUBS.filter(s=>areaSel==='all'||s.key[0]===areaSel);
  const counts=alloc(n,subs),used=new Set(),out=[],info={fresh:0,claude:0,gen:0,recycled:0},short={};
  subs.forEach((s,i)=>{
    let need=counts[i];
    for(const q of shuf(BANK.filter(q=>q.k===s.key&&!hist.seen['b'+q.i]))){
      if(!need)break;used.add('b'+q.i);out.push(fromBank(q));need--;info.fresh++;
    }
    for(const p of shuf(POOL.filter(p=>p.key===s.key&&!hist.seen[p.uid]))){
      if(!need)break;used.add(p.uid);out.push(fromPool(p));need--;info.claude++;
    }
    const gens=G[s.key]||[];let tries=0;
    while(o.gen&&need>0&&gens.length&&tries<600){
      tries++;let g=null;try{g=pick(gens)()}catch(e){}
      if(!g)continue;
      const uid='g'+hash(g.q+'|'+g.o[g.a]);
      if(hist.seen[uid]||used.has(uid))continue;
      used.add(uid);out.push({uid,key:s.key,d:'',q:g.q,s:null,o:g.o,a:g.a,h:g.h,e:g.e,src:'auto'});need--;info.gen++;
    }
    if(o.recycle&&need>0){
      const old=BANK.filter(q=>q.k===s.key&&hist.seen['b'+q.i]!=null&&!used.has('b'+q.i)).map(q=>[hist.seen['b'+q.i],()=>fromBank(q),'b'+q.i])
        .concat(POOL.filter(p=>p.key===s.key&&hist.seen[p.uid]!=null&&!used.has(p.uid)).map(p=>[hist.seen[p.uid],()=>fromPool(p),p.uid])).sort((a,b)=>a[0]-b[0]);
      for(const x of old){if(!need)break;used.add(x[2]);out.push(x[1]());need--;info.recycled++}
    }
    if(need>0)short[s.key]=need;
  });
  return {qs:shuf(out).sort((a,b)=>a.key[0].localeCompare(b.key[0])),info,short};
}

/* ===== Preguntas escritas por Claude ===== */
function promptFor(asks){
  const lines=asks.map(([k,c])=>{
    const ex=shuf(BANK.filter(q=>q.k===k)).slice(0,4).map(q=>'   - '+q.q.slice(0,150)).join('\n');
    const av=POOL.filter(p=>p.key===k).slice(-12).map(p=>'   - '+p.q.slice(0,90)).join('\n');
    return `Subárea ${k} · ${SUB[k].subarea}: ${c} preguntas\n  Ejemplos del estilo del banco:\n${ex}`+(av?`\n  Ya redactadas, no repetir estos temas:\n${av}`:'');
  }).join('\n\n');
  return `Eres diseñador de reactivos del CENEVAL para el EGEL de Ingeniería Computacional (EGEL-ICOMPU). Redacta preguntas nuevas de opción múltiple en español de México. Cada una tiene exactamente 3 opciones y una sola correcta, plantea un caso o escenario práctico (no memorización), mezcla niveles básico, medio y avanzado, y no repite las del banco. Reparte la posición de la opción correcta entre 0, 1 y 2. Verifica los cálculos antes de responder y evita opciones como "todas las anteriores".\n\n${lines}\n\nResponde solo con un arreglo JSON de objetos con esta forma: {"key":"1.1","q":"enunciado","o":["opción A","opción B","opción C"],"a":1,"h":"pista breve","e":"explicación breve de por qué es correcta"}. Usa en "key" la clave de la subárea.`;
}
function cleanAI(arr){
  const out=[];if(!Array.isArray(arr))return out;
  const stems=new Set(BANK.map(q=>hash(norm(q.q))).concat(POOL.map(p=>hash(norm(p.q)))));
  for(const x of arr){
    if(!x||!SUB[x.key]||typeof x.q!=='string'||x.q.length<20||!Array.isArray(x.o)||x.o.length!==3)continue;
    const o=x.o.map(String);if(new Set(o).size!==3)continue;
    const a=Number(x.a);if(!Number.isInteger(a)||a<0||a>2)continue;
    const st=hash(norm(x.q));if(stems.has(st))continue;stems.add(st);
    out.push({uid:'a'+st,key:x.key,q:x.q.trim(),o,a,h:String(x.h||''),e:String(x.e||'')});
  }
  return out;
}
async function askClaude(asks){
  const total=asks.reduce((a,x)=>a+x[1],0);
  const ctl=new AbortController();aiCtl=ctl;onHome=false;
  view.innerHTML=`<section class="card"><div class="eyebrow">Claude</div><h2>Escribiendo preguntas nuevas</h2><p class="note" id="aiMsg">Pensando. Si aparece un aviso de permiso, acéptalo para continuar.</p><div class="bar"><i id="aiBar"></i></div><div class="row"><button class="btn" data-act="aiskip">Usar preguntas automáticas</button></div></section>`;
  try{
    const arr=await CAP.sample.json(promptFor(asks),{signal:ctl.signal,cache:false,onText:({text})=>{
      const n=Math.min(total,(text.match(/"key"/g)||[]).length);
      const m=document.getElementById('aiMsg'),b=document.getElementById('aiBar');
      if(m)m.textContent=`Redactadas ${n} de ${total}`;if(b)b.style.width=Math.round(n/total*100)+'%';
    }});
    const items=cleanAI(arr);
    if(items.length){
      poolAdd(items);poolSave();
      if(aiRef){aiRef.doc('b'+Date.now().toString(36)).set({ts:Date.now(),items}).catch(()=>{})}
    }
    aiNote=items.length?`Claude escribió ${items.length} preguntas nuevas.`:'Claude no devolvió preguntas válidas; se usaron preguntas automáticas.';
    return items.length;
  }catch(e){
    const c=e&&e.code;
    if(c==='not_granted'||c==='sampling_disabled'||c==='not_declared'||c==='capability_disabled'||c==='capability_removed'){aiOff=true;CAP.sample=null}
    aiNote=c==='cancelled'?'':'Claude no pudo escribir preguntas ahora ('+(c==='rate_limited'?'límite de uso alcanzado':'error temporal')+'); se usaron preguntas automáticas.';
    return 0;
  }finally{aiCtl=null}
}
async function startExam(set){
  hist.set=set;aiNote='';
  const first=build(set.n,set.area,{gen:false,recycle:false});
  const keys=Object.keys(first.short);
  if(keys.length&&set.ai&&CAP.sample&&!aiOff){
    let asks=keys.map(k=>[k,Math.min(first.short[k]*2,12)]);
    const tot=asks.reduce((a,x)=>a+x[1],0);
    if(tot>40)asks=asks.map(x=>[x[0],Math.max(1,Math.floor(x[1]*40/tot))]);
    await askClaude(asks);
  }
  const {qs,info}=build(set.n,set.area,{gen:true,recycle:true});
  info.note=aiNote;
  hist.runs=(hist.runs||0)+1;
  qs.forEach(q=>{hist.seen[q.uid]=hist.runs});
  save();
  S={qs,idx:0,ans:[],fb:set.fb,info,set,hint:false};
  renderExam();window.scrollTo(0,0);
}
