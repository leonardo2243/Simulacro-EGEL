 diferentes etapas.","e":"La segmentación divide el ciclo de instrucción (Fetch, Decode, Execute, etc.) en múltiples etapas. Esto permite que la CPU trabaje en diferentes etapas de varias instrucciones al mismo tiempo. Mientras una instrucción se está ejecutando, la siguiente se está decodificando y la subsiguiente se está captando, aumentando significativamente el rendimiento."},{"i":"HW-ARQ-047","k":"1.2","d":"Avanzado","q":"Un 'hazard' o riesgo de datos en un procesador con pipeline ocurre cuando...","o":["La CPU intenta ejecutar dos instrucciones del mismo tipo al mismo tiempo.","Una instrucción necesita el resultado de una instrucción anterior que aún no ha completado su ejecución.","El programa intenta saltar a una dirección de memoria que no contiene una instrucción válida."],"a":1,"h":"Este problema surge de la dependencia de datos entre instrucciones que se están ejecutando de forma superpuesta.","e":"Un riesgo de datos (data hazard) es una condición que ocurre cuando una instrucción, que está en una etapa del pipeline, necesita el resultado de otra instrucción que todavía está en una etapa anterior del mismo pipeline y cuyo resultado aún no ha sido escrito en el registro. Esto requiere que el procesador se detenga (stall) o use técnicas de adelantamiento (forwarding) para resolver la dependencia."},{"i":"HW-ARQ-048","k":"1.2","d":"Básico","q":"¿Qué bus es bidireccional, permitiendo que se fluya tanto desde la CPU hacia la memoria como desde la memoria hacia la CPU?","o":["Bus de direcciones","Bus de datos","Bus de control"],"a":1,"h":"Su función es transportar la información que se va a procesar o que ya ha sido procesada.","e":"El bus de datos es bidireccional porque la CPU necesita tanto escribir datos en la memoria (enviarlos) como leer datos desde la memoria (recibirlos). Su ancho (ej. 64 bits) determina cuántos datos se pueden transferir a la vez."},{"i":"HW-ARQ-049","k":"1.2","d":"Medio","q":"Una compuerta XOR produce una salida verdadera (1) cuando:","o":["Cualquiera de sus entradas es verdadera.","Todas sus entradas son verdaderas.","Sus entradas tienen valores diferentes."],"a":2,"h":"Es la compuerta de la 'desigualdad'.","e":"La compuerta XOR produce una salida de 1 solo si el número de entradas con valor 1 es impar. Para dos entradas, esto significa que la salida es 1 si una entrada es 1 y la otra es 0 (son diferentes). Si ambas son 0 o ambas son 1, la salida es 0."},{"i":"HW-ARQ-050","k":"1.2","d":"Medio","q":"Un técnico observa que una computadora de escritorio, tras ser desconectada de la corriente por varios días, pierde la configuración de la fecha y la hora. ¿Cuál es la causa más probable de este problema?","o":["Fallo en la memoria ROM que almacena el UEFI.","La batería del CMOS está agotada.","El chipset ha sufrido un daño irreparable."],"a":1,"h":"Ciertos datos de configuración del sistema, incluyendo la hora del RTC, necesitan una alimentación constante de bajo consumo para no borrarse.","e":"La memoria CMOS es una RAM volátil de muy bajo consumo que almacena la configuración del BIOS/UEFI (orden de arranque, fecha, hora). El Reloj de Tiempo Real (RTC) también necesita energía para seguir funcionando. Ambos son alimentados por una pequeña batería en la placa base. Si esta batería se agota, la información del CMOS se pierde al desconectar la computadora de la red eléctrica."},{"i":"HW-ARQ-051","k":"1.2","d":"Avanzado","q":"Al recibir una señal de interrupción de hardware, ¿cuál es una de las primeras acciones que realiza la CPU antes de ejecutar la Rutina de Servicio de Interrupción (ISR)?","o":["Incrementar el Contador de Programa (PC) para saltar la siguiente instrucción.","Limpiar el contenido de todos los registros para preparar la ISR.","Guardar el estado actual del procesador (PC y otros registros) en la pila (stack)."],"a":2,"h":"La CPU debe ser capaz de reanudar el programa interrumpido exactamente donde lo dejó, sin perder ninguna información.","e":"Para poder continuar el programa original después de atender la interrupción, la CPU debe primero salvar su contexto actual. Esto implica empujar (push) el valor del Contador de Programa (PC) y el contenido de los registros de estado (y a veces otros registros) a un área de memoria llamada pila (stack). Una vez atendida la interrupción, recuperará esta información para continuar."},{"i":"HW-ARQ-052","k":"1.2","d":"Medio","q":"De acuerdo con los Teoremas de De Morgan del álgebra booleana, ¿a qué es equivalente la expresión NOT (A AND B)?","o":["(NOT A) AND (NOT B)","(NOT A) OR (NOT B)","A OR (NOT B)"],"a":1,"h":"La negación de una conjunción es la disyunción de las negaciones.","e":"El Teorema de De Morgan establece que la negación de una operación AND es equivalente a la operación OR de las entradas negadas. Por lo tanto, (A · B)' = A' + B'. De manera similar, la negación de una operación OR es la AND de las negaciones: (A + B)' = A' · B'."},{"i":"HW-ARQ-053","k":"1.2","d":"Avanzado","q":"Durante una operación de lectura de memoria, el Registro MAR y el Registro MDR juegan un papel crucial. ¿Qué contienen estos registros al final de la operación?","o":["MAR contiene el dato leído; MDR contiene la dirección de la siguiente lectura.","MAR contiene la dirección del dato leído; MDR contiene el dato en sí.","Ambos registros contienen el dato leído para su verificación."],"a":1,"h":"Cada registro tiene un propósito específico: uno para 'dónde' y otro para 'qué'.","e":"El proceso es: 1. La CPU coloca la dirección de memoria que quiere leer en el MAR. 2. La CPU activa la línea de 'lectura' del bus de control. 3. La memoria responde colocando el dato de esa dirección en el bus de datos. 4. El MDR copia el dato desde el bus de datos. Al final, el MAR sigue conteniendo la dirección y el MDR contiene el dato que se leyó.","f":1},{"i":"HW-ARQ-054","k":"1.2","d":"Medio","q":"Una tabla de verdad de 3 entradas (A, B, C) produce una salida (S) de '1' solo cuando el número de entradas en '1' es impar. ¿A qué función lógica corresponde?","o":["NAND de 3 entradas.","XOR de 3 entradas.","NOR de 3 entradas."],"a":1,"h":"Esta compuerta lógica a menudo se describe como un detector de paridad.","e":"La función XOR (OR Exclusiva) produce una salida de '1' cuando sus entradas son diferentes. En el caso de 3 o más entradas, esto se generaliza a que la salida es '1' si hay un número impar de entradas en '1'. Por ejemplo, para A=1, B=0, C=1 (dos '1', par), la salida sería 0. Para A=1, B=0, C=0 (un '1', impar), la salida sería 1."},{"i":"HW-ARQ-055","k":"1.2","d":"Medio","q":"¿Cuál es una ventaja clave de la interfaz UEFI sobre el BIOS tradicional?","o":["Soporte nativo para arrancar desde unidades de almacenamiento de más de 2.2 TB.","Capacidad para funcionar sin necesidad de memoria RAM en el sistema.","Tiempos de arranque más lentos pero con mayor seguridad."],"a":0,"h":"El BIOS tradicional utilizaba el esquema de particionamiento MBR, que tenía una limitación significativa de tamaño.","e":"El BIOS heredado usa el Master Boot Record (MBR), que no puede direccionar discos de más de 2.2 TB. UEFI (Unified Extensible Firmware Interface) utiliza la Tabla de Particiones GUID (GPT), que soporta volúmenes de arranque mucho más grandes (en el orden de zettabytes), además de ofrecer arranques más rápidos y características de seguridad como Secure Boot."},{"i":"HW-ARQ-056","k":"1.2","d":"Avanzado","q":"En un sistema de multiprocesamiento simétrico (SMP), ¿qué característica define la relación entre los procesadores?","o":["Un procesador maestro asigna tareas a varios procesadores esclavos.","Cada procesador tiene su propia memoria privada y se comunican a través de una red.","Todos los procesadores son pares, comparten la misma memoria principal y tienen acceso a los mismos dispositivos de E/S."],"a":2,"h":"La palabra 'simétrico' implica que todos los procesadores son iguales y tienen los mismos privilegios.","e":"La arquitectura SMP, base de los modernos procesadores multinúcleo, se define porque todos los procesadores (o núcleos) son idénticos, ejecutan la misma copia del sistema operativo y comparten el acceso a la memoria principal y a los periféricos. No hay una jerarquía de maestro-esclavo."},{"i":"HW-ARQ-057","k":"1.2","d":"Medio","q":"¿Cuál es la función principal del Registro de Instrucción (IR) dentro de la CPU?","o":["Almacenar la dirección de memoria de la instrucción actual.","Contener el código de operación de la instrucción que se está decodificando y ejecutando.","Acumular el resultado de la última instrucción ejecutada por la ALU."],"a":1,"h":"Una vez que una instrucción es traída de la memoria (fase de fetch), se debe guardar en algún lugar dentro de la CPU para ser analizada.","e":"Después de la fase de captación (fetch), la instrucción leída desde la memoria se carga en el Registro de Instrucción (IR). La Unidad de Control accede a este registro para decodificar el código de operación (opcode) y los operandos, y así determinar qué acción ejecutar."},{"i":"HW-ARQ-058","k":"1.2","d":"Medio","q":"La memoria ROM de máscara (Mask ROM) es un tipo de memoria no volátil. ¿Cuál es su característica más distintiva?","o":["Puede ser reprogramada eléctricamente miles de veces por el usuario.","Los datos se graban de forma permanente durante el proceso de fabricación del chip.","Utiliza luz ultravioleta para borrar su contenido antes de una nueva programación."],"a":1,"h":"Piensa en un método de producción en masa donde el contenido no necesita ser modificado nunca.","e":"La Mask ROM es programada en la fábrica como parte del proceso de manufactura del circuito integrado. Su contenido es fijo y no puede ser alterado de ninguna manera. Es la opción más económica para producir grandes volúmenes de dispositivos donde el firmware es definitivo, como en cartuchos de videojuegos antiguos o microcontroladores simples."},{"i":"HW-ARQ-059","k":"1.2","d":"Avanzado","q":"En las arquitecturas de CPU modernas (System on a Chip - SoC), muchas de las funciones del Northbridge y Southbridge han sido integradas en otros componentes. ¿Dónde reside principalmente el controlador de memoria en un sistema de escritorio actual?","o":["En el Platform Controller Hub (PCH), el sucesor del Southbridge.","En un chip dedicado separado, conectado directamente a la RAM.","Integrado directamente en el die de la CPU."],"a":2,"h":"Para reducir la latencia, el componente que más necesita la memoria debe estar lo más cerca posible de ella.","e":"Para mejorar el rendimiento y reducir la latencia, los fabricantes de CPU (como Intel y AMD) movieron el controlador de memoria (una de las funciones clave del Northbridge) desde un chip separado en la placa base directamente al interior de la propia CPU. El resto de funciones del chipset se consolidaron en el Platform Controller Hub (PCH)."},{"i":"HW-ARQ-060","k":"1.2","d":"Avanzado","q":"Cuando una CPU recibe múltiples peticiones de interrupción simultáneamente, utiliza una tabla de vectores de interrupción (IVT). ¿Cuál es el propósito de esta tabla?","o":["Almacenar los datos generados por los dispositivos que causaron la interrupción.","Contener las direcciones de memoria de inicio de las Rutinas de Servicio de Interrupción (ISR) para cada dispositivo.","Actuar como un buffer para ordenar las interrupciones por orden de llegada."],"a":1,"h":"La tabla funciona como un índice o un 'directorio telefónico' para que la CPU sepa a qué rutina de código saltar para cada tipo de interrupción.","e":"La tabla de vectores de interrupción es un área en memoria que contiene las direcciones de las rutinas de servicio para cada posible fuente de interrupción. Cuando ocurre una interrupción, la CPU utiliza el número de interrupción como un índice en esta tabla para encontrar la dirección de la ISR correspondiente y saltar a ella, ejecutando el código específico para manejar ese evento."},{"i":"HW-ARQ-061","k":"1.2","d":"Básico","q":"La ley distributiva del álgebra booleana permite reescribir expresiones. ¿Cuál de las siguientes opciones es una aplicación correcta de esta ley?","o":["A + (B · C) = (A + B) · (A + C)","A · (B + C) = (A · B) + C","A + (B · C) = (A · B) + (A · C)"],"a":0,"h":"Esta ley funciona de manera similar a la distributiva en el álgebra convencional, pero también a la inversa para la suma sobre la multiplicación.","e":"El álgebra booleana tiene dos leyes distributivas. La primera es A · (B + C) = (A · B) + (A · C), análoga al álgebra normal. La segunda, que es única del álgebra booleana, es A + (B · C) = (A + B) · (A + C). La opción correcta demuestra esta segunda ley."},{"i":"HW-ARQ-062","k":"1.2","d":"Medio","q":"Dentro de la estructura de registros de una CPU, ¿cuál es la función del Stack Pointer - SP?","o":["Apuntar a la base de la pila, que es una dirección fija en memoria.","Contener la dirección de memoria del último elemento añadido a la pila.","Almacenar el número total de elementos que se encuentran actualmente en la pila."],"a":1,"h":"La pila es una estructura LIFO (Last-In, First-Out), y este registro siempre sabe dónde se encuentra el elemento más reciente.","e":"El Puntero de Pila (SP) es un registro cuyo único propósito es mantener la dirección de memoria del tope de la pila. Cuando se añade un dato a la pila (push), el SP se decrementa (en arquitecturas donde la pila crece hacia abajo) y el dato se guarda en la nueva dirección. Cuando se quita un dato (pop), el dato es leído y el SP se incrementa."},{"i":"HW-ARQ-063","k":"1.2","d":"Medio","q":"En la arquitectura de chipset tradicional, ¿cuál era la función principal del Northbridge (puente norte)?","o":["Gestionar la comunicación con dispositivos lentos como el teclado, el mouse y los puertos serie.","Servir como el controlador de interrupciones y el reloj de tiempo real.","Actuar como intermediario de alta velocidad entre la CPU, la RAM y la tarjeta gráfica (AGP/PCIe)."],"a":2,"h":"Este componente se encargaba de los buses más rápidos y críticos del sistema.","e":"El Northbridge era el componente central que manejaba la comunicación con los periféricos de mayor ancho de banda: la memoria RAM (a través del controlador de memoria) y el puerto gráfico. Su contraparte, el Southbridge, se encargaba de los dispositivos de E/S más lentos (discos duros, USB, audio, etc.)."},{"i":"HW-ARQ-064","k":"1.2","d":"Medio","q":"Un ingeniero de sistemas embebidos está diseñando un microcontrolador para una aplicación de procesamiento de señales en tiempo real que requiere acceso simultáneo a instrucciones y datos. ¿Qué arquitectura de computadoras sería la más adecuada para minimizar los cuellos de botella en el acceso a memoria?","o":["Arquitectura de Von Neumann, porque utiliza un único espacio de memoria para ambos.","Arquitectura Harvard, ya que emplea buses y memorias separadas para datos e instrucciones.","Arquitectura CISC, porque optimiza el número de instrucciones por programa."],"a":1,"h":"Piensa en cómo se accede a las instrucciones y a los datos en cada arquitectura y cuál permite paralelismo.","e":"La arquitectura Harvard utiliza memorias y buses independientes para instrucciones y datos, permitiendo que la CPU pueda leer una instrucción y acceder a un dato simultáneamente. Esto es crucial en aplicaciones de procesamiento de señales (DSP) donde el rendimiento es crítico y se evitan los cuellos de botella de la arquitectura Von Neumann.","f":1},{"i":"HW-ARQ-065","k":"1.2","d":"Medio","q":"En una empresa de desarrollo de compiladores, un equipo debate si optimizar su nuevo lenguaje para una arquitectura RISC o CISC. El objetivo es lograr la máxima eficiencia en dispositivos móviles. ¿Qué enfoque arquitectónico debería priorizar el equipo?","o":["CISC, porque sus instrucciones complejas simplifican la tarea para el compilador.","RISC, ya que su conjunto de instrucciones simples y de longitud fija permite una optimización del consumo de energía y paralelismo.","Cualquiera de las dos, ya que los compiladores modernos pueden abstraer las diferencias de arquitectura."],"a":1,"h":"Considera las prioridades en dispositivos móviles: rendimiento por vatio y ejecución rápida de instrucciones simples.","e":"Las arquitecturas RISC (Reduced Instruction Set Computer) son preferidas en dispositivos móviles debido a su eficiencia energética. Sus instrucciones simples se ejecutan en un solo ciclo de reloj, lo que facilita técnicas como el pipelining y reduce la complejidad del hardware, resultando en menor consumo de energía."},{"i":"HW-ARQ-066","k":"1.2","d":"Medio","q":"Un técnico está diagnosticando una computadora que no arranca. Al encenderla, los ventiladores giran, pero no hay imagen en la pantalla ni se escuchan los pitidos del POST. El técnico sospecha de un fallo en el firmware de arranque. ¿En qué tipo de memoria se almacena típicamente este firmware?","o":["En la memoria RAM dinámica (DRAM), que se carga al inicio.","En la memoria EEPROM o Flash ROM, donde reside el BIOS/UEFI.","En la memoria caché L3 de la CPU para un acceso más rápido."],"a":1,"h":"El firmware de arranque debe ser no volátil, es decir, persistir incluso cuando el equipo está apagado.","e":"El BIOS (Basic Input/Output System) o su sucesor UEFI (Unified Extensible Firmware Interface) es el firmware que inicializa el hardware durante el proceso de arranque. Se almacena en una memoria no volátil como Flash ROM o EEPROM (Electrically Erasable Programmable Read-Only Memory) en la placa base."},{"i":"HW-ARQ-067","k":"1.2","d":"Medio","q":"Un desarrollador de software nota que su aplicación, que procesa grandes volúmenes de datos, sufre una caída drástica de rendimiento. Un análisis revela un alto número de 'cache misses'. ¿Qué está ocurriendo en la jerarquía de memoria para causar este problema?","o":["La CPU está encontrando los datos que necesita en la memoria CMOS con demasiada frecuencia.","El bus de datos está saturado y no puede transferir información a la velocidad requerida.","La CPU no encuentra los datos requeridos en la memoria caché y debe buscarlos en la memoria RAM."],"a":2,"h":"Un 'miss' en la caché implica que la información no estaba donde la CPU la buscó primero.","e":"Un 'cache miss' (fallo de caché) ocurre cuando la CPU intenta leer o escribir datos en la caché (L1, L2, o L3) y no los encuentra. Esto obliga a la CPU a acceder a la memoria principal (RAM), que es significativamente más lenta, generando latencias que degradan el rendimiento general de la aplicación."},{"i":"HW-ARQ-068","k":"1.2","d":"Medio","q":"Durante el diseño de un circuito de control de acceso, un ingeniero necesita una lógica que solo active una alarma si un sensor de movimiento está activado Y un sensor de puerta está desactivado. ¿Qué compuerta lógica fundamental modela esta condición?","o":["Una compuerta OR, porque cualquiera de las dos condiciones puede activar la alarma.","Una compuerta AND, donde una de las entradas está invertida.","Una compuerta XOR, porque la alarma se activa solo si los estados son diferentes."],"a":1,"h":"La condición es 'A y no B'. Analiza cómo construir esta expresión con compuertas básicas.","e":"La condición es: Movimiento (M=1) Y NO Puerta (P=0). Esto se representa con la función booleana F = M AND (NOT P). Para implementarlo, la señal del sensor de puerta (P) se pasa primero por una compuerta NOT (inversor) y luego el resultado se introduce en una compuerta AND junto con la señal del sensor de movimiento (M)."},{"i":"HW-ARQ-069","k":"1.2","d":"Medio","q":"Un estudiante está construyendo un sumador completo de 1 bit utilizando únicamente dos semisumadores. ¿Qué compuerta lógica adicional necesita para conectar correctamente los dos semisumadores y gestionar el acarreo de entrada (Cin)?","o":["Una compuerta AND para el acarreo de salida final.","Una compuerta XOR para la suma final.","Una compuerta OR para combinar los acarreos de ambos semisumadores."],"a":2,"h":"El acarreo de salida (Cout) del sumador completo se produce si cualquiera de los semisumadores genera un acarreo.","e":"Un sumador completo (Full Adder) se puede construir con dos semisumadores (Half Adders) y una compuerta OR. El primer semisumador suma las entradas A y B. El segundo semisumador suma el resultado de la suma anterior con el acarreo de entrada (Cin). El acarreo de salida final (Cout) se obtiene al conectar los acarreos de ambos semisumadores a una compuerta OR.","f":1},{"i":"HW-ARQ-070","k":"1.2","d":"Medio","q":"Un sistema de telecomunicaciones debe enrutar una de 16 líneas de datos de entrada a una única línea de salida, basándose en una señal de control de 4 bits. ¿Qué circuito combinacional es el ideal para esta tarea?","o":["Un decodificador de 4 a 16, para habilitar una de las líneas.","Un multiplexor (MUX) de 16 a 1, con 4 bits de selección.","Un codificador de 16 a 4, para comprimir las señales."],"a":1,"h":"El circuito debe 'seleccionar' una entrada de entre muchas. Piensa en un selector de canales de TV.","e":"Un multiplexor (MUX) es el dispositivo diseñado para esta función. Utiliza 'n' líneas de selección (en este caso, 4) para elegir una de las 2^n entradas de datos (en este caso, 2^4 = 16) y dirigirla a la única línea de salida. Funciona como un selector de datos digital."},{"i":"HW-ARQ-071","k":"1.2","d":"Medio","q":"Se ha presentado un error en un sistema de memoria donde un bit específico se invierte esporádicamente (pasa de 0 a 1 o viceversa). Para corregir esto en un futuro diseño, se necesita un circuito que pueda invertir su salida cada vez que recibe un pulso de reloj. ¿Qué tipo de Flip-Flop es el más adecuado para esta función de 'toggle'?","o":["Flip-Flop tipo D","Flip-Flop tipo T","Flip-Flop tipo SR"],"a":1,"h":"El nombre de este flip-flop describe su función principal: conmutar o alternar.","e":"El Flip-Flop tipo T (Toggle) está diseñado para cambiar (o 'togglear') su estado de salida (de Q a no-Q y viceversa) cada vez que su entrada T está en alto y recibe un pulso de reloj. Es la base para construir contadores binarios y divisores de frecuencia."},{"i":"HW-ARQ-072","k":"1.2","d":"Medio","q":"Un ingeniero necesita diseñar un contador síncrono de 3 bits que cuente de 0 a 7. Si está utilizando Flip-Flops JK, ¿cuál debe ser la configuración de las entradas J y K para que los flip-flops basculen (toggle) en cada pulso de reloj relevante?","o":["Ambas entradas J y K deben estar conectadas a un nivel lógico bajo (0).","La entrada J debe estar en alto (1) y la K en bajo (0).","Ambas entradas J y K deben estar conectadas a un nivel lógico alto (1)."],"a":2,"h":"Consulta la tabla de verdad del Flip-Flop JK. ¿Qué combinación de J y K provoca el cambio de estado de la salida?","e":"En un Flip-Flop JK, cuando ambas entradas J y K se mantienen en un nivel lógico alto (1), el flip-flop opera en modo 'toggle' o basculante. Esto significa que su salida se invertirá con cada pulso de reloj que reciba, lo cual es el comportamiento fundamental necesario para construir contadores.","f":1},{"i":"HW-ARQ-073","k":"1.2","d":"Medio","q":"Durante la fase de decodificación del ciclo de instrucción, la Unidad de Control de una CPU interpreta una instrucción que requiere leer un dato desde una dirección de memoria específica. ¿Qué registro de la CPU se utilizará para almacenar esta dirección de memoria antes de que se coloque en el bus de direcciones?","o":["El IR","El ACC","El MAR"],"a":2,"h":"El nombre de este registro describe su función: guardar la 'dirección' de la 'memoria' a ser accedida.","e":"El Memory Address Register (MAR) o Registro de Dirección de Memoria es un registro de la CPU que almacena la dirección de memoria que se va a leer o escribir. La Unidad de Control copia la parte de la dirección de la instrucción en el MAR, y luego esta dirección se envía a través del bus de direcciones al sistema de memoria."},{"i":"HW-ARQ-074","k":"1.2","d":"Medio","q":"Un sistema informático deja de funcionar y, al reiniciarlo, no reconoce ningún dispositivo de almacenamiento. Las pruebas de hardware indican que la CPU puede ejecutar instrucciones, pero es incapaz de seleccionar una dirección de memoria o un dispositivo de E/S específico. ¿Qué componente del sistema de buses es el más probable que esté fallando?","o":["El bus de datos","El bus de control","El bus de direcciones"],"a":2,"h":"Para leer o escribir en una ubicación (memoria o E/S), la CPU primero debe poder 'señalar' o 'apuntar' a esa ubicación.","e":"El bus de direcciones es el responsable de transportar la información que especifica la dirección de memoria o el puerto de E/S con el que la CPU desea interactuar. Si este bus falla, la CPU pierde la capacidad de seleccionar un dispositivo o una ubicación de memoria, lo que impide cualquier operación de lectura o escritura, y el sistema no podría, por ejemplo, encontrar el disco de arranque."},{"i":"HW-ARQ-075","k":"1.2","d":"Medio","q":"Un programador de bajo nivel está tratando de optimizar una función y se da cuenta de que la expresión lógica `!(A && B)` es computacionalmente costosa en su plataforma. Según las Leyes de De Morgan, ¿qué expresión equivalente podría utilizar para simplificarla?","o":["`!A && !B`","`!A || !B`","`A || !B`"],"a":1,"h":"La ley de De Morgan dice que la negación de una conjunción es la disyunción de las negaciones.","e":"Las Leyes de De Morgan son dos reglas fundamentales en el Álgebra de Boole. Una de ellas establece que la negación de una conjunción (AND) es equivalente a la disyunción (OR) de las negaciones de sus componentes. Por lo tanto, `NOT (A AND B)` es lógicamente equivalente a `(NOT A) OR (NOT B)`."},{"i":"HW-ARQ-076","k":"1.2","d":"Medio","q":"Una empresa fabrica teclados numéricos de 10 teclas (0-9). Para reducir el número de cables de salida, se decide usar un circuito que convierta la tecla presionada (una de 10 entradas) a su equivalente en binario de 4 bits. ¿Qué circuito combinacional se requiere para esta tarea?","o":["Un codificador (Encoder) de 10 a 4.","Un demultiplexor (DEMUX) 1 a 10.","Un multiplexor (MUX) 10 a 1."],"a":0,"h":"El objetivo es 'codificar' una entrada activa en un número binario representativo.","e":"Un codificador (Encoder) realiza la función opuesta a un decodificador. Tiene 2^n líneas de entrada y 'n' líneas de salida. Cuando una de las líneas de entrada se activa, el codificador genera el código binario correspondiente en sus salidas. En este caso, un codificador de 10 a 4 convierte la señal de una de las 10 teclas en un número BCD de 4 bits."},{"i":"HW-ARQ-077","k":"1.2","d":"Medio","q":"Un microprocesador está ejecutando un programa. Durante el ciclo de instrucción, la instrucción `ADD R1, R2` es traída de la memoria. ¿En qué registro se almacenará temporalmente el código de operación 'ADD' y los operandos 'R1, R2' justo después de ser leída y antes de ser interpretada?","o":["En el Registro de Instrucción (IR).","En el Contador de Programa (PC).","En el Registro de Datos de Memoria (MDR)."],"a":0,"h":"Hay un registro específico para 'sostener' la instrucción que se está ejecutando en el momento.","e":"La fase 'fetch' (búsqueda) del ciclo de instrucción consiste en leer la instrucción desde la memoria y cargarla en el Registro de Instrucción (Instruction Register, IR). Una vez en el IR, la Unidad de Control puede proceder a la fase de 'decode' (decodificación) para interpretar qué operación se debe realizar."},{"i":"HW-ARQ-078","k":"1.2","d":"Medio","q":"Un equipo de diseño está eligiendo el tipo de RAM para la memoria caché de un nuevo procesador de alto rendimiento. El presupuesto es limitado, pero la velocidad es la máxima prioridad. ¿Qué tipo de tecnología de RAM deberían elegir?","o":["DRAM (Dynamic RAM).","SRAM (Static RAM).","Flash RAM, porque es no volátil y retiene los datos sin energía."],"a":1,"h":"La memoria caché debe ser extremadamente rápida para no ser un cuello de botella para la CPU. Esta velocidad tiene un costo.","e":"La memoria SRAM (Static RAM) se utiliza para las cachés (L1, L2, L3) porque es significativamente más rápida que la DRAM. A diferencia de la DRAM, que usa capacitores y necesita ser refrescada constantemente, la SRAM usa flip-flops para almacenar cada bit, lo que le permite mantener los datos mientras haya energía, sin ciclos de refresco, resultando en menores latencias."},{"i":"HW-ARQ-079","k":"1.2","d":"Medio","q":"Un ingeniero necesita crear un divisor de frecuencia que reduzca a la mitad la frecuencia de una señal de reloj de entrada. ¿Cuál es el circuito secuencial más simple que puede lograr esto?","o":["Un Flip-Flop tipo D.","Un registro de desplazamiento de 4 bits.","Un sumador completo con acarreo en cascada."],"a":0,"h":"Piensa en un circuito que cambie su estado en cada pulso de reloj. ¿Cómo se relaciona la frecuencia de la salida con la del reloj?","e":"Un Flip-Flop tipo D con su salida negada (Q') conectada de nuevo a su entrada de datos (D) crea un Flip-Flop tipo T efectivo. En esta configuración, la salida Q cambiará de estado en cada flanco ascendente (o descendente) del reloj. Como se necesitan dos ciclos de reloj de entrada para completar un ciclo de la señal de salida, la frecuencia de salida es exactamente la mitad de la frecuencia de entrada."},{"i":"HW-ARQ-080","k":"1.2","d":"Medio","q":"Un sistema de control industrial tiene una función lógica de 4 variables que debe ser implementada con el menor número posible de compuertas NAND. ¿Cuál es la herramienta más apropiada que un diseñador usaría para encontrar la expresión booleana mínima para esta función?","o":["Un diagrama de flujo del programa.","Un Mapa de Karnaugh (K-map).","La aplicación directa de las leyes asociativas y distributivas."],"a":1,"h":"Existe un método gráfico específico para simplificar funciones booleanas agrupando términos adyacentes.","e":"El Mapa de Karnaugh es un método gráfico que permite simplificar funciones lógicas de hasta 4 o 5 variables de manera sistemática. Al agrupar los '1's en la tabla en grupos de 2, 4 u 8, se pueden identificar y eliminar variables redundantes, obteniendo una expresión mínima en forma de suma de productos o producto de sumas, que luego puede ser implementada con menos compuertas."},{"i":"HW-ARQ-081","k":"1.2","d":"Medio","q":"Una CPU está realizando una operación aritmética que genera un resultado negativo. La ALU necesita indicar esta condición a la Unidad de Control para una posible bifurcación en el programa. ¿Qué componente interno de la CPU se encarga de almacenar este tipo de información de estado?","o":["El registro Acumulador (ACC).","El Registro de Banderas (Flags Register).","La memoria caché L1."],"a":1,"h":"Piensa en 'banderas' que se levantan para señalar eventos específicos como Cero, Negativo, Acarreo u Overflow.","e":"La ALU (Unidad Aritmético-Lógica) actualiza un conjunto de bits de estado, conocidos como banderas o 'flags', después de cada operación. Estas banderas se guardan en el Registro de Banderas (o Registro de Estado). Banderas comunes incluyen la Bandera de Signo (o Negativo), Bandera de Cero, Bandera de Acarreo y Bandera de Desbordamiento (Overflow), que son cruciales para la ejecución de saltos condicionales."},{"i":"HW-ARQ-082","k":"1.2","d":"Medio","q":"Un técnico observa que al conectar un octavo módulo de memoria a una computadora, el sistema se vuelve inestable, aunque los módulos son compatibles. El manual de la CPU indica que tiene un bus de direcciones de 32 bits. ¿Cuál es la causa más probable del problema, asumiendo que el problema no es eléctrico?","o":["El bus de control no tiene suficientes líneas para manejar 8 módulos.","El bus de direcciones no es lo suficientemente ancho para direccionar toda la memoria instalada.","El programador de la BIOS no previó el uso de tantos módulos."],"a":1,"h":"Un bus de direcciones de 'n' bits puede direccionar 2^n ubicaciones. Calcula el límite para 32 bits.","e":"Un bus de direcciones de 32 bits puede direccionar un máximo de 2^32 bytes, que son 4 Gigabytes (GB) de memoria. Si al agregar el octavo módulo se supera este límite de direccionamiento físico, la CPU no podrá asignar direcciones únicas a toda la RAM. Esto puede causar 'aliasing' de memoria o conflictos de dirección, llevando a la inestabilidad del sistema. Aunque los sistemas modernos usan extensiones (PAE), el límite fundamental del bus de 32 bits sigue siendo 4 GB de espacio de direcciones virtual por proceso."},{"i":"HW-ARQ-083","k":"1.2","d":"Medio","q":"Se está diseñando un sistema para mostrar un número de 4 bits en un display de 7 segmentos. Se necesita un circuito que convierta el código binario de entrada (por ejemplo, 0101 para 5) en las 7 señales de salida que encienden los segmentos correctos del display. ¿Qué circuito es el adecuado?","o":["Un codificador de 7 a 4.","Un multiplexor de 4 a 1.","Un decodificador de BCD a 7."],"a":2,"h":"El circuito debe 'decodificar' el número binario en un patrón de visualización.","e":"Un decodificador de BCD (Binary-Coded Decimal) a 7 segmentos es un circuito combinacional diseñado específicamente para esta tarea. Toma una entrada BCD de 4 bits y genera 7 salidas (a, b, c, d, e, f, g), cada una correspondiente a un segmento del display. La lógica interna del decodificador asegura que se activen las salidas correctas para formar el dígito decimal correspondiente a la entrada binaria."},{"i":"HW-ARQ-084","k":"1.2","d":"Medio","q":"Un programador de lenguaje ensamblador escribe un código que debe realizar una operación bit a bit para verificar si el tercer bit (bit 2) de un registro está encendido. ¿Qué operación lógica sería la más eficiente para 'aislar' ese bit?","o":["Una operación OR con una máscara de `00000100`.","Una operación AND con una máscara de `00000100`.","Una operación XOR con una máscara de `11111011`."],"a":1,"h":"Se necesita una operación que ponga a cero todos los bits excepto el que te interesa, conservando el valor de este último.","e":"La operación AND es ideal para el enmascaramiento de bits. Al realizar un AND lógico entre el valor del registro y una máscara (en este caso, `00000100`, que solo tiene el bit 2 encendido), el resultado será cero en todas las posiciones excepto en la del bit 2. Si el bit 2 del registro original era 1, el resultado será `00000100`; si era 0, el resultado será `00000000`. Esto permite verificar fácilmente el estado del bit."},{"i":"HW-ARQ-085","k":"1.2","d":"Medio","q":"Se está diseñando un contador de rizo (asíncrono) de 4 bits. Un problema conocido de este tipo de contadores es el retardo de propagación que puede generar estados intermedios no válidos. ¿Cuál es la causa fundamental de este problema?","o":["La señal de reloj se aplica a todos los flip-flops simultáneamente.","La salida de cada flip-flop sirve como señal de reloj para el siguiente.","Se utilizan flip-flops tipo D en lugar de JK."],"a":1,"h":"El término 'asíncrono' o 'de rizo' describe cómo se propaga la señal de reloj a través del circuito.","e":"En un contador de rizo o asíncrono, solo el primer flip-flop está conectado directamente a la señal de reloj principal. La salida de este flip-flop actúa como el reloj para el segundo, la salida del segundo como reloj para el tercero, y así sucesivamente. Este encadenamiento provoca un retardo acumulativo (retraso de propagación), haciendo que los bits no cambien todos al mismo tiempo, lo que puede generar estados transitorios incorrectos."},{"i":"HW-ARQ-086","k":"1.2","d":"Medio","q":"Un sistema de adquisición de datos necesita almacenar temporalmente información proveniente de un sensor antes de que la CPU la procese. El acceso debe ser muy rápido. ¿Qué conjunto de circuitos secuenciales sería el más apropiado para este almacenamiento temporal dentro de la CPU o un periférico cercano?","o":["Un Flip-Flop tipo T.","Un conjunto de registros de propósito general.","Una memoria ROM."],"a":1,"h":"Un registro es una colección de flip-flops diseñada para almacenar un grupo de bits (una palabra, un byte, etc.).","e":"Los registros son los elementos de memoria más rápidos en la jerarquía de memoria. Un registro de 64 bits está compuesto por 64 flip-flops que trabajan en conjunto para almacenar 8 bytes (ya que 1 byte = 8 bits). Son ideales para el almacenamiento temporal de pequeñas cantidades de datos que necesitan ser accedidos y manipulados a la máxima velocidad por la CPU o la ALU."},{"i":"HW-ARQ-087","k":"1.2","d":"Medio","q":"Un sistema de control requiere que una señal de 'habilitación' (Enable) se envíe a uno de cuatro dispositivos diferentes, seleccionado por 2 líneas de control (S1, S0). ¿Qué circuito es el más adecuado para dirigir esta única señal de entrada a la salida correcta?","o":["Un multiplexor (MUX) 4 a 1.","Un demultiplexor (DEMUX) 1 a 4.","Un codificador de prioridad."],"a":1,"h":"El circuito debe tomar una fuente de datos única y distribuirla a uno de varios destinos.","e":"Un demultiplexor (DEMUX) realiza la operación inversa a un multiplexor. Tiene una sola línea de entrada de datos, 'n' líneas de selección y 2^n líneas de salida. Basándose en el valor de las líneas de selección, conecta la entrada de datos a una, y solo una, de las líneas de salida. Es ideal para enrutar una señal a múltiples destinos."},{"i":"HW-ARQ-088","k":"1.2","d":"Medio","q":"Durante la ejecución de un programa, la CPU necesita realizar una suma y luego, si el resultado es cero, saltar a una subrutina diferente. ¿Qué dos componentes principales de la CPU colaboran para lograr esta operación condicional?","o":["La memoria caché y la memoria RAM, utilizando los Registros MAR y MDR.","El bus de datos y el bus de direcciones, utilizando el Registro de Instrucción.","La ALU y la Unidad de Control, utilizando el Registro de Banderas."],"a":2,"h":"Una parte realiza el cálculo, otra parte almacena el estado del resultado, y una tercera parte toma una decisión basada en ese estado.","e":"La Unidad Aritmético-Lógica (ALU) realiza la operación de suma. Al finalizar, actualiza la 'Bandera de Cero' (Zero Flag) en el Registro de Banderas (si el resultado es 0, la pone en 1). La Unidad de Control, al decodificar la instrucción de salto condicional, revisa el estado de esta bandera. Si está activa, la Unidad de Control modificará el Contador de Programa (PC) para que apunte a la dirección de la subrutina, ejecutando así el salto."},{"i":"HW-EMB-001","k":"1.3","d":"Básico","q":"¿Qué periférico de microcontrolador se usa típicamente para generar señales PWM?","o":["ADC","Temporizador/Timer","UART"],"a":1,"h":"Ancho de pulso = temporización","e":"Los timers con módulos PWM permiten controlar ancho de pulso (p. ej. para motores o dimming LEDs)."},{"i":"HW-EMB-002","k":"1.3","d":"Medio","q":"En un sistema embebido con bajo consumo, ¿qué modo del MCU reduce más el gasto energético?","o":["Sleep/Deep-sleep","Idle","Active"],"a":0,"h":"Desactiva más dominios de reloj","e":"Los modos deep-sleep suspenden la mayoría de dominios de reloj; solo un RTC/INT puede reactivarlo."},{"i":"HW-EMB-003","k":"1.3","d":"Medio","q":"Un ingeniero está diseñando un termostato digital con un microcontrolador PIC. Necesita leer la temperatura de un sensor LM35, que proporciona un voltaje analógico proporcional a la temperatura. ¿Qué módulo del microcontrolador es esencial para esta tarea?","o":["PWM","UART","ADC"],"a":2,"h":"La señal del sensor es continua, pero el microcontrolador opera con valores discretos.","e":"El Convertidor Analógico-Digital (ADC) es indispensable para convertir la señal de voltaje analógica del sensor LM35 en un valor digital que el microcontrolador pueda procesar."},{"i":"HW-EMB-004","k":"1.3","d":"Avanzado","q":"Una empresa desarrolla un dispositivo IoT que envía datos a la nube. Para minimizar el consumo de energía, el microcontrolador debe pasar a un estado de bajo consumo y solo activarse cada 15 minutos para tomar una lectura y transmitirla. ¿Qué periférico es el más adecuado para despertar al MCU de un modo 'deep-sleep'?","o":["Un temporizador/watchdog (WDT)","Una interrupción por cambio de estado en un pin","El módulo UART al recibir un dato"],"a":0,"h":"Se necesita un mecanismo que funcione con un consumo mínimo y pueda contar tiempo de forma autónoma.","e":"El Watchdog Timer (WDT) o un Real-Time Clock (RTC) son ideales para despertar al MCU de modos de sueño profundo a intervalos regulares, ya que operan con muy bajo consumo y de forma independiente al reloj principal del CPU."},{"i":"HW-EMB-005","k":"1.3","d":"Medio","q":"Un equipo de desarrollo está trabajando en un sistema de control para un brazo robótico. El microcontrolador principal (Maestro) necesita coordinar varios microcontroladores secundarios (Esclavos) que controlan los motores. Se requiere un bus de comunicación que permita múltiples esclavos con solo dos cables. ¿Cuál es el protocolo más adecuado?","o":["UART","I²C (Inter-Integrated Circuit)","SPI (Serial Peripheral Interface)"],"a":1,"h":"Este protocolo usa líneas de datos (SDA) y de reloj (SCL) y un esquema de direccionamiento.","e":"El protocolo I²C es ideal para comunicación multi-esclavo en distancias cortas usando solo dos líneas (SDA y SCL), ya que cada dispositivo en el bus tiene una dirección única."},{"i":"HW-EMB-006","k":"1.3","d":"Medio","q":"Se está programando un microcontrolador en C para controlar la intensidad de un LED. Un ingeniero decide usar una señal PWM. Al configurar el registro del timer asociado, ¿qué parámetro define la resolución de los niveles de intensidad que se pueden generar?","o":["El pre-escalador del timer","El período del timer (valor de recarga)","La frecuencia del cristal oscilador"],"a":1,"h":"La resolución depende del número de 'pasos' que el contador del timer puede tener.","e":"El valor del período (PRx en PICs, o TOP en AVRs) del timer define el número máximo al que cuenta. Este valor determina la resolución del PWM. Por ejemplo, un período de 255 permite 256 niveles de intensidad."},{"i":"HW-EMB-007","k":"1.3","d":"Avanzado","q":"Durante el arranque de un sistema embebido, un pin de entrada conectado a un botón pulsador presenta un estado lógico flotante, causando lecturas erráticas. El ingeniero a cargo debe asegurar que el pin tenga un estado 'ALTO' por defecto. ¿Qué configuración debe implementar?","o":["Configurar el pin como 'open-drain'","Activar una resistencia de 'pull-down' interna","Activar una resistencia de 'pull-up' interna"],"a":2,"h":"Se necesita un componente que 'jale' el voltaje hacia VCC cuando el circuito está abierto.","e":"Activar la resistencia de pull-up interna del pin del microcontrolador asegura que, cuando el botón no está presionado, la entrada esté conectada a VCC a través de esta resistencia, manteniendo un estado lógico ALTO y evitando la flotación."},{"i":"HW-EMB-008","k":"1.3","d":"Medio","q":"Una empresa está decidiendo entre usar un microprocesador (MPU) con RAM externa o un microcontrolador (MCU) para un nuevo dispositivo de punto de venta. El dispositivo debe ser de bajo costo y ejecutar una única aplicación de forma muy confiable. ¿Cuál es la elección más acertada y por qué?","o":["MPU, porque es más potente y flexible.","Cualquiera de los dos, la diferencia es mínima.","MCU, porque integra CPU, RAM y periféricos en un solo chip."],"a":2,"h":"Piensa en la integración de componentes y el costo del sistema completo.","e":"Un microcontrolador (MCU) es la mejor opción para aplicaciones dedicadas y de bajo costo porque integra todos los componentes necesarios (CPU, memoria RAM, memoria Flash, periféricos) en un solo chip, reduciendo la complejidad y el costo de la placa de circuito impreso."},{"i":"HW-EMB-009","k":"1.3","d":"Avanzado","q":"Un desarrollador necesita escribir una rutina de retardo (delay) muy precisa en ensamblador para un microcontrolador PIC. La rutina se implementa con bucles anidados. Si el oscilador funciona a 4 MHz, ¿cuántos ciclos de instrucción dura una instrucción simple como NOP?","o":["1 ciclo de reloj","4 ciclos de reloj","2 ciclos de reloj"],"a":1,"h":"La arquitectura de muchos PICs divide la frecuencia del oscilador para el ciclo de instrucción.","e":"En la mayoría de los microcontroladores PIC de 8 bits, el ciclo de instrucción dura 4 ciclos de reloj del oscilador (Fosc/4). Por lo tanto, con un oscilador de 4 MHz, el ciclo de instrucción es de 1 µs."},{"i":"HW-EMB-010","k":"1.3","d":"Medio","q":"Un sistema embebido debe leer datos de un acelerómetro de alta velocidad vía SPI. Para asegurar que los datos no se corrompan, el microcontrolador debe procesar el byte recibido tan pronto como llegue. ¿Qué mecanismo de software es el más eficiente para manejar esta tarea?","o":["Polling (revisar constantemente una bandera en el bucle principal)","Usar una interrupción del módulo SPI","Crear un hilo (thread) dedicado a la lectura"],"a":1,"h":"Evita desperdiciar ciclos de CPU esperando un evento.","e":"Utilizar una interrupción (ISR) asociada a la recepción de datos del SPI es el método más eficiente. El CPU puede realizar otras tareas y solo se desviará para atender la recepción del dato en el momento exacto en que ocurra, evitando el polling y la sobrecarga de un sistema operativo."},{"i":"HW-EMB-011","k":"1.3","d":"Medio","q":"Un ingeniero necesita conectar un teclado matricial 4x4 a un Arduino. Para minimizar el número de pines utilizados, decide no usar un pin por cada tecla. ¿Cuál es la técnica estándar para leer un teclado de este tipo?","o":["Conectar todas las teclas a un solo pin analógico con diferentes resistencias.","Escanear filas y columnas: poner una fila en BAJO y leer el estado de las columnas.","Usar el protocolo I²C con un expansor de pines."],"a":1,"h":"Se activa una línea de salida y se leen múltiples líneas de entrada de forma secuencial.","e":"La técnica de escaneo de matrices consiste en configurar las filas como salidas y las columnas como entradas (con pull-ups). Se activa una fila a la vez (poniéndola en estado BAJO) y se leen las columnas. Si una columna está en BAJO, significa que el botón en la intersección de esa fila y columna está presionado.","f":1},{"i":"HW-EMB-012","k":"1.3","d":"Avanzado","q":"En un sistema embebido que controla un motor, el programa principal realiza cálculos complejos. Ocasionalmente, el motor se detiene porque una rutina de cálculo tarda más de lo esperado y el refresco de la señal PWM se retrasa. ¿Cómo podría gestionarse este 'paralelismo' en un microcontrolador de un solo núcleo?","o":["Usar un sistema operativo en tiempo real (RTOS) para gestionar tareas.","Poner los cálculos en una interrupción de timer de alta prioridad.","Optimizar el código de cálculo para que se ejecute más rápido."],"a":0,"h":"Se necesita un gestor que asigne tiempo de CPU a diferentes tareas según su prioridad.","e":"Un RTOS permite dividir el programa en tareas (p. ej., una para cálculos y otra para el control del motor). La tarea de control del motor puede tener mayor prioridad, asegurando que se ejecute a tiempo, incluso si la tarea de cálculo consume muchos recursos. El RTOS gestiona el cambio de contexto entre tareas."},{"i":"HW-EMB-013","k":"1.3","d":"Medio","q":"Un cliente reporta que un dispositivo con pantalla LCD a veces muestra caracteres basura al encenderse. El ingeniero sospecha que el microcontrolador intenta comunicarse con la pantalla antes de que esta se haya estabilizado. ¿Cuál es la solución más simple y robusta?","o":["Añadir un 'delay' o retardo al inicio del código, antes de inicializar la LCD.","Incrementar la velocidad de comunicación (baud rate) del bus.","Verificar el voltaje de alimentación de la LCD."],"a":0,"h":"Dale tiempo a los componentes para que se inicien correctamente.","e":"Muchos periféricos, como las pantallas LCD, requieren un tiempo de estabilización después de recibir energía. Introducir un retardo (delay) de unos pocos milisegundos en la función de inicialización (setup) del microcontrolador es una práctica común y efectiva para asegurar que el periférico esté listo para recibir comandos."},{"i":"HW-EMB-014","k":"1.3","d":"Medio","q":"Un programador está escribiendo código en C++ para un microcontrolador y quiere usar clases para abstraer el manejo de un sensor. Un colega argumenta que C es mejor para sistemas embebidos. ¿Cuál es una ventaja válida de C++ sobre C en este contexto?","o":["C++ siempre genera código más rápido y pequeño que C.","La recolección de basura automática de C++ simplifica la gestión de memoria.","La encapsulación (clases y objetos) permite un código más modular y reutilizable."],"a":2,"h":"Piensa en los principios de la programación orientada a objetos (POO).","e":"Aunque C++ puede tener una sobrecarga (overhead), su principal ventaja es la abstracción a través de clases y objetos. Esto permite encapsular la complejidad del hardware en interfaces limpias, resultando en un código más organizado, modular y fácil de mantener, especialmente en proyectos grandes."},{"i":"HW-EMB-015","k":"1.3","d":"Avanzado","q":"Un ingeniero configura una comunicación UART a 9600 baudios entre dos microcontroladores. Sin embargo, en el receptor solo se leen datos incorrectos. El osciloscopio muestra que los anchos de pulso son correctos. ¿Cuál es una causa probable del error, asumiendo que las conexiones son correctas?","o":["Ambos MCUs usan cristales de cuarzo de diferente frecuencia.","Los niveles de voltaje (p. ej., 3.3V vs 5V) son incompatibles.","El número de bits de parada o paridad no coinciden en ambos MCUs."],"a":2,"h":"El 'idioma' de la comunicación serial debe ser idéntico en ambos extremos.","e":"Para una comunicación UART exitosa, ambos dispositivos deben estar configurados con exactamente los mismos parámetros: misma tasa de baudios, mismo número de bits de datos, misma paridad (o ausencia de ella) y mismo número de bits de parada. Una discrepancia en cualquiera de estos causará errores de trama (framing errors).","f":1},{"i":"HW-EMB-016","k":"1.3","d":"Medio","q":"Se está diseñando un actuador lineal controlado por un servo motor. Este tipo de motor requiere un pulso de una duración específica (entre 1ms y 2ms usualmente) repetido cada 20ms para definir su posición. ¿Qué periférico de un microcontrolador es el ideal para generar esta señal de control?","o":["Un pin de E/S digital activado y desactivado con retardos.","El módulo ADC en modo de salida.","Un módulo de PWM configurado."],"a":2,"h":"La posición del servo depende del ancho del pulso, no solo de si está encendido o apagado.","e":"El control de un servo se logra con una señal PWM. Una frecuencia de 50 Hz corresponde a un período de 20 ms. Al variar el ciclo de trabajo (duty cycle) de esta señal, se puede controlar con precisión el ancho del pulso entre 1 ms y 2 ms, lo que se traduce en una posición angular del servo."},{"i":"HW-EMB-017","k":"1.3","d":"Medio","q":"Un sistema de adquisición de datos debe muestrear 10 sensores analógicos. ¿Cuál es la principal diferencia funcional entre un pin de E/S configurado como analógico y uno como digital?","o":["Los pines digitales pueden emitir voltajes variables a través de un comparador (Schmitt trigger).","Los pines analógicos están conectados internamente a un ADC.","Los pines digitales son más rápidos que los analógicos."],"a":1,"h":"Piensa en la circuitería interna a la que está conectado cada tipo de pin.","e":"Un pin configurado como entrada digital solo distingue dos estados (ALTO o BAJO) a través de un comparador (Schmitt trigger). Un pin configurado como entrada analógica se conecta a un multiplexor que lo dirige a un Convertidor Analógico-Digital (ADC) para medir el nivel de voltaje exacto."},{"i":"HW-EMB-018","k":"1.3","d":"Avanzado","q":"Un desarrollador de firmware está trabajando con un microcontrolador que tiene varios bancos de registros. Para acceder a una variable en un banco de registros diferente al actual, ¿qué tipo de instrucción en ensamblador debe ejecutar primero?","o":["Una instrucción como GOTO para saltar a otro banco de registros y acceder a su información.","La instrucción NOP para sincronizar los bancos.","Una instrucción para modificar los bits de selección de banco en el registro STATUS."],"a":2,"h":"El microcontrolador necesita saber a qué 'página' de memoria de registros debe apuntar.","e":"En arquitecturas con memoria RAM paginada o bancos de registros (como muchos PICs), es necesario modificar los bits de selección de banco (p. ej., RP0, RP1 en el registro STATUS) para cambiar el banco activo antes de poder acceder directamente a una dirección de registro en ese banco."},{"i":"HW-EMB-019","k":"1.3","d":"Medio","q":"Un actuador, como un pequeño motor DC, requiere más corriente de la que un pin de microcontrolador puede suministrar directamente. ¿Qué componente electrónico se utiliza comúnmente como intermediario o 'interruptor' controlado por el pin del MCU?","o":["Un transistor (BJT o MOSFET).","Un resistor de pull-down.","Un capacitor de desacoplo."],"a":0,"h":"Se necesita un componente que amplifique la corriente o la conmute desde una fuente de poder externa.","e":"Un transistor (ya sea BJT o MOSFET) actúa como un interruptor controlado electrónicamente. El pin del microcontrolador proporciona una pequeña corriente a la base/compuerta del transistor, permitiendo que una corriente mucho mayor fluya desde una fuente de alimentación externa a través del motor."},{"i":"HW-EMB-020","k":"1.3","d":"Medio","q":"Un cliente requiere que un dispositivo embebido se comunique con un sensor industrial que utiliza el protocolo SPI. El sensor necesita una transferencia de datos muy rápida y dedicada. ¿Por qué SPI sería más adecuado que I²C para esta aplicación específica?","o":["SPI es un protocolo full-duplex y generalmente alcanza velocidades más altas.","SPI utiliza menos pines que I²C.","SPI tiene un mecanismo de confirmación (ACK) por cada byte, a diferencia de I²C."],"a":0,"h":"Considera cómo se envían y reciben los datos simultáneamente.","e":"SPI (Serial Peripheral Interface) es generalmente más rápido que I²C y es full-duplex, lo que significa que puede enviar y recibir datos al mismo tiempo en líneas separadas (MISO y MOSI). Esto lo hace ideal para aplicaciones que requieren alto rendimiento con un solo periférico, como la transmisión de datos desde sensores de alta velocidad."},{"i":"HW-EMB-021","k":"1.3","d":"Medio","q":"Un ingeniero conecta un botón a un pin de un Arduino para contar pulsaciones. Sin embargo, cada vez que presiona el botón una vez, el contador se incrementa varias veces. ¿Qué fenómeno está ocurriendo y cómo se soluciona comúnmente por software?","o":["Interferencia electromagnética, se soluciona blindando el cable.","Rebotes (bouncing), se soluciona con una rutina de 'debounce'.","Estado flotante, se soluciona con una resistencia de pull-up."],"a":1,"h":"Los contactos mecánicos de un interruptor no cierran el circuito de forma limpia.","e":"El fenómeno es el rebote mecánico (bouncing), donde los contactos del botón vibran por unos milisegundos, generando múltiples transiciones de estado. La solución por software más común es una rutina de 'debounce', que consiste en leer el pin, esperar un corto período (p.ej., 20-50 ms) y volver a leerlo para confirmar que el estado es estable."},{"i":"HW-EMB-022","k":"1.3","d":"Avanzado","q":"Un sistema de control de motor debe reaccionar inmediatamente a una condición de sobrecorriente detectada por un sensor. El programa principal está ocupado en un bucle de control de velocidad. ¿Cuál es la forma más apropiada para que el microcontrolador maneje esta alerta crítica sin detener el control normal?","o":["Revisar el estado del sensor en cada iteración del bucle principal.","Usar un segundo microcontrolador dedicado solo a monitorear la corriente.","Configurar el sensor para que active una interrupción externa de alta prioridad."],"a":2,"h":"El procesador debe ser capaz de detener su tarea actual para atender un evento urgente de forma asíncrona.","e":"Las interrupciones son el mecanismo ideal para manejar eventos asíncronos y de alta prioridad. Al configurar una interrupción externa ligada al pin del sensor, el microcontrolador pausará su tarea actual (el bucle de control) en el instante en que ocurra la sobrecorriente, ejecutará una rutina de servicio de interrupción (ISR) para apagar el motor y luego reanudará su operación normal."},{"i":"HW-EMB-023","k":"1.3","d":"Medio","q":"Un equipo está desarrollando un dron y necesita leer los datos de una Unidad de Medición Inercial (IMU) que contiene un acelerómetro y un giroscopio. El sensor ofrece comunicación I²C y SPI. Si la velocidad de lectura es la máxima prioridad para la estabilidad del vuelo, ¿cuál interfaz deberían elegir?","o":["I²C","SPI","Cualquiera, la diferencia de velocidad es despreciable para esta aplicación."],"a":1,"h":"El control de vuelo requiere actualizaciones de estado muy rápidas y predecibles.","e":"Para aplicaciones de alto rendimiento como la estabilización de un dron, donde la latencia es crítica, SPI es la opción superior. Generalmente, SPI puede operar a frecuencias de reloj mucho más altas que I²C (decenas de MHz frente a 400 KHz o 1 MHz), lo que resulta en una adquisición de datos mucho más rápida."},{"i":"HW-EMB-024","k":"1.3","d":"Avanzado","q":"Un programador escribe código para un microcontrolador y declara una variable como 'volatile'. ¿Cuál es el propósito de esta palabra clave en el contexto de la programación de sistemas embebidos?","o":["Indica que la variable se almacenará en la memoria Flash en lugar de la RAM.","Hace que la variable sea accesible desde diferentes hilos de ejecución sin un mutex.","Instruye al compilador para que no optimice los accesos a esa variable."],"a":2,"h":"Esta palabra clave es crucial cuando una variable puede ser modificada por una interrupción o un periférico de hardware.","e":"La palabra clave 'volatile' le dice al compilador que el valor de una variable puede cambiar en cualquier momento por medios externos al flujo del programa (p. ej., una rutina de interrupción o un registro de hardware mapeado en memoria). Esto evita que el compilador 'optimice' el código eliminando lecturas o escrituras que considera redundantes, asegurando que siempre se acceda al valor más actual de la variable en memoria."},{"i":"HW-EMB-025","k":"1.3","d":"Medio","q":"Una empresa fabrica un juguete que emite diferentes sonidos. Para reducir costos, en lugar de un chip de audio dedicado, deciden generar el sonido directamente con un pin de un microcontrolador conectado a un pequeño altavoz. ¿Qué técnica se utiliza para esto?","o":["Enviar datos de audio digital a través del puerto UART al altavoz.","Variar la frecuencia de una señal PWM para generar diferentes tonos.","Usar el ADC para leer una señal de audio y reproducirla."],"a":1,"h":"El tono de un sonido está directamente relacionado con la frecuencia de la vibración.","e":"Se puede generar sonido simple (tonos) variando rápidamente el estado de un pin digital, lo que es esencialmente una señal PWM con un ciclo de trabajo del 50%. Al cambiar la frecuencia de esta señal cuadrada, se cambia la frecuencia de la vibración del diafragma del altavoz, produciendo así diferentes tonos musicales."},{"i":"HW-EMB-026","k":"1.3","d":"Avanzado","q":"Se presenta un error en un sistema embebido donde una tarea de baja prioridad, que accede a un recurso compartido (p. ej., el bus I²C), es interrumpida por una tarea de alta prioridad que también necesita ese recurso. Esto causa un bloqueo. ¿Cómo se conoce este problema en sistemas de tiempo real?","o":["Inversión de prioridad (Priority Inversion)","Condición de carrera (Race Condition)","Desbordamiento de pila (Stack Overflow)"],"a":0,"h":"Ocurre cuando una tarea de alta prioridad se ve forzada a esperar por una de menor prioridad.","e":"Esto describe un caso clásico de inversión de prioridad. Sucede cuando una tarea de baja prioridad tiene un recurso bloqueado (p. ej., con un mutex), y una tarea de alta prioridad necesita ese mismo recurso, quedando bloqueada. Si una tarea de prioridad media interrumpe a la de baja prioridad, la de alta prioridad nunca se ejecutará. Se soluciona con protocolos como el 'priority inheritance protocol'."},{"i":"HW-EMB-027","k":"1.3","d":"Avanzado","q":"En un sistema embebido, una rutina de interrupción (ISR) actualiza una variable de 32 bits (ej. `unsigned long contador;`) que es leída en el bucle principal. Ocasionalmente, el valor leído es incorrecto. ¿Cuál es la causa más probable de este error en un microcontrolador de 8 bits?","o":["Un desbordamiento de pila (stack overflow) causado por la ISR.","Una condición de carrera (race condition) durante el acceso a la variable.","El compilador está optimizando incorrectamente el acceso a la variable."],"a":1,"h":"El acceso a una variable de 32 bits no es una operación atómica en una arquitectura de 8 bits.","e":"Se produce una condición de carrera porque el microcontrolador de 8 bits necesita varias instrucciones para leer o escribir la variable de 32 bits. Si la interrupción ocurre a mitad de esta secuencia de lectura en el bucle principal, modificará la variable, y el resultado leído será una mezcla de los valores antiguo y nuevo."},{"i":"HW-EMB-028","k":"1.3","d":"Avanzado","q":"Un dispositivo se reinicia aleatoriamente. Al depurar, se descubre que el fallo ocurre al llamar a una función recursiva que procesa una estructura de datos. ¿Qué tipo de error de memoria es la causa más probable de este comportamiento impredecible?","o":["Fuga de memoria (memory leak) en el heap.","Fragmentación de la memoria Flash.","Desbordamiento de la pila (stack overflow)."],"a":2,"h":"Cada llamada a una función almacena su contexto (dirección de retorno, variables locales) en una zona de memoria finita.","e":"Las llamadas a funciones recursivas profundas consumen espacio en la pila (stack) para cada nivel de anidamiento. Si la recursión es demasiado profunda, la pila puede crecer hasta sobrescribir otras áreas críticas de la memoria (heap, variables globales), causando corrupción de datos y un reinicio del sistema."},{"i":"HW-EMB-029","k":"1.3","d":"Medio","q":"Un ingeniero debe medir el voltaje de una batería con la mayor precisión posible. Tiene dos microcontroladores disponibles: uno con un ADC de 10 bits y otro con un ADC de 12 bits ¿Cuál es la mejora en la resolución?","o":["La resolución es 2 veces mejor.","La resolución es 4 veces mejor.","La resolución es 25% mejor."],"a":1,"h":"La resolución depende del número de pasos discretos, que es 2 elevado a la potencia del número de bits.","e":"Un ADC de 10 bits tiene 2^10 = 1024 pasos. Un ADC de 12 bits tiene 2^12 = 4096 pasos. Por lo tanto, el ADC de 12 bits ofrece 4 veces más pasos de cuantificación, lo que se traduce en una resolución 4 veces mayor (un 'paso' de voltaje más pequeño)."},{"i":"HW-EMB-030","k":"1.3","d":"Medio","q":"Una startup está diseñando un sensor de fitness portátil que debe enviar datos de frecuencia cardíaca a un smartphone. La duración de la batería es el requisito más crítico. ¿Qué tecnología de comunicación inalámbrica es la más apropiada?","o":["Bluetooth (BR/EDR)","BLE","Módulo Wi-Fi de bajo consumo."],"a":1,"h":"El nombre de esta tecnología enfatiza su principal ventaja: el consumo energético.","e":"Bluetooth Low Energy (BLE) está diseñado específicamente para aplicaciones de IoT y wearables donde se transmiten pequeñas cantidades de datos a intervalos, priorizando un consumo de energía extremadamente bajo y una larga vida de la batería, a diferencia del Bluetooth Clásico, que está optimizado para flujos de datos continuos."},{"i":"HW-EMB-031","k":"1.3","d":"Medio","q":"Un dispositivo embebido desplegado en campo se congela ocasionalmente debido a picos de voltaje o bugs de software. ¿Qué periférico de hardware, presente en la mayoría de los microcontroladores, está diseñado para reiniciar el sistema automáticamente si el software deja de responder?","o":["El módulo ISR configurado en timer.","El controlador de acceso directo a memoria (DMA).","El Watchdog Timer - WDT."],"a":2,"h":"Este periférico es como un 'perro guardián' que debe ser 'alimentado' periódicamente por el software.","e":"El Watchdog Timer es un temporizador que, si no es reiniciado ('pateado' o 'alimentado') por el software dentro de un intervalo de tiempo específico, asume que el programa se ha bloqueado y genera un reinicio del microcontrolador para devolverlo a un estado funcional."},{"i":"HW-EMB-032","k":"1.3","d":"Avanzado","q":"Un ingeniero conecta dos sensores I²C a un Arduino, pero descubre que ambos vienen de fábrica con la misma dirección I²C fija. ¿Cuál es la consecuencia directa?","o":["Ambos sensores funcionarán pero a la mitad de la velocidad.","Se producirá un conflicto de bus y no se podrá comunicar con ninguno de los dos.","El bus funcionará pero el maestro solo verá uno de los sensores."],"a":1,"h":"En I²C, la dirección es la única forma de identificar a qué dispositivo esclavo se le está hablando.","e":"Si dos dispositivos en el mismo bus I²C tienen la misma dirección, ambos intentarán responder simultáneamente cuando el maestro llame a esa dirección, causando un conflicto de datos en la línea SDA que corrompe la comunicación. La solución es usar un multiplexor/switch I²C que aísle eléctricamente a cada sensor en buses separados.","f":1},{"i":"HW-EMB-033","k":"1.3","d":"Avanzado","q":"Al conectar un microcontrolador a un nuevo sensor SPI, la comunicación falla. La hoja de datos del sensor especifica 'SPI Mode 3'. ¿Qué significan los parámetros de 'Mode 3' (CPOL=1, CPHA=1) que el microcontrolador debe configurar?","o":["El reloj está activo en bajo y los datos se capturan en el flanco de bajada.","El reloj está en estado de reposo alto y los datos se capturan en el flanco de subida.","El reloj está en estado de reposo alto y los datos se capturan en el flanco de bajada."],"a":2,"h":"CPOL define el estado de reposo del reloj y CPHA define en qué flanco se capturan los datos.","e":"CPOL=1 significa que el reloj (SCK) está en ALTO en estado de reposo. CPHA=1 significa que los datos se capturan en el segundo flanco de reloj de cada ciclo, que en este caso es el flanco de bajada (de alto a bajo). Es crucial que el maestro y el esclavo SPI estén configurados en el mismo modo."},{"i":"HW-EMB-034","k":"1.3","d":"Medio","q":"Un dispositivo necesita guardar los ajustes de configuración del usuario (ej. un nivel de brillo) de forma que persistan incluso si se desconecta la alimentación. ¿En qué tipo de memoria del microcontrolador deberían almacenarse estos datos?","o":["En la SRAM, porque es la más rápida.","En la memoria Flash, junto con el programa.","En la memoria EEPROM."],"a":2,"h":"Se necesita una memoria no volátil que esté diseñada para ciclos de escritura frecuentes.","e":"La EEPROM (Electrically Erasable Programmable Read-Only Memory) es una memoria no volátil diseñada para almacenar pequeñas cantidades de datos que deben persistir sin energía y ser modificados ocasionalmente. La memoria Flash también es no volátil, pero tiene un número mucho más limitado de ciclos de escritura y es menos flexible para modificar pequeños trozos de datos."},{"i":"HW-EMB-035","k":"1.3","d":"Avanzado","q":"Un sistema de adquisición de datos debe muestrear una señal de audio a 44.1 kHz usando el ADC y guardar los datos en un buffer. Hacer esto con interrupciones por cada muestra satura la CPU. ¿Qué periférico permite transferir los datos del ADC a la memoria RAM sin intervención del CPU?","o":["El WDT.","El DMA.","El PWM."],"a":1,"h":"Este periférico actúa como un 'coprocesador' dedicado a mover datos entre periféricos y memoria.","e":"El DMA (Direct Memory Access) puede ser configurado para tomar automáticamente el resultado de la conversión del ADC y escribirlo en la siguiente posición de un buffer en la RAM. Esto libera completamente a la CPU de la tarea de transferir datos, permitiéndole realizar otras tareas de procesamiento mientras la adquisición ocurre en segundo plano."},{"i":"HW-EMB-036","k":"1.3","d":"Básico","q":"Un principiante se pregunta por qué puede cargar código a un Arduino a través de un simple cable USB sin necesidad de un programador externo como un ISP. ¿Qué software pre-cargado en el microcontrolador ATmega328P lo hace posible?","o":["El sistema operativo del Arduino.","El bootloader.","El driver USB-a-serial (CH340/FTDI)."],"a":1,"h":"Es un pequeño programa que se ejecuta justo al encender o resetear el microcontrolador.","e":"El bootloader es un pequeño programa almacenado en una sección protegida de la memoria Flash del microcontrolador. Al arrancar, el bootloader espera unos segundos para ver si la computadora está intentando cargar un nuevo programa a través del puerto serie. Si es así, recibe el código y lo escribe en la memoria Flash. Si no, cede el control al programa ya existente."},{"i":"HW-EMB-037","k":"1.3","d":"Medio","q":"Un ingeniero necesita conectar un sensor que opera a 3.3V a un Arduino Uno, que opera a 5V. Si el sensor se comunica por I²C, ¿cuál es el problema potencial?","o":["El Arduino no podrá leer los datos del sensor.","Se puede quemar el sensor.","La comunicación será lenta pero funcionará."],"a":1,"h":"Los pines de un dispositivo de 3.3V generalmente no son tolerantes a 5V.","e":"El problema es que el Arduino (maestro) enviará señales I²C con niveles lógicos de 5V, lo que puede dañar permanentemente los pines del sensor de 3.3V. La solución correcta es usar un convertidor de nivel lógico bidireccional, que traduce de forma segura los voltajes entre los dos dominios (5V a 3.3V y viceversa) para las líneas SDA y SCL."},{"i":"HW-EMB-038","k":"1.3","d":"Avanzado","q":"Un ingeniero debe implementar el protocolo I²C en un microcontrolador muy básico que no tiene un periférico de hardware para I²C. ¿Qué técnica de software se utiliza para emular el protocolo controlando manualmente los pines de E/S?","o":["Manipulación directa de registros.","Acceso directo a memoria (DMA).","Bit-banging."],"a":2,"h":"Esta técnica implica 'golpear' los bits uno por uno en los pines de E/S.","e":"Bit-banging es el término para la técnica de emular un protocolo de comunicación serie (como I²C, SPI o UART) por software, manipulando directamente los pines de E/S (GPIO) para generar las secuencias de reloj, datos, inicio y parada, siguiendo la temporización especificada por el protocolo."},{"i":"HW-EMB-039","k":"1.3","d":"Medio","q":"Una empresa está desarrollando una unidad de control electrónico (ECU) para un automóvil moderno que debe comunicarse de forma fiable con el motor, los frenos ABS y el sistema de airbags. ¿Qué protocolo de comunicación en bus es el estándar de la industria automotriz para esta tarea?","o":["I²C","LIN (Local Interconnect Network)","CAN (Controller Area Network)"],"a":2,"h":"Este protocolo es conocido por su robustez, tolerancia a fallos y arbitraje de mensajes basado en prioridad.","e":"El bus CAN es el estándar de facto en la industria automotriz para la comunicación entre microcontroladores (ECUs). Está diseñado para ser extremadamente robusto en entornos eléctricamente ruidosos y cuenta con un mecanismo de arbitraje que asegura que los mensajes más críticos (como los de los frenos) siempre tengan prioridad en el bus."},{"i":"HW-EMB-040","k":"1.3","d":"Medio","q":"El código para controlar una máquina expendedora se está volviendo muy complejo con muchos `if/else` anidados. Para organizar mejor el código, un ingeniero propone modelar el comportamiento del sistema como un conjunto de estados (ej. 'ESPERANDO_DINERO', 'SELECCIONANDO_PRODUCTO', 'ENTREGANDO_PRODUCTO'). ¿Qué patrón de diseño de software es este?","o":["Patrón Singleton","Máquina de estados finitos (FSM)","Patrón Observador"],"a":1,"h":"Este patrón es ideal para modelar la lógica de sistemas que tienen un comportamiento modal.","e":"Una máquina de estados finitos (FSM) es un modelo computacional perfecto para organizar código que tiene diferentes modos o estados de operación. El sistema solo puede estar en un estado a la vez y transita a otros estados basado en eventos de entrada. Esto simplifica enormemente la lógica en comparación con estructuras de control complejas y desordenadas."},{"i":"HW-EMB-041","k":"1.3","d":"Medio","q":"Un actuador requiere una señal de control 'activo-bajo', lo que significa que se enciende cuando la entrada está en 0V y se apaga cuando está en VCC. Para la interfaz con un microcontrolador, ¿qué configuración de resistencia es la más adecuada para el pin de entrada del actuador?","o":["Una resistencia de pull-up.","Una resistencia de pull-down.","Una resistencia en serie."],"a":0,"h":"Se necesita asegurar que el estado por defecto (inactivo) sea ALTO.","e":"Dado que el estado inactivo del actuador es ALTO (VCC), una resistencia de pull-up asegura que la entrada se mantenga en este estado cuando el pin del microcontrolador está en alta impedancia o no está activamente conduciendo a tierra. El microcontrolador activará el actuador poniendo su pin en estado BAJO."},{"i":"HW-CTL-001","k":"1.4","d":"Básico","q":"El término PID en control se refiere a…","o":["Proporcional-Integral-Derivado","Protocolo-Interfaz-Dispositivo","Proceso-Iteración-Diagnóstico"],"a":0,"h":"Tres acciones de control","e":"Control PID combina respuesta proporcional, integral y derivativa para mejorar estabilidad y error estacionario."},{"i":"HW-CTL-002","k":"1.4","d":"Medio","q":"Para eliminar error en estado estacionario ante una entrada escalón en un sistema estable, es común añadir…","o":["Acción integral","Acción derivativa","Mayor ganancia proporcional solamente"],"a":0,"h":"Integra el error","e":"La acción integral acumula el error y lo fuerza a cero en régimen permanente."},{"i":"HW-CTL-003","k":"1.4","d":"Medio","q":"¿Qué dispositivo es típico para automatización industrial discreta y robusta?","o":["PLC","FPGA","DSP"],"a":0,"h":"Industria + escalera","e":"Los PLC están diseñados para ambientes industriales, programación en lógica de escalera, E/S robustas."},{"i":"HW-CTL-004","k":"1.4","d":"Medio","q":"Relacione el tipo de controlador con su efecto predominante en el desempeño.","o":["PI→disminuye error estacionario; PD→mejora respuesta transitoria; PID→combina reducción de error y mejora transitoria","PI→mejora respuesta transitoria; PD→elimina error estacionario; PID→solo reduce ruido de medición","PI→solo reduce ruido; PD→solo mejora estado estacionario; PID→no influye en el transitorio"],"a":0,"h":"I corrige sesgo (offset); D ayuda al transitorio.","e":"La parte I actúa sobre el error acumulado (offset); la D atenúa sobreimpulso/mejora transitorio; el PID combina ambos efectos. Nise presenta controladores PI/PD/PID y su realización activa."},{"i":"HW-CTL-005","k":"1.4","d":"Avanzado","q":"La función de transferencia H(s) de un circuito relaciona la salida con la entrada en el dominio de la frecuencia. ¿Qué representan los polos de H(s)?","o":["Las frecuencias para las cuales la respuesta del circuito es cero.","La ganancia de CD del circuito.","Las frecuencias complejas que caracterizan la respuesta natural del circuito."],"a":2,"h":"Los polos son las raíces del denominador de la función de transferencia.","e":"Los polos de una función de transferencia H(s) son las frecuencias complejas para las cuales la función tiende a infinito. Estos valores determinan la forma de la respuesta natural del circuito (por ejemplo, decaimientos exponenciales, oscilaciones amortiguadas). A: describe más bien los ceros de la función de transferencia. B (ganancia de CD): se obtiene evaluando 𝐻(0), no a partir de los polos."},{"i":"HW-CTL-006","k":"1.4","d":"Medio","q":"Una empresa de manufactura necesita automatizar una línea de ensamblaje que opera con señales de encendido/apagado (sensores de posición, botones de paro). El ingeniero a cargo debe elegir un controlador que sea robusto, fácil de programar en un entorno industrial y con E/S modulares. ¿Cuál es la opción más adecuada?","o":["Un Controlador Lógico Programable (PLC)","Una tarjeta de adquisición de datos con una PC","Un microcontrolador como Arduino o ESP32"],"a":0,"h":"Este dispositivo es el estándar en la industria para control discreto.","e":"El PLC está diseñado específicamente para ambientes industriales hostiles, utiliza lenguajes de programación intuitivos como la lógica de escalera y ofrece una gran modularidad y fiabilidad para control discreto."},{"i":"HW-CTL-007","k":"1.4","d":"Medio","q":"Un ingeniero está ajustando un controlador PID para un horno que debe mantener una temperatura constante. Observa que la temperatura oscila continuamente alrededor del setpoint, y estas oscilaciones son rápidas y de gran amplitud. Para reducir la velocidad y la magnitud de estas oscilaciones, ¿qué acción de control debería disminuir principalmente?","o":["La acción derivativa (Kd)","La acción integral (Ki)","La acción proporcional (Kp)"],"a":2,"h":"Esta acción es la que más influye en la 'fuerza' de la respuesta del controlador.","e":"Una ganancia proporcional (Kp) demasiado alta provoca una reacción excesiva a los errores, llevando a oscilaciones inestables. Reducir Kp es el primer paso para estabilizar el sistema, aunque puede hacer la respuesta más lenta."},{"i":"HW-CTL-008","k":"1.4","d":"Medio","q":"En un sistema de control de nivel de un tanque, un sensor ultrasónico mide la distancia a la superficie del líquido. El sistema funciona bien, pero ocasionalmente reporta lecturas erróneas cuando se forma espuma en la superficie. ¿Qué tipo de sensor sería una alternativa más fiable para evitar este problema específico?","o":["Un sensor de presión diferencial en el fondo del tanque","Un sensor de proximidad capacitivo","Un flotador con un interruptor magnético"],"a":0,"h":"Busca un método que mida el nivel de forma indirecta, basándose en una propiedad física del líquido.","e":"Un sensor de presión diferencial mide la presión hidrostática, que depende directamente de la altura de la columna de líquido, ignorando irregularidades en la superficie como la espuma. Los sensores capacitivos también pueden ser afectados y un flotador puede ser impreciso o atascarse."},{"i":"HW-CTL-009","k":"1.4","d":"Avanzado","q":"Al analizar la función de transferencia de un sistema, un ingeniero identifica un par de polos complejos conjugados en el semiplano izquierdo del plano 's', muy cerca del eje imaginario. ¿Qué comportamiento dinámico se espera de la respuesta del sistema ante una entrada escalón?","o":["Una respuesta sobreamortiguada, lenta y sin oscilaciones","Una respuesta subamortiguada con oscilaciones que decaen lentamente","Una respuesta críticamente amortiguada, la más rápida sin sobreimpulso"],"a":1,"h":"La posición de los polos en el plano 's' determina la naturaleza de la respuesta transitoria.","e":"Los polos complejos conjugados en el semiplano izquierdo siempre producen una respuesta subamortiguada (oscilatoria). Cuanto más cerca están del eje imaginario, menor es el factor de amortiguamiento y más persistentes son las oscilaciones."},{"i":"HW-CTL-010","k":"1.4","d":"Medio","q":"Un ingeniero de audio está digitalizando una señal musical. Para preservar la calidad y evitar el fenómeno de 'aliasing', debe elegir una frecuencia de muestreo adecuada. Si el componente de frecuencia más alto en la música es de 20 kHz, ¿cuál es la frecuencia de muestreo mínima teórica que debe utilizar?","o":["20 kHz, igual a la frecuencia máxima de la señal","40 kHz, el doble de la frecuencia máxima de la señal","10 kHz, la mitad de la frecuencia máxima de la señal"],"a":1,"h":"El teorema de Nyquist-Shannon establece una relación fundamental entre la frecuencia de la señal y la de muestreo.","e":"Según el teorema de Nyquist, la frecuencia de muestreo debe ser al menos el doble de la frecuencia máxima contenida en la señal para poder reconstruirla sin pérdida de información (aliasing). Por lo tanto, 2 * 20 kHz = 40 kHz."},{"i":"HW-CTL-011","k":"1.4","d":"Medio","q":"Un sistema de riego automático activa los aspersores a una hora programada durante un tiempo fijo, sin importar si el suelo ya está húmedo o si está lloviendo. Un cliente se queja de que el sistema desperdicia agua. Este es
