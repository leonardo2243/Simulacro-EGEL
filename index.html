la acción: detectar vs. detectar y actuar.","e":"Un IDS solo detecta y alerta, mientras que un IPS (a menudo colocado 'en línea') tiene la capacidad de prevenir activamente que el ataque alcance su objetivo."},{"i":"NET-SEC-013","k":"2.3","d":"Básico","q":"Un usuario recibe un correo electrónico que aparenta ser de su banco, con el logo y diseño oficiales, solicitándole que haga clic en un enlace para verificar su cuenta por 'motivos de seguridad'. El enlace dirige a un sitio web falso. ¿Qué tipo de ataque es este?","o":["Ransomware","Phishing","Silver Ticket"],"a":1,"h":"Se trata de 'pescar' credenciales mediante el engaño.","e":"El phishing es una técnica de ingeniería social que utiliza correos electrónicos o mensajes fraudulentos para engañar a las personas y hacer que revelen información confidencial."},{"i":"NET-SEC-014","k":"2.3","d":"Avanzado","q":"Los empleados de una oficina se quejan de desconexiones constantes de la red Wi-Fi. Un análisis del tráfico inalámbrico revela una gran cantidad de tramas de 'desautenticación' dirigidas a los dispositivos de los empleados, aunque estos no las iniciaron. ¿Qué ataque se está produciendo?","o":["Rogue AP","Spoofing de MAC","Ataque de desautenticación"],"a":2,"h":"Este ataque explota una debilidad en el estándar 802.11 para forzar la desconexión de clientes.","e":"En un ataque de desautenticación, el atacante envía tramas falsificadas para desconectar a la fuerza a los clientes de un punto de acceso, interrumpiendo el servicio."},{"i":"NET-SEC-015","k":"2.3","d":"Básico","q":"Durante una falla eléctrica prolongada, el sistema de alimentación ininterrumpida (UPS) de un centro de datos falla, provocando que los servicios críticos queden fuera de línea para todos los clientes. ¿Qué principio de la tríada CID se ha visto comprometido?","o":["Confidencialidad","Integridad","Disponibilidad"],"a":2,"h":"El servicio no estaba accesible cuando se necesitaba.","e":"La disponibilidad asegura que los sistemas y los datos estén accesibles para los usuarios autorizados cuando sea necesario."},{"i":"NET-SEC-016","k":"2.3","d":"Medio","q":"Un administrador de red necesita implementar una regla en un router que bloquee todo el tráfico proveniente de una subred específica (172.16.30.0/24), sin importar a dónde se dirija o qué protocolo utilice. ¿Cuál es el tipo de ACL más eficiente para esta tarea?","o":["ACL Estándar","ACL Extendida","ACL Basada en el tiempo"],"a":0,"h":"Solo se necesita filtrar por la dirección de origen.","e":"Las ACL estándar son más eficientes porque solo examinan la dirección IP de origen. Son ideales para bloquear todo el tráfico de una red o host específico."},{"i":"NET-SEC-017","k":"2.3","d":"Básico","q":"Una auditoría de seguridad revela que los administradores de red se conectan a los switches y routers de la empresa utilizando Telnet para la gestión remota. El auditor señala esto como un riesgo crítico porque Telnet...","o":["Utiliza un puerto no estándar","Envía todo el tráfico, incluidas las contraseñas, en texto plano","Consume demasiado ancho de banda"],"a":1,"h":"El riesgo principal es la falta de cifrado.","e":"Telnet es inseguro porque no cifra la comunicación, lo que permite a un atacante capturar fácilmente credenciales y otra información sensible que viaje por la red."},{"i":"NET-SEC-018","k":"2.3","d":"Medio","q":"En una red, un atacante conecta su portátil y ejecuta un software que comienza a actuar como un servidor DHCP, asignando direcciones IP incorrectas (con una puerta de enlace maliciosa) a otros clientes. ¿Qué característica de seguridad de switch mitigaría este ataque?","o":["Port Security","DHCP Snooping","802.1X"],"a":1,"h":"Esta función distingue entre puertos 'confiables' y 'no confiables' para mensajes DHCP.","e":"DHCP Snooping permite configurar puertos de switch como confiables (donde se conecta el servidor DHCP legítimo) y no confiables, bloqueando ofertas DHCP de fuentes no autorizadas."},{"i":"NET-SEC-019","k":"2.3","d":"Medio","q":"Una empresa con una oficina central en Madrid y una sucursal en Barcelona necesita que ambas redes LAN se comuniquen de forma segura a través de Internet, como si fueran una sola red privada. ¿Qué solución de red es la más apropiada?","o":["VPN de acceso remoto SSL","VPN de sitio a sitio con IPsec","Una ACL extendida en ambos routers"],"a":1,"h":"Esta solución crea un 'túnel' seguro y permanente entre dos redes.","e":"Una VPN de sitio a sitio está diseñada específicamente para conectar dos o más redes geográficamente distintas de forma segura sobre una red pública como Internet.","f":1},{"i":"NET-SEC-020","k":"2.3","d":"Avanzado","q":"Un análisis de seguridad en la red Wi-Fi de un café revela que está utilizando el protocolo de cifrado WEP. El principal motivo por el cual WEP es considerado obsoleto y altamente inseguro es su vulnerabilidad a...","o":["Ataques de denegación de servicio","Ataques de colisión del Vector de Inicialización (IV)","Phishing a través del portal cautivo"],"a":1,"h":"La debilidad se encuentra en cómo se maneja una pequeña parte del cifrado.","e":"WEP utiliza un Vector de Inicialización (IV) de 24 bits, que es demasiado corto y se reutiliza con frecuencia. Esto permite a los atacantes capturar tráfico, encontrar colisiones de IV y, finalmente, descifrar la clave de la red."},{"i":"NET-SEC-021","k":"2.3","d":"Medio","q":"Un administrador configura un firewall con una regla final que dice 'deny any any'. Esto significa que cualquier tráfico que no coincida explícitamente con una regla de permiso anterior será bloqueado. ¿Qué principio de seguridad fundamental se está aplicando?","o":["Defensa en profundidad","Mínimo privilegio","Denegación implícita (Implicit Deny)"],"a":2,"h":"Es una estrategia de 'lo que no está expresamente permitido, está prohibido'.","e":"El principio de denegación implícita es una práctica recomendada en la configuración de firewalls y ACLs, donde la regla final bloquea todo el tráfico para garantizar que solo se permita el acceso explícitamente definido."},{"i":"NET-SEC-022","k":"2.3","d":"Medio","q":"Un cliente en un aeropuerto se conecta a una red Wi-Fi pública. Un atacante, en la misma red, intercepta el tráfico entre el cliente y el punto de acceso, pudiendo leer y modificar la comunicación. ¿Cómo se conoce este tipo de ataque?","o":["Ataque de Denegación de Servicio (DoS)","Ataque Man-in-the-Middle (MitM)","Troyano"],"a":1,"h":"El atacante se posiciona 'en medio' de la comunicación.","e":"En un ataque MitM, el actor malicioso se interpone secretamente entre dos partes que creen estar comunicándose directamente entre sí."},{"i":"NET-SEC-023","k":"2.3","d":"Avanzado","q":"Un IPS alerta sobre una actividad sospechosa en la red. La alerta no corresponde a ninguna firma de ataque conocida, sino que fue generada porque el volumen y tipo de tráfico desde un host interno hacia un servidor externo se desvió drásticamente de la línea base de comportamiento normal establecida. ¿Qué método de detección utilizó el IPS?","o":["Detección basada en firmas","Detección basada en anomalías (heurística)","Análisis de estado de paquetes"],"a":1,"h":"Este método busca desviaciones del comportamiento 'normal' de la red.","e":"La detección basada en anomalías o heurística establece un perfil del comportamiento normal de la red y genera alertas cuando detecta actividades que se desvían significativamente de esa línea base, pudiendo detectar ataques nuevos o desconocidos (zero-day)."},{"i":"NET-SEC-024","k":"2.3","d":"Avanzado","q":"Para prevenir que un atacante en la red local envíe respuestas ARP falsas (ARP spoofing) y asocie su propia dirección MAC con la dirección IP de la puerta de enlace, ¿qué característica de seguridad de switch se debería implementar en conjunto con DHCP Snooping?","o":["Port Security","Inspección Dinámica de ARP (DAI)","Listas de Control de Acceso (ACLs)"],"a":1,"h":"Esta tecnología valida los paquetes ARP en la red.","e":"DAI trabaja con la base de datos creada por DHCP Snooping para asegurarse de que solo se permitan paquetes ARP con enlaces válidos de dirección IP a MAC, mitigando así los ataques de envenenamiento de ARP."},{"i":"NET-SEC-025","k":"2.3","d":"Medio","q":"Un empleado se conecta a una red Wi-Fi llamada 'WIFI_GRATIS_STARBUCKS' mientras está en una cafetería. Sin embargo, esta red fue creada por un atacante con un portátil para capturar el tráfico de los usuarios. ¿Cómo se denomina a este punto de acceso malicioso?","o":["Punto de acceso gemelo malvado (Evil Twin)","Ataque de desautenticación","Jamming de señal"],"a":0,"h":"El punto de acceso imita a uno legítimo para engañar a los usuarios.","e":"Un 'Evil Twin' es un punto de acceso fraudulento que parece ser legítimo, a menudo con el mismo SSID que una red cercana, para atraer a los usuarios a conectarse y así poder interceptar su tráfico."},{"i":"NET-SEC-026","k":"2.3","d":"Básico","q":"Un nuevo director de TI quiere establecer reglas claras sobre la complejidad de las contraseñas, la frecuencia de cambio y los procedimientos para el acceso remoto a la red. ¿En qué documento se formalizarían estas directrices?","o":["En un diagrama de topología de red","En una Política de Seguridad de la Información","En el plan de direccionamiento IP"],"a":1,"h":"Este es el documento de alto nivel que rige la seguridad en una organización.","e":"La Política de Seguridad de la Información es el conjunto de reglas, procedimientos y directrices que definen cómo se gestiona y protege la información y los recursos tecnológicos de una organización."},{"i":"NET-SEC-027","k":"2.3","d":"Básico","q":"Una pequeña oficina de 5 empleados necesita configurar su red Wi-Fi de la manera más segura posible, pero sin la complejidad y el costo de implementar un servidor de autenticación dedicado. ¿Qué método de autenticación sería el más práctico y recomendado?","o":["WPA3-Personal (PSK)","802.1X con un servidor RADIUS","Abrir la red sin contraseña"],"a":0,"h":"También se conoce como modo de Clave Pre-Compartida.","e":"WPA3-Personal (o WPA2-Personal) utiliza una Clave Pre-Compartida (PSK), que es ideal para entornos pequeños donde todos los usuarios comparten la misma contraseña para acceder a la red, ofreciendo buena seguridad sin complejidad administrativa."},{"i":"NET-SEC-028","k":"2.3","d":"Medio","q":"Un sistema de correo electrónico utiliza certificados digitales para firmar los mensajes salientes. El destinatario puede verificar esta firma para asegurarse de que el contenido del correo no fue modificado durante el tránsito. ¿Qué pilar de la tríada CID se refuerza principalmente con esta firma digital?","o":["Confidencialidad","Integridad","Disponibilidad"],"a":1,"h":"Se enfoca en la exactitud y la no alteración de los datos.","e":"La integridad garantiza que los datos no han sido alterados o corrompidos. Las firmas digitales y los hashes criptográficos son mecanismos clave para asegurar la integridad de la información."},{"i":"NET-SEC-029","k":"2.3","d":"Medio","q":"Un gerente de una empresa informa que todos los archivos de su computadora han sido cifrados y en pantalla se muestra un mensaje exigiendo un pago en criptomonedas para recuperarlos. ¿Qué tipo de malware es el responsable?","o":["Spyware","Troyano","Ransomware"],"a":2,"h":"Este malware 'secuestra' tus datos hasta que se pague un rescate.","e":"El ransomware es un tipo de software malicioso que cifra los archivos de la víctima, bloqueando el acceso a ellos hasta que se pague una suma de dinero."},{"i":"NET-SEC-030","k":"2.3","d":"Medio","q":"Un firewall de red permite el tráfico de respuesta a una conexión que se originó desde dentro de la red, sin necesidad de una regla explícita para el tráfico entrante. ¿Qué tecnología de firewall permite este comportamiento?","o":["Filtrado de paquetes sin estado (Stateless)","Inspección de estado de paquetes (Stateful)","Proxy de aplicación"],"a":1,"h":"El firewall 'recuerda' las conexiones activas.","e":"Un firewall Stateful mantiene una tabla de estado de las conexiones activas, lo que le permite permitir automáticamente el tráfico de retorno que pertenece a una sesión ya establecida."},{"i":"NET-SEC-031","k":"2.3","d":"Avanzado","q":"Una empresa necesita conectar dispositivos IoT (como sensores de temperatura) a una red inalámbrica segura, pero estos dispositivos no soportan la autenticación 802.1X. ¿Cuál es la práctica recomendada para integrarlos de forma segura?","o":["Conectarlos a la red Wi-Fi principal usando una clave PSK","Crear una VLAN y un SSID separados para los dispositivos IoT con una clave PSK robusta","Dejar la red abierta solo para esos dispositivos"],"a":1,"h":"La segmentación de la red es clave para limitar el riesgo.","e":"Segmentar los dispositivos IoT en su propia VLAN y SSID aísla el tráfico y previene que una posible vulnerabilidad en un dispositivo IoT afecte a la red corporativa principal."},{"i":"NET-SEC-032","k":"2.3","d":"Básico","q":"Un ingeniero de seguridad está realizando un 'hardening' físico y de capa 2 en los switches de acceso. Una de las políticas es reducir la superficie de ataque. ¿Qué acción simple y efectiva debería realizar en todos los puertos que no están en uso?","o":["Asignarlos a la VLAN nativa","Deshabilitarlos administrativamente (shutdown)","Configurarles la máxima velocidad y dúplex"],"a":1,"h":"Si un puerto no se usa, no debería estar activo.","e":"Deshabilitar los puertos no utilizados es una medida de seguridad fundamental que impide que cualquier persona conecte un dispositivo no autorizado a la red."},{"i":"NET-SEC-033","k":"2.3","d":"Medio","q":"Para poder monitorear todo el tráfico que entra y sale de la red corporativa hacia Internet, un administrador necesita decidir la ubicación óptima para un Sistema de Prevención de Intrusos (IPS). ¿Dónde debería colocarlo?","o":["En el centro de la red, conectado al switch core","Justo detrás del firewall perimetral, antes de la red interna","Paralelo al firewall, analizando una copia del tráfico"],"a":1,"h":"El dispositivo debe estar 'en línea' para poder bloquear el tráfico malicioso.","e":"Colocar el IPS 'en línea' (in-line) justo después del firewall permite que inspeccione todo el tráfico que ya ha sido filtrado por el firewall antes de que alcance la red interna, permitiéndole actuar y bloquear amenazas."},{"i":"NET-SEC-034","k":"2.3","d":"Medio","q":"Un router tiene una ACL con varias reglas. Si un paquete entrante coincide con los criterios de la primera regla (access-list 10 deny...) y también con los de la tercera regla (access-list 10 permit...), ¿qué acción tomará el router?","o":["Aplicará la acción de la tercera regla (permit)","Aplicará la acción de la primera regla (deny)","Generará un error de conflicto de ACL"],"a":1,"h":"Las ACL se procesan de forma secuencial, de arriba hacia abajo.","e":"El procesamiento de una ACL se detiene tan pronto como se encuentra la primera coincidencia. Por lo tanto, el router aplicará la acción de la primera regla que coincida con el paquete."},{"i":"NET-SEC-035","k":"2.3","d":"Avanzado","q":"Al configurar una VPN de sitio a sitio con IPsec, un ingeniero necesita asegurar tanto la integridad de los datos como su confidencialidad. ¿Qué protocolo dentro del framework de IPsec es responsable de proporcionar el cifrado (confidencialidad) del paquete?","o":["AH (Authentication Header)","ESP (Encapsulating Security Payload)","IKE (Internet Key Exchange)"],"a":1,"h":"AH solo proporciona autenticación e integridad, no cifrado.","e":"ESP es el protocolo de IPsec que ofrece confidencialidad a través del cifrado de los datos. También puede proporcionar autenticación e integridad."},{"i":"NET-SEC-036","k":"2.3","d":"Básico","q":"Un administrador configura 'Port Security' en un puerto de un switch para permitir una única dirección MAC. Si un usuario desconecta su PC y conecta un hub con dos portátiles, ¿cuál es el comportamiento por defecto del puerto?","o":["Permitirá el tráfico de todos los dispositivos","El puerto se pondrá en estado de 'error-disabled' (shutdown)","Solo permitirá el tráfico del primer portátil que se comunique"],"a":1,"h":"El switch detecta una violación de la política de seguridad.","e":"Por defecto, cuando un puerto configurado con Port Security detecta más direcciones MAC de las permitidas, entra en modo de violación 'shutdown', deshabilitando el puerto para proteger la red."},{"i":"NET-SEC-037","k":"2.3","d":"Avanzado","q":"Una empresa está preocupada por ataques de Man-in-the-Middle (MitM) internos causados por envenenamiento de caché ARP. ¿Qué tecnología de seguridad de Capa 2 previene estos ataques validando los paquetes ARP contra una base de datos de confianza?","o":["Port Security","DHCP Snooping","Dynamic ARP Inspection (DAI)"],"a":2,"h":"Esta tecnología funciona en conjunto con DHCP Snooping.","e":"DAI intercepta y valida todos los paquetes ARP en la red, comparando la información con la base de datos de enlaces IP-MAC confiables creada por DHCP Snooping, y descarta los paquetes ARP inválidos."},{"i":"NET-SEC-038","k":"2.3","d":"Medio","q":"El estándar de seguridad inalámbrica WPA2 es ampliamente utilizado y considerado seguro. ¿Cuál es el algoritmo de cifrado simétrico que utiliza WPA2 y que lo hace robusto contra ataques de fuerza bruta?","o":["AES (Advanced Encryption Standard)","TKIP (Temporal Key Integrity Protocol)","WEP (Wired Equivalent Privacy)"],"a":0,"h":"Este es el estándar de cifrado adoptado por el gobierno de EE. UU.","e":"WPA2 utiliza el cifrado AES con el protocolo CCMP, que es significativamente más fuerte y seguro que los protocolos más antiguos como TKIP (usado en WPA) y WEP."},{"i":"NET-SEC-039","k":"2.3","d":"Básico","q":"Un empleado es sancionado por utilizar la red de la empresa para descargar grandes volúmenes de contenido ilegal. La regla que ha infringido estaría definida en la...","o":["Política de copias de seguridad","Política de uso aceptable (AUP)","Política de recuperación ante desastres"],"a":1,"h":"Este documento define lo que los empleados pueden y no pueden hacer con los recursos de TI.","e":"La Política de Uso Aceptable (AUP) establece las reglas y directrices para el uso de los activos de TI y la red de una organización, incluyendo prohibiciones sobre actividades ilegales o no autorizadas."},{"i":"NET-SEC-040","k":"2.3","d":"Medio","q":"Un administrador de sistemas necesita proteger un único servidor web crítico contra accesos no autorizados a puertos específicos. En lugar de instalar un dispositivo físico, decide usar las capacidades de filtrado del propio sistema operativo del servidor. ¿Qué tipo de firewall está implementando?","o":["Firewall de red","Firewall de host","Firewall de nueva generación (NGFW)"],"a":1,"h":"El firewall se ejecuta en el mismo dispositivo que protege.","e":"Un firewall de host es una aplicación de software que se ejecuta en un dispositivo individual (host) y protege solo a ese dispositivo, como el Firewall de Windows Defender o iptables en Linux."},{"i":"NET-SEC-041","k":"2.3","d":"Medio","q":"Un atacante configura un punto de acceso inalámbrico con el mismo SSID que la red corporativa, pero con una señal más potente, para que los dispositivos de los empleados se conecten automáticamente a él. El objetivo principal de este ataque de 'Evil Twin' es...","o":["Mejorar la cobertura Wi-Fi de la oficina","Capturar credenciales de usuario y datos sensibles","Causar una denegación de servicio inalámbrica"],"a":1,"h":"El atacante se convierte en el intermediario de la comunicación.","e":"Al actuar como un Man-in-the-Middle, el atacante puede interceptar todo el tráfico de los usuarios conectados a su 'Evil Twin', permitiéndole robar contraseñas, datos bancarios y otra información confidencial."},{"i":"NET-SEC-042","k":"2.3","d":"Básico","q":"En un centro de datos, un router principal falla. Inmediatamente, un router de respaldo configurado en un clúster de alta disponibilidad toma el control de todo el tráfico sin una interrupción perceptible para los usuarios. Este diseño de red redundante busca principalmente garantizar la...","o":["Confidencialidad","Integridad","Disponibilidad"],"a":2,"h":"El objetivo es que el servicio siempre esté operativo.","e":"La alta disponibilidad, lograda a través de la redundancia, es una estrategia clave para asegurar la disponibilidad, garantizando que los servicios permanezcan accesibles incluso en caso de fallo de un componente."},{"i":"NET-SEC-043","k":"2.3","d":"Medio","q":"Un administrador de red junior crea una ACL en un router para permitir el tráfico HTTP desde una red específica. Sin embargo, después de aplicar la ACL, todo el resto del tráfico (DNS, ICMP, etc.) deja de funcionar. ¿Cuál es la causa más probable?","o":["La ACL tiene un error de sintaxis","Olvidó incluir una línea 'permit any any' al final","El router no tiene suficiente memoria para la ACL"],"a":1,"h":"Las ACLs tienen una regla final que no se ve.","e":"Todas las Listas de Control de Acceso tienen una denegación implícita ('deny any any') al final. Si no se agrega una regla explícita para permitir el tráfico deseado ('permit any any' o reglas más específicas), todo el tráfico que no coincida con las reglas anteriores será bloqueado."},{"i":"NET-SEC-044","k":"2.3","d":"Medio","q":"Una empresa tiene muchos empleados remotos que a menudo se conectan desde redes con firewalls muy restrictivos (hoteles, aeropuertos). ¿Qué tipo de VPN es generalmente más exitoso para establecer una conexión en estos escenarios?","o":["VPN IPsec","VPN SSL/TLS","VPN GRE"],"a":1,"h":"Este tipo de VPN utiliza puertos que rara vez están bloqueados.","e":"Las VPN SSL/TLS suelen utilizar el puerto TCP 443 (el mismo que el tráfico web HTTPS), que casi nunca está bloqueado en las redes de invitados, lo que las hace más resistentes a los firewalls restrictivos que las VPN IPsec, que utilizan otros puertos y protocolos."},{"i":"NET-SEC-045","k":"2.3","d":"Avanzado","q":"Un ingeniero quiere asegurarse de que solo las estaciones de trabajo del equipo de TI (subred 10.1.1.0/28) puedan conectarse a las líneas de terminal virtual (VTY) de los routers para administrarlos a través de SSH. ¿Cuál es el método más efectivo y seguro para lograrlo?","o":["Configurar una contraseña de enable fuerte","Aplicar una ACL estándar a las líneas VTY","Deshabilitar Telnet en las líneas VTY"],"a":1,"h":"Se puede restringir el acceso a los puertos de gestión.","e":"Aplicar una ACL a las líneas VTY (access-class) es la práctica recomendada para filtrar qué direcciones IP de origen tienen permitido establecer una sesión de gestión remota (SSH/Telnet) con el dispositivo."},{"i":"NET-SEC-046","k":"2.3","d":"Medio","q":"Un usuario, tratando de obtener un punto de red adicional, conecta un cable entre dos tomas de pared en una sala de conferencias. Esto provoca que la red se vuelva extremadamente lenta y deje de funcionar. ¿Qué protocolo de capa 2 está diseñado para prevenir este tipo de problemas?","o":["DHCP","STP (Spanning Tree Protocol)","ARP (Address Resolution Protocol)"],"a":1,"h":"Este protocolo previene bucles en topologías de red redundantes.","e":"STP está diseñado para detectar y prevenir bucles de conmutación en una red Ethernet. Cuando se crea un bucle, STP bloquea uno de los puertos para romperlo, evitando las tormentas de broadcast que colapsarían la red."},{"i":"NET-SEC-047","k":"2.3","d":"Básico","q":"El equipo de seguridad de una empresa está abrumado por la cantidad de alertas que genera su Sistema de Detección de Intrusos (IDS). Tras investigar, descubren que la mayoría de las alertas son sobre tráfico legítimo que el sistema interpretó erróneamente como malicioso. ¿Cómo se denominan estas alertas incorrectas?","o":["Falsos Positivos","Falsos Negativos","Anomalías de red"],"a":0,"h":"La alerta es 'positiva' (detectó algo), pero 'falsa' (no era una amenaza real).","e":"Un falso positivo es una alerta generada por un sistema de seguridad que identifica incorrectamente una actividad benigna como una amenaza. Ajustar la sensibilidad del sistema es clave para reducirlos."},{"i":"NET-SEC-048","k":"2.3","d":"Avanzado","q":"Una ventaja clave de seguridad de WPA3 sobre WPA2, especialmente relevante en redes Wi-Fi abiertas (públicas), es la inclusión de 'Opportunistic Wireless Encryption' (OWE). ¿Qué proporciona OWE?","o":["Una clave pre-compartida (PSK) más larga y compleja","Cifrado individualizado y automático del tráfico entre cada cliente y el AP","Autenticación obligatoria a través de un portal cautivo"],"a":1,"h":"Protege contra el espionaje pasivo en redes abiertas.","e":"OWE (también conocido como Wi-Fi Enhanced Open) cifra automáticamente el tráfico entre cada usuario y el punto de acceso, incluso en una red que no tiene contraseña. Esto previene que otros usuarios en la misma red puedan espiar tu tráfico."},{"i":"NET-SEC-049","k":"2.3","d":"Medio","q":"Un usuario informa que después de instalar un software de apariencia inofensiva, su cuenta bancaria fue comprometida. Un análisis forense revela que un programa en segundo plano estaba grabando todas las pulsaciones de su teclado. ¿Qué tipo de malware específico es este?","o":["Virus","Keylogger","Rootkit"],"a":1,"h":"Su función es registrar las 'llaves' (keys) que se pulsan.","e":"Un keylogger es un tipo de spyware que registra secretamente las pulsaciones de teclado de un usuario. Es una herramienta común utilizada por los ciberdelincuentes para robar contraseñas y otra información sensible."},{"i":"NET-SEC-050","k":"2.3","d":"Medio","q":"Una empresa necesita alojar un servidor web público, pero quiere proteger su red interna (LAN) de posibles ataques dirigidos al servidor. La arquitectura de red recomendada es colocar el servidor en un segmento de red aislado. ¿Cómo se llama este segmento?","o":["Red de invitados","VLAN nativa","DMZ (Zona Desmilitarizada)"],"a":2,"h":"Es una zona intermedia entre la red interna y la red externa (Internet).","e":"Una DMZ es una subred perimetral que expone los servicios externos de una organización a una red no confiable como Internet, mientras que aísla y protege la red interna en caso de que un servidor en la DMZ sea comprometido."},{"i":"NET-SEC-051","k":"2.3","d":"Avanzado","q":"Dentro del plan de continuidad del negocio, un administrador define que, en caso de un fallo del servidor de base de datos, la empresa no puede permitirse perder más de 15 minutos de transacciones. Esta métrica de tiempo que define la pérdida de datos tolerable se conoce como:","o":["RTO (Recovery Time Objective)","RPO (Recovery Point Objective)","SLA (Service Level Agreement)"],"a":1,"h":"Se refiere al 'punto' en el tiempo al que se debe poder volver.","e":"El RPO define la antigüedad máxima de los archivos que una organización debe poder recuperar. Un RPO de 15 minutos significa que las copias de seguridad deben realizarse al menos cada 15 minutos."},{"i":"NET-SEC-052","k":"2.3","d":"Básico","q":"Para proporcionar acceso Wi-Fi a los visitantes de una oficina, se implementa un sistema donde, al conectarse al SSID de 'Invitados', los usuarios son redirigidos a una página web donde deben aceptar los términos y condiciones antes de poder navegar. ¿Cómo se llama esta solución?","o":["Portal Cautivo","802.1X","DHCP Snooping"],"a":0,"h":"El usuario está 'cautivo' hasta que realiza una acción en la página.","e":"Un portal cautivo es una página web que el usuario de una red Wi-Fi pública debe ver e interactuar antes de que se le conceda el acceso a Internet. Se usa comúnmente para autenticación, pago o aceptación de políticas."},{"i":"NET-SEC-053","k":"2.3","d":"Medio","q":"Un empleado recibe un correo que parece ser de su jefe, pidiéndole una transferencia urgente. Sin embargo, al revisar los detalles del encabezado del correo, descubre que la dirección del remitente real es diferente a la que se muestra. Esta técnica de falsificar la dirección del remitente se llama:","o":["Phishing","Email Spoofing","Man-in-the-Middle"],"a":1,"h":"Se trata de una suplantación de la identidad del remitente.","e":"El email spoofing es la creación de mensajes de correo electrónico con una dirección de remitente falsificada para engañar al destinatario sobre el origen del mensaje. Es una táctica muy utilizada en los ataques de phishing."},{"i":"NET-SEC-054","k":"2.3","d":"Avanzado","q":"Un administrador de red ejecuta `netstat -an | grep :80` en un servidor web y observa miles de conexiones en estado `SYN_RECV` desde distintas direcciones IP de origen. El servidor está extremadamente lento. ¿Qué tipo de ataque está ocurriendo?","o":["Ataque de fuerza bruta a una aplicación","Escaneo de puertos TCP","Ataque de inundación SYN (SYN Flood)"],"a":2,"h":"El ataque explota el handshake de tres vías de TCP.","e":"Un ataque SYN Flood satura al servidor con paquetes SYN, forzándolo a mantener una gran cantidad de conexiones semiabiertas (en estado SYN_RECV). Esto agota sus recursos e impide que atienda a usuarios legítimos."},{"i":"NET-SEC-055","k":"2.3","d":"Medio","q":"Un ingeniero despliega una máquina virtual (instancia EC2) en la nube de AWS. Para permitir el tráfico entrante por el puerto 443 (HTTPS) desde cualquier lugar de Internet, ¿qué componente de seguridad nativo de la nube debe configurar?","o":["Una ACL de red (Network ACL)","Un Grupo de Seguridad (Security Group)","Una política de IAM (Identity and Access Management)"],"a":1,"h":"Actúa como un firewall a nivel de instancia.","e":"Los Grupos de Seguridad en AWS son firewalls con estado que controlan el tráfico entrante y saliente de las instancias EC2. Son el método principal para permitir o denegar tráfico a nivel de instancia."},{"i":"NET-SEC-056","k":"2.3","d":"Avanzado","q":"Un IPS ha detectado y bloqueado exitosamente una intrusión. Según el framework de respuesta a incidentes (NIST), ¿cuál debería ser el siguiente paso inmediato para el equipo de seguridad?","o":["Eradicación y recuperación del sistema","Análisis post-incidente y lecciones aprendidas","Contención, identificación y análisis del alcance"],"a":2,"h":"Antes de limpiar, hay que entender qué pasó y hasta dónde llegó.","e":"Después de la detección inicial, la fase de contención es crucial para aislar los sistemas afectados y prevenir que el atacante se propague, seguida del análisis para entender el vector de ataque y el alcance del compromiso."},{"i":"NET-SEC-057","k":"2.3","d":"Avanzado","q":"Al analizar los logs de acceso de un servidor web Apache, un analista encuentra la siguiente entrada: `GET /scripts/..%2F..%2F..%2F..%2Fetc%2Fpasswd HTTP/1.1`. ¿Qué tipo de ataque se está intentando?","o":["Cross-Site Scripting (XSS)","Inyección SQL","Directory Traversal (Atravesamiento de Directorios)"],"a":2,"h":"El atacante intenta navegar fuera del directorio raíz del servidor web.","e":"El patrón `../` (codificado como `%2F`) es característico de un ataque de Directory Traversal, donde el atacante intenta acceder a archivos y directorios restringidos en el sistema de archivos del servidor."},{"i":"NET-SEC-058","k":"2.3","d":"Medio","q":"Una organización genera logs desde firewalls, servidores Windows y Linux, y un IDS. Para poder detectar ataques complejos que involucren varios de estos sistemas, necesitan una herramienta que centralice, normalice y correlacione todos estos eventos. ¿Qué solución necesitan implementar?","o":["Un sistema de respaldo centralizado","Un sistema SIEM (Security Information and Event Management)","Un balanceador de carga"],"a":1,"h":"Esta tecnología es el cerebro del Centro de Operaciones de Seguridad (SOC).","e":"Un SIEM es una plataforma que agrega y analiza datos de eventos de múltiples fuentes, proporcionando una vista unificada de la seguridad y permitiendo la correlación de eventos para identificar actividades maliciosas."},{"i":"NET-SEC-059","k":"2.3","d":"Avanzado","q":"Para mitigar los ataques de envenenamiento de caché DNS (DNS cache poisoning) y asegurar a los clientes que los registros DNS que reciben son auténticos y no han sido alterados, ¿qué extensión de seguridad del protocolo DNS se debe implementar en los servidores de nombres autoritativos?","o":["DNS over HTTPS (DoH)","DNSSEC (Domain Name System Security Extensions)","Anycast DNS"],"a":1,"h":"Utiliza firmas digitales para verificar la autenticidad de los registros.","e":"DNSSEC añade una capa de autenticación al DNS mediante el uso de criptografía de clave pública para firmar digitalmente los registros, permitiendo a los resolutores verificar que la respuesta proviene del servidor correcto y no ha sido modificada."},{"i":"NET-SEC-060","k":"2.3","d":"Experto","q":"Al configurar una VPN IPsec, se habilita una opción que asegura que si la clave de sesión a largo plazo es comprometida, un atacante no podrá descifrar el tráfico capturado previamente. Esta propiedad criptográfica, lograda mediante el uso de claves de sesión efímeras (ej. Diffie-Hellman), se conoce como:","o":["Perfect Forward Secrecy (PFS)","Split Tunneling","Transport Mode"],"a":0,"h":"Garantiza la seguridad de las sesiones pasadas.","e":"Perfect Forward Secrecy (PFS) asegura que cada sesión de comunicación genere una clave de cifrado única e independiente de la clave maestra del servidor. Así, el compromiso de una clave de sesión no compromete ninguna otra."},{"i":"NET-SEC-061","k":"2.3","d":"Medio","q":"El equipo de seguridad de una empresa configura un servidor en su DMZ que emula servicios vulnerables y no contiene datos reales. El objetivo es atraer a los atacantes, estudiar sus métodos y obtener alertas tempranas de un ataque. ¿Cómo se denomina este sistema?","o":["Sandbox","Honeypot","Bastion Host"],"a":1,"h":"Es un 'tarro de miel' para atraer a los atacantes.","e":"Un honeypot es un sistema trampa diseñado para ser un objetivo atractivo para los ciberatacantes. Permite a los defensores analizar las tácticas, técnicas y procedimientos (TTPs) de los atacantes en un entorno controlado."},{"i":"NET-SEC-062","k":"2.3","d":"Avanzado","q":"Un analista revisa el log de autenticación de un servidor Linux (`/var/log/auth.log`) y observa cientos de entradas como esta en un minuto, todas desde la misma IP: `Failed password for invalid user admin from 198.51.100.10 port 22 ssh2`. ¿Qué ataque está ocurriendo?","o":["Ataque de denegación de servicio","Ataque de fuerza bruta SSH","Envenenamiento de caché ARP"],"a":1,"h":"El atacante está intentando adivinar credenciales de forma masiva.","e":"Múltiples intentos de inicio de sesión fallidos en un corto período de tiempo, especialmente en servicios como SSH, son un claro indicador de un ataque de fuerza bruta, donde un atacante prueba sistemáticamente muchas contraseñas."},{"i":"NET-SEC-063","k":"2.3","d":"Medio","q":"Un NGFW de una empresa se suscribe a un servicio que le proporciona listas actualizadas en tiempo real de direcciones IP y dominios asociados con malware, botnets y phishing. El firewall utiliza estas listas para bloquear proactivamente cualquier conexión hacia o desde esos indicadores. Esta práctica es un ejemplo del uso de:","o":["Inteligencia de Amenazas Cibernéticas (Cyber Threat Intelligence)","Análisis heurístico","Listas de Control de Acceso manuales"],"a":0,"h":"Se trata de usar conocimiento externo y contextual para mejorar la defensa.","e":"La Inteligencia de Amenazas (CTI) es el conocimiento basado en evidencia sobre amenazas existentes o emergentes. El uso de feeds para poblar dinámicamente las reglas de un firewall es una aplicación común y efectiva de la CTI."},{"i":"NET-SEC-064","k":"2.3","d":"Avanzado","q":"Una empresa está rediseñando su arquitectura de seguridad basándose en el principio de 'nunca confiar, siempre verificar'. En este modelo, cada solicitud de acceso a un recurso es autenticada y autorizada rigurosamente, sin importar si el origen está dentro o fuera del perímetro de la red. ¿Cómo se llama este modelo estratégico?","o":["Defensa en profundidad","Arquitectura de Confianza Cero (Zero Trust)","Modelo de seguridad perimetral"],"a":1,"h":"Este modelo elimina la idea de una red interna 'confiable'.","e":"La Confianza Cero es un modelo de seguridad que trata todas las conexiones como si provinieran de una red no confiable. Se basa en la microsegmentación, la autenticación multifactor y el principio de mínimo privilegio para cada acceso."},{"i":"NET-SEC-065","k":"2.3","d":"Medio","q":"El log de un firewall perimetral muestra una serie de paquetes `TCP SYN` provenientes de una única dirección IP (203.0.113.5) dirigidos a un servidor interno (10.0.0.100) en los puertos 21, 22, 23, 25, 80, 110, 143, 443, etc., en un lapso de dos segundos. ¿Qué actividad está realizando el atacante?","o":["Un ataque de denegación de servicio","Un escaneo de puertos","Un ataque Man-in-the-Middle"],"a":1,"h":"El atacante está intentando descubrir qué servicios están abiertos en el servidor.","e":"Esta actividad es un clásico escaneo de puertos. El atacante envía paquetes a una secuencia de puertos para determinar cuáles están abiertos y, por lo tanto, qué servicios se están ejecutando en el objetivo, como fase de reconocimiento."},{"i":"NET-SEC-066","k":"2.3","d":"Experto","q":"Cuando un SIEM detecta un malware en un portátil, un sistema anexo se activa automáticamente: ejecuta un script para aislar el portátil de la red, bloquea el hash del malware en el EDR y crea un ticket de alta prioridad para el equipo de TI. Esta automatización de flujos de trabajo de respuesta se conoce como:","o":["EDR (Endpoint Detection and Response)","DLP (Data Loss Prevention)","SOAR (Security Orchestration, Automation, and Response)"],"a":2,"h":"Se enfoca en automatizar y orquestar las acciones de respuesta a incidentes.","e":"Una plataforma SOAR se integra con otras herramientas de seguridad (SIEM, EDR, firewalls) para automatizar las tareas repetitivas de respuesta a incidentes a través de 'playbooks', permitiendo una respuesta más rápida y consistente."},{"i":"NET-SEC-067","k":"2.3","d":"Medio","q":"Para almacenar contraseñas de usuarios en una base de datos de forma segura, un desarrollador decide no guardarlas en texto plano. En su lugar, aplica una función que convierte la contraseña en una cadena de longitud fija e irreversible. ¿Qué tipo de función criptográfica está utilizando?","o":["Cifrado simétrico (ej. AES)","Cifrado asimétrico (ej. RSA)","Función de hash criptográfico (ej. SHA-256)"],"a":2,"h":"Es una operación de un solo sentido; no se puede revertir para obtener la contraseña original.","e":"El hashing es el proceso de transformar una cadena de entrada en un valor de longitud fija. Es ideal para almacenar contraseñas porque, a diferencia del cifrado, no está diseñado para ser revertido, solo para ser comparado."},{"i":"NET-SEC-068","k":"2.3","d":"Medio","q":"Una empresa sufre un ataque de malware sin archivos (fileless) que no es detectado por su antivirus tradicional basado en firmas. Para mejorar su defensa, adquieren una solución para los portátiles que monitoriza el comportamiento de los procesos, las llamadas al sistema y las conexiones de red para identificar actividades anómalas. Esta solución se conoce como:","o":["NGFW (Next-Generation Firewall)","EDR (Endpoint Detection and Response)","WAF (Web Application Firewall)"],"a":1,"h":"Proporciona una visibilidad profunda en lo que ocurre dentro de los dispositivos finales.","e":"Las soluciones EDR van más allá del antivirus tradicional al enfocarse en la detección y respuesta. Recopilan telemetría detallada de los endpoints para detectar comportamientos maliciosos, incluso de amenazas desconocidas."},{"i":"NET-SEC-069","k":"2.3","d":"Experto","q":"Un analista de seguridad nota en los logs del servidor DNS un volumen inusualmente alto de peticiones para subdominios extraños y muy largos de un dominio externo, como `ZGF0YS1wYXJ0LTEuZXhhbXBsZS5jb20= .malicious-domain.com`. Este patrón es un fuerte indicador de:","o":["Un ataque de amplificación de DNS","Exfiltración de datos mediante túneles DNS","Un escaneo de subdominios normal"],"a":1,"h":"El atacante está ocultando datos dentro de las peticiones DNS.","e":"El túnel DNS es una técnica para exfiltrar datos o establecer un canal de comando y control (C2) encapsulando datos dentro de las consultas y respuestas DNS. Los subdominios largos y codificados (como en Base64) son una señal clásica de esta actividad."},{"i":"NET-SEC-070","k":"2.3","d":"Avanzado","q":"Una universidad quiere asegurarse de que solo los dispositivos que cumplen con su política de seguridad (ej. antivirus actualizado, parches de SO al día) puedan conectarse a su red cableada o inalámbrica. Implementan una solución que evalúa el 'estado de salud' del dispositivo antes de concederle acceso. ¿Qué tecnología es esta?","o":["NAC (Network Access Control)","VPN (Virtual Private Network)","IDS (Intrusion Detection System)"],"a":0,"h":"Actúa como un 'guardia de seguridad' en la puerta de la red.","e":"NAC es una solución de seguridad que unifica las políticas de seguridad de los endpoints, la autenticación de usuarios y la aplicación de acceso a la red. Puede poner en cuarentena a los dispositivos no conformes hasta que se remedien."},{"i":"NET-SEC-071","k":"2.3","d":"Experto","q":"Un auditor de seguridad prueba una aplicación web. Al solicitar los datos de su propio perfil con la URL `/api/user/profile?id=123`, decide cambiar el ID a `124` y observa que la API le devuelve los datos de otro usuario. ¿Qué tipo de vulnerabilidad de seguridad de aplicaciones ha descubierto?","o":["Cross-Site Scripting (XSS)","Inyección SQL","IDOR (Insecure Direct Object Reference)"],"a":2,"h":"La aplicación no valida que el usuario autenticado tenga permiso para acceder al objeto solicitado.","e":"Una vulnerabilidad IDOR ocurre cuando una aplicación expone una referencia directa a un objeto interno (como un ID de base de datos) y no realiza las comprobaciones de autorización adecuadas, permitiendo a un atacante manipular estas referencias para acceder a datos ajenos."},{"i":"NET-SEC-072","k":"2.3","d":"Medio","q":"Un administrador de la nube necesita otorgar a un desarrollador permisos para crear y eliminar máquinas virtuales en Azure, pero quiere asegurarse de que no pueda modificar la configuración de red ni acceder a la facturación. ¿Qué concepto de seguridad en la nube utilizaría para definir estos roles y permisos granulares?","o":["Grupos de Seguridad de Red","RBAC (Role-Based Access Control)","Políticas de etiquetado de recursos"],"a":1,"h":"Se basa en asignar permisos a roles en lugar de a usuarios individuales.","e":"RBAC (implementado como IAM en AWS o Roles en Azure) es el método estándar en la nube para gestionar el acceso. Permite a los administradores definir roles con conjuntos específicos de permisos y luego asignar esos roles a usuarios o grupos."},{"i":"NET-SEC-073","k":"2.3","d":"Avanzado","q":"El monitoreo de flujo de red (NetFlow/sFlow) muestra que un servidor de archivos interno, que normalmente solo recibe conexiones, ha comenzado a enviar un flujo constante y grande de datos (varios GB) a una dirección IP desconocida en China durante la madrugada. ¿Cuál es la interpretación más probable de esta anomalía?","o":["Una actualización de software programada","Una copia de seguridad remota a un sitio no autorizado","Un incidente de exfiltración de datos"],"a":2,"h":"El comportamiento anómalo indica una posible fuga de información.","e":"Un cambio drástico en los patrones de tráfico, especialmente un gran volumen de datos salientes desde un servidor interno a un destino externo inusual y fuera del horario laboral, es una fuerte señal de que los datos están siendo robados o exfiltrados de la red."},{"i":"NET-SEC-MR-01-a","k":"2.3","d":"","q":"¿Qué patrón sugiere este comportamiento?","o":["DoS por SYN flood","Barrido de puertos ICMP","Exfiltración DNS"],"a":0,"h":"Muchos SYN a mismo destino/puerto","e":"Numerosos SYN a 22/tcp desde múltiples orígenes sugieren intento de SYN flood contra SSH.","s":"LOG del IDS (resumen): 10:15:13 DROP TCP 10.0.1.25:53612 → 10.0.2.10:22 FLAGS=S; 10:15:14 DROP TCP 10.0.1.26:53614 → 10.0.2.10:22 FLAGS=S; 10:15:15 DROP TCP 10.0.1.27:53615 → 10.0.2.10:22 FLAGS=S; (más eventos similares)"},{"i":"NET-SEC-MR-01-b","k":"2.3","d":"","q":"Una medida de mitigación inmediata es…","o":["Habilitar rate-limiting/ SYN cookies","Desactivar ARP en el gateway","Bloquear HTTP en el perímetro"],"a":0,"h":"Protecciones del stack TCP","e":"SYN cookies / rate-limiting ayudan a resistir floods. ARP o HTTP no atienden este vector.","s":"LOG del IDS (resumen): 10:15:13 DROP TCP 10.0.1.25:53612 → 10.0.2.10:22 FLAGS=S; 10:15:14 DROP TCP 10.0.1.26:53614 → 10.0.2.10:22 FLAGS=S; 10:15:15 DROP TCP 10.0.1.27:53615 → 10.0.2.10:22 FLAGS=S; (más eventos similares)"},{"i":"NET-SEC-MR-01-c","k":"2.3","d":"","q":"¿Qué métrica confirmarías en el servidor SSH?","o":["Uso de CPU y backlog de conexiones half-open","Latencia de disco","Tamaño de logs de aplicaciones web"],"a":0,"h":"Conexiones semiabiertas","e":"Los SYN flood elevan half-open (SYN-RECV) y pueden elevar CPU/consumo de recursos en el servicio.","s":"LOG del IDS (resumen): 10:15:13 DROP TCP 10.0.1.25:53612 → 10.0.2.10:22 FLAGS=S; 10:15:14 DROP TCP 10.0.1.26:53614 → 10.0.2.10:22 FLAGS=S; 10:15:15 DROP TCP 10.0.1.27:53615 → 10.0.2.10:22 FLAGS=S; (más eventos similares)"},{"i":"SW-ING-001","k":"3.1","d":"Básico","q":"En Scrum, ¿quién es responsable de maximizar el valor del producto?","o":["Scrum Master","Product Owner","Equipo de desarrollo"],"a":1,"h":"Gestión del backlog","e":"El Product Owner gestiona el Product Backlog y maximiza el valor. El Scrum Master facilita el proceso."},{"i":"SW-ING-002","k":"3.1","d":"Medio","q":"Un objetivo principal de las pruebas unitarias es…","o":["Validar integración entre servicios","Verificar el comportamiento de componentes aislados","Medir desempeño extremo"],"a":1,"h":"Aislamiento ≈ unidad","e":"Las pruebas unitarias validan componentes aislados; la integración trata interacción entre componentes."},{"i":"SW-ING-003","k":"3.1","d":"Medio","q":"En requisitos, una cualidad típica de un requerimiento bien escrito es…","o":["Ambigüedad controlada","Trazabilidad","Solución implícita"],"a":1,"h":"Rastreable de origen a prueba","e":"La trazabilidad permite mapear requisitos → diseño → pruebas → despliegue."},{"i":"SW-ING-004","k":"3.1","d":"Básico","q":"Para una empresa de reciente creación, un director con 30 años de experiencia exige que todos los pasos del ciclo de vida del desarrollo sean documentados al 100% y se acepta que la empresa funcione con hojas de cálculo máximo durante el primer año y medio. ¿Qué metodología de desarrollo es la más recomendable?","o":["Cascada","Ágil","Espiral"],"a":0,"h":"Esta metodología es conocida por su enfoque secuencial y su énfasis en la documentación exhaustiva en cada fase.","e":"La metodología en cascada es un modelo secuencial que requiere la finalización y documentación completa de una fase antes de pasar a la siguiente. Es adecuada para proyectos con requisitos claros y estables desde el inicio, como lo prefiere el director, además de que la empresa tiene flexibilidad operativa en sus herramientas iniciales."},{"i":"SW-ING-005","k":"3.1","d":"Básico","q":"Un ingeniero de software ha sido contratado para automatizar una línea de producción, pero primero debe descubrir por qué una línea de producción con 30 estaciones de trabajo tiene tiempos muertos sin explicación alguna por parte de los encargados. Cada estación cuenta con un obrero que es experto en su estación. ¿Cuál es la técnica de recopilación de información más adecuada?","o":["Entrevista","Cuestionario Abierto","Observación Directa"],"a":2,"h":"Al explicar un proceso complejo y no documentado, se puede omitir información valiosa.","e":"La observación directa permite al ingeniero ver el proceso tal como ocurre en la realidad, identificando cuellos de botella, interacciones y problemas que los trabajadores podrían no comunicar verbalmente o no ser conscientes de ellos."},{"i":"SW-ING-006","k":"3.1","d":"Medio","q":"Para la nueva interfaz de un sistema bancario, se establece que un cajero no debe tardar más de 2 horas en aprender a usarla. ¿Qué tipo de requerimiento no funcional se está describiendo?","o":["Usabilidad","Capacitación","Fiabilidad"],"a":0,"h":"Este requerimiento se enfoca en qué tan fácil y eficiente es para un usuario interactuar con el sistema.","e":"La usabilidad es un requerimiento no funcional que mide la facilidad de uso de una interfaz. Incluye métricas como el tiempo de aprendizaje, la eficiencia de uso, la facilidad para recordar cómo se usa y la satisfacción del usuario."},{"i":"SW-ING-007","k":"3.1","d":"Medio","q":"En un sistema de control de producción se ha definido que el tiempo para iniciar o reiniciar el sistema debe ser de 3 minutos como máximo, sin importar la causa. ¿A qué tipo de requerimiento no funcional corresponde esta situación?","o":["Rendimiento","Fiabilidad","Soporte"],"a":1,"h":"Este tipo de requerimiento se relaciona con la capacidad del sistema para mantenerse operativo y recuperarse de fallos.","e":"La fiabilidad (Reliability) se refiere a la capacidad de un sistema para funcionar correctamente durante un período de tiempo. Incluye aspectos como el tiempo medio entre fallos (MTBF) y el tiempo medio de recuperación (MTTR), que está directamente relacionado con el tiempo de reinicio."},{"i":"SW-ING-008","k":"3.1","d":"Avanzado","q":"En el diseño de un videojuego, el controlador que gestiona las peticiones de la interfaz de ayuda está sobrecargado con operaciones que tienen que ver exclusivamente con la presentación. ¿Qué patrón GRASP se debe utilizar para delegar estas responsabilidades y reducir la carga del controlador?","o":["Fabricación Pura (Pure Fabrication)","Alta Cohesión (High Cohesion)","Controlador (Controller)"],"a":0,"h":"Este patrón sugiere crear una clase artificial que no representa un concepto del dominio, pero que sirve para agrupar responsabilidades y mejorar la cohesión.","e":"El patrón Fabricación Pura se utiliza para crear clases de servicio (p. ej., un `PresentadorDeAyuda`) que asumen responsabilidades que no encajan de forma natural en otras clases del dominio, evitando así que clases como el Controlador se sobrecarguen y violen el principio de Alta Cohesión."},{"i":"SW-ING-009","k":"3.1","d":"Básico","q":"Una empresa busca a un profesional para analizar los requerimientos no funcionales de los proyectos y dictar los estándares técnicos, de codificación, herramientas y plataformas. ¿Qué perfil se está buscando?","o":["Arquitecto de Software","Programador Full Stack","Analista de Sistemas"],"a":0,"h":"Este rol se enfoca en la visión de alto nivel del sistema, tomando decisiones estructurales que son difíciles de cambiar después.","e":"El Arquitecto de Software es responsable de definir la estructura general del sistema, seleccionar tecnologías y establecer los estándares y patrones de diseño que guiarán al equipo de desarrollo para cumplir con los requerimientos funcionales y no funcionales."},{"i":"SW-ING-010","k":"3.1","d":"Medio","q":"Para un sistema de control de semáforos, se cuenta con expertos en hardware, bases de datos, Java y visualización. Se sugiere que cada equipo desarrolle su parte de forma independiente para luego integrarlas. ¿Cuál es la arquitectura más adecuada?","o":["En capas (Layered)","Pizarrón (Blackboard)","Cliente - Servidor"],"a":0,"h":"Este estilo arquitectónico organiza el sistema en grupos de sub-tareas, cada una en un nivel de abstracción particular.","e":"La arquitectura en capas es ideal para esta situación, ya que permite separar las responsabilidades del sistema en diferentes niveles (ej. capa de presentación, capa de lógica de negocio, capa de acceso a datos, capa de hardware), permitiendo que equipos especializados trabajen en paralelo."},{"i":"SW-ING-011","k":"3.1","d":"Medio","q":"Para un cliente es muy importante que la estimación de costos del nuevo sistema tome en cuenta cuánto del software actual se va a reutilizar. ¿Qué técnica de cálculo de costos es la más adecuada?","o":["COCOMO II - Modelo de Diseño Temprano","COCOMO Básico","COCOMO II - Modelo de Composición de Aplicación"],"a":2,"h":"Esta variante de COCOMO II es útil en las primeras fases para estimar proyectos que integran componentes existentes o reutilizan código.","e":"El modelo de Composición de Aplicación de COCOMO II está diseñado para estimar el esfuerzo en proyectos que se construyen utilizando componentes existentes (COTS), código reutilizado o herramientas de construcción de interfaces, lo cual encaja perfectamente con el requisito del cliente."},{"i":"SW-ING-012","k":"3.1","d":"Básico","q":"La alta dirección de una aseguradora ha solicitado un plan para recuperar los servicios de TI rápidamente en caso de un evento catastrófico. ¿Qué tipo de documento se necesita generar?","o":["Plan de continuidad de negocio (BCP)","Plan de emergencia de ocupantes","Plan de recuperación de desastres (DRP)"],"a":2,"h":"Este plan se enfoca específicamente en la infraestructura y los sistemas de Tecnología de la Información.","e":"Un Plan de Recuperación de Desastres (DRP) es un subconjunto del Plan de Continuidad de Negocio (BCP) y se centra exclusivamente en los procedimientos para recuperar la infraestructura tecnológica, las aplicaciones y los datos después de un desastre."},{"i":"SW-ING-013","k":"3.1","d":"Medio","q":"Durante un proceso de Design Thinking para un software de exportación de acero, se generó la pregunta: '¿Cómo podríamos publicar la oferta del acero para que los clientes potenciales la vean, confirmen y paguen un adelanto inmediatamente?'. ¿En qué fase de la metodología se encuentra el equipo?","o":["Idear","Definir (o Analizar)","Investigación"],"a":1,"h":"En esta fase, el equipo sintetiza los hallazgos de la investigación para formular un 'punto de vista' o una pregunta clave que guiará la generación de soluciones.","e":"La fase de 'Definir' (a veces llamada Analizar o Sintetizar) consiste en dar sentido a la información recopilada en la fase de investigación para enmarcar el problema de manera clara y accionable. La pregunta '¿Cómo podríamos...?' es la herramienta clásica para cristalizar el desafío de diseño antes de pasar a la fase de 'Idear'."},{"i":"SW-ING-014","k":"3.1","d":"Básico","q":"Una consultora propone a un despacho migrar todo el equipo de cómputo a la última versión de Windows y Office. ¿En qué sección del estudio de viabilidad se analiza si la organización cuenta con el hardware, el personal y los conocimientos necesarios para llevar a cabo esta migración?","o":["Factibilidad Técnica","Factibilidad Operativa","Factibilidad Económica"],"a":0,"h":"Esta sección evalúa si la tecnología necesaria está disponible y si el equipo actual tiene la capacidad para implementarla.","e":"La factibilidad técnica se encarga de evaluar los recursos tecnológicos y humanos. Analiza si el hardware actual soporta el nuevo software, si el personal tiene las habilidades para la migración y el soporte, y si la tecnología propuesta es la adecuada para resolver el problema."},{"i":"SW-ING-015","k":"3.1","d":"Básico","q":"Un Project Manager informa que un proyecto de unificación de sistemas de pago lleva un retraso de 3 semanas contra el plan original, pero solo se ha gastado el 75% del presupuesto estimado para la fecha. ¿En qué etapa de la gestión de proyectos se encuentra?","o":["Seguimiento y Control","Planeación","Inicio"],"a":0,"h":"En esta fase se mide y supervisa regularmente el progreso para identificar variaciones con respecto al plan.","e":"La etapa de Seguimiento y Control se ejecuta en paralelo con la de Ejecución. Implica monitorear el avance del proyecto, compararlo con el plan (cronograma, presupuesto, alcance) y tomar acciones correctivas si es necesario, como lo está haciendo el manager al reportar el estado."},{"i":"SW-ING-016","k":"3.1","d":"Medio","q":"Al probar una app móvil de un banco, se detecta que la consulta de saldo solo funciona de 9 a 13 horas y no permite transferencias entre cuentas del mismo cliente, a pesar de que ambas funcionalidades estaban en el caso de uso. ¿A qué métrica de calidad corresponden estos defectos?","o":["Funcionalidad","Usabilidad","Capacidad de prueba"],"a":0,"h":"Esta característica de calidad se refiere a la capacidad del software para proveer las funciones que satisfacen las necesidades explícitas e implícitas del usuario.","e":"La funcionalidad mide si el software hace lo que se supone que debe hacer. Los defectos descritos son fallos en las funciones principales que se esperaban (consultar saldo a cualquier hora, realizar transferencias), por lo que afectan directamente a esta métrica de calidad."},{"i":"SW-ING-017","k":"3.1","d":"Básico","q":"La práctica de 'programación en pareja' (Pair Programming), donde dos desarrolladores trabajan juntos en una misma estación de trabajo, es una de las prácticas centrales de la metodología llamada:","o":["RUP (Rational Unified Process)","XP (Extreme Programming)","Yourdon"],"a":1,"h":"Es una de las metodologías ágiles más conocidas, enfocada en la retroalimentación constante y las buenas prácticas de ingeniería.","e":"La Programación Extrema (XP) promueve un conjunto de prácticas de ingeniería de software, siendo la programación en pareja una de las más distintivas, junto con el desarrollo guiado por pruebas (TDD), la integración continua y las entregas pequeñas."},{"i":"SW-ING-018","k":"3.1","d":"Básico","q":"Un equipo de desarrollo está trabajando en una aplicación móvil para un cliente que no tiene claros todos los requerimientos y anticipa que solicitará muchos cambios durante el proyecto. El equipo necesita un modelo de ciclo de vida que le permita entregar valor de forma rápida y adaptarse a la incertidumbre.","o":["Modelo en Cascada","Modelo en Espiral","Modelo Scrum"],"a":2,"h":"Habrá cambios durante el proyecto","e":" Metodología Ágil (Scrum), porque se basa en ciclos cortos e iterativos (Sprints) que permiten la adaptación continua a nuevos requerimientos."},{"i":"SW-ING-019","k":"3.1","d":"Medio","q":"Durante la fase de diseño de un sistema de comercio electrónico, el arquitecto de software debe decidir cómo estructurar la comunicación entre el servicio de inventario y el servicio de procesamiento de pagos. Es crucial que si el pago falla, el inventario reservado para la compra se libere automáticamente.  ¿Qué patrón de diseño es el más adecuado para asegurar la consistencia de los datos entre ambos servicios?","o":["Singleton","Saga","Factory"],"a":1,"h":"comunicación entre servicio de inventario y servicio de procesamiento de pagos","e":"Saga, para gestionar transacciones que abarcan múltiples microservicios a través de una secuencia de transacciones locales compensatorias."},{"i":"SW-ING-020","k":"3.1","d":"Medio","q":"Un equipo de desarrollo está trabajando en un sistema de comercio electrónico a gran escala. Para asegurar que los cambios en el módulo de pagos no afecten la funcionalidad del carrito de compras, ¿qué tipo de pruebas deben realizarse prioritariamente?","o":["Pruebas Unitarias","Pruebas de Integración","Pruebas de Aceptación de Usuario (UAT)"],"a":1,"h":"Este tipo de prueba se centra en verificar la correcta comunicación y flujo de datos entre diferentes componentes del software.","e":"Las Pruebas de Integración son cruciales para verificar que distintos módulos o servicios de una aplicación (como pagos y carrito de compras) interactúan correctamente entre sí, asegurando que los cambios en uno no rompan la funcionalidad del otro."},{"i":"SW-ING-021","k":"3.1","d":"Básico","q":"Una startup está desarrollando una nueva aplicación móvil y necesita lanzar una versión funcional al mercado lo más rápido posible para obtener retroalimentación de los primeros usuarios. El equipo es pequeño y los requisitos cambian constantemente. ¿Qué metodología de desarrollo es la más adecuada?","o":["Cascada","Scrum","Modelo en V"],"a":1,"h":"Esta metodología ágil se basa en ciclos cortos de desarrollo (Sprints) que permiten una adaptación rápida a los cambios.","e":"Scrum es una metodología ágil ideal para entornos con requisitos volátiles y donde la velocidad de entrega es crítica. Permite al equipo entregar valor de forma incremental y adaptarse a la retroalimentación del cliente en cada Sprint."},{"i":"SW-ING-022","k":"3.1","d":"Medio","q":"Un analista de sistemas necesita representar gráficamente cómo un cliente puede 'Iniciar Sesión', 'Consultar Saldo' y 'Realizar Transferencia' en una aplicación bancaria. ¿Qué diagrama de UML es el más apropiado para visualizar estas interacciones?","o":["Diagrama de Clases","Diagrama de Secuencia","Diagrama de Casos de Uso"],"a":2,"h":"Este diagrama se utiliza para describir la funcionalidad de un sistema desde la perspectiva del usuario o actor.","e":"El Diagrama de Casos de Uso es la herramienta de UML diseñada específicamente para modelar las interacciones entre los actores (usuarios) y el sistema, representando las funcionalidades que este ofrece (casos de uso)."},{"i":"SW-ING-023","k":"3.1","d":"Avanzado","q":"En una aplicación de red social, múltiples componentes de la interfaz de usuario (como el contador de notificaciones, el feed de noticias y la lista de amigos) necesitan actualizarse automáticamente cuando un usuario recibe un nuevo mensaje. ¿Qué patrón de diseño es el más adecuado para manejar esta notificación masiva de cambios?","o":["Singleton","Factory","Observer"],"a":2,"h":"Este patrón de comportamiento permite que un objeto (el sujeto) notifique a una lista de objetos dependientes (observadores) sobre cualquier cambio en su estado.","e":"El patrón Observer es ideal para situaciones donde un cambio en el estado de un objeto debe ser notificado a otros objetos sin que el sujeto conozca los detalles de sus observadores. El objeto 'mensaje nuevo' notificaría a todos los componentes suscritos para que se actualicen."},{"i":"SW-ING-024","k":"3.1","d":"Medio","q":"Una empresa está migrando su gigantesca aplicación de gestión empresarial a una arquitectura que permita a diferentes equipos trabajar de forma independiente en módulos como 'Facturación', 'Inventario' y 'Recursos Humanos', y que cada módulo pueda ser desplegado y escalado por separado. ¿Qué tipo de arquitectura de software están adoptando?","o":["Arquitectura de Microservicios","Arquitectura Monolítica","Arquitectura Cliente-Servidor"],"a":0,"h":"Este enfoque arquitectónico estructura una aplicación como una colección de servicios pequeños, autónomos y débilmente acoplados.","e":"La Arquitectura de Microservicios permite desarrollar, desplegar y mantener servicios de forma independiente. Esto se alinea con la necesidad de la empresa de que equipos autónomos trabajen en módulos separados que pueden ser escalados individualmente."},{"i":"SW-ING-025","k":"3.1","d":"Básico","q":"Un equipo de QA recibe una nueva versión de un software de contabilidad para probar. El equipo no tiene acceso al código fuente y debe verificar que todas las funciones, como la generación de facturas y el cálculo de impuestos, operan según lo especificado en el manual de usuario. ¿Qué enfoque de pruebas están utilizando?","o":["Pruebas de Caja Blanca","Pruebas de Caja Negra","Pruebas Unitarias"],"a":1,"h":"Este método de prueba se enfoca en la funcionalidad del sistema desde una perspectiva externa, sin conocimiento de su estructura interna.","e":"Las pruebas de Caja Negra se realizan sin conocer la implementación interna del sistema. El probador se enfoca en las entradas y salidas esperadas, tratando el software como una 'caja opaca', lo cual es exactamente lo que hace el equipo de QA al basarse en las especificaciones funcionales."},{"i":"SW-ING-026","k":"3.1","d":"Medio","q":"Dentro de un proyecto Scrum, el Development Team informa en la Daily Standup que un impedimento técnico les bloquea para avanzar en una tarea del Sprint Backlog. ¿Quién es el principal responsable de ayudar a eliminar este impedimento?","o":["Product Owner","El propio Development Team","Scrum Master"],"a":2,"h":"Este rol en Scrum actúa como un facilitador y líder servicial, cuya función principal es eliminar los obstáculos que enfrenta el equipo de desarrollo.","e":"Una de las responsabilidades clave del Scrum Master es eliminar los impedimentos que el Development Team no puede resolver por sí mismo, protegiendo al equipo de interrupciones externas y asegurando que el flujo de trabajo sea lo más fluido posible."},{"i":"SW-ING-027","k":"3.1","d":"Avanzado","q":"Un desarrollador necesita asegurarse de que su aplicación solo tenga una única instancia de la clase que gestiona la conexión a la base de datos para evitar el consumo excesivo de recursos. ¿Qué patrón de diseño GoF debería implementar?","o":["Factory Method","Singleton","Model-View-Controller (MVC)"],"a":1,"h":"Este patrón creacional garantiza que una clase solo tenga una instancia y proporciona un punto de acceso global a ella.","e":"El patrón Singleton está diseñado específicamente para restringir la instanciación de una clase a un único objeto. Es comúnmente utilizado para gestionar recursos compartidos como conexiones a bases de datos, gestores de configuración o servicios de logging."},{"i":"SW-ING-028","k":"3.1","d":"Básico","q":"Al final de un Sprint de dos semanas, el equipo de desarrollo presenta el incremento de producto funcional a los stakeholders para obtener su feedback. ¿Cómo se llama este evento en Scrum?","o":["Sprint Planning","Daily Standup","Sprint Review"],"a":2,"h":"Este evento no es una simple demo, sino una sesión de trabajo colaborativa para inspeccionar el resultado del Sprint y adaptar el Product Backlog.","e":"La Sprint Review es el evento que se celebra al final del Sprint para inspeccionar el incremento y adaptar el Product Backlog si es necesario. El Development Team muestra lo que ha completado y responde preguntas sobre el incremento."},{"i":"SW-ING-029","k":"3.1","d":"Medio","q":"Una tienda en línea quiere asegurar que el sistema pueda soportar 5,000 usuarios concurrentes durante una venta de 'Viernes Negro' sin que el tiempo de respuesta exceda los 2 segundos por petición. ¿Qué tipo de requerimiento no funcional se está describiendo?","o":["Rendimiento","Seguridad","Portabilidad"],"a":0,"h":"Este requerimiento se enfoca en cómo el sistema se comporta bajo una cierta carga de trabajo.","e":"El rendimiento es un requerimiento no funcional que define atributos de calidad como la velocidad, la escalabilidad y la capacidad de respuesta de un sistema bajo condiciones específicas, como el número de usuarios concurrentes y los tiempos de respuesta aceptables."},{"i":"SW-ING-030","k":"3.1","d":"Medio","q":"Un ingeniero está diseñando una clase `Coche` y necesita representar la relación con su `Motor`. Sabe que un `Coche` tiene exactamente un `Motor`, y que el `Motor` no puede existir si el `Coche` es destruido. En un Diagrama de Clases de UML, ¿qué tipo de relación es la más adecuada?","o":["Asociación","Agregación","Composición"],"a":2,"h":"Es una forma fuerte de 'tiene un', donde el ciclo de vida de la parte depende del todo.","e":"La Composición es la relación correcta porque representa una relación fuerte de 'parte-todo'. Si el `Coche` (el todo) es destruido, el `Motor` (la parte) también lo es, lo que indica que sus ciclos de vida están fuertemente acoplados."},{"i":"SW-ING-031","k":"3.1","d":"Avanzado","q":"Un equipo de desarrollo está construyendo un sistema complejo. Para separar la lógica de negocio de la interfaz de usuario y del manejo de datos, deciden usar un patrón arquitectónico donde un componente maneja los datos y la lógica, otro presenta los datos al usuario y un tercero gestiona la interacción del usuario. ¿Qué patrón están aplicando?","o":["Microservicios","Modelo-Vista-Controlador (MVC)","Singleton"],"a":1,"h":"Este patrón es fundamental en el desarrollo de interfaces de usuario y aplicaciones web, promoviendo la separación de preocupaciones.","e":"El patrón Modelo-Vista-Controlador (MVC) está diseñado explícitamente para separar una aplicación en tres componentes interconectados: el Modelo para la gestión de datos, la Vista para la representación de la información y el Controlador para manejar la entrada del usuario y la lógica de flujo."},{"i":"SW-ING-032","k":"3.1","d":"Básico","q":"Durante el análisis de requerimientos para un sistema de biblioteca, se define que 'el sistema debe permitir a los usuarios buscar libros por título, autor o ISBN'. ¿Qué tipo de requerimiento es este?","o":["Requerimiento Funcional","Requerimiento No Funcional","Requerimiento de Sistema"],"a":0,"h":"Este tipo de requerimiento describe una acción o comportamiento específico que el sistema debe ser capaz de realizar.","e":"Un requerimiento funcional especifica lo que el sistema debe hacer. La capacidad de buscar libros es una función directa del sistema, describiendo una de sus características principales desde la perspectiva del usuario."},{"i":"SW-ING-033","k":"3.1","d":"Medio","q":"Un equipo que utiliza Kanban ha notado que el tiempo de entrega de las tareas es muy alto. El tablero muestra muchas tareas en la columna 'En Desarrollo' y pocas en 'Terminado'. ¿Qué principio de Kanban deberían aplicar para mejorar el flujo de trabajo?","o":["Aumentar el número de tareas","Limitar el Trabajo en Progreso (WIP)","Realizar reuniones diarias más largas"],"a":1,"h":"Este principio fundamental de Kanban ayuda a evitar cuellos de botella y a mejorar el enfoque del equipo.","e":"Limitar el Trabajo en Progreso (WIP) es una práctica central de Kanban. Al establecer un límite máximo de tareas que pueden estar en una columna (especialmente 'En Desarrollo'), se obliga al equipo a terminar tareas antes de empezar nuevas, lo que reduce los cuellos de botella y mejora el flujo (flow)."},{"i":"SW-ING-034","k":"3.1","d":"Avanzado","q":"Un tester de QA está verificando el algoritmo de ordenamiento de una lista de números. Para ello, diseña casos de prueba que aseguren que cada bucle y cada condición (if/else) dentro del código del algoritmo se ejecuten al menos una vez. ¿Qué tipo de técnica de prueba está utilizando?","o":["Pruebas de Caja Negra","Pruebas de Caja Blanca","Pruebas de Regresión"],"a":1,"h":"Esta técnica requiere conocimiento de la estructura interna, la lógica y el código del software.","e":"Las pruebas de Caja Blanca se basan en el conocimiento del código fuente para diseñar casos de prueba. Técnicas como la cobertura de sentencias, de decisiones o de caminos se centran en ejecutar la lógica interna del código, que es exactamente lo que el tester está haciendo."},{"i":"SW-ING-035","k":"3.1","d":"Medio","q":"Un sistema de aviación civil requiere que el software de control de tráfico aéreo tenga una disponibilidad del 99.999% ('cinco nueves'). Este requerimiento se enfoca en la capacidad del sistema para operar continuamente sin fallos. ¿A qué categoría de requerimiento no funcional pertenece?","o":["Usabilidad","Mantenibilidad","Fiabilidad (Reliability)"],"a":2,"h":"Se relaciona con la probabilidad de que un sistema funcione sin fallos durante un período de tiempo específico.","e":"La fiabilidad (Reliability) es un requerimiento no funcional que mide la capacidad de un sistema para funcionar correctamente y de forma continua. Se cuantifica a menudo en términos de disponibilidad, tiempo medio entre fallos (MTBF) y tasa de fallos."},{"i":"SW-ING-036","k":"3.1","d":"Básico","q":"Un proyecto de construcción de un puente tiene requisitos extremadamente claros, fijos y bien documentados desde el inicio. El cliente no prevé ningún cambio y se requiere un control estricto en cada fase antes de pasar a la siguiente. ¿Qué ciclo de vida de desarrollo de software sería el más apropiado si se aplicara su filosofía a este proyecto?","o":["Ágil","Cascada","Prototipado"],"a":1,"h":"Este modelo es secuencial y no permite volver a una fase anterior una vez que ha sido completada.","e":"El modelo en Cascada es ideal para proyectos donde los requisitos son estables y bien definidos desde el principio. Su naturaleza secuencial (Análisis -> Diseño -> Implementación -> Pruebas) y su énfasis en la documentación y la finalización de fases encajan perfectamente en un escenario tan rígido."},{"i":"SW-ING-037","k":"3.1","d":"Avanzado","q":"Un arquitecto de software está diseñando un sistema que debe permitir la creación de diferentes tipos de objetos `Vehiculo` (como `Coche`, `Bicicleta`, `Camion`) sin que el código cliente se acople a las clases concretas de cada vehículo. El cliente solo necesita solicitar un tipo de vehículo y recibir el objeto correspondiente. ¿Qué patrón de diseño facilitaría esta creación de objetos?","o":["Observer","Factory","Adapter"],"a":1,"h":"Este patrón creacional proporciona una interfaz para crear objetos en una superclase, pero permite que las subclases alteren el tipo de objetos que se crearán.","e":"El patrón Factory Method (o más generalmente, el patrón Factory) se utiliza para encapsular la lógica de creación de objetos. Permite al código cliente solicitar un objeto a través de una interfaz común sin saber qué clase concreta de objeto se está instanciando, promoviendo así un bajo acoplamiento."},{"i":"SW-ING-038","k":"3.1","d":"Medio","q":"Un equipo está desarrollando un sistema de procesamiento de pagos. Un desarrollador junior ha escrito una función que valida la tarjeta de crédito, realiza el cargo y envía un correo de confirmación. Un desarrollador senior le recomienda separar estas tres responsabilidades en funciones distintas. ¿Qué principio de diseño de software está promoviendo el senior?","o":["Bajo Acoplamiento (Low Coupling)","Alta Cohesión (High Cohesion)","Indirección (Indirection)"],"a":1,"h":"Este principio sugiere que los elementos de un módulo (o una función) deben estar estrechamente relacionados y enfocados en una sola tarea.","e":"La Alta Cohesión se refiere a qué tan enfocadas están las responsabilidades de un módulo. Al separar la validación, el cargo y la notificación en funciones distintas, cada función tiene una única y bien definida responsabilidad, lo que aumenta la cohesión, facilita el mantenimiento y la reutilización del código."},{"i":"SW-ING-039","k":"3.1","d":"Básico","q":"En el contexto del Manifiesto Ágil, se valora 'la colaboración con el cliente sobre la negociación contractual'. ¿Cuál de las siguientes acciones refleja mejor este valor?","o":["Crear un contrato detallado que cubra todas las posibles contingencias antes de iniciar el proyecto.","Involucrar al cliente en las reuniones de Sprint Review para que dé su feedback sobre el producto.","Enviar informes de progreso al cliente únicamente al final de cada fase del proyecto."],"a":1,"h":"El agilismo promueve una comunicación continua y directa con el cliente para asegurar que el producto final satisfaga sus necesidades.","e":"Involucrar al cliente de forma regular y colaborativa, como en las Sprint Reviews, es una manifestación directa del valor de 'colaboración con el cliente'. Permite una retroalimentación constante y una adaptación del producto, en lugar de depender rígidamente de un contrato inicial.","f":1},{"i":"SW-ING-040","k":"3.1","d":"Medio","q":"Un desarrollador ha creado una nueva función para un sistema. Antes de integrar su código al repositorio principal, ejecuta un conjunto de pruebas automatizadas que verifican que su nueva función opera correctamente. ¿Qué tipo de pruebas está realizando?","o":["Pruebas de Integración","Pruebas de Sistema","Pruebas Unitarias"],"a":2,"h":"Estas pruebas se centran en la unidad más pequeña de código que puede ser aislada y probada lógicamente.","e":"Las Pruebas Unitarias consisten en probar componentes individuales de software (una función, un método o una clase) de forma aislada para validar que se comportan como se espera. Son la primera línea de defensa para asegurar la calidad del código a nivel micro."},{"i":"SW-ING-041","k":"3.1","d":"Avanzado","q":"Un equipo de desarrollo está construyendo una aplicación monolítica. Con el tiempo, la base de código se ha vuelto tan grande y acoplada que hacer un pequeño cambio requiere un ciclo completo de pruebas y despliegue de toda la aplicación, lo que es lento y arriesgado. ¿Cuál es la principal desventaja de la arquitectura monolítica que se describe aquí?","o":["Dificultad para escalar componentes individuales.","Barreras tecnológicas para adoptar nuevas herramientas.","Fuerte acoplamiento y despliegues de alto riesgo."],"a":2,"h":"En un monolito, todos los componentes están interconectados en un único proceso, lo que dificulta su modificación y despliegue independiente.","e":"Una de las mayores desventajas de la arquitectura monolítica es el fuerte acoplamiento entre sus componentes. Esto significa que un cambio en una pequeña parte del sistema puede tener efectos inesperados en otras, obligando a volver a probar y desplegar toda la aplicación, lo que aumenta el riesgo y ralentiza la entrega de valor."},{"i":"SW-ING-042","k":"3.1","d":"Medio","q":"Un analista está modelando la interacción entre un `Usuario` y un `CajeroAutomático` para la acción de 'Retirar Dinero'. Necesita mostrar el orden cronológico de los mensajes intercambiados, como 'insertarTarjeta()', 'ingresarPIN()', 'solicitarMonto()', 'entregarDinero()'. ¿Qué diagrama de UML es el más adecuado para este propósito?","o":["Diagrama de Clases","Diagrama de Casos de Uso","Diagrama de Secuencia"],"a":2,"h":"Este diagrama de comportamiento se especializa en mostrar la línea de vida de los objetos y los mensajes que intercambian a lo largo del tiempo.","e":"El Diagrama de Secuencia es la herramienta ideal para visualizar interacciones ordenadas en el tiempo. Muestra los objetos participantes y la secuencia de mensajes que se envían entre ellos para completar una funcionalidad específica, como un retiro de dinero."},{"i":"SW-ING-043","k":"3.1","d":"Básico","q":"En un proyecto Scrum, ¿quién es el único responsable de gestionar el Product Backlog, incluyendo la priorización de sus elementos para maximizar el valor del producto?","o":["El equipo de desarrollo (Development Team)","El Scrum Master","El Dueño del Producto (Product Owner)"],"a":2,"h":"Este rol representa la voz del cliente y de los stakeholders, y su objetivo es asegurar que el equipo construya el producto correcto.","e":"El Product Owner es la única persona responsable de la gestión del Product Backlog. Esto incluye crear y comunicar claramente los elementos del backlog, ordenarlos para alcanzar mejor los objetivos y asegurar que el backlog sea visible y entendido por todos."},{"i":"SW-ING-044","k":"3.1","d":"Avanzado","q":"Una empresa de logística ha actualizado su sistema de gestión de rutas. Antes de desplegar la nueva versión a producción, el equipo de QA debe verificar que las funcionalidades existentes, como el seguimiento de envíos y la facturación, no se hayan visto afectadas negativamente por los nuevos cambios. ¿Qué tipo de pruebas deben realizar?","o":["Pruebas de Aceptación (UAT)","Pruebas de Regresión","Pruebas de Rendimiento"],"a":1,"h":"El objetivo de estas pruebas es descubrir errores en áreas funcionales que antes funcionaban correctamente.","e":"Las Pruebas de Regresión son esenciales para asegurar que las nuevas modificaciones o funcionalidades no han roto el código existente. Se ejecutan para confirmar que las partes del software que no han cambiado siguen funcionando como se esperaba después de una actualización."},{"i":"SW-ING-045","k":"3.1","d":"Medio","q":"Un equipo ágil necesita estimar el esfuerzo requerido para un conjunto grande de historias de usuario en el backlog inicial. Para agilizar el proceso, deciden agrupar las historias en categorías de tamaño como 'Pequeño', 'Mediano', 'Grande' y 'Extra Grande'. ¿Qué técnica de estimación están utilizando?","o":["Planning Poker","Puntos de Función","T-shirt Sizing"],"a":2,"h":"Esta técnica de estimación relativa es útil para obtener una visión general y rápida del esfuerzo sin entrar en detalles numéricos precisos.","e":"El T-shirt Sizing e
