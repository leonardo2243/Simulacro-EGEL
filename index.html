  }).join('');
  let fb='';
  if(rev){const ok=a===q.a;fb=`<div class="fb ${ok?'ok':'no'}" role="status"><b>${ok?'Correcto':'Incorrecto. La respuesta es '+'ABC'[q.a]}</b><span>${esc(q.e)}</span></div>`}
  const notes=S.idx===0?[S.info.note?`<div class="warn">${esc(S.info.note)}</div>`:'',S.info.recycled?`<div class="warn">En algunas subáreas ya viste todo lo disponible. Se reutilizaron ${S.info.recycled} preguntas, las más antiguas primero.</div>`:''].join(''):'';
  view.innerHTML=`
  <section class="card">
    ${notes}
    <div class="top"><span class="lbl">Pregunta ${S.idx+1} de ${S.qs.length}</span><span class="lbl">${done} contestadas</span></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${S.qs.length}" aria-valuenow="${S.idx+1}"><i style="width:${pct}%"></i></div>
    <div class="qmeta"><span class="tag">${q.key} · ${esc(SUB[q.key].subarea)}</span>${tagFor(q)}</div>
    ${q.s?`<div class="stim">${esc(q.s)}</div>`:''}
    <p class="qtext" style="white-space:pre-wrap">${esc(q.q)}</p>
    <div class="opts" role="group" aria-label="Opciones">${opts}</div>
    ${S.hint&&!rev?`<div class="hint">Pista: ${esc(q.h||'Sin pista disponible.')}</div>`:''}
    ${fb}
    <div class="row">
      ${!S.fb&&S.idx>0?'<button class="btn" data-act="prev">Anterior</button>':''}
      ${!rev?'<button class="btn" data-act="hint">Pista</button>':''}
      <button class="btn primary" data-act="next"${S.fb&&!has?' disabled':''}>${last?'Ver resultados':'Siguiente'}</button>
      <button class="btn" data-act="finish">Terminar ahora</button>
    </div>
  </section>`;
}
function pickOpt(i){
  if(!S||!S.qs[S.idx]||i>=S.qs[S.idx].o.length)return;
  if(S.fb&&S.ans[S.idx]!=null)return;
  S.ans[S.idx]=i;renderExam();
}
function next(){
  if(S.fb&&S.ans[S.idx]==null)return;
  if(S.idx<S.qs.length-1){S.idx++;S.hint=false;renderExam();window.scrollTo(0,0)}else renderResults();
}
function renderResults(){
  onHome=false;
  const R=S.qs.map((q,i)=>({q,a:S.ans[i],ok:S.ans[i]===q.a}));
  const ok=R.filter(r=>r.ok).length,tot=R.length,pct=Math.round(ok/tot*100);
  hist.last={ok,total:tot,pct,ts:Date.now(),date:new Date().toLocaleDateString('es-MX',{day:'numeric',month:'short'})};save();
  const agg=f=>{const m={};R.forEach(r=>{const k=f(r.q);m[k]=m[k]||[0,0];m[k][1]++;if(r.ok)m[k][0]++});return m};
  const row=(name,v)=>{const p=Math.round(v[0]/v[1]*100);return `<tr><td>${name}</td><td class="n">${v[0]}/${v[1]}</td><td class="n">${p}%</td><td><div class="mini"><i style="width:${p}%"></i></div></td></tr>`};
  const ar=agg(q=>q.key[0]),sa=agg(q=>q.key),wrong=R.filter(r=>!r.ok);
  const rev=wrong.map(r=>`<div class="rev"><div class="qmeta"><span class="tag">${r.q.key} · ${esc(SUB[r.q.key].subarea)}</span>${tagFor(r.q)}</div>${r.q.s?`<div class="stim">${esc(r.q.s)}</div>`:''}<p class="qtext" style="white-space:pre-wrap">${esc(r.q.q)}</p><div class="note">Tu respuesta: ${r.a==null?'sin contestar':esc(r.q.o[r.a])}</div><div class="note"><b>Correcta:</b> ${esc(r.q.o[r.q.a])}</div><div class="note">${esc(r.q.e)}</div></div>`).join('');
  view.innerHTML=`
  <section class="card">
    <div class="eyebrow">Resultado</div>
    <div class="top"><div class="score">${pct}%</div><div><h2>${ok} de ${tot} correctas</h2><p class="note">${pct>=70?'Buen nivel. Sigue con preguntas nuevas.':'Repasa las falladas y vuelve a intentar con preguntas nuevas.'}</p></div></div>
    <div class="row">
      <button class="btn primary" data-act="again">Hacer de nuevo con preguntas nuevas</button>
      ${wrong.length?'<button class="btn" data-act="redo">Repasar las '+wrong.length+' falladas</button>':''}
      <button class="btn" data-act="home">Cambiar ajustes</button>
    </div>
  </section>
  <section class="card"><h2>Por área</h2><div class="tbl"><table><thead><tr><th>Área</th><th>Aciertos</th><th>%</th><th></th></tr></thead><tbody>${Object.keys(ar).sort().map(k=>row(AREA[k],ar[k])).join('')}</tbody></table></div>
    <h2>Por subárea</h2><div class="tbl"><table><thead><tr><th>Subárea</th><th>Aciertos</th><th>%</th><th></th></tr></thead><tbody>${Object.keys(sa).sort().map(k=>row(k+' '+esc(SUB[k].subarea),sa[k])).join('')}</tbody></table></div></section>
  ${wrong.length?`<section class="card"><h2>Preguntas para repasar</h2>${rev}</section>`:''}`;
  window.scrollTo(0,0);
}
async function manualAI(){
  hist.set=curSet();
  const subs=SUBS.filter(s=>hist.set.area==='all'||s.key[0]===hist.set.area);
  const c=alloc(20,subs);
  const asks=subs.map((s,i)=>[s.key,c[i]]).filter(x=>x[1]>0);
  const n=await askClaude(asks);
  homeMsg=aiNote||(n?'':'');
  renderHome();
}
view.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='start'){homeMsg='';startExam(curSet())}
  else if(a==='aigen')manualAI();
  else if(a==='aiskip'){if(aiCtl)aiCtl.abort()}
  else if(a==='clear'){
    hist.set=curSet();
    if(confirmClear){hist.seen={};hist.last=null;hist.epoch=(hist.epoch||0)+1;save();confirmClear=false;homeMsg=''}else confirmClear=true;
    renderHome();
  }
  else if(a==='pick')pickOpt(+b.dataset.i);
  else if(a==='hint'){S.hint=!S.hint;renderExam()}
  else if(a==='next')next();
  else if(a==='prev'){S.idx--;S.hint=false;renderExam()}
  else if(a==='finish')renderResults();
  else if(a==='again')startExam(S.set);
  else if(a==='home'){homeMsg='';renderHome()}
  else if(a==='redo'){const w=S.qs.filter((q,i)=>S.ans[i]!==q.a);S={qs:w,idx:0,ans:[],fb:S.set.fb,info:{recycled:0},set:S.set,hint:false};renderExam();window.scrollTo(0,0)}
});
document.addEventListener('keydown',e=>{
  if(!S||!view.querySelector('.opts')||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k.length===1&&'abc'.includes(k))pickOpt('abc'.indexOf(k));
  else if(k.length===1&&'123'.includes(k))pickOpt(+k-1);
  else if(e.key==='ArrowRight'||(e.key==='Enter'&&e.target.tagName!=='BUTTON'))next();
});
view.addEventListener('change',()=>{confirmClear=false});
const useCap=n=>{try{return window.claude&&window.claude.use?window.claude.use(n).catch(()=>null):Promise.resolve(null)}catch(e){return Promise.resolve(null)}};
fetch('bank.json').then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(d=>{
  BANK=d.bank;SUBS=d.subareas;SUBS.forEach(s=>SUB[s.key]=s);
  return fetch('reserve.json').then(r=>r.ok?r.json():[]).catch(()=>[]);
}).then(res=>{
  localLoad();
  poolAdd(cleanAI(res).map(x=>Object.assign(x,{uid:'r'+x.uid.slice(1),r:1})));
  renderHome();
  cloudInit(useCap).then(()=>{if(onHome){hist.set=curSet();renderHome()}}).catch(()=>{sync='error';paintSync()});
}).catch(()=>{view.innerHTML='<div class="card"><h2>No se pudo cargar el banco</h2><p class="note">Recarga la página. Si el problema continúa, avisa para volver a publicarla.</p></div>'});
</script>
