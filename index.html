 minimizar la diafonía (crosstalk) y asegurar la fiabilidad, ¿qué categoría de cableado UTP sería la más adecuada y recomendada para esta implementación?","o":["Categoría 5e","Categoría 6","Categoría 6A"],"a":2,"h":"Esta categoría está específicamente diseñada para soportar 10GBASE-T hasta los 100 metros y cuenta con un blindaje mejorado.","e":"La Categoría 6A (Aumentada) es el estándar recomendado para 10 Gigabit Ethernet sobre cobre a distancias de hasta 100 metros. Ofrece especificaciones de rendimiento más estrictas, especialmente en lo que respecta a la diafonía exógena (alien crosstalk), en comparación con la Cat 6, que solo soporta 10 Gbps en distancias muy cortas."},{"i":"NET-DIS-071","k":"2.1","d":"Medio","q":"Un técnico necesita fabricar un cable de red para conectar directamente el puerto de red de una laptop al de otra para transferir archivos grandes, sin usar un switch o router. Al ponchar los conectores RJ45, se da cuenta de que debe usar una determinada configuración en cada extremo. ¿Qué estándar debe aplicar en cada punta del cable para que funcione correctamente?","o":["T568B en un extremo y T568A en el otro","T568A para ambos extremos","T568B para ambos extremos"],"a":0,"h":"Este tipo de cable, conocido como 'crossover' o cable cruzado, intercambia los pares de transmisión y recepción.","e":"Para crear un cable cruzado (crossover), que permite la comunicación directa entre dos dispositivos de red iguales (como dos PCs), se debe usar el estándar T568A en un extremo y el T568B en el otro. Esto cruza los pares de transmisión (pines 1 y 2) con los de recepción (pines 3 y 6).","f":1},{"i":"NET-DIS-072","k":"2.1","d":"Medio","q":"Un servidor crítico para una base de datos presenta lentitud en la red bajo cargas de trabajo pesadas. Para mejorar el rendimiento y proporcionar redundancia, el administrador instala una segunda tarjeta de interfaz de red (NIC) y las configura para que funcionen como una única interfaz lógica, duplicando el ancho de banda. ¿Qué técnica se está aplicando?","o":["Agregación de enlaces","Balanceo de carga","Calidad de Servicio"],"a":0,"h":"Esta tecnología también es conocida por otros nombres como 'NIC teaming', 'bonding' o 'etherchannel'.","e":"La agregación de enlaces (Link Aggregation), normada por el estándar IEEE 802.3ad, permite combinar varios enlaces de red físicos en un único enlace lógico. Esto aumenta el ancho de banda total y proporciona redundancia, ya que si un enlace falla, el tráfico se redirige automáticamente por los enlaces restantes."},{"i":"NET-DIS-073","k":"2.1","d":"Medio","q":"Un cliente se queja de que no puede acceder a la versión segura de los sitios web (HTTPS) desde la red de la oficina, aunque la versión no segura (HTTP) funciona bien. Un técnico de soporte revisa las reglas del firewall corporativo. ¿Qué puerto es más probable que esté bloqueado, causando este problema específico?","o":["80","443","8080"],"a":1,"h":"Este puerto es el estándar para el tráfico web cifrado mediante TLS/SSL.","e":"El puerto 443 es el puerto estándar utilizado por el protocolo HTTPS (Hypertext Transfer Protocol Secure). Si este puerto está bloqueado en el firewall, los navegadores no podrán establecer una conexión segura con los servidores web, mientras que el tráfico HTTP sobre el puerto 80 seguirá funcionando."},{"i":"NET-DIS-074","k":"2.1","d":"Avanzado","q":"En un centro de datos, un administrador de red necesita conectar dos racks de servidores que están a 15 metros de distancia. La conexión debe soportar 40 Gbps. El cableado de cobre Cat 8 es una opción, pero el administrador prefiere una alternativa que sea completamente inmune a la interferencia electromagnética (EMI) generada por las fuentes de alimentación de los servidores. ¿Qué tipo de cableado debería elegir?","o":["Cable coaxial Thicknet (10BASE5)","Cable de par trenzado blindado (STP) Cat 7","Cable de fibra óptica multimodo (OM3/OM4)"],"a":2,"h":"Este medio de transmisión utiliza pulsos de luz en lugar de señales eléctricas, lo que lo hace inmune a la EMI.","e":"La fibra óptica transmite datos mediante luz, por lo que es inmune a la interferencia electromagnética (EMI) y a la interferencia de radiofrecuencia (RFI). La fibra multimodo, específicamente OM3 u OM4, es ideal para distancias cortas dentro de un centro de datos y puede soportar fácilmente velocidades de 40 Gbps y 100 Gbps."},{"i":"NET-DIS-075","k":"2.1","d":"Medio","q":"Un usuario informa que puede recibir correos electrónicos en su cliente de escritorio, pero no se sincronizan las carpetas ni el estado de 'leído/no leído' entre su laptop y su smartphone. El administrador revisa la configuración y sospecha que está usando un protocolo obsoleto para la recepción. ¿Qué protocolo debería estar usando para permitir la sincronización entre múltiples dispositivos?","o":["POP3S (Puerto 995)","IMAPS (Puerto 993)","SMTP (Puerto 25)"],"a":1,"h":"Este protocolo mantiene los correos en el servidor y sincroniza el estado de todos los clientes que se conectan a la misma cuenta.","e":"IMAP (Internet Message Access Protocol), especialmente en su versión segura IMAPS sobre el puerto 993, está diseñado para que los correos permanezcan en el servidor. Esto permite que múltiples clientes accedan al buzón y vean el mismo estado de los mensajes (leído, borrado, movido a carpetas), a diferencia de POP3, que generalmente descarga los mensajes a un solo dispositivo."},{"i":"NET-DIS-076","k":"2.1","d":"Medio","q":"En una fábrica, se instala un cable UTP Cat 6 para conectar una máquina en la línea de producción. El cable se tiende en la misma canaleta que los cables de alimentación de un motor industrial de alta potencia. Los usuarios reportan que la conexión de red de la máquina es inestable y se cae con frecuencia, especialmente cuando el motor está en funcionamiento. ¿Cuál es el fenómeno responsable de este problema?","o":["Diafonía (Crosstalk)","Atenuación de la señal","Interferencia Electromagnética (EMI)"],"a":2,"h":"Los motores eléctricos son una fuente importante de 'ruido' eléctrico que puede inducir corrientes no deseadas en cables de datos cercanos.","e":"La Interferencia Electromagnética (EMI) es la perturbación generada por una fuente eléctrica externa que afecta a un circuito electrónico. Los motores de alta potencia generan campos electromagnéticos fuertes que pueden inducir ruido en el cable UTP, corrompiendo la señal de datos y causando errores de transmisión o pérdida de conexión. El cableado de datos siempre debe estar separado físicamente del cableado eléctrico de alta potencia."},{"i":"NET-DIS-077","k":"2.1","d":"Medio","q":"Una oficina pequeña está siendo cableada. El técnico tiene dos bobinas de cable UTP: una marcada como 'Plenum' y otra como 'Riser'. Le piden que instale un cable que atraviese verticalmente varios pisos a través de un ducto de comunicaciones. ¿Qué tipo de cable debe utilizar según los códigos de seguridad contra incendios?","o":["Plenum (CMP)","Riser (CMR)","PVC de uso general (CM)"],"a":1,"h":"El nombre de este tipo de cable hace referencia a su uso en 'elevadores' o tramos verticales entre pisos.","e":"El cable de tipo Riser (CMR - Communications Multipurpose Cable, Riser) está diseñado para evitar la propagación del fuego de un piso a otro en instalaciones verticales. Aunque el cable Plenum (CMP) tiene una resistencia al fuego superior y emite menos humos tóxicos, su uso es obligatorio en espacios de circulación de aire (plenums), pero el CMR es el adecuado y más económico para los tramos verticales."},{"i":"NET-ADM-001","k":"2.2","d":"Básico","q":"¿Qué protocolo se usa comúnmente para monitoreo y sondeo de equipos de red?","o":["SMTP","SNMP","SFTP"],"a":1,"h":"Gestión de red","e":"SNMP permite obtener métricas (MIB) y gestionar dispositivos en administración de red."},{"i":"NET-ADM-002","k":"2.2","d":"Medio","q":"Para asignación dinámica de direcciones a clientes, el servicio adecuado es…","o":["DNS","DHCP","RADIUS"],"a":1,"h":"Pool y lease","e":"DHCP otorga direcciones, gateway y DNS mediante leases temporales."},{"i":"NET-ADM-003","k":"2.2","d":"Medio","q":"Spanning Tree Protocol (STP) evita…","o":["Bucles de capa 2","Colisiones CSMA/CD","Ataques Man-in-the-Middle"],"a":0,"h":"Puentes y topologías redundantes","e":"STP bloquea enlaces redundantes para asegurar una topología libre de lazos a nivel 2."},{"i":"NET-ADM-004","k":"2.2","d":"Medio","q":"Una empresa implementa OSPF en su red interna. ¿Qué característica principal de OSPF lo hace adecuado para redes empresariales grandes y dinámicas?","o":["Es un protocolo de vector distancia que usa saltos como métrica","Es un protocolo de estado de enlace que calcula rutas óptimas con Dijkstra","No requiere configuración y aprende rutas automáticamente"],"a":1,"h":"Piensa en cómo OSPF mantiene una visión completa de la topología.","e":"OSPF es un protocolo de estado de enlace que construye una base de datos completa de la topología y usa el algoritmo de Dijkstra para calcular las rutas más eficientes."},{"i":"NET-ADM-005","k":"2.2","d":"Medio","q":"Un administrador de red interconecta dos switches con dos enlaces paralelos para mejorar la redundancia. Sin embargo, observa una degradación masiva del rendimiento y tormentas de broadcast. ¿Qué protocolo debe configurar para solucionar este problema?","o":["STP","VTP","DHCP"],"a":0,"h":"Evita la formación de bucles en topologías de capa 2.","e":"El Protocolo de Árbol de Expansión (STP) está diseñado para prevenir bucles de capa 2 al bloquear lógicamente los enlaces redundantes, evitando así las tormentas de broadcast y la inestabilidad de la tabla MAC."},{"i":"NET-ADM-006","k":"2.2","d":"Medio","q":"Una empresa necesita que el tráfico de múltiples departamentos (VLANs 10, 20 y 30) viaje a través de un único enlace físico entre dos switches. ¿Qué configuración es indispensable en los puertos que conforman dicho enlace?","o":["Configurar los puertos en modo de acceso","Configurar los puertos como troncales (trunking)","Asignar una dirección IP a cada puerto"],"a":1,"h":"Piensa en cómo un enlace puede transportar tráfico de múltiples VLANs.","e":"Un enlace troncal (trunk), comúnmente usando el protocolo 802.1Q, permite el paso de tráfico de múltiples VLANs a través de un solo puerto al etiquetar las tramas con el ID de la VLAN correspondiente."},{"i":"NET-ADM-007","k":"2.2","d":"Avanzado","q":"Un ingeniero está diseñando una red empresarial grande y jerárquica. Se requiere un protocolo de enrutamiento interior que converja rápidamente, soporte VLSM y base sus decisiones en el costo del ancho de banda. ¿Cuál es la opción más adecuada?","o":["RIP","OSPF","Enrutamiento Estático"],"a":1,"h":"Protocolo de estado de enlace, no de vector distancia.","e":"OSPF (Open Shortest Path First) es un protocolo de estado de enlace ideal para redes grandes. Utiliza el algoritmo de Dijkstra para calcular la ruta más corta y su métrica se basa en el costo, que es inversamente proporcional al ancho de banda."},{"i":"NET-ADM-008","k":"2.2","d":"Básico","q":"En una nueva sucursal, un técnico necesita que las 100 computadoras de los empleados obtengan su configuración de red (IP, máscara, gateway) de forma automática al conectarse. ¿Qué servicio debe implementar en el router local?","o":["DNS","NAT","DHCP"],"a":2,"h":"Asignación dinámica de direcciones.","e":"El Protocolo de Configuración Dinámica de Host (DHCP) centraliza y automatiza la asignación de direcciones IP y otros parámetros de red a los clientes."},{"i":"NET-ADM-009","k":"2.2","d":"Medio","q":"Una pequeña empresa tiene múltiples dispositivos en su red LAN (192.168.1.0/24) pero solo una dirección IP pública provista por su ISP. ¿Qué tecnología debe configurar en su router para permitir que todos los dispositivos accedan a Internet?","o":["PAT (Port Address Translation)","DHCP Relay","DNS Caching"],"a":0,"h":"Una forma de NAT que mapea múltiples IPs privadas a una única IP pública usando diferentes puertos.","e":"PAT, una variante de NAT, permite que múltiples dispositivos en una red privada compartan una sola dirección IP pública. El router realiza un seguimiento de las conexiones utilizando números de puerto únicos."},{"i":"NET-ADM-010","k":"2.2","d":"Medio","q":"Un administrador de red no puede acceder a un servidor web remoto por su nombre de dominio (ej. www.google.com), pero sí puede hacerlo usando su dirección IP. ¿Qué servicio de red es el más probable responsable del problema?","o":["DHCP","DNS","ARP"],"a":1,"h":"Resolución de nombres a direcciones.","e":"El Sistema de Nombres de Dominio (DNS) es responsable de traducir nombres de dominio legibles para humanos en direcciones IP. Si la resolución de nombres falla, el acceso por nombre de dominio no funcionará."},{"i":"NET-ADM-011","k":"2.2","d":"Básico","q":"Un usuario reporta lentitud al acceder a un servicio en la nube. Para identificar en qué punto de la ruta de red se está introduciendo la mayor latencia, ¿qué herramienta de diagnóstico debería utilizar el administrador?","o":["ping","ipconfig /all","traceroute (o tracert)"],"a":2,"h":"Muestra el camino y el tiempo de respuesta de cada salto hacia un destino.","e":"El comando traceroute (o tracert en Windows) envía paquetes con TTLs crecientes para trazar la ruta que toma un paquete hasta su destino, mostrando la latencia en cada salto intermedio."},{"i":"NET-ADM-012","k":"2.2","d":"Avanzado","q":"Una empresa requiere una solución de VPN para interconectar dos de sus sedes a través de Internet. La solución debe ser capaz de transportar tráfico de enrutamiento dinámico (multicast) y asegurar la confidencialidad de los datos. ¿Qué combinación de protocolos es la más adecuada?","o":["GRE sobre IPsec","PPTP con AES","L2TP sobre SSL"],"a":0,"h":"Un protocolo para encapsulación genérica y otro para el cifrado del túnel.","e":"GRE (Generic Routing Encapsulation) crea un túnel que puede transportar diversos tipos de paquetes, incluyendo multicast. IPsec se utiliza para cifrar el tráfico del túnel GRE, proporcionando una conexión segura (VPN)."},{"i":"NET-ADM-013","k":"2.2","d":"Medio","q":"Un ingeniero de seguridad desea centralizar todos los registros (eventos, errores, accesos) generados por los routers, switches y firewalls de la red en un único servidor para facilitar la auditoría. ¿Qué protocolo debería implementar para este fin?","o":["SNMP","Syslog","NetFlow"],"a":1,"h":"Protocolo estándar para el envío de mensajes de registro de eventos.","e":"Syslog es un protocolo estándar utilizado para enviar mensajes de registro de eventos a un servidor central, conocido como servidor Syslog, permitiendo la gestión y el análisis centralizado de logs."},{"i":"NET-ADM-014","k":"2.2","d":"Avanzado","q":"Una organización necesita conectar su red al sistema de un proveedor externo a través de Internet. Para controlar qué rutas se anuncian y se reciben, y para aplicar políticas complejas de enrutamiento, ¿qué protocolo es el estándar de la industria para este escenario?","o":["OSPF","EIGRP","BGP"],"a":2,"h":"Es el protocolo de enrutamiento de Internet, utilizado entre sistemas autónomos.","e":"BGP (Border Gateway Protocol) es el protocolo de enrutamiento exterior (EGP) utilizado para intercambiar información de enrutamiento entre diferentes sistemas autónomos (AS) en Internet, permitiendo una granularidad alta en las políticas de ruteo."},{"i":"NET-ADM-015","k":"2.2","d":"Avanzado","q":"Para garantizar la alta disponibilidad del gateway predeterminado en una red crítica, un ingeniero implementa dos routers. Se necesita un mecanismo que permita que ambos routers compartan una dirección IP virtual y que uno tome el control si el otro falla. ¿Qué protocolo cumple esta función?","o":["VRRP","STP","VTP"],"a":0,"h":"Protocolo de redundancia de primer salto.","e":"El Protocolo de Redundancia de Router Virtual (VRRP) permite que un grupo de routers funcione como un único router virtual, compartiendo una IP. Si el router maestro falla, un router de respaldo toma el control de la IP virtual de forma automática."},{"i":"NET-ADM-016","k":"2.2","d":"Medio","q":"Un administrador de red nota que las tablas de enrutamiento en una red OSPF muy grande son excesivamente largas, lo que consume mucha memoria y CPU. ¿Qué técnica puede aplicar para reducir el tamaño de estas tablas y mejorar la estabilidad?","o":["Usar enrutamiento estático","Implementar resumen de rutas","Aumentar el costo de las interfaces"],"a":1,"h":"Agrega múltiples redes en un solo anuncio de ruta.","e":"El resumen de rutas (route summarization) permite que un router anuncie un bloque de redes contiguas como una sola ruta resumida, reduciendo significativamente el tamaño de las tablas de enrutamiento en otros routers."},{"i":"NET-ADM-017","k":"2.2","d":"Avanzado","q":"Un gerente de TI solicita un informe detallado sobre qué aplicaciones (por ejemplo, YouTube, Office 365) están consumiendo la mayor parte del ancho de banda de Internet. ¿Qué tecnología, si se activa en los routers, puede proporcionar esta visibilidad a nivel de flujo de tráfico?","o":["SNMP","NetFlow","Syslog"],"a":1,"h":"Recopila metadatos sobre los flujos de tráfico IP.","e":"NetFlow (y sus variantes como sFlow o IPFIX) recopila y exporta metadatos sobre los flujos de tráfico IP que atraviesan un dispositivo de red, permitiendo un análisis detallado del uso del ancho de banda por IP, puerto y aplicación."},{"i":"NET-ADM-018","k":"2.2","d":"Medio","q":"Un técnico de soporte está solucionando un problema de conectividad en una red local. Tiene una dirección IP de destino pero no sabe si el dispositivo está respondiendo o cuál es su dirección MAC. ¿Qué protocolo es fundamental para que su equipo pueda construir la trama de Ethernet para enviar el primer paquete a ese IP?","o":["DNS","ARP","RARP"],"a":1,"h":"Resuelve direcciones de capa 3 a direcciones de capa 2.","e":"El Protocolo de Resolución de Direcciones (ARP) se utiliza para descubrir la dirección de hardware (MAC) de un dispositivo en la red local asociada a una dirección IP específica, lo cual es necesario para el encapsulamiento de la trama."},{"i":"NET-ADM-019","k":"2.2","d":"Medio","q":"Para simplificar la administración de VLANs en un campus con docenas de switches, un administrador quiere que la creación, modificación o eliminación de una VLAN en un switch 'servidor' se propague automáticamente a los demás switches 'clientes'. ¿Qué protocolo propietario de Cisco facilita esta tarea?","o":["STP","CDP","VTP"],"a":2,"h":"Protocolo para la sincronización de la base de datos de VLANs.","e":"El Protocolo de Enlace Troncal de VLAN (VTP) permite a un administrador de red configurar VLANs en un switch central (servidor VTP) y que esta configuración se propague a todos los demás switches del mismo dominio VTP."},{"i":"NET-ADM-020","k":"2.2","d":"Avanzado","q":"Una empresa está implementando una política de seguridad estricta para sus servidores web públicos. Se requiere que toda la comunicación entre el navegador del cliente y el servidor esté cifrada para proteger la integridad y confidencialidad de los datos. ¿Qué protocolo es el estándar para lograr esto?","o":["FTP","TLS","Telnet"],"a":1,"h":"Es el sucesor de SSL y la base de HTTPS.","e":"La Seguridad de la Capa de Transporte (TLS) es el protocolo criptográfico estándar utilizado para asegurar las comunicaciones en la web (HTTPS). Proporciona autenticación, confidencialidad e integridad de los datos."},{"i":"NET-ADM-021","k":"2.2","d":"Básico","q":"Un ingeniero necesita establecer una ruta hacia una red remota (10.100.0.0/16) a través de un router específico (192.168.1.254). La topología es simple y no se esperan cambios. ¿Cuál es el método de enrutamiento más eficiente y directo para este caso?","o":["Configurar una ruta estática","Habilitar OSPF","Utilizar RIPv2"],"a":0,"h":"Configuración manual que no consume recursos de CPU para cálculos de ruta.","e":"Una ruta estática es una entrada configurada manualmente en la tabla de enrutamiento. Es ideal para redes pequeñas o para definir una ruta específica (stub network) de manera predecible y con bajo overhead administrativo."},{"i":"NET-ADM-022","k":"2.2","d":"Medio","q":"Un analista de seguridad está examinando una captura de paquetes con Wireshark para diagnosticar un problema de lentitud en la transferencia de archivos a un servidor. Observa muchos reintentos y confirmaciones de TCP. ¿A qué capa del modelo OSI pertenece la información que está analizando?","o":["Capa 2 (Enlace de Datos)","Capa 4 (Transporte)","Capa 7 (Aplicación)"],"a":1,"h":"Esta capa se encarga de la comunicación de extremo a extremo y el control de flujo.","e":"TCP (Protocolo de Control de Transmisión) opera en la Capa 4 (Transporte). Es responsable de la entrega fiable de datos, el control de flujo y la gestión de la conexión, por lo que los reintentos y confirmaciones son parte de su funcionamiento."},{"i":"NET-ADM-023","k":"2.2","d":"Básico","q":"Un administrador está configurando un nuevo switch Cisco desde la Interfaz de Línea de Comandos (CLI). Para evitar accesos no autorizados al modo de configuración privilegiado, ¿qué comando es fundamental ejecutar?","o":["hostname SW-CORE-01","enable secret [contraseña]","interface vlan 1"],"a":1,"h":"Establece una contraseña cifrada para el modo 'enable'.","e":"El comando `enable secret` configura una contraseña cifrada para acceder al modo EXEC privilegiado, que es necesario para realizar cambios de configuración. Es una medida de seguridad básica y esencial."},{"i":"NET-ADM-024","k":"2.2","d":"Medio","q":"En una red EIGRP, un ingeniero necesita conectar una nueva subred. EIGRP es conocido por su rápida convergencia en caso de fallo de un enlace. ¿Qué algoritmo utiliza EIGRP para lograr esto?","o":["Dijkstra","Bellman-Ford","DUAL"],"a":2,"h":"Permite al router calcular una ruta de respaldo sin bucles de forma proactiva.","e":"EIGRP utiliza el Algoritmo de Actualización por Difusión (DUAL) para garantizar una operación libre de bucles y para proporcionar una convergencia rápida al precalcular una ruta de respaldo (feasible successor) si está disponible."},{"i":"NET-ADM-025","k":"2.2","d":"Medio","q":"Una empresa utiliza el protocolo SNMP para monitorear el estado de sus dispositivos de red. El sistema de monitoreo necesita consultar información específica, como el uso de la CPU o el estado de una interfaz. ¿Dónde se define la estructura de esta información gestionada?","o":["En el servidor Syslog","En la MIB (Management Information Base)","En la configuración de NAT"],"a":1,"h":"Es una base de datos jerárquica de objetos que pueden ser gestionados.","e":"La Base de Información de Gestión (MIB) es una base de datos estructurada que contiene objetos (como el uso de la CPU, el tráfico de la interfaz, etc.) que pueden ser consultados o modificados por un sistema de gestión de red a través de SNMP."},{"i":"NET-ADM-026","k":"2.2","d":"Medio","q":"Un cliente reporta que no puede conectarse a un servidor de archivos interno. Al usar 'ipconfig', el administrador nota que el cliente tiene una dirección IP del rango 169.254.x.x. ¿Qué problema indica esta dirección?","o":["Fallo del servidor DNS","Fallo en la negociación de dúplex","Fallo en la comunicación con el servidor DHCP"],"a":2,"h":"Esta dirección se conoce como APIPA.","e":"Una dirección APIPA (Automatic Private IP Addressing) en el rango 169.254.0.0/16 es autoconfigurada por un sistema operativo Windows cuando no puede contactar a un servidor DHCP para obtener una dirección IP."},{"i":"NET-ADM-027","k":"2.2","d":"Avanzado","q":"Una empresa quiere asegurar la comunicación de sus trabajadores remotos a la red corporativa. Se necesita una solución de VPN que sea fácil de configurar en los clientes y que utilice los puertos estándar de navegación web (TCP 80/443) para evitar bloqueos por firewalls intermedios. ¿Qué tipo de VPN es la más indicada?","o":["VPN IPsec","VPN SSL/TLS","VPN PPTP"],"a":1,"h":"También se conoce como VPN sin cliente o basada en web.","e":"Una VPN SSL/TLS (como OpenVPN o Cisco AnyConnect) encapsula el tráfico VPN dentro de sesiones TLS, las cuales pueden usar el puerto TCP 443. Esto hace que el tráfico VPN sea difícil de distinguir del tráfico HTTPS normal, evitando bloqueos."},{"i":"NET-ADM-028","k":"2.2","d":"Medio","q":"Durante una auditoría, se descubre que un switch está reenviando tramas de broadcast de una VLAN a otra, lo cual no debería ocurrir. ¿Cuál es la causa más probable de este comportamiento anómalo?","o":["Una configuración incorrecta de STP","Un router con una configuración de 'router-on-a-stick' mal implementada","El uso de VTP en modo transparente"],"a":1,"h":"Se necesita un dispositivo de capa 3 para enrutar entre VLANs.","e":"Los switches operan en la capa 2 y no deben reenviar tráfico entre VLANs. Si esto ocurre, es porque hay un dispositivo de capa 3 (un router o un switch de capa 3) que está enrutando activamente el tráfico entre ellas. Un error en esta configuración puede causar fugas de broadcast."},{"i":"NET-ADM-029","k":"2.2","d":"Avanzado","q":"Una red utiliza EIGRP. Un administrador nota que un router tiene una ruta en su tabla de topología marcada como 'Passive'. ¿Qué significa este estado?","o":["La ruta es inalcanzable y está a punto de ser eliminada","El router ha calculado exitosamente una ruta y su sucesor factible para ese destino","El router está buscando activamente una nueva ruta para ese destino tras un fallo"],"a":1,"h":"Es el estado normal y estable para una ruta en EIGRP.","e":"En EIGRP, el estado 'Passive' indica que la ruta es estable y el router tiene una ruta funcional (un sucesor) hacia el destino. El estado 'Active' indica que la ruta ha fallado y el router está realizando el cálculo DUAL para encontrar una alternativa."},{"i":"NET-ADM-030","k":"2.2","d":"Básico","q":"Un técnico necesita verificar la dirección MAC que su computadora tiene registrada para el gateway predeterminado (192.168.1.1). ¿Qué comando le mostraría la tabla de caché de ARP en su sistema?","o":["netstat -r","arp -a","ipconfig /displaydns"],"a":1,"h":"Muestra las correspondencias IP a MAC que el equipo ha aprendido.","e":"El comando `arp -a` (o `arp -g`) muestra el contenido de la caché de ARP, que es una tabla que almacena las asignaciones de direcciones IP a direcciones MAC de los dispositivos en la red local."},{"i":"NET-ADM-031","k":"2.2","d":"Medio","q":"Una compañía está configurando NAT dinámico en su router de borde. Tienen 5 direcciones IP públicas disponibles para un grupo de 100 empleados. ¿Qué sucede cuando el sexto empleado intenta acceder a Internet simultáneamente?","o":["El router asigna el mismo IP que a otro usuario, usando un puerto diferente (PAT)","La solicitud del sexto empleado es denegada hasta que una de las 5 IPs se libere","El router pide una IP adicional al ISP automáticamente"],"a":1,"h":"NAT dinámico puro crea un mapeo uno a uno.","e":"Con NAT dinámico (sin PAT/Overload), se crea un mapeo uno a uno entre una dirección IP interna y una dirección del pool público. Si todas las direcciones del pool están en uso, las nuevas solicitudes de traducción fallarán hasta que una se libere."},{"i":"NET-ADM-032","k":"2.2","d":"Medio","q":"Se implementa OSPF en una red con múltiples áreas. ¿Qué tipo de router es responsable de conectar un área OSPF al área de backbone (área 0)?","o":["Router de Backbone","Router Interno","Router de Borde de Área (ABR)"],"a":2,"h":"Este router tiene interfaces en más de un área.","e":"Un Router de Borde de Área (ABR) es un router OSPF que tiene al menos una interfaz en el área de backbone (área 0) y al menos una interfaz en otra área. Su función es intercambiar información de resumen de rutas entre las áreas."},{"i":"NET-ADM-033","k":"2.2","d":"Avanzado","q":"Un administrador necesita transferir una imagen del sistema operativo de 2GB a un router de forma segura. La transferencia de archivos estándar (FTP) no es una opción debido a la falta de cifrado. ¿Qué protocolo seguro debería usar para esta tarea?","o":["Telnet","SNMP","SCP (Secure Copy Protocol)"],"a":2,"h":"Funciona sobre SSH para proporcionar seguridad.","e":"SCP es un protocolo de transferencia de archivos que utiliza SSH (Secure Shell) para cifrar tanto los datos transferidos como las credenciales de autenticación, lo que lo convierte en una alternativa segura a FTP."},{"i":"NET-ADM-034","k":"2.2","d":"Medio","q":"En una red con redundancia, el administrador principal de un par de routers VRRP falla. El router de respaldo asume el rol de maestro y la IP virtual. ¿Qué mecanismo utiliza el router de respaldo para anunciar su nuevo rol y tomar control del tráfico?","o":["Envía un paquete ARP gratuito (Gratuitous ARP)","Actualiza el servidor DHCP con la nueva MAC","Fuerza una re-convergencia de STP"],"a":0,"h":"Actualiza las tablas ARP de los dispositivos de la red.","e":"Cuando un router de respaldo en VRRP se convierte en maestro, envía un paquete ARP gratuito. Este paquete contiene la IP virtual y la nueva dirección MAC del router ahora activo, forzando a los hosts y switches a actualizar sus cachés de ARP."},{"i":"NET-ADM-035","k":"2.2","d":"Medio","q":"Un analizador de protocolos como Wireshark captura una trama con el valor 0x0806 en el campo 'EtherType'. ¿Qué tipo de protocolo de capa superior indica este valor?","o":["IPv4","IPv6","ARP"],"a":2,"h":"Este protocolo opera en la capa de enlace para resolver direcciones.","e":"El campo EtherType en una trama Ethernet identifica el protocolo de la capa superior encapsulado. El valor 0x0800 corresponde a IPv4, mientras que 0x0806 corresponde a ARP."},{"i":"NET-ADM-036","k":"2.2","d":"Avanzado","q":"Una organización necesita conectar dos edificios distantes usando fibra oscura, pero el protocolo de enrutamiento que utilizan es antiguo y no es compatible con la red del proveedor de servicios. ¿Qué tecnología de túnel de capa 2 pueden usar para encapsular sus tramas Ethernet y transportarlas de forma transparente a través de la red intermedia?","o":["L2TP (Layer 2 Tunneling Protocol)","GRE (Generic Routing Encapsulation)","IPsec en modo transporte"],"a":0,"h":"Está diseñado específicamente para extender redes de capa 2.","e":"L2TP es un protocolo de túnel que permite encapsular tramas de capa 2 (como Ethernet o PPP) para ser enviadas a través de una red IP. Es ideal para extender una red local a través de una WAN."},{"i":"NET-ADM-037","k":"2.2","d":"Medio","q":"Un administrador configura una ruta estática en un router Cisco: `ip route 10.20.30.0 255.255.255.0 192.168.1.2 150`. ¿Qué representa el número '150' al final del comando?","o":["El costo de la ruta para OSPF","La distancia administrativa de la ruta","El número de saltos máximo"],"a":1,"h":"Es una medida de la confiabilidad de la fuente de la ruta.","e":"El último número en un comando de ruta estática es la distancia administrativa (AD). Se utiliza para desempatar cuando hay múltiples rutas hacia el mismo destino aprendidas por diferentes protocolos. Un valor más bajo es preferido. La AD por defecto para una ruta estática es 1."},{"i":"NET-ADM-038","k":"2.2","d":"Básico","q":"Un usuario informa que la red está 'lenta'. El administrador utiliza el comando `netstat -an` en el PC del usuario y observa una gran cantidad de conexiones en estado 'CLOSE_WAIT'. ¿Qué podría indicar esta situación?","o":["El servidor remoto ha cerrado la conexión, pero la aplicación local no lo ha hecho","La conexión está esperando a que el servidor remoto confirme el cierre","Hay un problema de resolución de nombres DNS"],"a":0,"h":"El extremo local no ha reconocido el FIN del extremo remoto.","e":"El estado 'CLOSE_WAIT' en una conexión TCP indica que el extremo remoto ha enviado un paquete FIN para cerrar su lado de la conexión, pero el sistema operativo local está esperando que la aplicación local también cierre su socket. Una acumulación sugiere un problema en la aplicación local."},{"i":"NET-ADM-039","k":"2.2","d":"Medio","q":"Para asegurar el tráfico de una VPN sitio a sitio, un ingeniero debe elegir un algoritmo de cifrado simétrico robusto. ¿Cuál de las siguientes opciones es considerada un estándar de la industria actual por su seguridad y eficiencia?","o":["DES","AES","MD5"],"a":1,"h":"Es el estándar de cifrado avanzado adoptado por el gobierno de EE.UU.","e":"AES (Advanced Encryption Standard) es el algoritmo de cifrado simétrico de bloque utilizado globalmente para asegurar datos. Reemplazó al antiguo estándar DES y es significativamente más seguro. MD5 no es un algoritmo de cifrado, sino de hashing."},{"i":"NET-ADM-040","k":"2.2","d":"Medio","q":"Un administrador configura un switch para que los puertos 1 al 10 pertenezcan a la VLAN 10 (Ventas) y los puertos 11 al 20 a la VLAN 20 (Ingeniería). Un usuario de Ventas en el puerto 5 intenta hacer ping a un usuario de Ingeniería en el puerto 15. ¿Por qué falla el ping?","o":["Porque STP ha bloqueado uno de los puertos","Porque no hay un dispositivo de capa 3 para enrutar entre las VLANs","Porque VTP no ha sincronizado la base de datos de VLANs"],"a":1,"h":"Las VLANs crean dominios de broadcast separados.","e":"Las VLANs segmentan la red en diferentes dominios de broadcast. Por diseño, los dispositivos en diferentes VLANs no pueden comunicarse directamente. Se necesita un router o un switch multicapa para enrutar el tráfico entre ellas."},{"i":"NET-ADM-041","k":"2.2","d":"Avanzado","q":"Una red BGP tiene dos rutas posibles hacia un mismo prefijo de destino. ¿Cuál de los siguientes atributos de BGP se evaluará primero en el proceso de selección de la mejor ruta?","o":["AS-Path","MED (Multi-Exit Discriminator)","Local Preference"],"a":2,"h":"Se utiliza para influir en la ruta de salida de un Sistema Autónomo.","e":"El proceso de selección de la mejor ruta de BGP sigue un orden estricto. La preferencia local (Local Preference) es uno de los primeros atributos que se comprueban (después de Weight, que es propietario de Cisco). Un valor de Local Preference más alto es preferido."},{"i":"NET-ADM-042","k":"2.2","d":"Básico","q":"Un administrador necesita configurar la dirección IP 172.16.30.5 y la máscara de subred 255.255.255.0 en la primera interfaz Gigabit Ethernet de un router Cisco. ¿Cuál es la secuencia de comandos correcta en el modo de configuración global?","o":["interface gigabitethernet 0/0; ip address 172.16.30.5 255.255.255.0; no shutdown","ip address 172.16.30.5 255.255.255.0 on gigabitethernet 0/0; enable","set interface gigabitethernet 0/0 ip 172.16.30.5 /24"],"a":0,"h":"Primero se ingresa al modo de configuración de interfaz.","e":"La sintaxis correcta de Cisco IOS requiere entrar primero al modo de configuración de la interfaz (`interface gigabitethernet 0/0`), luego asignar la dirección IP y la máscara (`ip address ...`), y finalmente activar la interfaz (`no shutdown`)."},{"i":"NET-ADM-043","k":"2.2","d":"Medio","q":"Un sistema de monitoreo basado en SNMP necesita obtener datos de un switch gestionado. El sistema de monitoreo envía una solicitud y el agente en el switch responde con el valor solicitado. ¿Qué tipo de operación SNMP describe esta interacción?","o":["SNMP Trap","SNMP GetRequest","SNMP SetRequest"],"a":1,"h":"Es una solicitud explícita de información del gestor al agente.","e":"La operación GetRequest es iniciada por el gestor SNMP (el sistema de monitoreo) para consultar el valor de un objeto MIB específico en un agente SNMP (el switch). Un Trap, en cambio, es una notificación no solicitada del agente al gestor."},{"i":"NET-ADM-044","k":"2.2","d":"Avanzado","q":"En una red OSPF, para reducir la cantidad de LSA (Link-State Advertisements) y el tamaño de la tabla de enrutamiento en otras áreas, un administrador configura un área como 'stub'. ¿Qué tipo de LSA está bloqueado de entrar en un área 'stub'?","o":["LSA de tipo 1 (Router LSA)","LSA de tipo 3 (Summary LSA)","LSA de tipo 5 (External LSA)"],"a":2,"h":"Estas LSA anuncian rutas de fuera del dominio OSPF.","e":"Un área 'stub' no permite la entrada de LSA de tipo 5, que son las que anuncian rutas externas (por ejemplo, redistribuidas desde otro protocolo de enrutamiento). En su lugar, el ABR inyecta una ruta por defecto (0.0.0.0/0) para alcanzar esos destinos externos."},{"i":"NET-ADM-045","k":"2.2","d":"Medio","q":"Un ingeniero configura un túnel GRE entre dos routers para extender una red privada. Por defecto, el túnel GRE no proporciona cifrado. Si un atacante captura los paquetes, podrá ver el tráfico original. ¿Qué protocolo se debe aplicar al túnel para proporcionar confidencialidad a los datos?","o":["IPsec","SSL","PPTP"],"a":0,"h":"Es el estándar para asegurar comunicaciones IP.","e":"IPsec (Internet Protocol Security) es un conjunto de protocolos que se utiliza para asegurar las comunicaciones en la capa de red. Se puede aplicar a un túnel GRE para cifrar la carga útil del paquete GRE, creando una VPN segura."},{"i":"NET-ADM-046","k":"2.2","d":"Básico","q":"Un administrador está configurando un nuevo router y necesita asegurarse de que la hora del dispositivo esté siempre sincronizada para que los logs de eventos sean precisos. ¿Qué protocolo de red debería configurar para lograr esto?","o":["FTP (File Transfer Protocol)","NTP (Network Time Protocol)","SMTP (Simple Mail Transfer Protocol)"],"a":1,"h":"Se utiliza para sincronizar relojes de computadora.","e":"NTP es un protocolo diseñado específicamente para sincronizar los relojes de los dispositivos en una red con una fuente de tiempo de referencia, asegurando una hora consistente y precisa en toda la infraestructura."},{"i":"NET-ADM-047","k":"2.2","d":"Medio","q":"Una red utiliza el protocolo RIP. Un administrador nota que las actualizaciones de enrutamiento se envían como broadcast a la dirección 255.255.255.255 cada 30 segundos. ¿Qué versión de RIP se está utilizando y cuál es su principal desventaja?","o":["RIPv1, que no soporta VLSM","RIPv2, que utiliza multicast","RIPng, que soporta IPv6"],"a":0,"h":"Es la versión original y classful del protocolo.","e":"RIPv1 es un protocolo de enrutamiento classful, lo que significa que no envía la máscara de subred en sus actualizaciones. Envía estas actualizaciones como broadcast, lo que consume ancho de banda innecesariamente. Su principal limitación es la falta de soporte para VLSM (Variable Length Subnet Masking)."},{"i":"NET-ADM-048","k":"2.2","d":"Avanzado","q":"Una empresa tiene un solo router Cisco con dos enlaces a Internet hacia diferentes proveedores y utiliza BGP. Quiere que el tráfico de salida hacia una red específica del cliente A siempre use el enlace del Proveedor 1, a menos que falle. ¿Qué atributo de BGP es el más adecuado para influir en esta decisión de ruta de salida?","o":["Weight (propietario de Cisco)","AS-Path Prepending","Community"],"a":0,"h":"Es el primer atributo evaluado en el proceso de decisión de BGP de Cisco y es local al router.","e":"El atributo 'Weight' es específico de Cisco y es el primer criterio que un router Cisco evalúa para elegir una ruta BGP. Al asignar un peso mayor a la ruta aprendida del Proveedor 1, el router siempre preferirá ese camino para el tráfico de salida, ya que es una decisión local del router."},{"i":"NET-ADM-049","k":"2.2","d":"Medio","q":"Un administrador de red está solucionando un problema en el que un host no puede resolver nombres de dominio externos. El administrador ejecuta el comando `nslookup www.google.com` y recibe un error de 'timeout'. ¿Qué es lo primero que debería verificar?","o":["La conectividad IP con el servidor DNS configurado en el host","El estado del protocolo STP en el switch local","La tabla de enrutamiento del gateway predeterminado"],"a":0,"h":"El comando nslookup depende de la conectividad con el servidor DNS.","e":"Un error de 'timeout' en `nslookup` significa que el host no recibió una respuesta de su servidor DNS configurado. El primer paso lógico es verificar si hay conectividad básica (por ejemplo, con un `ping`) al servidor DNS para descartar un problema de red."},{"i":"NET-ADM-050","k":"2.2","d":"Medio","q":"Una red utiliza el protocolo de redundancia HSRP. El router activo tiene una prioridad de 110 y el router de standby tiene la prioridad por defecto. ¿Qué valor de prioridad tiene el router de standby?","o":["90","100","110"],"a":1,"h":"Es el valor estándar si no se configura explícitamente.","e":"En HSRP (Hot Standby Router Protocol), la prioridad por defecto es 100. El router con la prioridad más alta se convierte en el router activo. En este caso, con 110, el primer router es el activo, y el segundo, con la prioridad por defecto de 100, es el de standby."},{"i":"NET-ADM-051","k":"2.2","d":"Medio","q":"Un ingeniero implementa una topología 'router-on-a-stick' para enrutar entre VLAN 10 y VLAN 20. ¿Qué configuración es esencial en la interfaz física del router que se conecta al switch?","o":["Asignar una dirección IP a la interfaz física","Crear dos subinterfaces, una para cada VLAN, con encapsulación 802.1Q","Configurar la interfaz física en modo troncal"],"a":1,"h":"La interfaz física actúa como un tronco, pero la lógica de enrutamiento se maneja en interfaces virtuales.","e":"En una configuración 'router-on-a-stick', la interfaz física del router no lleva una dirección IP. En su lugar, se crean subinterfaces lógicas. Cada subinterfaz se asigna a una VLAN específica mediante el comando `encapsulation dot1q [vlan-id]` y se le configura la dirección IP que funcionará como gateway para esa VLAN."},{"i":"NET-ADM-052","k":"2.2","d":"Medio","q":"Una oficina con 200 empleados necesita acceso a Internet, pero la empresa solo dispone de una única dirección IP pública. ¿Qué configuración específica de NAT permite que todos los empleados naveguen simultáneamente?","o":["NAT Estático","NAT Dinámico con un pool de una dirección","PAT (NAT Overload)"],"a":2,"h":"Esta técnica mapea múltiples direcciones privadas a una única dirección pública utilizando diferentes números de puerto.","e":"PAT (Port Address Translation), también conocido como NAT Overload, es la técnica que permite a múltiples dispositivos compartir una o más direcciones IP públicas. El router rastrea cada conexión única mediante la combinación de la IP privada y el puerto de origen, mapeándolos a la IP pública con un puerto único."},{"i":"NET-ADM-053","k":"2.2","d":"Avanzado","q":"En una configuración de HSRP entre dos routers, ambos tienen la misma prioridad configurada. ¿Qué factor utilizarán los routers para decidir cuál de ellos se convertirá en el router Activo?","o":["La dirección MAC más baja de sus interfaces","La dirección IP más alta en la interfaz configurada para HSRP","El que se inicie primero se convierte en Activo"],"a":1,"h":"Es el mecanismo de desempate final en la elección de HSRP.","e":"Cuando dos routers HSRP tienen la misma prioridad, el desempate se resuelve eligiendo el router con la dirección IP numéricamente más alta en la interfaz donde HSRP está habilitado. Este se convierte en el router Activo."},{"i":"NET-ADM-054","k":"2.2","d":"Avanzado","q":"La tabla de enrutamiento de un router tiene las siguientes tres entradas: 10.1.1.0/24, 10.1.0.0/16 y 10.0.0.0/8. Si llega un paquete destinado a la dirección IP 10.1.1.5, ¿qué ruta elegirá el router para reenviar el paquete?","o":["La ruta 10.1.1.0/24","La ruta 10.1.0.0/16","La ruta 10.0.0.0/8"],"a":0,"h":"Los routers siempre prefieren la ruta con el prefijo de red más específico.","e":"Los routers utilizan la regla de la 'coincidencia de prefijo más larga' (longest prefix match). La dirección 10.1.1.5 coincide con las tres rutas, pero 10.1.1.0/24 es la más específica (tiene la máscara de subred más larga, /24), por lo que será la ruta elegida."},{"i":"NET-ADM-055","k":"2.2","d":"Medio","q":"Un administrador está configurando un servidor DHCP en un router Cisco para la red 192.168.10.0/24. Necesita que las primeras 10 direcciones (de .1 a .10) no sean asignadas dinámicamente porque se usan para servidores y el gateway. ¿Qué comando debe usar para lograr esto?","o":["ip dhcp pool SERVIDORES","ip dhcp excluded-address 192.168.10.1 192.168.10.10","network 192.168.10.11 255.255.255.0"],"a":1,"h":"Este comando se configura fuera de la definición del pool de DHCP.","e":"El comando `ip dhcp excluded-address` se utiliza para especificar un rango de direcciones IP que el servidor DHCP no debe ofrecer a los clientes. Esto permite reservar direcciones para asignaciones estáticas."},{"i":"NET-ADM-056","k":"2.2","d":"Avanzado","q":"Dos switches están conectados mediante un enlace troncal. En el Switch A, la VLAN nativa es la 1, y en el Switch B, la VLAN nativa es la 99. ¿Qué problema de seguridad y rendimiento puede causar esta discrepancia?","o":["El enlace troncal no se establecerá y los puertos se apagarán.","El tráfico de la VLAN 1 y 99 podría saltar entre VLANs (VLAN hopping).","Solo el tráfico de la VLAN 1 podrá cruzar el enlace."],"a":1,"h":"El tráfico en la VLAN nativa no se etiqueta.","e":"Una discrepancia en la VLAN nativa en un enlace troncal 802.1Q es un riesgo de seguridad. El tráfico no etiquetado enviado desde el Switch A (VLAN 1) será recibido por el Switch B y colocado en su VLAN nativa (VLAN 99), y viceversa. Esto puede ser explotado en ataques de 'VLAN hopping'."},{"i":"NET-ADM-057","k":"2.2","d":"Avanzado","q":"Un router (R1) aprende una ruta hacia la red 10.50.0.0/16 a través de OSPF. El administrador quiere que esta ruta se propague a su red EIGRP. Después de configurar la redistribución, los routers EIGRP no aprenden la ruta. ¿Cuál es una causa común de este fallo de propagación?","o":["EIGRP y OSPF no son compatibles para redistribución.","No se definió una métrica semilla para las rutas redistribuidas en EIGRP.","STP está bloqueando la propagación de rutas."],"a":1,"h":"Al redistribuir en EIGRP, se deben especificar los componentes de la métrica.","e":"A diferencia de otros protocolos, cuando se redistribuyen rutas en EIGRP, este no asigna una métrica por defecto. El administrador debe especificar explícitamente una métrica semilla (ancho de banda, retardo, fiabilidad, carga y MTU) en el comando `redistribute`. Sin ella, la métrica es infinita y la ruta no se propaga."},{"i":"NET-ADM-058","k":"2.2","d":"Medio","q":"Una empresa configuró un pool de NAT dinámico con 10 direcciones IP públicas. Si 10 usuarios ya están utilizando estas direcciones y un undécimo usuario intenta acceder a Internet, ¿qué mensaje de log es más probable que aparezca en el router?","o":["%NAT-6-ADDR_USED: Address xx.xx.xx.xx is already in use","%NAT-5-POOL_EXHAUSTED: Pool de NAT agotado","%SYS-5-CONFIG_I: Configurado desde consola por consola"],"a":1,"h":"El mensaje de log indicará que no hay más direcciones disponibles en el grupo.","e":"Cuando todas las direcciones IP en un pool de NAT dinámico están en uso, el router no puede crear nuevas traducciones. Generará un mensaje de log similar a `%NAT-5-POOL_EXHAUSTED` para indicar que el pool está agotado y las nuevas solicitudes de acceso a Internet fallarán."},{"i":"NET-ADM-059","k":"2.2","d":"Medio","q":"Una empresa aloja un servidor web interno en la dirección 192.168.10.100. Necesitan que este servidor sea accesible desde Internet a través de la dirección IP pública 200.100.50.5. ¿Qué tipo de NAT se debe configurar para este mapeo permanente y uno a uno?","o":["NAT Estático","PAT (NAT Overload)","NAT Dinámico"],"a":0,"h":"Crea una traducción fija entre una dirección local y una dirección global.","e":"El NAT Estático se utiliza para crear un mapeo permanente entre una dirección IP privada específica y una dirección IP pública específica. Es la solución ideal para hacer que un servidor interno sea accesible desde el exterior."},{"i":"NET-ADM-060","k":"2.2","d":"Avanzado","q":"Un router aprende la misma ruta de destino a través de OSPF y de EIGRP (interno). Por defecto, ¿qué ruta instalará el router en su tabla de enrutamiento y por qué?","o":["La ruta OSPF, porque su métrica de costo es más baja.","La ruta EIGRP, porque su distancia administrativa es menor.","Ambas rutas, para balanceo de carga."],"a":1,"h":"La primera decisión de un router se basa en la confiabilidad de la fuente de la ruta.","e":"La Distancia Administrativa (AD) es el primer criterio que un router utiliza para seleccionar una ruta. La AD por defecto de EIGRP interno es 90, mientras que la de OSPF es 110. Como 90 es menor (más confiable) que 110, el router preferirá e instalará la ruta aprendida por EIGRP.","f":1},{"i":"NET-ADM-061","k":"2.2","d":"Medio","q":"Un empleado conecta su portátil personal a un puerto de red en la oficina, y el puerto se apaga inmediatamente (estado err-disabled). El administrador revisa la configuración del switch y ve que la seguridad del puerto está habilitada. ¿Cuál es la causa más probable?","o":["El servidor DHCP no tiene más direcciones disponibles.","La dirección MAC del portátil del empleado violó la política de seguridad del puerto.","Hay una discrepancia de VLAN nativa en ese puerto."],"a":1,"h":"Esta función limita el número de direcciones MAC permitidas en un puerto.","e":"La seguridad de puerto (Port Security) es una característica de capa 2 que restringe el acceso a un puerto de switch basándose en las direcciones MAC. Si un dispositivo con una MAC no autorizada se conecta, o si se excede el número máximo de MACs permitidas, el puerto puede entrar en estado 'err-disabled' como medida de protección."},{"i":"NET-ADM-062","k":"2.2","d":"Básico","q":"Al ejecutar el comando `show ip route` en un router, un administrador ve la siguiente línea: `S* 0.0.0.0/0 [1/0] via 203.0.113.1`. ¿Qué representa esta entrada en la tabla de enrutamiento?","o":["Una ruta estática hacia una red específica.","Una ruta de host para el propio router.","Una ruta estática por defecto o de último recurso."],"a":2,"h":"El asterisco y la dirección 'todo ceros' son indicadores clave.","e":"La entrada `0.0.0.0/0` representa la ruta por defecto. El router la utiliza para reenviar cualquier paquete cuyo destino no coincida con ninguna otra ruta más específica en la tabla. La 'S*' indica que es una ruta estática (`S`) y que es una candidata a ser la ruta de último recurso (`*`)."},{"i":"NET-ADM-063","k":"2.2","d":"Avanzado","q":"Los clientes de la VLAN 20 necesitan obtener direcciones IP de un servidor DHCP centralizado que se encuentra en la VLAN 10. Como las peticiones DHCP son broadcasts, no cruzan los límites de la VLAN por sí solas. ¿Qué configuración se necesita en el router o switch de capa 3?","o":["Configurar una ruta estática entre las VLANs.","Configurar la interfaz de la VLAN 20 como un agente de retransmisión DHCP (helper-address).","Crear un enlace troncal entre el router y el servidor DHCP."],"a":1,"h":"Convierte las solicitudes de broadcast DHCP en unicast.","e":"La función de agente de retransmisión DHCP (configurada con el comando `ip helper-address [IP_servidor_DHCP]` en la interfaz de la VLAN cliente) intercepta las solicitudes de broadcast DHCP de los clientes y las reenvía como paquetes unicast directamente a la dirección del servidor DHCP especificado, permitiendo que la comunicación cruce los límites de la red."},{"i":"NET-ADM-064","k":"2.2","d":"Medio","q":"En un enlace troncal entre dos switches, los usuarios de las VLANs 10 y 20 pueden comunicarse sin problemas, pero los de la VLAN 30 no. ¿Cuál es la causa de configuración más probable en el enlace troncal?","o":["STP ha bloqueado la VLAN 30.","La VLAN 30 no existe en la base de datos de VTP.","La VLAN 30 no está en la lista de VLANs permitidas en el enlace troncal."],"a":2,"h":"Por seguridad y gestión, se puede filtrar qué VLANs pueden cruzar un tronco.","e":"Los enlaces troncales pueden ser configurados para permitir solo el paso de VLANs específicas. Si la VLAN 30 no ha sido añadida explícitamente a la lista de VLANs permitidas (usando comandos como `switchport trunk allowed vlan`), su tráfico será descartado en el puerto troncal."},{"i":"NET-ADM-065","k":"2.2","d":"Avanzado","q":"Un administrador quiere una ruta de respaldo que solo se active si la ruta principal, aprendida a través de OSPF, desaparece de la tabla de enrutamiento. ¿Cómo puede configurar esta ruta de respaldo?","o":["Creando una ruta estática con una distancia administrativa mayor a 110.","Creando una segunda ruta OSPF con un costo más alto.","Configurando una ruta estática con una métrica más alta."],"a":0,"h":"La clave es manipular la confiabilidad (AD) de la ruta de respaldo.","e":"Esto se conoce como una 'ruta estática flotante'. Al configurar una ruta estática hacia el mismo destino que la ruta OSPF, pero con una distancia administrativa mayor que la de OSPF (que es 110), por ejemplo, 120, la ruta estática no será instalada en la tabla mientras la ruta OSPF exista. Si la ruta OSPF falla y desaparece, la ruta estática flotante se instalará como la mejor opción de respaldo."},{"i":"NET-ADM-066","k":"2.2","d":"Básico","q":"Un usuario conecta su nueva computadora de escritorio a la red de la oficina, pero no obtiene conexión. El técnico verifica el cable y el puerto del switch, que están correctos. Luego, revisa la parte trasera de la PC y nota que el LED de la tarjeta de red (NIC) está apagado. ¿Qué indica de manera más probable un LED apagado en la NIC?","o":["La tarjeta de red está transmitiendo datos a máxima velocidad.","Hay un conflicto de dirección IP en la red.","No hay enlace físico (conexión eléctrica) entre la NIC y el switch."],"a":2,"h":"El LED de enlace (link) usualmente tiene un color sólido (verde o ámbar) para indicar una conexión física válida.","e":"El LED de enlace en una tarjeta de interfaz de red (NIC) se enciende para indicar que se ha establecido una conexión eléctrica y un enlace físico válido con el dispositivo en el otro extremo del cable (como un switch). Si el LED está apagado, significa que no hay enlace, lo que puede deberse a un cable defectuoso, un puerto de switch deshabilitado o una NIC dañada."},{"i":"NET-ADM-067","k":"2.2","d":"Medio","q":"Una empresa está implementando un sistema de Call Center basado en VoIP. Para garantizar que la calidad de las llamadas no se vea afectada por el tráfico de datos (como descargas grandes o navegación web), el administrador de red necesita priorizar los paquetes de voz sobre todos los demás tipos de tráfico en la red. ¿Qué mecanismo de red debe configurar en los switches y routers?","o":["NAT","SLA","QoS"],"a":2,"h":"Esta tecnología permite clasificar y marcar paquetes para darles un tratamiento preferencial a través de la red.","e":"La Calidad de Servicio (QoS) es un conjunto de tecnologías que gestionan el tráfico de red para reducir la pérdida de paquetes, la latencia y el jitter. Permite a los administradores marcar el tráfico sensible al tiempo, como el de voz (VoIP), para que los equipos de red le den prioridad sobre el tráfico menos sensible, como las transferencias de archivos o el correo electrónico."},{"i":"NET-ADM-068","k":"2.2","d":"Avanzado","q":"Un administrador de red configura un servidor FTP para operar en modo pasivo (PASV). Un cliente externo, que está detrás de un firewall muy restrictivo, intenta conectarse. El cliente logra autenticarse a través del puerto 21, pero la conexión se queda 'colgada' al intentar listar los directorios. ¿Cuál es la causa más probable del problema?","o":["El puerto 20 (canal de datos FTP) no está abierto en el firewall del cliente.","El firewall del cliente está bloqueando el rango de puertos efímeros que el servidor intenta usar para el canal de datos.","El protocolo UDP está completamente bloqueado en el firewall."],"a":1,"h":"En modo pasivo, es el servidor quien le dice al cliente a qué puerto debe conectarse para establecer el canal de datos.","e":"En el modo pasivo de FTP, después de la conexión inicial por el puerto 21, el servidor abre un puerto aleatorio de alto número (efímero) y le indica al cliente que se conecte a él para la transferencia de datos. Si el firewall del cliente no permite conexiones salientes a este rango de puertos no estándar, la conexión del canal de datos fallará, impidiendo la lista de archivos o la transferencia."},{"i":"NET-ADM-069","k":"2.1","d":"Básico","q":"Una empresa está implementando un sistema de telefonía VoIP. Los teléfonos IP necesitan obtener energía directamente a través del cable de red para funcionar, eliminando la necesidad de un adaptador de corriente para cada dispositivo. ¿Qué estándar de IEEE permite que el switch de red proporcione energía eléctrica a través del cableado de par trenzado?","o":["IEEE 802.1Q","IEEE 802.11ac","IEEE 802.3af"],"a":2,"h":"Esta tecnología es conocida como 'Power over Ethernet'.","e":"El estándar IEEE 802.3af, y sus sucesores como 802.3at (PoE+) y 802.3bt (PoE++), define la tecnología Power over Ethernet (PoE). Permite que los cables de red de par trenzado transporten tanto datos como energía eléctrica de bajo voltaje, lo que es ideal para alimentar dispositivos como teléfonos VoIP, cámaras IP y puntos de acceso inalámbricos."},{"i":"NET-ADM-070","k":"2.1","d":"Medio","q":"Durante una auditoría de seguridad, se detecta que un servidor web público tiene el puerto 22 abierto. Un analista junior sugiere cerrarlo inmediatamente para reducir la superficie de ataque. Sin embargo, el administrador senior explica que es esencial para la gestión remota del servidor. ¿Qué protocolo se está utilizando a través de este puerto?","o":["FTP","SSH","Telnet"],"a":1,"h":"Este protocolo proporciona un canal de comunicación seguro y cifrado para administrar sistemas de forma remota en una red no segura.","e":"El puerto 22 es el puerto estándar para el protocolo SSH (Secure Shell). Permite a los administradores acceder de forma segura a la línea de comandos de un servidor remoto para realizar tareas de mantenimiento y gestión. A diferencia de Telnet, todo el tráfico SSH, incluidas las contraseñas, está cifrado."},{"i":"NET-ADM-071","k":"2.2","d":"Medio","q":"Un ingeniero de red en una empresa de manufactura observa que al conectar un nuevo switch redundante, la red se vuelve inestable y se producen tormentas de broadcast. Para solucionar esto, necesita un protocolo que prevenga bucles y asegure una recuperación rápida si un enlace falla. ¿Qué protocolo debería habilitar?","o":["STP","RSTP","OSPF"],"a":1,"h":"Busca la evolución del protocolo original de prevención de bucles, conocido por su velocidad de convergencia mejorada.","e":"RSTP (802.1w) es la opción correcta porque es una mejora de STP (802.1D). Reduce significativamente el tiempo que tarda la red en converger después de un cambio en la topología, pasando de minutos a segundos, lo cual es crucial para minimizar el tiempo de inactividad."},{"i":"NET-ADM-072","k":"2.2","d":"Básico","q":"Un administrador junior necesita acceder a la consola de un router Cisco de forma remota para aplicar una nueva configuración. La política de seguridad de la empresa es estricta y prohíbe el envío de credenciales en texto plano a través de la red. ¿Qué protocolo debe utilizar para cumplir con la política?","o":["Telnet","SSH","HTTP"],"a":1,"h":"La 'S' en el nombre de uno de estos protocolos significa 'Seguro'.","e":"SSH es el estándar de la industria para la administración remota segura porque cifra toda la sesión, incluyendo la autenticación y los comandos ejecutados, evitando que la información sensible sea interceptada."},{"i":"NET-ADM-073","k":"2.2","d":"Básico","q":"Un empleado de la oficina llama a soporte técnico indicando que 'no tiene internet'. El técnico necesita realizar una primera verificación en la máquina con Windows del empleado para ver si ha recibido correctamente una dirección IP del servidor DHCP. ¿Qué comando es el más rápido y directo para obtener esta información?","o":["ping 8.8.8.8","tracert www.google.com","ipconfig"],"a":2,"h":"Este comando te da la 'configuración de IP' de tu máquina.","e":"El comando `ipconfig` es fundamental en la resolución de problemas de red en Windows, ya que proporciona de manera instantánea la información esencial sobre la configuración IP de la máquina, permitiendo verificar si la comunicación con el servidor DHCP fue exitosa."},{"i":"NET-ADM-074","k":"2.2","d":"Medio","q":"Un administrador de sistemas está desplegando un nuevo servidor web en un entorno Linux. Se le ha pedido que capture y analice en tiempo real todo el tráfico HTTP (puerto 80) que llega a la interfaz de red 'eth1' para diagnosticar un problema con las peticiones de un cliente. ¿Qué comando debería utilizar para esta tarea?","o":["whois example.com","dig -x 8.8.8.8","tcpdump -i eth1 'port 80'"],"a":2,"h":"Esta herramienta es como un 'vertedero' de paquetes TCP para análisis.","e":"tcpdump es la herramienta estándar en sistemas Linux para la captura de paquetes. La sintaxis `tcpdump -i eth1 'port 80'` le indica a la herramienta que escuche en la interfaz `eth1` y capture únicamente los paquetes cuyo puerto de origen o destino sea el 80. whois y dig -x no capturan tráfico, solo consultan información de dominio o DNS inverso."},{"i":"NET-ADM-075","k":"2.2","d":"Avanzado","q":"Un servidor de aplicaciones en Windows parece estar bajo un ataque de denegación de servicio. El administrador observa una cantidad anormalmente alta de conexiones a medio abrir (SYN_RCVD). Necesita obtener una lista de todas las conexiones activas, los puertos en escucha y el ejecutable asociado a cada conexión para identificar el proceso afectado. ¿Qué comando proporciona toda esta información?","o":["netstat -a","arp -a","netstat -anb"],"a":2,"h":"Necesitas combinar varios flags del mismo comando para ver puertos, números y el binario responsable.","e":"El comando `netstat` es muy versátil. El parámetro `-a` muestra todas las conexiones, `-n` evita la resolución de nombres (lo que lo hace más rápido) y el parámetro clave `-b` (que requiere privilegios de administrador) muestra el nombre del ejecutable que creó la conexión, siendo crucial para identificar qué aplicación está recibiendo el ataque."},{"i":"NET-ADM-076","k":"2.2","d":"Medio","q":"Un cliente se queja de que su sitio web 'miempresa.com' no es accesible desde el exterior, aunque internamente funciona. El administrador sospecha que el problema podría estar en los registros DNS públicos. ¿Qué comando en un sistema Linux le permitiría consultar específicamente los registros DNS para 'miempresa.com' desde un servidor DNS público como 8.8.8.8?","o":["ping miempresa.com","whois miempresa.com","dig @8.8.8.8 miempresa.com"],"a":2,"h":"Esta herramienta de consulta DNS es conocida por su flexibilidad y es la sucesora de `nslookup` en entornos *nix.","e":"Dig (Domain Information Groper) es una herramienta de línea de comandos muy potente para realizar consultas DNS. La sintaxis `dig @<servidor_dns> <dominio>` ofrece un control granular para diagnosticar problemas de resolución de nombres. ping solo verifica conectividad y whois muestra información del registro de dominio, no de los registros DNS."},{"i":"NET-ADM-077","k":"2.2","d":"Avanzado","q":"Un ingeniero de redes está diagnosticando una conectividad lenta y con pérdida de paquetes entre dos sucursales conectadas por una WAN. El comando 'tracert' le muestra la ruta, pero necesita una herramienta más robusta que también le informe del porcentaje de pérdida de paquetes en cada salto intermedio para identificar el enrutador problemático. ¿Qué comando de Windows debería utilizar?","o":["ping -t -l 1500 server_remoto","pathping server_remoto","route print"],"a":1,"h":"Busca un comando que sea una combinación de 'ping' y 'path' (ruta).","e":"Pathping es una herramienta de diagnóstico de red de Windows que combina la funcionalidad de `ping` y `tracert`. Proporciona un análisis mucho más detallado al calcular estadísticas de pérdida de paquetes en cada enrutador a lo largo de la ruta."},{"i":"NET-ADM-078","k":"2.2","d":"Medio","q":"Un técnico necesita verificar la dirección física (MAC) de la tarjeta de red de un equipo Windows para registrarla en el filtro MAC de un punto de acceso inalámbrico. Quiere un comando que le muestre únicamente esta información de la forma más limpia posible. ¿Cuál es el comando más directo?","o":["ipconfig /all","arp -a","getmac"],"a":2,"h":"El nombre del comando describe exactamente la acción: 'obtener la MAC'.","e":"Mientras que `ipconfig /all` puede proporcionar la dirección MAC, el comando `getmac` es más específico y ofrece una salida mucho más limpia y directa, lo que lo hace ideal para scripts o cuando solo se necesita ese dato en particular. arp -a muestra las direcciones MAC de otros dispositivos en la red local, no la del propio equipo."},{"i":"NET-ADM-079","k":"2.2","d":"Medio","q":"Una empresa está migrando su infraestructura de telefonía. El proveedor les pregunta si necesitarán conectar su nuevo sistema de VoIP a la red telefónica tradicional para poder realizar y recibir llamadas desde y hacia teléfonos fijos. ¿A qué red se refieren?","o":["Private Automatic Branch Exchange (PABX)","Public Switched Telephone Network (PSTN)","Internet Relay Chat (IRC)"],"a":1,"h":"Es el acrónimo de la infraestructura global de redes de telecomunicaciones de voz de conmutación de circuitos.","e":"La PSTN (Red Telefónica Pública Conmutada) es el término que describe la red telefónica clásica. Para que un sistema de telefonía IP (VoIP) pueda comunicarse con teléfonos no-IP, necesita una pasarela (gateway) que lo interconecte con la PSTN."},{"i":"NET-ADM-080","k":"2.2","d":"Avanzado","q":"Un administrador de red ha configurado un firewall de Windows para bloquear cierto tráfico, pero sospecha que una regla no está funcionando. Necesita una forma de ver la configuración detallada de una regla específica del firewall desde la línea de comandos. ¿Qué comando utilizaría?","o":["netstat -b","ipconfig /displaydns","netsh advfirewall firewall show rule name=\"Mi Regla\""],"a":2,"h":"Busca la utilidad de scripting de red de Windows y su contexto para el firewall avanzado.","e":"El comando `netsh` (Network Shell) es una utilidad poderosa en Windows para la administración de la red desde la línea de comandos. El contexto `advfirewall` permite una gestión completa del Firewall de Windows con Seguridad Avanzada. Los otros comandos (netstat -b o ipconfig /displaydns) no tienen relación con el firewall."},{"i":"NET-ADM-081","k":"2.2","d":"Avanzado","q":"En una red conmutada, un puerto de un switch entra repetidamente en estado 'err-disabled'. El administrador confirma que la seguridad de puerto está habilitada. ¿Cuál de las siguientes situaciones NO sería una causa probable de este problema?","o":["Un empleado conectó un hub no autorizado al puerto y luego conectó varios dispositivos.","Un atacante está intentando un ataque de inundación de MAC (MAC flooding).","El servidor DHCP de la red se ha quedado sin direcciones IP disponibles."],"a":2,"h":"El problema se describe como una violación de la dirección MAC, que es un concepto de Capa 2. Busca la opción que describe un problema de Capa 3.","e":"La seguridad de puerto (Port Security) es una característica de Capa 2 que funciona basándose en las direcciones MAC. El agotamiento de direcciones DHCP es un problema de Capa 3 y no provocaría una violación de seguridad de direcciones MAC en un puerto de switch."},{"i":"NET-ADM-082","k":"2.2","d":"Medio","q":"Un administrador necesita borrar la entrada de un dispositivo específico de la caché ARP de una máquina Windows porque sospecha que la entrada es incorrecta. Si la IP del dispositivo es 192.168.1.101, ¿qué comando debería ejecutar?","o":["arp -a 192.168.1.101","arp -s 192.168.1.101 00-11-22-33-44-55","arp -d 192.168.1.101"],"a":2,"h":"Busca el parámetro que corresponde a la acción de 'eliminar' (delete).","e":"El comando `arp -d <dirección_ip>` permite eliminar manualmente una entrada de la tabla ARP. Esto es útil cuando se sospecha que la tabla contiene información obsoleta o incorrecta."},{"i":"NET-ADM-083","k":"2.2","d":"Medio","q":"Un técnico está configurando un nuevo router en una pequeña oficina. Necesita asegurarse de que todo el tráfico de la red interna que no tenga un destino específico sea enviado al proveedor de servicios de internet (ISP) en 203.0.113.1. ¿Qué tipo de ruta necesita configurar?","o":["Una ruta estática específica para cada sitio web popular.","Una ruta estática por defecto (de último recurso).","Una ruta dinámica aprendida a través de OSPF."],"a":1,"h":"Piensa en la ruta que un router utiliza cuando no tiene otra entrada más específica en su tabla para un destino.","e":"Una ruta estática por defecto, comúnmente configurada como `ip route 0.0.0.0 0.0.0.0 <IP_del_siguiente_salto>`, es fundamental en redes perimetrales. Le dice al router: 'Si no sabes a dónde enviar un paquete, envíalo a esta dirección'."},{"i":"NET-ADM-084","k":"2.2","d":"Básico","q":"Una startup está instalando su primera oficina y necesita un sistema telefónico interno que permita a los empleados hacer llamadas entre extensiones sin usar líneas telefónicas externas y compartir un número limitado de líneas externas para llamadas fuera de la oficina. ¿Qué tipo de sistema satisface mejor estas necesidades?","o":["Public Switched Telephone Network (PSTN)","Un servidor de Internet Relay Chat (IRC)","Private Automatic Branch Exchange (PABX)"],"a":2,"h":"Busca el término que describe una central telefónica privada y automatizada para una organización.","e":"Una PABX (o PBX) es una central telefónica privada que gestiona las llamadas entrantes y salientes de una empresa. Permite la comunicación interna gratuita entre extensiones y optimiza el uso de las líneas telefónicas externas, funcionando como el núcleo del sistema telefónico de la organización."},{"i":"NET-ADM-085","k":"2.2","d":"Básico","q":"Un grupo de desarrolladores de software de código abierto, distribuidos por todo el mundo, necesita una plataforma de comunicación basada en texto y en tiempo real para discutir cambios en el código y coordinar sus esfuerzos. Prefieren una solución clásica, basada en canales temáticos (por ejemplo, #desarrollo, #bugs) que no dependa de una empresa central. ¿Qué tecnología se alinea con estos requisitos?","o":["Secure Shell (SSH)","Internet Relay Chat (IRC)","Telnet"],"a":1,"h":"Este protocolo de comunicación fue uno de los precursores de las aplicaciones de mensajería instantánea modernas y es conocido por su estructura de servidores, canales y comandos de texto.","e":"IRC es un protocolo de comunicación en tiempo real basado en texto que permite a los usuarios unirse a canales (salas de chat) para discutir temas específicos. Su naturaleza descentralizada y su simplicidad lo han mantenido como una herramienta popular en comunidades técnicas y de código abierto durante décadas."},{"i":"NET-ADM-086","k":"2.2","d":"Medio","q":"Una empresa acaba de implementar un sistema de telefonía VoIP, pero los usuarios se quejan de que la calidad del audio es mala, con cortes y eco, especialmente durante las horas de mayor tráfico en la red. El administrador de red necesita asegurar que los paquetes de voz tengan preferencia sobre otro tipo de tráfico, como las descargas de archivos grandes. ¿Qué mecanismo debe configurar en los routers y switches?","o":["Aumentar el ancho de banda de la conexión a internet.","Configurar Calidad de Servicio (QoS) para marcar y priorizar el tráfico de voz.","Separar el tráfico de voz en su propia VLAN."],"a":1,"h":"Este mecanismo actúa como un 'carril rápido' para el tráfico sensible a la latencia, como la voz.","e":"La Calidad de Servicio (QoS) permite a los administradores de red gestionar el tráfico para reducir la pérdida de paquetes, la latencia y el jitter. Al marcar los paquetes de voz (usualmente con DSCP o CoS), los equipos de red pueden darles prioridad, asegurando una comunicación fluida incluso cuando la red está congestionada. Aumentar el ancho de banda no garantiza prioridad, y una VLAN de voz mejora segmentación, pero no priorización."},{"i":"NET-ADM-087","k":"2.2","d":"Avanzado","q":"Un ingeniero está intentando integrar un nuevo sistema de centralita IP-PBX con un servicio de troncales de un proveedor externo para realizar llamadas a la red pública. El proveedor le ha entregado las credenciales y la dirección de su servidor. ¿Qué protocolo, estándar de la industria, es el más probable que el ingeniero necesite configurar en la IP-PBX para registrarse con el proveedor y gestionar las sesiones de llamada?","o":["H.323","MGCP (Media Gateway Control Protocol)","SIP (Session Initiation Protocol)"],"a":2,"h":"Es el protocolo de señalización más utilizado en la telefonía IP moderna, similar a HTTP en su sintaxis basada en texto.","e":"SIP es el protocolo de señalización predominante para VoIP. Se encarga de crear, modificar y terminar sesiones, incluyendo llamadas de voz y video. Es el estándar de facto para la interconexión entre sistemas de VoIP y proveedores de servicios de telefonía por internet (ITSP). H.323 es más antiguo y menos común hoy en día.MGCP se usa más en arquitecturas donde los gateways son controlados por un Call Agent, no en IP-PBX autónomas."},{"i":"NET-ADM-088","k":"2.2","d":"Medio","q":"El gerente de una oficina se queja de que están recibiendo un gran volumen de llamadas automáticas no deseadas (robocalls) a través de su sistema VoIP, las cuales son claramente spam. El administrador de seguridad necesita identificar este tipo de amenaza para buscar una solución. ¿Cómo se conoce específicamente a este tipo de ataque en el mundo de la telefonía por internet?","o":["Vishing (Voice Phishing)","SPIT","Ataque de denegación de servicio (DoS)"],"a":1,"h":"Es el equivalente del spam en el correo electrónico, pero adaptado a la telefonía por IP.","e":"SPIT (Spam over Internet Telephony) es el término utilizado para describir el envío de mensajes de voz masivos y no solicitados a través de sistemas de VoIP. Al igual que el spam de correo electrónico, su objetivo suele ser publicitario o malicioso y puede congestionar los sistemas de comunicación de una empresa."},{"i":"NET-SEC-001","k":"2.3","d":"Básico","q":"El principio de la tríada CIA que se violenta cuando un atacante modifica datos es…","o":["Confidencialidad","Integridad","Disponibilidad"],"a":1,"h":"Alteración del contenido","e":"Integridad = exactitud/consistencia; modificación no autorizada la rompe."},{"i":"NET-SEC-002","k":"2.3","d":"Medio","q":"Para inspección profunda de paquetes y políticas por aplicación, ¿qué equipo es más adecuado?","o":["Switch L2","NGFW","Hub"],"a":1,"h":"Firewall de nueva generación","e":"Los NGFW realizan DPI, control de aplicaciones y funciones UTM."},{"i":"NET-SEC-003","k":"2.3","d":"Medio","q":"AES-256 es un cifrado…","o":["Simétrico por bloques","Asimétrico (clave pública)","Hash criptográfico"],"a":0,"h":"Clave compartida","e":"AES es simétrico por bloques (tamaños de clave comunes 128/192/256)."},{"i":"NET-SEC-004","k":"2.3","d":"Medio","q":"Un auditor de seguridad descubre que un empleado no autorizado pudo acceder a informes financieros confidenciales. El empleado no modificó los datos, pero se confirma la visualización. ¿Qué principio de la tríada de la seguridad (CID) fue principalmente vulnerado?","o":["Confidencialidad","Integridad","Disponibilidad"],"a":0,"h":"Acceso no autorizado a la información.","e":"La confidencialidad se enfoca en prevenir la divulgación no autorizada de información sensible."},{"i":"NET-SEC-005","k":"2.3","d":"Medio","q":"El servidor web de una empresa de comercio electrónico deja de responder debido a una avalancha de solicitudes de conexión simultáneas provenientes de miles de equipos a nivel mundial. ¿Qué tipo de ataque es más probable que esté ocurriendo?","o":["Phishing","Man-in-the-Middle","DDoS"],"a":2,"h":"El ataque se origina desde múltiples fuentes para agotar los recursos del objetivo.","e":"Un ataque DDoS utiliza una red de bots (botnet) para sobrecargar un servicio con tráfico, haciéndolo inaccesible para los usuarios legítimos."},{"i":"NET-SEC-006","k":"2.3","d":"Básico","q":"Un ingeniero de redes está instalando un nuevo switch Cisco sacado directamente de la caja. ¿Cuál es una de las primeras y más críticas acciones de 'hardening' que debe realizar?","o":["Configurar Port Security en todos los puertos","Cambiar las credenciales de administrador por defecto","Implementar DHCP Snooping"],"a":1,"h":"Los fabricantes usan credenciales genéricas conocidas.","e":"Las contraseñas y nombres de usuario por defecto son públicamente conocidos y representan un riesgo de seguridad inmediato si no se cambian."},{"i":"NET-SEC-007","k":"2.3","d":"Medio","q":"En una empresa, se necesita impedir que la red de 'Invitados' (192.168.10.0/24) pueda acceder a los servidores de la red 'Corporativa' (10.0.20.0/24) utilizando el protocolo RDP (puerto 3389). ¿Qué tipo de ACL es la más adecuada para esta tarea?","o":["ACL Estándar","ACL Extendida","ACL Dinámica"],"a":1,"h":"Se necesita filtrar por origen, destino y número de puerto.","e":"Las ACL extendidas permiten un filtrado granular, especificando direcciones IP de origen y destino, así como protocolos y puertos."},{"i":"NET-SEC-008","k":"2.3","d":"Avanzado","q":"El departamento de TI de una compañía quiere bloquear el uso de aplicaciones específicas de P2P, como BitTorrent, sin importar el puerto que utilicen. ¿Qué dispositivo de seguridad de red es el más indicado para cumplir este requisito?","o":["Un router con ACLs extendidas","Un switch de Capa 3","Un Firewall de Nueva Generación (NGFW)"],"a":2,"h":"Este dispositivo puede identificar el tráfico a nivel de aplicación (Capa 7).","e":"Los NGFW realizan inspección profunda de paquetes (DPI) para identificar y controlar aplicaciones específicas, independientemente de los puertos que usen."},{"i":"NET-SEC-009","k":"2.3","d":"Medio","q":"Un empleado necesita conectarse de forma segura a la red de la oficina desde su casa para acceder a los recursos internos. La empresa busca una solución flexible que funcione a través de navegadores web. ¿Qué tipo de VPN y protocolo serían los más adecuados?","o":["VPN de sitio a sitio con IPsec","VPN de acceso remoto con SSL/TLS","VPN MPLS de capa 2"],"a":1,"h":"Esta solución es ideal para usuarios individuales y a menudo no requiere software cliente.","e":"Una VPN de acceso remoto con SSL/TLS (a menudo llamada 'clientless VPN') es perfecta para que usuarios individuales se conecten de forma segura, a veces directamente desde un portal web."},{"i":"NET-SEC-010","k":"2.3","d":"Medio","q":"Una corporación desea implementar la máxima seguridad para su red Wi-Fi, requiriendo que cada empleado se autentique con sus propias credenciales de dominio (usuario y contraseña). ¿Qué método de autenticación inalámbrica debería implementar?","o":["WPA2-PSK","WEP","WPA3-Enterprise (802.1X)"],"a":2,"h":"Este método utiliza un servidor de autenticación centralizado, como RADIUS.","e":"El modo Enterprise (802.1X) utiliza un servidor RADIUS para autenticar a cada usuario individualmente, proporcionando mayor seguridad y control que una clave pre-compartida (PSK)."},{"i":"NET-SEC-011","k":"2.3","d":"Básico","q":"Un técnico observa que un dispositivo desconocido ha sido conectado a un puerto de red en un área común. Para evitar que dispositivos no autorizados obtengan acceso a la red a través de ese puerto, ¿qué característica de seguridad del switch debería habilitar?","o":["ACL estándar","Port Security","ARP Inspection"],"a":1,"h":"Esta función limita el número de direcciones MAC permitidas en un puerto.","e":"Port Security permite especificar qué direcciones MAC pueden conectarse a un puerto de switch o limitar la cantidad de MACs, evitando conexiones no autorizadas."},{"i":"NET-SEC-012","k":"2.3","d":"Medio","q":"Una empresa ha instalado un sistema de seguridad que no solo detecta el tráfico malicioso basándose en firmas de ataques conocidas, sino que también toma medidas activas para bloquear dicho tráfico en tiempo real. ¿Cómo se clasifica este sistema?","o":["Sistema de Detección de Intrusos (IDS)","Sistema de Prevención de Intrusos (IPS)","Firewall de Capa 4"],"a":1,"h":"La diferencia clave está en
