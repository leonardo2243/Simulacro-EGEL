<style>
/* Concepto: hoja de respuestas óptica. Opciones como burbujas A/B/C, tinta azul sobre papel gris frío. */
:root{
  --bg:#e9edf2; --surface:#ffffff; --ink:#142038; --muted:#5a667c; --line:#cdd5e0;
  --accent:#2b4bdb; --accent-ink:#ffffff; --accent-soft:#e3e9ff;
  --good:#12805c; --good-soft:#dff3ea; --bad:#c0392b; --bad-soft:#fbe4e0;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1524; --surface:#162036; --ink:#e6ebf5; --muted:#9aa7bf; --line:#2a3752;
  --accent:#7d97ff; --accent-ink:#0e1524; --accent-soft:#232f57;
  --good:#4fd1a1; --good-soft:#12342a; --bad:#ff8a7a; --bad-soft:#3d1f1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1524; --surface:#162036; --ink:#e6ebf5; --muted:#9aa7bf; --line:#2a3752;
  --accent:#7d97ff; --accent-ink:#0e1524; --accent-soft:#232f57;
  --good:#4fd1a1; --good-soft:#12342a; --bad:#ff8a7a; --bad-soft:#3d1f1b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--f-body);padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:760px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:2rem;font-weight:700;letter-spacing:.01em}
h2{font-size:1.35rem;font-weight:700}
.eyebrow,.lbl{font:500 .72rem var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.btn{font:600 .95rem var(--f-body);border:1px solid var(--ink);background:transparent;color:var(--ink);padding:10px 16px;border-radius:4px;cursor:pointer;min-height:44px}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.small{min-height:36px;padding:6px 12px;font-size:.85rem}
.btn:focus-visible,.opt:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat b{font:500 1.5rem var(--f-mono);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
select{font:400 1rem var(--f-body);padding:10px;border:1px solid var(--ink);border-radius:4px;background:var(--surface);color:var(--ink);min-height:44px;width:100%}
.check{display:flex;gap:10px;align-items:center;font-size:.95rem}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font:500 .72rem var(--f-mono);letter-spacing:.05em;border:1px solid var(--line);border-radius:3px;padding:2px 8px;color:var(--muted)}
.tag.gen{border-color:var(--accent);color:var(--accent)}
.tag.ok{border-color:var(--good);color:var(--good)}
.tag.bad{border-color:var(--bad);color:var(--bad)}
hr{border:0;border-top:1px solid var(--line);margin:0;width:100%}
.stim{font:400 .88rem/1.5 var(--f-mono);background:var(--bg);border-left:3px solid var(--accent);padding:10px 12px;overflow-wrap:anywhere}
.qtext{font-size:1.1rem;line-height:1.5;margin:0;max-width:65ch;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:12px 14px;cursor:pointer;font:400 1rem/1.45 var(--f-body);min-height:52px}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.bub{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font:500 .8rem var(--f-mono)}
.opt .t{padding-top:3px;min-width:0;overflow-wrap:anywhere}
.opt.sel .bub{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.ok .bub{background:var(--good);border-color:var(--good);color:var(--surface)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .bub{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.fb{border-radius:4px;padding:12px 14px;font-size:.95rem;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--good-soft);border:1px solid var(--good)}
.fb.no{background:var(--bad-soft);border:1px solid var(--bad)}
.hint{font-size:.9rem;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:8px 12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.score{font:700 3.2rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:500 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.mini{height:6px;background:var(--line);border-radius:3px;min-width:80px}
.mini i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.rev{border:1px solid var(--line);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:6px}
.note{font-size:.88rem;color:var(--muted);margin:0}
.warn{background:var(--accent-soft);border:1px solid var(--accent);border-radius:4px;padding:10px 12px;font-size:.92rem}
@media (max-width:480px){h1{font-size:1.6rem}.stats{grid-template-columns:1fr 1fr 1fr}.stat b{font-size:1.2rem}.card{padding:16px}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>

<script>(function(){var B={"subareas":[{"key":"1.1","area":"Área 1 · Implementación de hardware","subarea":"Circuitos eléctricos y electrónica","goal":11},{"key":"1.2","area":"Área 1 · Implementación de hardware","subarea":"Arquitectura de computadoras y su organización","goal":11},{"key":"1.3","area":"Área 1 · Implementación de hardware","subarea":"Sistemas embebidos","goal":13},{"key":"1.4","area":"Área 1 · Implementación de hardware","subarea":"Automatización y control de procesos","goal":14},{"key":"2.1","area":"Área 2 · Implementación de redes de computadoras","subarea":"Diseño de redes","goal":11},{"key":"2.2","area":"Área 2 · Implementación de redes de computadoras","subarea":"Administración de redes","goal":13},{"key":"2.3","area":"Área 2 · Implementación de redes de computadoras","subarea":"Seguridad y evaluación en redes","goal":17},{"key":"3.1","area":"Área 3 · Desarrollo de software","subarea":"Ingeniería de software","goal":16},{"key":"3.2","area":"Área 3 · Desarrollo de software","subarea":"Programación y software base","goal":13},{"key":"3.3","area":"Área 3 · Desarrollo de software","subarea":"Manejo de datos y algoritmos","goal":21}],"bank":[{"i":"HW-CE-001","k":"1.1","d":"Medio","q":"Un técnico mide un resistor en un circuito y la lectura de voltaje es de 9V mientras que la de corriente es de 3mA. Si el código de colores del resistor indica que debería tener un valor de 2 kΩ, ¿cuál es la conclusión más probable?","o":["El resistor está funcionando correctamente, ya que la potencia disipada es baja.","El resistor está dañado o es incorrecto, ya que su resistencia real es de 3 kΩ.","El instrumento de medición de corriente está descalibrado."],"a":1,"h":"Aplica la Ley de Ohm (V=I*R) con los valores medidos y compara el resultado con el valor esperado del componente.","e":"Según la Ley de Ohm, la resistencia real del componente es R = V / I = 9V / 0.003A = 3000 Ω, es decir, 3 kΩ. Este valor no corresponde al valor de 2 kΩ indicado por su código de colores, lo que sugiere que el componente es incorrecto para esa posición o está dañado."},{"i":"HW-CE-002","k":"1.1","d":"Medio","q":"En un nodo de un circuito de control, un ingeniero observa que entran dos corrientes: I1 = 5A e I2 = 2A. Si del mismo nodo salen tres corrientes (I3, I4, I5) y se mide que I3 es de 3A y I4 es de 1.5A, ¿qué valor debe tener I5 según la LCK?","o":["2.5 A","3.5 A","No se puede determinar sin conocer los voltajes."],"a":0,"h":"La Ley de Corrientes de Kirchhoff (LCK) establece que la suma de las corrientes que entran a un nodo es igual a la suma de las corrientes que salen.","e":"Aplicando la LCK: Corrientes de entrada = Corrientes de salida. Por lo tanto, I1 + I2 = I3 + I4 + I5. Sustituyendo los valores conocidos: 5A + 2A = 3A + 1.5A + I5. Esto nos da 7A = 4.5A + I5. Despejando I5, obtenemos I5 = 2.5A."},{"i":"HW-CE-003","k":"1.1","d":"Medio","q":"Se necesita diseñar un atenuador de señal simple usando un divisor de voltaje. Si la fuente es de 12V y se requiere una salida de 4.5V, y se dispone de una resistencia R1 de 10 kΩ conectada a la fuente, ¿qué valor debe tener la resistencia R2 conectada a tierra?","o":["10 kΩ","16.6 kΩ","6 kΩ"],"a":2,"h":"La fórmula del divisor de voltaje es Vout = Vin * (R2 / (R1 + R2)). Despeja R2.","e":"Usando la fórmula del divisor de voltaje: 4.5V = 12V * (R2 / (10kΩ + R2)). Despejando, 4.5/12 = R2 / (10kΩ + R2), lo que da 0.375 = R2 / (10kΩ + R2). Entonces, 0.375 * (10kΩ + R2) = R2. Resolviendo la ecuación: 3.75kΩ + 0.375*R2 = R2, por lo que 3.75kΩ = 0.625*R2. Finalmente, R2 = 3.75kΩ / 0.625 = 6 kΩ."},{"i":"HW-CE-004","k":"1.1","d":"Medio","q":"En una placa de circuito impreso, se utiliza un diodo Zener con un voltaje nominal de 5.1V para regular la alimentación de un microcontrolador. Si la fuente de entrada varía entre 8V y 12V, ¿cuál es la función principal del Zener en esta configuración?","o":["Amplificar la corriente de entrada para el microcontrolador.","Mantener un voltaje constante de 5.1V en sus terminales, a pesar de las variaciones de la fuente.","Bloquear completamente el flujo de corriente si el voltaje de entrada supera los 12V."],"a":1,"h":"El diodo Zener está diseñado para operar en la región de ruptura inversa.","e":"La característica principal de un diodo Zener es que, cuando se polariza inversamente, mantiene un voltaje casi constante a través de él (su voltaje Zener) una vez que se alcanza la región de ruptura. En este caso, estabiliza el voltaje de entrada variable a un valor fijo de 5.1V para alimentar de forma segura el microcontrolador."},{"i":"HW-CE-005","k":"1.1","d":"Medio","q":"Se diseña un circuito de control de iluminación con un transistor BJT (NPN) que activa un relé de 12V. Para que el relé se active, el transistor debe entrar en saturación. ¿Qué condición se debe cumplir en los terminales del transistor?","o":["La corriente de base debe ser cero para permitir el máximo flujo de colector a emisor.","El voltaje colector-emisor (Vce) debe ser máximo, cercano al voltaje de la fuente.","Se debe inyectar una corriente de base suficiente para que el voltaje colector-emisor (Vce) sea mínimo (cercano a 0V)."],"a":2,"h":"La saturación en un BJT se asemeja a un interruptor cerrado.","e":"Para que un transistor BJT funcione como un interruptor cerrado (estado de saturación), se debe aplicar una corriente de base lo suficientemente grande. Esto provoca que la unión colector-emisor tenga una resistencia muy baja, resultando en una caída de voltaje (Vce) mínima, cercana a 0V, permitiendo que la máxima corriente fluya a través del relé para activarlo."},{"i":"HW-CE-006","k":"1.1","d":"Medio","q":"Un dispositivo de 240W está conectado a una toma de corriente doméstica de 120V (CA). Un fusible en el circuito está clasificado para 1.5A. ¿Qué ocurrirá al encender el dispositivo?","o":["El dispositivo funcionará normalmente.","El fusible se quemará inmediatamente.","El dispositivo funcionará pero con una potencia reducida."],"a":1,"h":"Calcula la corriente que consumirá el dispositivo usando la fórmula de la potencia (P=V*I) y compárala con la capacidad del fusible.","e":"La corriente que el dispositivo requiere es I = P / V = 240W / 120V = 2A. Dado que la corriente requerida (2A) es mayor que la corriente nominal del fusible (1.5A), el fusible se fundirá (quemará) para proteger el circuito tan pronto como se encienda el dispositivo."},{"i":"HW-CE-007","k":"1.1","d":"Medio","q":"Un ingeniero analiza una malla cerrada en un circuito y mide las siguientes caídas de voltaje: una fuente de 15V, y caídas en tres resistores, V_R1 = 5V, V_R2 = 7V. ¿Cuál debe ser la caída de voltaje en el tercer resistor (V_R3) para cumplir la LVK?","o":["12V","3V","No se puede determinar sin conocer el valor de las resistencias."],"a":1,"h":"La Ley de Voltajes de Kirchhoff (LVK) establece que la suma de todas las caídas de voltaje en una malla cerrada es igual a la suma de las subidas de voltaje (fuentes).","e":"Según la LVK, la suma de las caídas de tensión en los resistores debe ser igual al voltaje de la fuente. Por lo tanto: V_fuente = V_R1 + V_R2 + V_R3. Sustituyendo: 15V = 5V + 7V + V_R3. Resolviendo para V_R3: 15V = 12V + V_R3, lo que da V_R3 = 3V."},{"i":"HW-CE-008","k":"1.1","d":"Medio","q":"Un circuito tiene tres resistores en paralelo: R1=100Ω, R2=200Ω y R3=50Ω. Si la corriente total que ingresa a esta configuración es de 7A, ¿cuál es la caída de voltaje a través del conjunto de resistores?","o":["700 V","No se puede calcular sin el voltaje de la fuente.","200 V"],"a":2,"h":"Primero, calcula la resistencia equivalente total para una configuración en paralelo. Luego, usa la Ley de Ohm con la corriente total.","e":"La resistencia equivalente (Req) para resistores en paralelo se calcula como 1/Req = 1/R1 + 1/R2 + 1/R3. 1/Req = 1/100 + 1/200 + 1/50 = (2+1+4)/200 = 7/200 Ω⁻¹. Por lo tanto, Req = 200/7 Ω. Usando la Ley de Ohm, el voltaje es el mismo para todos los componentes en paralelo: V = I_total * Req = 7A * (200/7 Ω) = 200V."},{"i":"HW-CE-009","k":"1.1","d":"Medio","q":"Un ingeniero necesita que un circuito se active solo cuando el voltaje de entrada supere los 15V. Para ello, utiliza un circuito comparador, pero necesita una referencia de voltaje estable y precisa. ¿Qué componente es el más indicado para generar esta referencia de 15V a partir de una fuente de 24V?","o":["Un divisor de voltaje con dos resistencias de igual valor.","Un diodo rectificador en serie para reducir el voltaje.","Un diodo Zener con un voltaje Zener nominal de ese voltaje."],"a":2,"h":"La referencia debe ser estable incluso si la fuente de 24V fluctúa ligeramente. ¿Qué componente está diseñado para mantener un voltaje constante?","e":"Mientras que un divisor de voltaje podría generar 15V, sería susceptible a variaciones en la fuente de 24V y a cambios en la carga. Un diodo Zener de 15V, polarizado inversamente y con una resistencia limitadora adecuada, proporcionará una referencia de voltaje mucho más estable y confiable, ideal para un circuito comparador."},{"i":"HW-CE-010","k":"1.1","d":"Medio","q":"Se tiene un circuito divisor de corriente con una fuente de 1A que se divide entre dos ramas. La primera rama tiene una resistencia de 10 Ω. Si se desea que solo 0.2A fluyan por la segunda rama, ¿qué resistencia debe tener esta segunda rama?","o":["40 Ω","2.5 Ω","La corriente no depende de la resistencia en un divisor de corriente."],"a":0,"h":"En un divisor de corriente, la corriente se divide inversamente proporcional a la resistencia de las ramas. La rama con menos corriente debe tener más resistencia.","e":"Si la corriente total es 1A y 0.2A van por la segunda rama (R2), entonces por la primera rama (R1 = 10Ω) deben pasar 1A - 0.2A = 0.8A. Como ambas ramas están en paralelo, la caída de voltaje a través de ellas es la misma: V = I1 * R1 = I2 * R2. Por lo tanto, (0.8A) * (10Ω) = (0.2A) * R2. Resolviendo: 8V = 0.2 * R2, lo que nos da R2 = 8 / 0.2 = 40 Ω."},{"i":"HW-CE-011","k":"1.1","d":"Medio","q":"Un puente rectificador de onda completa convierte una señal de CA de 60Hz en CD pulsante. ¿Cuál será la frecuencia del componente principal de rizado (ripple) en la salida de CD no filtrada?","o":["60 Hz","120 Hz","30 Hz"],"a":1,"h":"Un rectificador de onda completa aprovecha tanto el semiciclo positivo como el negativo de la onda de CA.","e":"En un rectificador de onda completa, tanto el semiciclo positivo como el negativo de la entrada de CA se convierten en picos positivos en la salida. Esto significa que por cada ciclo completo de la entrada (a 60 Hz), se producen dos picos (o pulsos) en la salida. Por lo tanto, la frecuencia fundamental del rizado de la salida es el doble de la frecuencia de entrada: 2 * 60 Hz = 120 Hz."},{"i":"HW-CE-012","k":"1.1","d":"Básico","q":"Un resistor de 200 Ω en serie con uno de 300 Ω se conecta a 25 V. ¿Cuál es la corriente del circuito?","o":["0.05 A","0.083 A","0.125 A"],"a":0,"h":"Usa la ley de Ohm con R_total = R1 + R2","e":"R_total = 200 + 300 = 500 Ω. I = V/R = 25/500 = 0.05 A."},{"i":"HW-CE-013","k":"1.1","d":"Medio","q":"En un divisor de voltaje ideal con R1=1 kΩ y R2=3 kΩ alimentado a 12 V, ¿qué voltaje cae en R2?","o":["3 V","9 V","4 V"],"a":1,"h":"V_R2 = V_in * R2 / (R1 + R2)","e":"V_R2 = 12 * 3000 / 4000 = 9 V."},{"i":"HW-CE-014","k":"1.1","d":"Medio","q":"En el modelo ideal de diodo, cuando está polarizado en conducción directa, ¿cuál es el valor aproximado del voltaje entre el ánodo y el cátodo?","o":["Es ≈ 0 V","Es ≈ 0.7 V","Es ≈ 1.2 V"],"a":0,"h":"Modelo ideal ≠ modelo real de silicio","e":"En el modelo ideal, un diodo polarizado directamente se comporta como un cortocircuito, por lo que la caída de voltaje ánodo-cátodo es prácticamente 0 V. Los valores 0.7 V (silicio) o 1.2 V (LED) corresponden a modelos más realistas que consideran la barrera de potencial."},{"i":"HW-CE-015","k":"1.1","d":"Básico","q":"Según la Ley de Corrientes de Kirchhoff (LCK), ¿cuál es el principio que describe el comportamiento de las corrientes en un nodo de un circuito eléctrico?","o":["En un resistor, la corriente es proporcional a la tensión aplicada en sus terminales.","En todo nodo, la suma algebraica de las corrientes que entran y salen es igual a cero.","En cualquier lazo cerrado, la suma algebraica de las tensiones es igual a cero."],"a":1,"h":"La ley se relaciona con la conservación de la carga en un nodo.","e":"La Ley de Corrientes de Kirchhoff (LCK) afirma que en cualquier nodo (punto de interconexión de elementos) de un circuito eléctrico, la suma algebraica de las corrientes que entran y salen es igual a cero. Esto se basa en el principio de conservación de la carga eléctrica, que indica que la carga no se acumula en un nodo: toda la corriente que llega debe salir."},{"i":"HW-CE-016","k":"1.1","d":"Básico","q":"Ordene correctamente los pasos para aplicar el método de análisis nodal general a un circuito eléctrico.","o":["1. Designar un nodo de referencia. 2. Resolver el sistema. 3. Escribir ecuaciones LCK. 4. Asignar tensiones nodales.","1. Contar nodos y designar uno de referencia. 2. Asignar tensiones nodales. 3. Escribir una ecuación de LCK para cada nodo de no referencia. 4. Resolver el sistema de ecuaciones.","1. Asignar corrientes de malla. 2. Escribir ecuaciones LCK. 3. Designar nodo de referencia. 4. Resolver el sistema."],"a":1,"h":"El primer paso es siempre identificar los nodos del circuito.","e":"El procedimiento de análisis nodal sigue un orden metodológico: identificar nodos, elegir una referencia, definir las variables (tensiones nodales), aplicar LCK para formular las ecuaciones y, finalmente, resolver el sistema resultante."},{"i":"HW-CE-017","k":"1.1","d":"Medio","q":"¿Cuáles son las dos reglas fundamentales que definen el comportamiento de un amplificador operacional ideal?","o":["La impedancia de salida es infinita y la ganancia en lazo abierto es unitaria.","La corriente de entrada es igual a la de salida y la tensión de salida es igual a la de entrada.","Nunca fluye corriente hacia las terminales de entrada y no existe diferencia de tensión entre ellas."],"a":2,"h":"Una regla se refiere a la corriente y la otra a la tensión en las entradas.","e":"El modelo del amplificador operacional ideal se basa en dos reglas simplificadoras: 1) La corriente en ambas terminales de entrada es cero. 2) La diferencia de tensión entre las terminales de entrada es cero."},{"i":"HW-CE-018","k":"1.1","d":"Básico","q":"Relacione la combinación de resistencias con su fórmula de resistencia equivalente.","o":["N resistores en serie→Req = R1 + R2 + ... + RN; N resistores en paralelo→1/Req = 1/R1 + 1/R2 + ... + 1/RN","N resistores en serie→1/Req = 1/R1 + 1/R2 + ... + 1/RN; N resistores en paralelo→Req = R1 + R2 + ... + RN","N resistores en serie→Req = R1 + R2 + ... + RN; N resistores en paralelo→1/Req = R1 + R2 + ... + RN"],"a":0,"h":"En serie, las resistencias se suman. En paralelo, se suman sus conductancias.","e":"Para resistores en serie, la resistencia total es la suma de las resistencias individuales. Para resistores en paralelo, el recíproco de la resistencia total es la suma de los recíprocos de las resistencias individuales."},{"i":"HW-CE-019","k":"1.1","d":"Básico","q":"Si una resistencia de 10 Ω es atravesada por una corriente de 2 A, ¿cuál es el voltaje en sus terminales según la Ley de Ohm?","o":["5 V","20 V","0.2 V"],"a":1,"h":"Recuerda la fórmula V = I * R.","e":"Aplicando la Ley de Ohm (V = I * R), se calcula el voltaje como V = 2 A * 10 Ω = 20 V."},{"i":"HW-CE-020","k":"1.1","d":"Medio","q":"En un divisor de voltaje con R1 = 2 kΩ y R2 = 3 kΩ alimentado por 10 V, ¿qué voltaje se mide en los extremos de R2?","o":["4 V","5 V","6 V"],"a":2,"h":"La fórmula del divisor de voltaje es V_R2 = V_in * (R2 / (R1 + R2)).","e":"El voltaje en R2 se calcula como V_R2 = 10 V * (3000 Ω / (2000 Ω + 3000 Ω)) = 10 V * (3/5) = 6 V."},{"i":"HW-CE-021","k":"1.1","d":"Básico","q":"Según la Ley de Voltajes de Kirchhoff (LVK), ¿cuál es el principio que rige las tensiones en una malla o lazo cerrado?","o":["La suma algebraica de las corrientes en un nodo es cero.","La suma algebraica de las caídas de tensión en una malla es igual a la suma de las fuentes de voltaje.","La resistencia total es la suma de todas las resistencias en la malla."],"a":1,"h":"Esta ley se basa en la conservación de la energía en un lazo cerrado.","e":"La LVK establece que la suma algebraica de todas las tensiones (tanto las suministradas por las fuentes como las caídas en los componentes) en cualquier lazo cerrado de un circuito es igual a cero. Esto implica que la suma de las subidas de tensión es igual a la suma de las caídas de tensión.","f":1},{"i":"HW-CE-022","k":"1.1","d":"Básico","q":"¿Cuál es la principal función de un diodo rectificador en un circuito?","o":["Amplificar la corriente.","Permitir el paso de la corriente en un solo sentido.","Regular un voltaje constante."],"a":1,"h":"Piensa en cómo se convierte la corriente alterna (CA) en corriente directa (CD).","e":"Un diodo rectificador está diseñado para permitir el flujo de corriente eléctrica en una dirección (polarización directa) y bloquearlo en la dirección opuesta (polarización inversa), siendo fundamental para la conversión de CA a CD."},{"i":"HW-CE-023","k":"1.1","d":"Medio","q":"Un transistor BJT operando en la región de corte se comporta como un...","o":["Interruptor cerrado","Amplificador de corriente","Interruptor abierto"],"a":2,"h":"En la región de corte, idealmente no fluye corriente a través del colector.","e":"Cuando un transistor BJT está en la región de corte, no hay suficiente corriente de base para activarlo, por lo que actúa como un interruptor abierto, impidiendo el paso de corriente entre el colector y el emisor."},{"i":"HW-CE-024","k":"1.1","d":"Avanzado","q":"¿Cuál es el propósito de encontrar el circuito equivalente de Thevenin?","o":["Calcular la potencia máxima disipada por el circuito.","Simplificar una parte compleja de un circuito en una única fuente de voltaje y una resistencia en serie.","Determinar la corriente total suministrada por todas las fuentes del circuito."],"a":1,"h":"El teorema de Thevenin es una técnica de simplificación de circuitos.","e":"El teorema de Thevenin permite reducir cualquier circuito lineal complejo a una forma mucho más simple: una única fuente de voltaje (V_th) en serie con una única resistencia (R_th). Esto facilita el análisis de la carga conectada a dicho circuito.","f":1},{"i":"HW-CE-025","k":"1.1","d":"Básico","q":"Un foco de 60 W se conecta a una red doméstica de 120 V. ¿Qué corriente consume?","o":["0.5 A","2 A","7200 A"],"a":0,"h":"Usa la fórmula de la potencia eléctrica: P = V * I.","e":"Despejando la corriente (I) de la fórmula de potencia, tenemos I = P / V. Sustituyendo los valores: I = 60 W / 120 V = 0.5 A."},{"i":"HW-CE-026","k":"1.1","d":"Medio","q":"¿Qué componente se utiliza específicamente para regular y mantener un voltaje constante en sus terminales cuando está polarizado inversamente?","o":["Diodo LED","Diodo Zener","Capacitor"],"a":1,"h":"Este diodo está diseñado para operar en la región de ruptura inversa.","e":"El diodo Zener está fabricado para funcionar en la zona de ruptura inversa. Cuando el voltaje inverso alcanza el 'voltaje Zener', el diodo conduce y mantiene ese voltaje constante a través de él, lo que lo hace ideal como regulador de voltaje."},{"i":"HW-CE-027","k":"1.1","d":"Básico","q":"¿Cuál es la característica principal de la Corriente Alterna (CA) en comparación con la Corriente Directa (CD)?","o":["Su voltaje es siempre constante.","Su magnitud y dirección varían periódicamente en el tiempo.","Solo puede ser generada por baterías."],"a":1,"h":"Piensa en la forma de onda de la electricidad que llega a los hogares.","e":"La Corriente Alterna (CA) se caracteriza porque su magnitud y sentido cambian de forma cíclica, típicamente siguiendo una forma de onda senoidal. En contraste, la Corriente Directa (CD) fluye en una sola dirección y su magnitud es constante."},{"i":"HW-CE-028","k":"1.1","d":"Medio","q":"Tres resistencias de 30 Ω cada una se conectan en paralelo. ¿Cuál es la resistencia equivalente del conjunto?","o":["90 Ω","30 Ω","10 Ω"],"a":2,"h":"La fórmula para resistencias en paralelo es 1/R_eq = 1/R1 + 1/R2 + ...","e":"Para resistencias iguales en paralelo, la resistencia equivalente es R / N, donde R es el valor de la resistencia y N es el número de resistencias. En este caso, R_eq = 30 Ω / 3 = 10 Ω."},{"i":"HW-CE-029","k":"1.1","d":"Medio","q":"La función principal de un transistor MOSFET en la electrónica digital es actuar como un...","o":["Interruptor controlado por voltaje.","Resistencia variable.","Fuente de corriente constante."],"a":0,"h":"Este componente es la base para la construcción de compuertas lógicas CMOS.","e":"En circuitos digitales, el MOSFET se utiliza principalmente como un interruptor electrónico. Aplicando un voltaje en su terminal de compuerta (Gate), se controla el flujo de corriente entre el drenador (Drain) y la fuente (Source), permitiendo que actúe como un interruptor abierto o cerrado."},{"i":"HW-CE-030","k":"1.1","d":"Avanzado","q":"El circuito equivalente de Norton consiste en...","o":["Una fuente de voltaje en serie con una resistencia.","Una fuente de corriente en paralelo con una resistencia.","Solo una fuente de corriente ideal."],"a":1,"h":"Es el dual del equivalente de Thevenin.","e":"El teorema de Norton establece que cualquier circuito lineal puede ser simplificado a una fuente de corriente ideal (I_n) en paralelo con una única resistencia (R_n). Es el equivalente en corriente del teorema de Thevenin."},{"i":"HW-CE-031","k":"1.1","d":"Básico","q":"¿Qué componente pasivo almacena energía en forma de campo eléctrico?","o":["Inductor","Resistor","Capacitor"],"a":2,"h":"Está formado por dos placas conductoras separadas por un material dieléctrico.","e":"El capacitor (o condensador) es un componente pasivo que almacena energía potencial eléctrica bajo la forma de un campo eléctrico entre sus dos placas conductoras."},{"i":"HW-CE-032","k":"1.1","d":"Básico","q":"¿Qué componente pasivo almacena energía en forma de campo magnético?","o":["Capacitor","Inductor","Diodo"],"a":1,"h":"Generalmente tiene forma de bobina de alambre.","e":"El inductor es un componente pasivo que almacena energía en forma de campo magnético cuando una corriente eléctrica fluye a través de él."},{"i":"HW-CE-033","k":"1.1","d":"Medio","q":"Un transistor BJT operando en la región de saturación se comporta como un...","o":["Interruptor abierto","Interruptor cerrado","Fuente de voltaje"],"a":1,"h":"En saturación, la corriente de colector es máxima y el voltaje colector-emisor es mínimo.","e":"Cuando un transistor BJT está saturado, permite el máximo flujo de corriente entre el colector y el emisor, con una caída de voltaje mínima entre ellos. Por esta razón, su comportamiento es análogo a un interruptor cerrado."},{"i":"HW-CE-034","k":"1.1","d":"Medio","q":"Para proteger la entrada de un circuito digital que opera a 3.3V, un diseñador utiliza un circuito de sujeción (clamping). ¿Qué componente es el más adecuado para desviar cualquier voltaje que exceda ligeramente los 3.3V hacia la línea de alimentación?","o":["Un inductor en serie para bloquear picos de voltaje.","Un diodo rectificador conectado inversamente a la línea de 3.3V.","Un diodo Schottky conectado entre la entrada y la línea de 3.3V."],"a":2,"h":"Se necesita un componente que se active rápidamente y tenga una caída de voltaje directa muy baja para no dañar la entrada.","e":"Un diodo Schottky es ideal para aplicaciones de clamping por su baja caída de voltaje directo (aprox. 0.2-0.3V) y su alta velocidad de conmutación. Cuando el voltaje de entrada supera los 3.3V + la caída del diodo, este conduce y desvía el exceso de corriente a la fuente, protegiendo el pin de entrada del circuito digital."},{"i":"HW-CE-035","k":"1.1","d":"Medio","q":"Un ingeniero está diseñando una interfaz para un sensor que genera pulsos rápidos. Para evitar que el ruido de alta frecuencia afecte la lectura, decide implementar un filtro pasabajas simple. ¿Qué configuración de componentes pasivos debe usar?","o":["Un capacitor en serie con la señal y un resistor a tierra.","Un resistor en serie con la señal y un capacitor en paralelo a tierra.","Un inductor en paralelo con la señal y un capacitor en serie."],"a":1,"h":"Un filtro pasabajas debe atenuar las frecuencias altas y permitir el paso de las bajas. Piensa en cómo se comportan los capacitores a diferentes frecuencias.","e":"En un filtro RC pasabajas, el resistor se coloca en serie para limitar la corriente. El capacitor se coloca en paralelo a la carga. A bajas frecuencias, la reactancia del capacitor es alta y actúa como un circuito abierto, dejando pasar la señal. A altas frecuencias, su reactancia es baja, actuando como un cortocircuito a tierra que desvía el ruido."},{"i":"HW-CE-036","k":"1.1","d":"Básico","q":"En un nodo de un circuito, entran dos corrientes de 3 A y 2 A. Según la LCK, ¿qué corriente total debe salir del nodo?","o":["1 A","5 A","No se puede saber sin el voltaje."],"a":1,"h":"La suma de las corrientes que entran es igual a la suma de las que salen.","e":"La Ley de Corrientes de Kirchhoff (LCK) establece que la suma algebraica de las corrientes en un nodo es cero. Si entran 3 A + 2 A = 5 A, entonces deben salir 5 A para que la suma sea nula."},{"i":"HW-CE-037","k":"1.1","d":"Medio","q":"¿Para qué se utiliza principalmente un TRIAC en aplicaciones de electrónica de potencia?","o":["Para rectificar una señal de CA.","Para amplificar señales de bajo nivel.","Para controlar la potencia entregada a una carga de CA."],"a":2,"h":"Es un interruptor bidireccional para corriente alterna.","e":"El TRIAC es un componente semiconductor de la familia de los tiristores que puede conmutar corriente en ambas direcciones de una onda de CA. Esto lo hace ideal para controlar la cantidad de potencia que se entrega a una carga, como en los reguladores de intensidad de luz o controles de velocidad de motores."},{"i":"HW-CE-038","k":"1.1","d":"Básico","q":"¿Qué es un semiconductor?","o":["Un material que siempre conduce la electricidad perfectamente.","Un material con una conductividad eléctrica entre la de un conductor y un aislante.","Un material que nunca conduce la electricidad."],"a":1,"h":"El silicio es el ejemplo más común de este tipo de material.","e":"Un semiconductor es un material (como el silicio o el germanio) cuyas propiedades de conductividad eléctrica se pueden modificar. Se sitúa entre los conductores (como el cobre) y los aislantes (como el plástico), y es la base de todos los componentes electrónicos modernos como diodos y transistores."},{"i":"HW-CE-039","k":"1.1","d":"Medio","q":"El DIAC es un tipo de tiristor que se utiliza principalmente para...","o":["Regular el voltaje de una fuente de CD.","Activar un TRIAC.","Generar señales de reloj en circuitos digitales."],"a":1,"h":"Funciona como un interruptor de disparo bidireccional.","e":"El DIAC es un dispositivo bidireccional que conduce corriente solo después de que se ha alcanzado su voltaje de ruptura. Su aplicación más común es en circuitos de control de fase para proporcionar un pulso de disparo controlado a la compuerta de un TRIAC, asegurando una activación simétrica."},{"i":"HW-CE-040","k":"1.1","d":"Básico","q":"¿Cuál es la unidad de medida de la capacitancia?","o":["Henry (H)","Ohm (Ω)","Farad (F)"],"a":2,"h":"Nombrada en honor a Michael Faraday.","e":"La unidad de medida de la capacitancia en el Sistema Internacional es el Farad (o Faradio), simbolizado con la letra F. Mide la capacidad de un componente para almacenar carga eléctrica."},{"i":"HW-CE-041","k":"1.1","d":"Básico","q":"Cuando un diodo emisor de luz (LED) está correctamente polarizado, ¿qué ocurre?","o":["Bloquea el paso de la corriente y se calienta.","Conduce corriente y emite luz.","Almacena energía en su interior."],"a":1,"h":"Su función principal es la conversión de energía eléctrica en lumínica.","e":"Un LED es un tipo de diodo que, al ser polarizado en directa (voltaje positivo en el ánodo y negativo en el cátodo), permite el paso de la corriente y, como resultado del proceso de recombinación de portadores de carga, emite energía en forma de fotones (luz)."},{"i":"HW-CE-042","k":"1.1","d":"Medio","q":"¿Cuál es la diferencia fundamental en el control de un BJT y un MOSFET?","o":["El BJT se controla por voltaje y el MOSFET por corriente.","Ambos se controlan por temperatura.","El BJT se controla por corriente y el MOSFET por voltaje."],"a":2,"h":"Uno es un dispositivo controlado por corriente y el otro por campo eléctrico (voltaje).","e":"La principal diferencia operativa es que el Transistor de Unión Bipolar (BJT) es un dispositivo controlado por corriente: una pequeña corriente en la base controla una corriente mayor entre colector y emisor. En cambio, el Transistor de Efecto de Campo (MOSFET) es controlado por voltaje: un voltaje aplicado a la compuerta crea un campo eléctrico que controla el flujo de corriente entre drenador y fuente.","f":1},{"i":"HW-CE-043","k":"1.1","d":"Avanzado","q":"Se tiene un circuito con una fuente de 12 V y dos resistores en serie, R1=1kΩ y R2=2kΩ. ¿Qué potencia total disipa el circuito?","o":["48 mW","144 mW","12 mW"],"a":0,"h":"Primero calcula la resistencia total, luego la corriente total y finalmente la potencia total (P = V * I).","e":"1. Resistencia total en serie: R_total = R1 + R2 = 1 kΩ + 2 kΩ = 3 kΩ. 2. Corriente total del circuito (Ley de Ohm): I = V / R_total = 12 V / 3000 Ω = 0.004 A (4 mA). 3. Potencia total disipada: P = V * I = 12 V * 0.004 A = 0.048 W, que equivale a 48 mW."},{"i":"HW-CE-044","k":"1.1","d":"Básico","q":"En un circuito en serie, ¿qué magnitud eléctrica es la misma para todos los componentes?","o":["El voltaje","La corriente","La resistencia"],"a":1,"h":"En una conexión en serie, solo hay un camino para el flujo de electrones.","e":"En un circuito en serie, los componentes están conectados uno tras otro, formando una única trayectoria para el flujo de la corriente. Por lo tanto, la corriente que pasa a través de cada uno de los componentes es exactamente la misma."},{"i":"HW-CE-045","k":"1.1","d":"Medio","q":"En un circuito de corriente directa (CD), ¿cómo se comporta un capacitor una vez que se ha cargado completamente (en estado estacionario)?","o":["Como un cortocircuito.","Como un circuito abierto.","Como una resistencia de valor muy bajo."],"a":1,"h":"En estado estacionario de CD, el flujo de corriente hacia el capacitor se detiene.","e":"Una vez que un capacitor está completamente cargado en un circuito de CD, no permite que fluya más corriente a través de él. Actúa como una interrupción en el circuito, es decir, como un circuito abierto."},{"i":"HW-CE-046","k":"1.1","d":"Medio","q":"En un circuito de corriente directa (CD), ¿cómo se comporta un inductor ideal después de que ha transcurrido mucho tiempo (en estado estacionario)?","o":["Como un circuito abierto.","Como una fuente de voltaje.","Como un cortocircuito."],"a":2,"h":"La oposición del inductor al cambio de corriente desaparece cuando la corriente se vuelve constante.","e":"En estado estacionario de CD, la corriente es constante, por lo que el campo magnético en el inductor no cambia. Un inductor ideal no ofrece oposición a una corriente constante, comportándose como un simple cable o cortocircuito."},{"i":"HW-CE-047","k":"1.1","d":"Medio","q":"Un cliente reporta que el brillo de una lámpara incandescente controlada por un dimmer (atenuador) parpadea irregularmente. El dimmer utiliza un TRIAC. ¿Cuál es la causa más probable del problema?","o":["El potenciómetro del dimmer está ajustado al máximo.","El TRIAC no está recibiendo el pulso de disparo adecuado en su compuerta.","La lámpara incandescente tiene una resistencia demasiado alta."],"a":1,"h":"Un TRIAC necesita un pulso en su 'gate' en cada semiciclo de la CA para activarse y permitir el paso de corriente a la carga.","e":"El TRIAC controla la potencia entregada a la carga (la lámpara) activándose durante una porción de cada semiciclo de la corriente alterna. Si el circuito de disparo que envía la señal a la compuerta (gate) es inestable o defectuoso, el TRIAC se disparará en momentos inconsistentes, causando el parpadeo visible en la lámpara."},{"i":"HW-CE-048","k":"1.1","d":"Medio","q":"Si se conectan dos capacitores en serie, C1=10µF y C2=10µF, ¿cuál es la capacitancia total equivalente?","o":["20 µF","10 µF","5 µF"],"a":2,"h":"La fórmula para capacitores en serie es el inverso de la de resistores en serie: 1/C_eq = 1/C1 + 1/C2.","e":"Para capacitores en serie, la capacitancia total se calcula con la fórmula del inverso de la suma de los inversos. 1/C_eq = 1/10 + 1/10 = 2/10. Por lo tanto, C_eq = 10/2 = 5 µF. La capacitancia total en serie siempre es menor que la menor de las capacitancias individuales."},{"i":"HW-CE-049","k":"1.1","d":"Medio","q":"¿En qué región de operación debe trabajar un transistor BJT para funcionar como un amplificador de señal?","o":["Región de corte.","Región activa.","Región de saturación."],"a":1,"h":"Las regiones de corte y saturación son para su uso como interruptor.","e":"Para que un BJT funcione como amplificador, debe operar en la región activa. En esta zona, la corriente de colector es proporcional a la corriente de base (Ic = β * Ib), permitiendo que una pequeña variación en la corriente de entrada controle una gran variación en la corriente de salida."},{"i":"HW-CE-050","k":"1.1","d":"Básico","q":"Además de P = V * I, ¿qué otra fórmula es correcta para calcular la potencia eléctrica disipada en una resistencia R?","o":["P = I² * R","P = I / R","P = V / R"],"a":0,"h":"Sustituye V = I * R en la fórmula principal de potencia.","e":"Partiendo de P = V * I y usando la Ley de Ohm (V = I * R), podemos sustituir V en la fórmula de potencia: P = (I * R) * I = I² * R. Esta ecuación es muy útil para calcular la potencia disipada cuando se conocen la corriente y la resistencia."},{"i":"HW-CE-051","k":"1.1","d":"Básico","q":"¿Cuál es la función del terminal de 'base' en un transistor BJT?","o":["Es el terminal principal de salida de corriente.","Controla el flujo de corriente entre el colector y el emisor.","Actúa como terminal de referencia o tierra."],"a":1,"h":"Una pequeña corriente en este terminal permite el paso de una corriente mucho mayor.","e":"La base es el terminal de control del BJT. Al inyectar una pequeña corriente en la base, se permite que una corriente mucho más grande fluya desde el colector hacia el emisor, controlando así el estado del transistor (corte, activo o saturación)."},{"i":"HW-CE-052","k":"1.1","d":"Básico","q":"Un cortocircuito ideal se caracteriza por tener:","o":["Voltaje y corriente infinitos.","Resistencia cero y voltaje cero.","Resistencia y voltaje muy altos."],"a":1,"h":"Piensa en un cable conductor perfecto.","e":"Un cortocircuito ideal es una conexión con resistencia nula (cero). Según la Ley de Ohm (V=I*R), si la resistencia es cero, la caída de voltaje a través de él también debe ser cero, sin importar la corriente que lo atraviese."},{"i":"HW-CE-053","k":"1.1","d":"Básico","q":"Para construir una fuente de alimentación que convierta CA en CD pulsante, el primer componente esencial que se necesita es un:","o":["Transistor","Diodo rectificador","Capacitor"],"a":1,"h":"¿Qué componente permite el paso de corriente en un solo sentido para eliminar los semiciclos negativos de la CA?","e":"El proceso de rectificación es el primer paso para convertir CA en CD. Esto se logra con un diodo rectificador (o un puente de diodos), que bloquea los semiciclos negativos de la onda de CA, resultando en una CD pulsante."},{"i":"HW-CE-054","k":"1.1","d":"Medio","q":"¿Cuál es el propósito principal de 'dopar' un material semiconductor como el silicio?","o":["Para aumentar su resistencia y hacerlo más aislante.","Para purificarlo y eliminar todas las impurezas.","Para alterar sus propiedades eléctricas creando portadores de carga (electrones o huecos)."],"a":2,"h":"El dopaje crea semiconductores tipo N y tipo P, que son la base de los diodos y transistores.","e":"El dopaje consiste en introducir intencionalmente impurezas en la red cristalina de un semiconductor puro para aumentar drásticamente su conductividad. Al dopar con ciertos elementos se crean portadores de carga negativa (electrones, tipo N) o positiva (huecos, tipo P), lo cual es fundamental para fabricar componentes electrónicos.","f":1},{"i":"HW-CE-055","k":"1.1","d":"Medio","q":"Dos inductores, L1=5mH y L2=20mH, se conectan en paralelo. ¿Cuál es su inductancia equivalente?","o":["4 mH","25 mH","12.5 mH"],"a":0,"h":"Los inductores en paralelo se combinan de la misma forma que los resistores en paralelo.","e":"La fórmula para inductores en paralelo es 1/L_eq = 1/L1 + 1/L2. Para dos inductores, se simplifica a L_eq = (L1 * L2) / (L1 + L2). Sustituyendo: L_eq = (5 * 20) / (5 + 20) = 100 / 25 = 4 mH."},{"i":"HW-CE-056","k":"1.1","d":"Básico","q":"En un transistor MOSFET, ¿cuál es la función del terminal 'compuerta' (Gate)?","o":["Permitir la salida principal de la corriente.","Aplicar un voltaje para controlar el flujo de corriente.","Disipar el calor generado por el componente."],"a":1,"h":"Este terminal está eléctricamente aislado del resto del transistor y funciona por campo eléctrico.","e":"La compuerta (Gate) es el terminal de control del MOSFET. Al aplicar un voltaje a la compuerta, se crea un campo eléctrico que modula la conductividad del canal entre el Drenador (Drain) y la Fuente (Source), controlando así el paso de la corriente. No requiere corriente para su activación, solo voltaje."},{"i":"HW-CE-057","k":"1.1","d":"Avanzado","q":"En la práctica, ¿qué valor de caída de voltaje se suele considerar para un diodo de silicio cuando está polarizado en directa y conduciendo corriente?","o":["Aproximadamente 0.7 V","0 V","El voltaje de la fuente"],"a":0,"h":"Este valor representa la 'barrera de potencial' que los electrones deben superar en la unión P-N.","e":"A diferencia del modelo ideal (0 V), un diodo de silicio real requiere un pequeño voltaje para empezar a conducir significativamente. Esta caída de voltaje, debida a la barrera de potencial de la unión P-N, es de aproximadamente 0.7 V y se mantiene relativamente constante mientras conduce."},{"i":"HW-CE-058","k":"1.1","d":"Medio","q":"¿Cuál es la principal ventaja de un MOSFET sobre un BJT en aplicaciones de conmutación de alta frecuencia?","o":["Requiere menos voltaje para activarse.","Soporta mayores voltajes en general.","Es más rápido porque es controlado por voltaje y no por corriente."],"a":2,"h":"Piensa en qué es más rápido de modificar: un campo eléctrico (voltaje) o un flujo de portadores de carga (corriente).","e":"Los MOSFET son generalmente más rápidos que los BJT para conmutar. Al ser controlados por voltaje, no sufren del 'tiempo de almacenamiento de portadores minoritarios' que afecta a los BJT, lo que les permite encenderse y apagarse a velocidades mucho mayores, haciéndolos ideales para fuentes de alimentación conmutadas y circuitos digitales."},{"i":"HW-CE-059","k":"1.1","d":"Básico","q":"Ordene los pasos para analizar un circuito simple en serie con una fuente de voltaje y varias resistencias.","o":["1. Calcular la corriente total. 2. Calcular la resistencia total. 3. Calcular la caída de voltaje en cada resistor.","1. Calcular la resistencia total sumando todas las resistencias. 2. Calcular la corriente total usando la Ley de Ohm (I=V/R_total). 3. Calcular la caída de voltaje en cada resistor (V_R = I * R).","1. Calcular la caída de voltaje en cada resistor. 2. Calcular la corriente total. 3. Calcular la resistencia total."],"a":1,"h":"No puedes saber la corriente ni las caídas de voltaje individuales sin conocer primero la oposición total al flujo.","e":"El procedimiento lógico es: primero, determinar la resistencia total que el circuito presenta a la fuente (sumando las resistencias en serie). Segundo, con el voltaje de la fuente y la resistencia total, calcular la única corriente que fluye por todo el circuito. Finalmente, con esa corriente, calcular la caída de voltaje específica en cada componente.","f":1},{"i":"HW-CE-060","k":"1.1","d":"Medio","q":"Un técnico reemplaza un transistor BJT defectuoso en un amplificador de audio. Tras el reemplazo, el sonido se escucha muy distorsionado. Mide el voltaje de polarización en la base y descubre que es mucho más alto de lo especificado, llevando al transistor a un estado de saturación constante. ¿Cuál es la causa más probable?","o":["El nuevo transistor tiene una ganancia (hFE) mucho menor que el original.","Una de las resistencias del divisor de voltaje que polariza la base se ha abierto.","Una de las resistencias del divisor de voltaje que polariza la base tiene un valor incorrecto o está en cortocircuito."],"a":2,"h":"El voltaje de base en un BJT a menudo se establece con un divisor de voltaje. Analiza cómo una falla en este divisor podría aumentar el voltaje.","e":"Un voltaje de base excesivamente alto indica un problema en el circuito de polarización. Si la resistencia inferior del divisor de voltaje (la que va a tierra) estuviera en cortocircuito o tuviera un valor mucho menor, o si la resistencia superior (la que va a VCC) tuviera un valor incorrecto, el punto medio del divisor (la base) se acercaría más al voltaje de alimentación, causando la saturación del transistor y la distorsión de la señal."},{"i":"HW-ARQ-001","k":"1.2","d":"Básico","q":"¿Qué nivel de memoria ofrece menor latencia típica en una jerarquía convencional?","o":["Memoria principal (DRAM)","Caché L1","Almacenamiento secundario (SSD)"],"a":1,"h":"Piensa en la pirámide de memoria","e":"La caché L1 es la más cercana al CPU y con menor latencia; después L2/L3, DRAM y finalmente SSD/HDD."},{"i":"HW-ARQ-002","k":"1.2","d":"Medio","q":"La técnica para reducir fallos de caché prediciendo accesos futuros basada en patrones temporales es…","o":["Prefetching","Write-through","Associativity"],"a":0,"h":"Anticipación de bloques","e":"El prefetching trae líneas antes de ser referenciadas para disminuir fallos de caché."},{"i":"HW-ARQ-003","k":"1.2","d":"Básico","q":"Ordene de menor a mayor latencia típica en una jerarquía de memoria.","o":["Registros < Caché L1 < Memoria principal < Disco","Caché L1 < Registros < Disco < Memoria principal","Memoria principal < Registros < Caché L1 < Disco"],"a":0,"h":"Al bajar en la jerarquía, aumenta el tiempo de acceso.","e":"Los registros son los más rápidos, luego caché (L1), memoria principal y finalmente almacenamiento secundario. Guijarro explica cómo el tiempo de acceso crece al descender en la jerarquía."},{"i":"HW-ARQ-004","k":"1.2","d":"Medio","q":"Relacione el método de acceso con su descripción correcta.","o":["Secuencial→acceso por dirección única; Directo→búsqueda por contenido; Aleatorio→leer en orden; Asociativo→bloques con dirección","Secuencial→leer posiciones en orden desde la última; Directo→bloques con dirección y acceso secuencial interno; Aleatorio→acceso por dirección única; Asociativo→búsqueda por contenido","Secuencial→bloques con dirección; Directo→leer en orden; Aleatorio→búsqueda por contenido; Asociativo→acceso por dirección única"],"a":1,"h":"Son cuatro: secuencial, directo, aleatorio y asociativo.","e":"Guijarro define los métodos de acceso: secuencial (recorre posiciones en orden), directo (acceso por bloque con recorrido interno), aleatorio (dirección única por elemento) y asociativo (por contenido)."},{"i":"HW-ARQ-005","k":"1.2","d":"Básico","q":"Un servidor web presenta problemas de 'out of memory' por alto tráfico. Un administrador soluciona el problema agregando un nuevo módulo de memoria RAM de 8 GB al servidor existente. ¿Qué tipo de escalamiento se utilizó?","o":["Mixto","Horizontal","Vertical"],"a":2,"h":"Este tipo de escalamiento implica 'hacer más grande' un único servidor.","e":"El escalamiento vertical (scale up) consiste en aumentar los recursos de un único nodo (servidor), como añadir más CPU, RAM o almacenamiento. En contraste, el escalamiento horizontal (scale out) consiste en añadir más nodos a un sistema."},{"i":"HW-ARQ-006","k":"1.2","d":"Medio","q":"Según el modelo clásico de arquitectura Von Neumann, ¿cuáles son los tres componentes fundamentales que la componen?","o":["CPU, Memoria y Dispositivos de E/S","Unidad de Control, Memoria RAM y Fuente de Poder","Procesador, ALU y Arreglo de registros"],"a":0,"h":"Este modelo describe la estructura conceptual de una computadora digital con programa almacenado.","e":"La arquitectura Von Neumann se define por tres subsistemas clave: 1) Una Unidad Central de Procesamiento (CPU) que contiene la Unidad Aritmético-Lógica (ALU) y la Unidad de Control. 2) Una unidad de Memoria principal que almacena tanto datos como instrucciones. 3) Los Dispositivos de Entrada y Salida (E/S) que gestionan la comunicación con el exterior."},{"i":"HW-ARQ-007","k":"1.2","d":"Avanzado","q":"¿Cuál de las siguientes afirmaciones describe mejor la diferencia fundamental entre las arquitecturas CISC y RISC?","o":["RISC facilita la programación en ensamblador al tener instrucciones potentes que realizan múltiples operaciones, a diferencia de CISC que requiere más líneas de código.","La principal ventaja de CISC es que todas sus instrucciones son de longitud fija y se ejecutan en un único ciclo de reloj, superando a RISC en velocidad.","CISC se basa en un conjunto de instrucciones complejas interpretadas por microcódigo, mientras que RISC utiliza un conjunto de instrucciones simples y alambradas (hardwired) para una ejecución más rápida."],"a":2,"h":"Piensa en el significado de las siglas: 'Complejo' (CISC) vs. 'Reducido' (RISC) y cómo se traduce eso en el hardware.","e":"La diferencia clave radica en la filosofía de diseño. CISC (Computadora con Conjunto de Instrucciones Complejas) transfiere la complejidad al hardware, utilizando instrucciones potentes que pueden requerir múltiples ciclos de reloj y son interpretadas por microcódigo. En contraste, RISC (Computadora con Conjunto de Instrucciones Reducido) simplifica el hardware con un pequeño conjunto de instrucciones optimizadas y de formato fijo. Estas instrucciones son alambradas (hardwired) para ejecutarse idealmente en un solo ciclo de reloj, delegando la complejidad al compilador para que combine estas operaciones simples."},{"i":"HW-ARQ-008","k":"1.2","d":"Básico","q":"¿Cuál es la definición del bus?","o":["Conjunto de líneas eléctricas que permiten la comunicación entre los elementos de la arquitectura","Conjunto de líneas imaginarias usadas en los diagramas para identificar la relación entre los elementos de la arquitectura","Conjunto de líneas usadas para almacenar datos con poca batería"],"a":0,"h":"Es como una carretera o una autopista dentro de una computadora.","e":"Un bus es un sistema de comunicación que transfiere datos, señales de control y direcciones entre los componentes de una computadora. Físicamente, es un conjunto de conductores eléctricos (líneas) que funcionan como una ruta compartida."},{"i":"HW-ARQ-009","k":"1.2","d":"Medio","q":"¿Cuál es la función principal del chipset en la tarjeta madre de una computadora?","o":["Ejecutar el sistema operativo y las aplicaciones del usuario.","Gestionar el flujo de datos y la comunicación entre la CPU, la memoria y los periféricos.","Almacenar permanentemente los datos y la configuración de la BIOS/UEFI."],"a":1,"h":"Actúa como el centro de comunicaciones o el 'controlador de tráfico' de la placa base.","e":"El chipset es un conjunto de circuitos integrados que actúa como intermediario, gestionando el flujo de datos entre los componentes clave: CPU, memoria RAM, ranuras de expansión (PCIe) y puertos de E/S (USB, SATA). Libera a la CPU de la tarea de tener que gestionar directamente esta comunicación."},{"i":"HW-ARQ-010","k":"1.2","d":"Básico","q":"¿Qué compuerta lógica produce una salida verdadera (1) únicamente cuando todas sus entradas son verdaderas (1)?","o":["OR","AND","XOR"],"a":1,"h":"Esta compuerta representa la multiplicación lógica.","e":"La compuerta AND implementa la multiplicación booleana. Su salida es 1 solo si la entrada A Y la entrada B (y todas las demás, si las hay) son 1. En cualquier otro caso, la salida es 0."},{"i":"HW-ARQ-011","k":"1.2","d":"Medio","q":"¿Cuál es el propósito principal de utilizar Mapas de Karnaugh en el diseño de circuitos digitales?","o":["Dibujar el esquemático del circuito.","Simplificar funciones lógicas booleanas.","Calcular el consumo de energía del circuito."],"a":1,"h":"Es una herramienta gráfica para minimizar el número de compuertas necesarias.","e":"Los Mapas de Karnaugh (K-maps) son un método gráfico utilizado para simplificar expresiones del Álgebra de Boole. Permiten encontrar la expresión más simple posible para una función lógica, lo que se traduce en un circuito con menos compuertas."},{"i":"HW-ARQ-012","k":"1.2","d":"Medio","q":"¿Qué tipo de circuito combinacional se utiliza para seleccionar una de varias líneas de entrada y dirigirla a una única línea de salida?","o":["Multiplexor (MUX)","Decodificador","Sumador completo"],"a":0,"h":"Funciona como un selector de datos controlado por señales de selección.","e":"Un Multiplexor (MUX) es un circuito que tiene múltiples entradas de datos, líneas de control (selección) y una única salida. Las líneas de control determinan cuál de las entradas se conecta a la salida en un momento dado."},{"i":"HW-ARQ-013","k":"1.2","d":"Medio","q":"¿Cuál es el bloque de construcción fundamental para la memoria en los circuitos secuenciales?","o":["Compuerta AND","Flip-Flop","Multiplexor"],"a":1,"h":"Este dispositivo puede almacenar un solo bit de información (0 o 1).","e":"El Flip-Flop es el dispositivo de memoria más básico en la electrónica digital. Es un circuito biestable, lo que significa que puede existir en uno de dos estados estables, representando un 0 o un 1, y es la base para construir registros y memoria."},{"i":"HW-ARQ-014","k":"1.2","d":"Básico","q":"En la arquitectura de computadoras, ¿cuál es la principal característica del modelo de Von Neumann?","o":["Utiliza buses separados para datos e instrucciones.","Tiene un conjunto de instrucciones muy reducido.","Almacena datos e instrucciones en la misma memoria principal."],"a":2,"h":"Esta es la arquitectura utilizada en la mayoría de las computadoras personales modernas.","e":"La arquitectura de Von Neumann se caracteriza por tener una única memoria principal donde se almacenan tanto las instrucciones del programa como los datos que este manipula. Utiliza un único bus para acceder a ambos, lo que puede crear un 'cuello de botella'."},{"i":"HW-ARQ-015","k":"1.2","d":"Básico","q":"¿Qué componente de la CPU es responsable de realizar operaciones aritméticas (suma, resta) y lógicas (AND, OR)?","o":["CU","Registros","ALU"],"a":2,"h":"Su nombre describe directamente su función.","e":"La Unidad Aritmético-Lógica (ALU) es el 'cerebro' matemático de la CPU. Ejecuta todos los cálculos numéricos y las comparaciones lógicas requeridas por las instrucciones."},{"i":"HW-ARQ-016","k":"1.2","d":"Medio","q":"Ordene correctamente las fases principales del ciclo de instrucción de una CPU.","o":["Execute, Fetch, Decode","Decode, Execute, Fetch","Fetch, Decode, Execute"],"a":2,"h":"Primero se debe buscar la instrucción, luego entenderla y finalmente realizarla.","e":"El ciclo de instrucción sigue un orden fundamental: 1. Fetch (Captación): Traer la siguiente instrucción desde la memoria. 2. Decode (Decodificación): Interpretar la instrucción para saber qué hacer. 3. Execute (Ejecución): Realizar la operación indicada por la instrucción."},{"i":"HW-ARQ-017","k":"1.2","d":"Básico","q":"En la jerarquía de memoria, ¿cuál es el tipo de memoria más rápida y cercana a la CPU?","o":["Memoria RAM","Registros","Memoria Caché L3"],"a":1,"h":"Están ubicados físicamente dentro del propio núcleo de la CPU.","e":"Los registros son la cima de la jerarquía de memoria. Son pequeñas unidades de memoria de altísima velocidad ubicadas dentro de la CPU que almacenan los datos que se están procesando en el instante actual. El acceso a ellos es prácticamente instantáneo."},{"i":"HW-ARQ-018","k":"1.2","d":"Básico","q":"¿Qué tipo de bus se utiliza para especificar la ubicación de un dato en la memoria principal?","o":["Bus de datos","Bus de control","Bus de direcciones"],"a":2,"h":"Su ancho determina la cantidad máxima de memoria que la CPU puede gestionar.","e":"El bus de direcciones es un canal unidireccional desde la CPU hacia la memoria (y otros dispositivos). La CPU lo utiliza para enviar la dirección de memoria específica a la que desea acceder, ya sea para leer un dato o para escribirlo."},{"i":"HW-ARQ-019","k":"1.2","d":"Básico","q":"¿Cuál es la diferencia fundamental entre un circuito combinacional y un circuito secuencial?","o":["Los secuenciales tienen memoria para recordar estados pasados.","Los secuenciales usan más compuertas lógicas.","Los combinacionales son más rápidos que los secuenciales."],"a":0,"h":"La salida de uno depende solo de la entrada actual, mientras que la del otro depende también de la historia.","e":"La característica distintiva de los circuitos secuenciales es que poseen elementos de memoria (como los flip-flops). Esto significa que su salida actual depende no solo de las entradas actuales, sino también del estado anterior del circuito."},{"i":"HW-ARQ-020","k":"1.2","d":"Medio","q":"¿Qué es un 'registro' en el contexto de la arquitectura de computadoras?","o":["Un software que monitorea el sistema.","Un conjunto de flip-flops que almacenan un grupo de bits.","Una dirección específica de la memoria RAM."],"a":1,"h":"Si un flip-flop guarda un bit, un conjunto de ellos guarda una palabra de datos.","e":"Un registro es una unidad de memoria de alta velocidad compuesta por un grupo de flip-flops. Se utiliza para almacenar temporalmente datos, instrucciones o direcciones que la CPU necesita de forma inmediata. Por ejemplo, un registro de 8 bits está formado por 8 flip-flops."},{"i":"HW-ARQ-021","k":"1.2","d":"Avanzado","q":"La principal diferencia entre un contador síncrono y uno asíncrono (de rizo) es que:","o":["En los síncronos, todos los flip-flops cambian de estado con la misma señal de reloj.","Los contadores síncronos no pueden contar hacia atrás.","Los contadores asíncronos son más rápidos que los síncronos."],"a":0,"h":"Piensa en cómo se propaga la señal que provoca el cambio de estado en los flip-flops.","e":"En un contador síncrono, la señal de reloj se aplica simultáneamente a todos los flip-flops, haciendo que cambien de estado al mismo tiempo. En un contador asíncrono, la salida de un flip-flop actúa como la señal de reloj del siguiente, causando un retardo en cadena ('rizo')."},{"i":"HW-ARQ-022","k":"1.2","d":"Medio","q":"¿Qué función cumple el 'firmware' como el BIOS o UEFI en un sistema de cómputo?","o":["Es el sistema operativo principal de la computadora.","Es un software de bajo nivel que inicializa el hardware durante el arranque.","Gestiona la memoria virtual del sistema."],"a":1,"h":"Es lo primero que se ejecuta cuando enciendes la computadora.","e":"El firmware (almacenado en una memoria ROM/EEPROM) es un programa esencial que se ejecuta al encender el equipo. Su función es realizar una verificación del hardware (POST), inicializar los componentes básicos y cargar el sistema operativo desde el disco de almacenamiento."},{"i":"HW-ARQ-023","k":"1.2","d":"Avanzado","q":"Un sumador completo (Full Adder) se diferencia de un semisumador (Half Adder) en que:","o":["El sumador completo puede restar, pero el semisumador no.","El sumador completo tiene una entrada de acarreo (Carry-in).","El sumador completo utiliza compuertas XOR, mientras que el semisumador no."],"a":1,"h":"Para sumar columnas de números de varios bits, necesitas considerar el acarreo de la columna anterior.","e":"Un semisumador suma dos bits (A y B) y produce una suma y un acarreo de salida. Un sumador completo suma tres bits: A, B y un acarreo de entrada (Cin) de una etapa anterior. Esto lo hace esencial para construir sumadores de múltiples bits."},{"i":"HW-ARQ-024","k":"1.2","d":"Básico","q":"En la expresión booleana A + 1, ¿cuál es el resultado?","o":["A","0","1"],"a":2,"h":"La operación '+' en Álgebra de Boole representa una compuerta OR.","e":"En el Álgebra de Boole, la operación OR (+) con 1 siempre da como resultado 1. Si A es 0, 0 + 1 = 1. Si A es 1, 1 + 1 = 1. Por lo tanto, el resultado es siempre 1."},{"i":"HW-ARQ-025","k":"1.2","d":"Medio","q":"¿Qué tipo de Flip-Flop es más adecuado para ser usado en registros de datos, ya que transfiere directamente la entrada a la salida en el pulso de reloj?","o":["Flip-Flop JK","Flip-Flop SR","Flip-Flop D"],"a":2,"h":"Su nombre viene de 'Data' o 'Delay'.","e":"El Flip-Flop tipo D (Datos) es ideal para registros porque su función es simple: el valor que está en la entrada D se transfiere a la salida Q en el flanco activo del reloj y se mantiene hasta el siguiente. Es perfecto para capturar y almacenar un bit de datos."},{"i":"HW-ARQ-026","k":"1.2","d":"Medio","q":"La principal ventaja de la arquitectura Harvard sobre la de Von Neumann es que:","o":["Es más barata de implementar.","Permite el acceso simultáneo a datos e instrucciones.","Puede direccionar más memoria RAM."],"a":1,"h":"Esta arquitectura utiliza buses separados para datos e instrucciones.","e":"La arquitectura Harvard utiliza memorias y buses independientes para datos e instrucciones. Esto permite a la CPU leer una instrucción y, al mismo tiempo, leer o escribir un dato, eliminando el 'cuello de botella' de Von Neumann y mejorando la velocidad de procesamiento. Es común en microcontroladores y DSPs."},{"i":"HW-ARQ-027","k":"1.2","d":"Básico","q":"¿Qué componente de la CPU se encarga de dirigir y coordinar la mayoría de las operaciones del computador?","o":["La memoria caché","ALU","CU"],"a":2,"h":"Actúa como el 'director de orquesta' de la CPU.","e":"La Unidad de Control (CU) interpreta las instrucciones del programa y genera las señales de control que dirigen a los otros componentes (como la ALU, los registros y la memoria) para que ejecuten las acciones requeridas. No procesa datos, solo los gestiona."},{"i":"HW-ARQ-028","k":"1.2","d":"Medio","q":"La diferencia clave entre la memoria SRAM y DRAM es que:","o":["SRAM es no volátil, mientras que DRAM es volátil.","SRAM es más lenta y barata que DRAM.","SRAM no necesita ser refrescada, mientras que DRAM sí."],"a":2,"h":"La 'S' es de Estática y la 'D' de Dinámica. Piensa en qué necesita una acción constante para mantener los datos.","e":"La SRAM (RAM Estática) está construida con flip-flops y mantiene los datos mientras reciba energía. La DRAM (RAM Dinámica) usa capacitores que se descargan con el tiempo, por lo que necesita un circuito de refresco constante para reescribir los datos. Esto hace que la SRAM sea mucho más rápida (y cara), por lo que se usa para la memoria caché."},{"i":"HW-ARQ-029","k":"1.2","d":"Medio","q":"¿Qué tipo de circuito se requiere para implementar una memoria de solo lectura (ROM) de 16x8 bits?","o":["Un decodificador de 4 a 16 líneas y 8 compuertas OR.","Un multiplexor de 16 a 1 y 8 flip-flops tipo D.","Un registro de desplazamiento de 128 bits."],"a":0,"h":"Piensa en cómo se selecciona una de las 16 ubicaciones de memoria y cómo se leen los 8 bits de datos almacenados en esa ubicación.","e":"Para seleccionar una de las 16 palabras, se necesita un decodificador que convierta las 4 líneas de dirección (2^4 = 16) en 16 líneas de selección. Cada una de las 8 líneas de salida de datos (el bus de datos de 8 bits) requiere una compuerta OR para combinar las salidas de las celdas de memoria correspondientes."},{"i":"HW-ARQ-030","k":"1.2","d":"Avanzado","q":"En un flip-flop JK, si las entradas J y K están ambas en alto (1) y llega un pulso de reloj, ¿qué le sucede a la salida Q?","o":["La salida Q mantiene su estado anterior.","La salida Q se pone en estado de alta impedancia.","La salida Q invierte (conmuta) su estado anterior."],"a":2,"h":"Esta es la condición que diferencia principalmente al flip-flop JK del SR.","e":"El modo de 'conmutación' (toggle) es una característica definitoria del flip-flop JK. Cuando J=1 y K=1, la salida Q cambia a su estado complementario en cada flanco activo del reloj. Si Q era 0, se convierte en 1; si era 1, se convierte en 0."},{"i":"HW-ARQ-031","k":"1.2","d":"Medio","q":"Un procesador con un bus de direcciones de 32 bits y un bus de datos de 64 bits, ¿cuál es la máxima cantidad de memoria directamente direccionable y cuántos datos transfiere por ciclo?","o":["2 GB de memoria, 32 bits por ciclo.","4 GB de memoria, 64 bits por ciclo.","64 GB de memoria, 32 bits por ciclo."],"a":1,"h":"El bus de direcciones determina el 'cuánto' y el bus de datos determina el 'cuán rápido' se transfiere.","e":"El ancho del bus de direcciones determina el espacio de memoria direccionable: 2^32 ubicaciones, que equivale a 4 Gigabytes (GB). El ancho del bus de datos determina la cantidad de información transferida en un solo ciclo de bus: 64 bits (u 8 bytes)."},{"i":"HW-ARQ-032","k":"1.2","d":"Avanzado","q":"Si una CPU CISC puede ejecutar una instrucción 'MULT M' que multiplica un registro por un operando en memoria, ¿cómo se realizaría una operación equivalente en una arquitectura RISC típica?","o":["Con una única macro-instrucción similar a la de CISC.","Mediante una secuencia de instrucciones: LOAD, MULT, STORE.","El compilador lo rechazaría por ser una operación compleja."],"a":1,"h":"La filosofía RISC se basa en operaciones simples de registro a registro (load/store).","e":"Las arquitecturas RISC no permiten operaciones aritméticas que accedan directamente a la memoria. La operación debe descomponerse en pasos explícitos: primero cargar el dato de la memoria a un registro (LOAD), luego realizar la multiplicación entre registros (MULT), y finalmente, si es necesario, guardar el resultado en memoria (STORE)."},{"i":"HW-ARQ-033","k":"1.2","d":"Medio","q":"Durante el ciclo de instrucción, la decodificación de la instrucción es realizada por la Unidad de Control. ¿Qué información principal se obtiene en esta fase?","o":["El resultado final de la operación aritmética.","La dirección de la siguiente instrucción a ejecutar.","El tipo de operación a realizar y los operandos involucrados."],"a":2,"h":"En esta fase, la CPU 'entiende' qué es lo que la instrucción le pide que haga.","e":"La fase de decodificación consiste en interpretar el código de operación (opcode) de la instrucción para determinar qué acción se debe llevar a cabo (sumar, mover datos, etc.) e identificar los operandos (registros, direcciones de memoria, valores inmediatos) sobre los que se va a operar."},{"i":"HW-ARQ-034","k":"1.2","d":"Medio","q":"La memoria caché L1 suele estar dividida en dos partes: una para instrucciones y otra para datos. ¿Qué arquitectura de computadoras inspira este diseño?","o":["Arquitectura de Von Neumann.","Arquitectura Harvard.","Arquitectura CISC."],"a":1,"h":"Este diseño permite buscar una instrucción y un dato de forma simultánea.","e":"La arquitectura Harvard utiliza buses y memorias separadas para datos e instrucciones. Dividir la caché L1 de esta manera (caché de instrucciones y caché de datos) es una implementación de la arquitectura Harvard a nivel de caché, lo que permite a la CPU obtener instrucciones y datos al mismo tiempo, mejorando el rendimiento."},{"i":"HW-ARQ-035","k":"1.2","d":"Avanzado","q":"En un contador de rizo (asíncrono) de 4 bits, el retardo de propagación de cada flip-flop es de 10 ns. ¿Cuál es el tiempo total que tarda el contador en pasar del estado 7 (0111) al estado 8 (1000)?","o":["10 ns","30 ns","40 ns"],"a":2,"h":"En un contador asíncrono, el cambio se propaga en cadena. Considera cuántos flip-flops deben cambiar de estado en esta transición.","e":"Al pasar de 0111 a 1000, todos los 4 flip-flops deben conmutar. El primer flip-flop cambia con el reloj. Su cambio provoca el cambio del segundo (10ns), el cambio del segundo provoca el del tercero (20ns), y el del tercero provoca el del cuarto (30ns). El estado no es estable hasta que el último flip-flop ha conmutado, lo que toma 4 retardos en total: 4 * 10ns = 40ns."},{"i":"HW-ARQ-036","k":"1.2","d":"Medio","q":"Un multiplexor de 8 a 1 (8x1 MUX) requiere de un cierto número de líneas de selección para determinar cuál de las 8 entradas se enruta a la salida. ¿Cuántas líneas de selección son necesarias?","o":["8 líneas","3 líneas","4 líneas"],"a":1,"h":"La relación entre el número de entradas (N) y las líneas de selección (S) es N = 2^S.","e":"Se necesitan 'S' líneas de selección para poder generar 2^S combinaciones binarias diferentes. Para seleccionar una de 8 entradas, se necesita generar 8 combinaciones (del 000 al 111). Esto requiere 3 líneas de selección, ya que 2^3 = 8."},{"i":"HW-ARQ-037","k":"1.2","d":"Medio","q":"¿Cuál es la principal diferencia entre memoria EEPROM y memoria Flash?","o":["La EEPROM es volátil, mientras que la Flash es no volátil.","La EEPROM permite borrar y escribir a nivel de byte, mientras que la Flash lo hace en bloques.","La EEPROM utiliza tecnología magnética y la Flash utiliza tecnología óptica."],"a":1,"h":"Piensa en la granularidad con la que se puede modificar la información en cada una.","e":"Ambas son memorias no volátiles. La diferencia fundamental radica en la unidad de borrado/escritura. Las EEPROM tradicionales permiten modificar bytes individuales, lo que las hace flexibles pero lentas y caras. La memoria Flash, en cambio, se borra y se escribe en bloques de muchos bytes, lo que la hace mucho más rápida y densa para almacenamiento masivo."},{"i":"HW-ARQ-038","k":"1.2","d":"Básico","q":"¿Cuál de las siguientes es una característica de la memoria volátil?","o":["Retiene la información incluso después de cortar el suministro de energía.","Se utiliza para almacenar permanentemente el firmware de un dispositivo.","Pierde toda la información almacenada cuando se interrumpe la alimentación eléctrica."],"a":2,"h":"La memoria RAM es el ejemplo más común de este tipo de memoria.","e":"La característica que define a la memoria volátil (como la SRAM y DRAM que componen la RAM) es que requiere un suministro continuo de energía para mantener almacenada la información. Al apagar el equipo, su contenido se pierde."},{"i":"HW-ARQ-039","k":"1.2","d":"Avanzado","q":"Un semisumador (Half Adder) puede ser construido utilizando únicamente dos tipos de compuertas lógicas. ¿Qué combinación es la correcta?","o":["Una compuerta AND y una compuerta OR.","Una compuerta XOR y una compuerta AND.","Dos compuertas NAND."],"a":1,"h":"El bit de Suma corresponde a la operación 'OR exclusivo', y el bit de Acarreo a la 'Y' lógica.","e":"Un semisumador tiene dos salidas: Suma (S) y Acarreo (Cout). La salida S = A ⊕ B (A XOR B), lo que requiere una compuerta XOR. La salida Cout = A ⋅ B (A AND B), lo que requiere una compuerta AND. Por lo tanto, se implementa con una compuerta XOR y una AND."},{"i":"HW-ARQ-040","k":"1.2","d":"Medio","q":"El bus de control en un sistema de cómputo se encarga de transportar señales como 'Memory Read', 'Memory Write' e 'Interrupt Request'. ¿Cuál es el propósito general de este bus?","o":["Indicar la ubicación de la memoria que se va a acceder.","Transportar los datos que se leen o escriben en la memoria.","Sincronizar y dirigir las operaciones entre los componentes del sistema."],"a":2,"h":"Actúa como el sistema de semáforos y señales de tráfico entre la CPU, la memoria y los periféricos.","e":"El bus de control no transporta datos ni direcciones, sino señales de temporización y comando que coordinan las actividades del sistema. Indica si la operación actual es una lectura o una escritura, si un dispositivo está listo, o si un periférico necesita la atención de la CPU, sincronizando así todo el flujo de información."},{"i":"HW-ARQ-041","k":"1.2","d":"Básico","q":"¿Cuál es la función de un 'program counter' (contador de programa) en una CPU?","o":["Contar el número de instrucciones que ha ejecutado un programa.","Almacenar la dirección de memoria de la instrucción que se está ejecutando actualmente.","Almacenar la dirección de memoria de la siguiente instrucción a ser ejecutada."],"a":2,"h":"Es el registro que le dice a la CPU a dónde ir a buscar la próxima tarea.","e":"El contador de programa (PC) es un registro de la CPU que contiene la dirección de memoria donde se encuentra la próxima instrucción que debe ser captada y ejecutada. Después de cada captación, el PC se incrementa automáticamente para apuntar a la siguiente instrucción en secuencia."},{"i":"HW-ARQ-042","k":"1.2","d":"Medio","q":"En un sistema de memoria, el 'Principio de Localidad' es fundamental para la eficacia de la caché. ¿A qué se refiere la 'localidad espacial'?","o":["A que si se accede a un dato, es probable que se vuelva a acceder a él pronto.","A que la memoria RAM está físicamente cerca de la CPU.","A que si se accede a un dato, es probable que se acceda a datos en ubicaciones de memoria cercanas."],"a":2,"h":"Piensa en cómo se organizan los datos en arreglos o las instrucciones en secuencia.","e":"La localidad espacial postula que si un programa accede a una dirección de memoria, es muy probable que sus próximos accesos sean a direcciones contiguas. Por eso, cuando ocurre un fallo de caché, no solo se trae el dato solicitado, sino un bloque entero de datos adyacentes a la caché."},{"i":"HW-ARQ-043","k":"1.2","d":"Medio","q":"¿Qué compuerta lógica universal puede ser utilizada para implementar cualquier otra función lógica (AND, OR, NOT) sin necesidad de otras compuertas?","o":["XOR","NAND","AND"],"a":1,"h":"Con esta compuerta (y también con su dual) se puede construir todo el conjunto de operaciones booleanas.","e":"La compuerta NAND (y también la NOR) es una compuerta universal. Se puede crear una función NOT conectando sus entradas. A partir de la NOT y la NAND, se pueden derivar las funciones AND y OR, y por lo tanto, cualquier otra función lógica."},{"i":"HW-ARQ-044","k":"1.2","d":"Medio","q":"¿Cuál es el contenido del acumulador después de ejecutar la siguiente secuencia de instrucciones en un procesador hipotético? 1. LDA #5 (Cargar 5), 2. ADD #3 (Sumar 3), 3. SHL (Desplazar a la izquierda 1 bit).","o":["8","9","16"],"a":2,"h":"Realiza las operaciones en orden. Recuerda que un desplazamiento a la izquierda de 1 bit equivale a una multiplicación por 2.","e":"1. LDA #5: El acumulador contiene 5 (0101 en binario). 2. ADD #3: El acumulador ahora contiene 5 + 3 = 8 (1000 en binario). 3. SHL: El contenido del acumulador (1000) se desplaza un bit a la izquierda, resultando en 10000 en binario, que es 16 en decimal."},{"i":"HW-ARQ-045","k":"1.2","d":"Básico","q":"En la jerarquía de memoria, ¿cuál es el compromiso fundamental que se debe gestionar entre los diferentes niveles?","o":["Velocidad vs. Capacidad y Costo","Volatilidad vs. No volatilidad","Acceso secuencial vs. Acceso aleatorio"],"a":0,"h":"No se puede tener una memoria que sea a la vez extremadamente rápida, enorme y barata.","e":"El principio de diseño de la jerarquía de memoria se basa en un compromiso: los niveles más altos (cercanos a la CPU, como los registros y la caché) son muy rápidos pero tienen poca capacidad y son caros por bit. Los niveles más bajos (como el almacenamiento secundario) son lentos pero tienen gran capacidad y son baratos."},{"i":"HW-ARQ-046","k":"1.2","d":"Medio","q":"¿Qué es el 'pipeline' o segmentación de cauce en una CPU moderna?","o":["Un bus de datos extra ancho para transferir más información a la vez.","Una técnica que permite que múltiples instrucciones se superpongan en su ejecución.","Un algoritmo de compresión de datos ejecutado por la ALU."],"a":1,"h":"Es análogo a una línea de ensamblaje industrial, donde varias unidades se trabajan simultáneamente en
