s una técnica de estimación ágil que utiliza tallas de camiseta (XS, S, M, L, XL) para asignar un tamaño relativo a las historias de usuario. Es más rápida que Planning Poker y se usa a menudo para estimaciones de alto nivel o para un backlog muy grande."},{"i":"SW-ING-046","k":"3.1","d":"Avanzado","q":"Un proyecto de software para un sistema bancario se encuentra en una fase donde el objetivo principal es mitigar los riesgos técnicos más importantes, definir y validar la arquitectura del sistema y tener un prototipo ejecutable. Según el Proceso Unificado de Rational (RUP), ¿en qué fase se encuentra el proyecto?","o":["Elaboración (Elaboration)","Inicio (Inception)","Construcción (Construction)"],"a":0,"h":"Esta es la segunda fase de RUP y se centra en establecer una base arquitectónica sólida para el sistema.","e":"La fase de Elaboración en RUP tiene como objetivo principal analizar el dominio del problema, establecer una arquitectura base, desarrollar el plan del proyecto y eliminar los riesgos más críticos. Al final de esta fase, se tiene una comprensión clara de la arquitectura y la mayoría de los requisitos."},{"i":"SW-ING-047","k":"3.1","d":"Medio","q":"Un equipo de desarrollo de un sistema de e-commerce entrega una primera versión que solo permite ver productos. En la siguiente entrega, la versión ya existente se refina para que la visualización de productos sea más rápida y con mejor calidad de imagen, pero sin añadir nuevas funcionalidades. ¿Qué modelo de desarrollo describe mejor este enfoque de refinamiento progresivo?","o":["Incremental","Iterativo","Cascada"],"a":1,"h":"Este modelo se enfoca en mejorar y refinar repetidamente el producto existente a través de ciclos de desarrollo.","e":"El modelo Iterativo se basa en la repetición y el refinamiento. Se comienza con una implementación inicial de un subconjunto de requisitos y se mejora iterativamente hasta que el sistema está completo. Se diferencia del incremental en que no necesariamente añade nuevas funcionalidades, sino que mejora las ya existentes."},{"i":"SW-ING-048","k":"3.1","d":"Avanzado","q":"Un analista necesita un método de estimación formal para un proyecto de software de gestión gubernamental. El método requiere identificar actores, casos de uso, clasificarlos por complejidad (simple, promedio, complejo) y ajustar el resultado con base en 13 factores técnicos y 8 factores ambientales. ¿Qué técnica de estimación se está describiendo?","o":["Story Points","UCP","COCOMO II"],"a":1,"h":"Este método se basa en el modelo de casos de uso de UML para predecir el tamaño y esfuerzo del software.","e":"Los Puntos de Caso de Uso (UCP) son un método de estimación de software que se utiliza durante las primeras fases del ciclo de vida. Se calcula el peso de los casos de uso no ajustados (UUCW), el peso de los actores no ajustados (UAW), y luego se ajusta con el Factor de Complejidad Técnica (TCF) y el Factor de Entorno (EF)."},{"i":"SW-ING-049","k":"3.1","d":"Medio","q":"El software para un dispositivo médico ha pasado todas las pruebas internas. Ahora, un grupo de usuarios finales (médicos y enfermeras) es invitado a las instalaciones de la empresa desarrolladora para usar el software en un entorno simulado y proporcionar retroalimentación antes del lanzamiento. ¿Cómo se denomina esta prueba?","o":["Prueba Beta","Prueba de Regresión","Prueba Alfa"],"a":2,"h":"Es un tipo de prueba de aceptación que se realiza en un entorno controlado por el equipo de desarrollo, pero con usuarios reales.","e":"La Prueba Alfa es una forma de prueba de aceptación interna. Se realiza para identificar errores antes de que el software sea liberado al público. Los usuarios finales prueban el software en el sitio del desarrollador, en un ambiente controlado."},{"i":"SW-ING-050","k":"3.1","d":"Avanzado","q":"Un desarrollador está trabajando en un módulo de exportación de reportes. Se da cuenta de que la clase `ReportGenerator` está fuertemente acoplada a las clases `PDFExporter` y `CSVExporter`. Para solucionar esto, decide crear una interfaz `IExporter`, de modo que `ReportGenerator` dependa de la abstracción `IExporter` y no de las implementaciones concretas. ¿Qué principio SOLID está aplicando?","o":["Principio de Responsabilidad Única (SRP)","Principio de Inversión de Dependencias (DIP)","Principio de Liskov (LSP)"],"a":1,"h":"Este principio establece que los módulos de alto nivel no deben depender de los módulos de bajo nivel; ambos deben depender de abstracciones.","e":"El Principio de Inversión de Dependencias (DIP) es clave para crear software desacoplado. Al hacer que la clase de alto nivel (`ReportGenerator`) dependa de una interfaz (`IExporter`) en lugar de clases concretas (`PDFExporter`), se invierte el flujo de dependencia tradicional, lo que permite cambiar o añadir nuevos exportadores sin modificar el generador de reportes."},{"i":"SW-ING-051","k":"3.1","d":"Medio","q":"Un equipo Scrum está en la sesión de Planning Poker para estimar una historia de usuario. Tres desarrolladores votan '3', uno vota '5' y un desarrollador junior vota '13'. ¿Qué debería hacer el equipo a continuación?","o":["Tomar el promedio de los votos y asignarlo a la historia.","Descartar el voto más alto y el más bajo y promediar el resto.","Pedir al desarrollador con el voto más alto (13) y a uno con el voto más bajo (3) que expliquen su razonamiento."],"a":2,"h":"El objetivo de esta técnica no es solo llegar a un número, sino fomentar la discusión y compartir el conocimiento.","e":"El valor de Planning Poker reside en la conversación que genera. Cuando hay una gran disparidad en las estimaciones, los miembros con los votos extremos (el más alto y el más bajo) deben explicar su perspectiva. Esto ayuda a descubrir supuestos no declarados, malentendidos sobre los requisitos o conocimientos técnicos que no todo el equipo posee."},{"i":"SW-ING-052","k":"3.1","d":"Básico","q":"Un cliente ha encargado un sistema de información. Al final del desarrollo, el equipo le entrega el software completo y funcional para que lo valide contra los requisitos originales. Este tipo de prueba, realizada por el cliente o usuario final en su propio entorno para decidir si aprueba el producto, se conoce como:","o":["Prueba de Sistema","Prueba de Integración","Prueba de Aceptación de Usuario (UAT)"],"a":2,"h":"Es la última fase de pruebas antes de que el software entre en producción y su objetivo es la validación final por parte del cliente.","e":"La Prueba de Aceptación de Usuario (UAT) es el proceso en el que se verifica que la solución funciona para el usuario en el 'mundo real'. El cliente la realiza para confirmar que el sistema cumple con sus necesidades y puede tomar la decisión de aceptar o rechazar el producto."},{"i":"SW-ING-053","k":"3.1","d":"Medio","q":"Para modelar el comportamiento de un objeto `Pedido` a lo largo de su vida, un analista necesita representar los diferentes estados por los que puede pasar (ej. 'Pendiente', 'Pagado', 'Enviado', 'Entregado') y las transiciones que lo hacen cambiar de un estado a otro (ej. 'recibirPago', 'enviarProducto'). ¿Qué diagrama de UML es el más adecuado?","o":["Diagrama de Actividad","Diagrama de Estados (State Machine Diagram)","Diagrama de Secuencia"],"a":1,"h":"Este diagrama es ideal para modelar el ciclo de vida de un objeto específico dentro del sistema.","e":"El Diagrama de Máquina de Estados (o Diagrama de Estados) se utiliza para describir el comportamiento dinámico de un objeto, mostrando la secuencia de estados por los que pasa en respuesta a eventos a lo largo de su vida."},{"i":"SW-ING-054","k":"3.1","d":"Medio","q":"Un arquitecto de software necesita mostrar la organización y las dependencias entre los componentes físicos de un sistema, tales como archivos ejecutables (.exe), bibliotecas (.dll) y archivos de configuración. ¿Qué diagrama de UML debe utilizar para esta representación?","o":["Diagrama de Clases","Diagrama de Despliegue (Deployment Diagram)","Diagrama de Componentes (Component Diagram)"],"a":2,"h":"Este diagrama de estructura de UML se enfoca en la vista de implementación del sistema.","e":"El Diagrama de Componentes modela la estructura física de un sistema de software, mostrando cómo se organiza el código en componentes (como bibliotecas, ejecutables, etc.) y las dependencias entre ellos. Es útil para entender la arquitectura a nivel de archivos y compilación."},{"i":"SW-ING-055","k":"3.1","d":"Avanzado","q":"Un equipo está desarrollando un sistema de renderizado de gráficos. La clase base `Shape` tiene un método `draw()`. Las clases derivadas como `Circle` y `Square` sobrescriben este método. Si una función que espera un objeto de tipo `Shape` recibe un `Circle`, debe poder llamar a `draw()` sin problemas y obtener el comportamiento de un círculo. ¿Qué principio de diseño se describe?","o":["Principio de Sustitución de Liskov (LSP)","Principio Abierto/Cerrado (OCP)","Principio de Segregación de Interfaces (ISP)"],"a":0,"h":"Este principio fundamental de la programación orientada a objetos establece que los objetos de una clase derivada deben poder sustituir a los objetos de la clase base sin alterar la corrección del programa.","e":"El Principio de Sustitución de Liskov (LSP) es una de las 'patas' de SOLID. Asegura que una subclase pueda ser usada en lugar de su superclase sin que el programa falle. Es crucial para mantener la integridad de las jerarquías de herencia y el polimorfismo."},{"i":"SW-ING-056","k":"3.1","d":"Medio","q":"Un equipo está construyendo una aplicación de software en varias etapas. En la primera etapa entregan un producto con las funcionalidades A y B. En la segunda, entregan un producto que ahora incluye las funcionalidades A, B, C y D. Cada entrega añade nuevas capacidades al producto. Este enfoque de desarrollo se conoce como:","o":["Modelo Iterativo","Modelo Incremental","Modelo en Espiral"],"a":1,"h":"Este modelo se enfoca en entregar el software en partes funcionales y crecientes.","e":"El Modelo Incremental divide el desarrollo en incrementos, donde cada incremento añade una nueva funcionalidad al sistema. El cliente recibe partes operativas del software a medida que se construyen, en lugar de esperar al final para recibir el producto completo."},{"i":"SW-ING-057","k":"3.1","d":"Básico","q":"Durante la fase de pruebas de un sistema de matrícula escolar, se realizan pruebas para verificar que el software completo funciona como un todo, evaluando la interacción entre todos sus módulos integrados (inscripción, pagos, control escolar) y que cumple con los requerimientos funcionales y no funcionales especificados. ¿Qué tipo de pruebas se están realizando?","o":["Pruebas Unitarias","Pruebas de Sistema","Pruebas de Componentes"],"a":1,"h":"Esta fase de pruebas evalúa el software completamente integrado en su entorno final (o uno muy similar).","e":"Las Pruebas de Sistema (System Testing) tienen como objetivo validar el sistema de software completo y totalmente integrado. Se verifica que el sistema cumple con todos los requisitos especificados y se comporta como se espera en su conjunto."},{"i":"SW-ING-058","k":"3.1","d":"Avanzado","q":"Un equipo de desarrollo ha acumulado una gran cantidad de 'deuda técnica' al tomar atajos en la calidad del código para cumplir con fechas de entrega agresivas. Ahora, se enfrentan a una situación donde añadir nuevas funcionalidades es extremadamente lento y propenso a errores. ¿Cuál es la mejor estrategia a largo plazo para manejar esta situación?","o":["Continuar desarrollando nuevas funcionalidades e ignorar la deuda.","Descartar el proyecto y empezar de cero.","Dedicar Sprints específicos o un porcentaje del tiempo de cada Sprint para refactorizar y pagar la deuda."],"a":2,"h":"La 'deuda técnica' es como una deuda financiera: si no se paga, los 'intereses' (costo del cambio) crecerán con el tiempo.","e":"La gestión proactiva de la deuda técnica es crucial para la sostenibilidad de un proyecto. La estrategia más recomendada es asignar tiempo de forma explícita para abordar los problemas de calidad del código, refactorizar y mejorar la arquitectura. Ignorarla solo empeora el problema, y reescribir todo suele ser demasiado costoso y arriesgado."},{"i":"SW-ING-059","k":"3.1","d":"Medio","q":"Un analista necesita modelar un flujo de trabajo que involucra a varios departamentos (Ventas, Almacén, Envíos) para procesar un pedido. Quiere visualizar claramente qué departamento es responsable de cada acción. ¿Qué elemento del Diagrama de Actividad de UML debería usar para separar y agrupar las acciones por responsable?","o":["Nodos de Decisión","Forks y Joins","Carriles (Swimlanes)"],"a":2,"h":"Este elemento organiza las actividades en columnas o filas, cada una correspondiente a un actor o unidad organizativa.","e":"Los Carriles (Swimlanes) en un Diagrama de Actividad son una herramienta poderosa para asignar responsabilidades. Permiten agrupar actividades según quién las realiza (un actor, un departamento, un sistema), lo que clarifica enormemente los flujos de trabajo interdepartamentales."},{"i":"SW-ING-060","k":"3.1","d":"Básico","q":"En el contexto de RUP (Rational Unified Process), el ciclo de vida del software se divide en cuatro fases secuenciales que son:","o":["Análisis, Diseño, Codificación, Pruebas","Inicio, Elaboración, Construcción, Transición","Planificación, Ejecución, Monitoreo, Cierre"],"a":1,"h":"Estas fases representan la dimensión temporal del proyecto, desde la concepción de la idea hasta la entrega del producto al cliente.","e":"El ciclo de vida de RUP se estructura en cuatro fases consecutivas: Inicio (establecer la viabilidad), Elaboración (definir la arquitectura), Construcción (desarrollar el producto) y Transición (entregar el producto a los usuarios)."},{"i":"SW-ING-061","k":"3.1","d":"Avanzado","q":"Un equipo de desarrollo de una aplicación web de alto tráfico está diseñando la arquitectura. Necesitan mostrar cómo los servidores web, los servidores de aplicaciones y los servidores de bases de datos (los nodos de hardware) se conectan entre sí y qué artefactos de software (ej. `webapp.war`, `database.sql`) se ejecutarán en cada uno. ¿Qué diagrama UML es el más apropiado para esta vista física?","o":["Diagrama de Componentes","Diagrama de Paquetes","Diagrama de Despliegue (Deployment Diagram)"],"a":2,"h":"Este diagrama se utiliza para modelar la topología del hardware y el software en un sistema.","e":"El Diagrama de Despliegue es el único diagrama de UML que se enfoca en la distribución física de los artefactos de un sistema en los nodos de hardware. Es esencial para planificar la infraestructura y entender cómo los componentes de software se ejecutan en el hardware físico o virtualizado."},{"i":"SW-ING-062","k":"3.1","d":"Medio","q":"Una nueva versión de una aplicación de redes sociales es liberada a un pequeño porcentaje de usuarios en una región específica para monitorear su comportamiento y detectar posibles problemas en un entorno real antes de lanzarla globalmente. ¿Qué tipo de prueba de aceptación se está llevando a cabo?","o":["Prueba de Humo (Smoke Test)","Prueba Alfa","Prueba Beta"],"a":2,"h":"Este tipo de prueba involucra a usuarios reales probando el producto en su propio entorno, fuera del control del desarrollador.","e":"La Prueba Beta (o 'beta testing') consiste en distribuir una versión casi final del producto a un grupo de usuarios externos para que la prueben en un entorno real. Su objetivo es obtener retroalimentación sobre la usabilidad, funcionalidad y detectar errores que no se encontraron en las pruebas internas."},{"i":"SW-ING-063","k":"3.1","d":"Avanzado","q":"Se está diseñando una clase `Impresora` que tiene métodos como `imprimir()`, `escanear()` y `enviarFax()`. Un cliente, que solo necesita una impresora simple, se ve obligado a depender de la interfaz completa, incluyendo los métodos de escaneo y fax que no utiliza. Esto viola un principio de diseño. ¿Cuál es la mejor solución aplicando los principios SOLID?","o":["Crear una única clase gigante que maneje todas las posibles funciones de una impresora.","Segregar la interfaz `IImpresora` en interfaces más pequeñas como `IImprimible`, `IEscaneable`, `IFaxeable`.","Usar el patrón Singleton para asegurar que solo haya una instancia de la impresora."],"a":1,"h":"Este principio SOLID sugiere que los clientes no deben ser forzados a depender de interfaces que no utilizan.","e":"Este escenario es una violación directa del Principio de Segregación de Interfaces (ISP). La solución correcta es dividir la interfaz 'gorda' en varias interfaces más pequeñas y específicas. De esta manera, los clientes solo necesitan depender de las interfaces que contienen los métodos que realmente necesitan, lo que conduce a un diseño más desacoplado y mantenible.","f":1},{"i":"SW-ING-064","k":"3.1","d":"Medio","q":"Una empresa de logística necesita visualizar el flujo de trabajo para la gestión de sus pedidos, desde la recepción hasta la entrega. El objetivo es identificar cuellos de botella y optimizar el proceso. ¿Qué notación es la más adecuada para modelar este proceso de negocio?","o":["Diagrama de Secuencia","BPMN","Diagrama de Clases"],"a":1,"h":"Esta notación se especializa en representar gráficamente los procesos de negocio de una manera estandarizada y comprensible tanto para perfiles técnicos como de negocio.","e":"BPMN está diseñado específicamente para modelar procesos de negocio. Permite detallar los pasos, decisiones, roles y flujos de información, lo que lo hace ideal para analizar y mejorar flujos de trabajo complejos como el de la gestión de pedidos."},{"i":"SW-ING-065","k":"3.1","d":"Medio","q":"Un equipo de desarrollo está construyendo un sistema para una biblioteca. Necesitan definir las entidades principales como 'Libro', 'Usuario' y 'Préstamo', junto con sus atributos, funciones y las relaciones entre ellas. ¿Qué diagrama UML es el más apropiado para esta tarea?","o":["Diagrama de Casos de Uso","Diagrama de Clases","Diagrama ER"],"a":1,"h":"Este diagrama es fundamental en el diseño orientado a objetos para describir la estructura estática de un sistema.","e":"El Diagrama de Clases es la herramienta UML estándar para modelar la estructura de un sistema. Permite definir las clases (entidades), sus atributos (propiedades) y los métodos (comportamientos), así como las relaciones de asociación, herencia y composición entre ellas."},{"i":"SW-ING-066","k":"3.1","d":"Avanzado","q":"Un ingeniero está documentando la interacción entre un 'CajeroAutomático', un 'Usuario' y el 'ServidorDelBanco' para la operación 'RetirarDinero'. Necesita mostrar el orden cronológico exacto en que se envían los mensajes entre estos objetos. ¿Qué diagrama UML debería utilizar?","o":["Diagrama de Comunicación","Diagrama de Componentes","Diagrama de Secuencia"],"a":2,"h":"Este tipo de diagrama se enfoca en la línea de vida de los objetos y el intercambio de mensajes a lo largo del tiempo.","e":"El Diagrama de Secuencia es ideal para visualizar interacciones complejas a lo largo del tiempo. Muestra los objetos participantes y los mensajes que intercambian, ordenados cronológicamente, lo que lo hace perfecto para detallar el flujo de una operación específica."},{"i":"SW-ING-067","k":"3.1","d":"Medio","q":"Una startup está desarrollando un producto innovador con requisitos muy inciertos. El cliente necesita ver avances funcionales cada dos semanas para dar retroalimentación y ajustar la dirección del proyecto. ¿Qué metodología ágil se adapta mejor a este escenario de entregas cortas y frecuentes?","o":["Scrum","RUP (Rational Unified Process)","Modelo en Cascada"],"a":0,"h":"Esta metodología se organiza en ciclos de trabajo cortos y fijos llamados 'Sprints', diseñados para entregar valor de forma incremental.","e":"Scrum es un marco de trabajo ágil que se basa en Sprints (generalmente de 2 a 4 semanas) para entregar incrementos de producto funcionales. Es ideal para proyectos con alta incertidumbre, ya que permite la inspección y adaptación continua basada en la retroalimentación del cliente."},{"i":"SW-ING-068","k":"3.1","d":"Avanzado","q":"Un equipo de mantenimiento de software gestiona un alto volumen de tickets (bugs, mejoras, etc.). Necesitan un sistema que les permita visualizar el flujo de trabajo de cada tarea y limitar la cantidad de trabajo en progreso para evitar cuellos de botella. ¿Qué metodología ágil es la más indicada?","o":["XP (Extreme Programming)","Prototipos","Kanban"],"a":2,"h":"El principio clave de esta metodología es visualizar el trabajo, limitar el 'Work in Progress' (WIP) y maximizar el flujo.","e":"Kanban es una metodología visual que se centra en la gestión del flujo de trabajo. Utiliza un tablero para representar las etapas del proceso y establece límites explícitos sobre cuántas tareas pueden estar en cada etapa a la vez (límite WIP), lo que ayuda a identificar y resolver cuellos de botella de manera eficiente."},{"i":"SW-ING-069","k":"3.1","d":"Medio","q":"Un analista de sistemas debe capturar los requerimientos funcionales de un nuevo sistema de E-commerce desde la perspectiva de los usuarios. Necesita describir las interacciones que un 'Cliente' o un 'Administrador' tendrán con el sistema. ¿Qué diagrama UML es el más adecuado?","o":["Diagrama de Secuencia","Diagrama Entidad Relación","Diagrama de Casos de Uso"],"a":2,"h":"Este diagrama modela la funcionalidad del sistema identificando los actores (usuarios) y las acciones que pueden realizar.","e":"El Diagrama de Casos de Uso se utiliza para describir la funcionalidad de un sistema desde el punto de vista del usuario. Define los 'actores' (roles que interactúan con el sistema) y los 'casos de uso' (las acciones o metas que los actores pueden lograr), proporcionando una visión de alto nivel de lo que el sistema debe hacer."},{"i":"SW-ING-070","k":"3.1","d":"Avanzado","q":"Una empresa constructora necesita estimar el esfuerzo para desarrollar un software de gestión de proyectos a medida. El sistema tiene una complejidad alta, y el equipo de desarrollo tiene una experiencia nominal en este tipo de proyectos. ¿Qué modelo de estimación de costos sería más apropiado para obtener una estimación precisa?","o":["T-Shirt Sizing","UCP (Use Case Points)","COCOMO II - Modelo Detallado"],"a":2,"h":"Este modelo de estimación considera múltiples 'conductores de costo' y las fases del desarrollo para refinar la estimación de esfuerzo y duración.","e":"El modelo COCOMO II Detallado es el más adecuado para esta situación, ya que permite una estimación precisa al incorporar factores como la complejidad del producto, las capacidades del personal, y los atributos del proyecto y la plataforma. A diferencia de modelos más simples, ofrece un análisis más granular del esfuerzo requerido."},{"i":"SW-ING-071","k":"3.1","d":"Medio","q":"Una aplicación de banca móvil será lanzada al mercado. Antes del lanzamiento, se debe asegurar que la app pueda manejar 10,000 usuarios concurrentes sin degradar su tiempo de respuesta. ¿Qué tipo de prueba no funcional se debe realizar?","o":["Prueba de Usabilidad","Prueba de Carga","Prueba de Regresión"],"a":1,"h":"Este tipo de prueba evalúa el comportamiento de un sistema bajo una carga de trabajo específica y anticipada.","e":"La Prueba de Carga es una prueba no funcional diseñada para medir el rendimiento de un sistema bajo una carga de usuarios esperada. Su objetivo es identificar los límites de capacidad y asegurar que la aplicación cumple con los requisitos de rendimiento antes de entrar en producción."},{"i":"SW-ING-072","k":"3.1","d":"Avanzado","q":"Una empresa desea integrar sus departamentos de ventas, marketing y servicio al cliente en una sola plataforma para tener una vista 360° de cada cliente. La solución debe gestionar contactos, historiales de interacción y automatizar campañas de marketing. ¿Qué tipo de sistema empresarial están buscando implementar?","o":["ERP (Enterprise Resource Planning)","ECM (Enterprise Content Management)","CRM (Customer Relationship Management)"],"a":2,"h":"Este sistema se centra específicamente en la gestión y análisis de las interacciones con los clientes y los datos a lo largo de su ciclo de vida.","e":"Un sistema CRM está diseñado para gestionar todas las relaciones e interacciones de una empresa con sus clientes actuales y potenciales. Su objetivo principal es mejorar las relaciones comerciales, ayudar a la retención de clientes e impulsar las ventas."},{"i":"SW-ING-073","k":"3.1","d":"Medio","q":"Un jefe de proyecto está iniciando un nuevo proyecto de desarrollo de software. Necesita definir el alcance, los entregables, los riesgos y el cronograma. ¿Qué guía de buenas prácticas le proporcionaría un marco de trabajo completo para la gestión del proyecto?","o":["Guía de Scrum","PMBOK","Manifiesto Ágil"],"a":1,"h":"Esta guía es un estándar reconocido internacionalmente que describe los procesos, herramientas y técnicas para la gestión de proyectos.","e":"El PMBOK, publicado por el PMI, es una guía exhaustiva que cubre las áreas de conocimiento de la gestión de proyectos, como la gestión del alcance, tiempo, costo, calidad, riesgos y comunicaciones. Proporciona un marco robusto para dirigir proyectos de manera exitosa."},{"i":"SW-ING-074","k":"3.1","d":"Avanzado","q":"Se está evaluando el código de una aplicación y se descubre que una clase 'ReportGenerator' es responsable de conectarse a la base de datos, ejecutar consultas SQL, formatear los datos en HTML y enviar el reporte por correo electrónico. ¿Qué principio de diseño se está violando flagrantemente?","o":["Principio de Inversión de Dependencias (DIP)","Principio de Responsabilidad Única (SRP)","Principio de Abierto/Cerrado (OCP)"],"a":1,"h":"Este principio establece que una clase debe tener una, y solo una, razón para cambiar.","e":"El Principio de Responsabilidad Única (SRP) se viola porque la clase 'ReportGenerator' tiene múltiples responsabilidades (acceso a datos, lógica de negocio, presentación y comunicación). Un cambio en el formato del email o en la base de datos requeriría modificar la misma clase, haciéndola frágil y difícil de mantener. La solución sería segregar estas responsabilidades en clases diferentes."},{"i":"SW-ING-075","k":"3.1","d":"Medio","q":"Un equipo de desarrollo utiliza una herramienta que genera automáticamente el esqueleto del código a partir de diagramas UML y ayuda a mantener sincronizados el modelo y el código. ¿Qué tipo de herramienta están utilizando?","o":["IDE","Herramienta CASE","Sistema de Control de Versiones"],"a":1,"h":"Estas herramientas están diseñadas para automatizar y dar soporte a las actividades del ciclo de vida del desarrollo de software.","e":"Las herramientas CASE (Computer-Aided Software Engineering) están diseñadas para ayudar en el análisis, diseño, implementación y mantenimiento de software. La generación de código a partir de modelos (como UML) y la sincronización entre diseño y código (ingeniería directa e inversa) son características clave de las herramientas CASE."},{"i":"SW-ING-076","k":"3.1","d":"Avanzado","q":"Una aplicación financiera debe ser extremadamente segura. Se contrata a un equipo de hackers éticos para que intenten activamente explotar vulnerabilidades en el sistema de producción, como inyección SQL o Cross-Site Scripting (XSS). ¿Qué tipo de prueba no funcional se está realizando?","o":["Prueba de Estrés","Prueba de Penetración","Prueba de Recuperación"],"a":1,"h":"Este tipo de prueba simula un ataque de una fuente maliciosa para encontrar fallos de seguridad.","e":"La Prueba de Penetración (o pentesting) es una simulación de ataque autorizada sobre un sistema informático para evaluar su seguridad. El objetivo es identificar y explotar vulnerabilidades para determinar el nivel de riesgo y proponer contramedidas."},{"i":"SW-ING-077","k":"3.1","d":"Medio","q":"Una empresa quiere implementar un sistema centralizado para gestionar todos sus recursos empresariales, incluyendo finanzas, contabilidad, recursos humanos, producción y cadena de suministro. ¿Qué tipo de software empresarial satisface esta necesidad?","o":["CRM","ERP","BI"],"a":1,"h":"Este tipo de sistema integra las funciones de negocio clave de una organización en una única plataforma.","e":"Un sistema ERP integra y gestiona los procesos de negocio principales de una organización en tiempo real. Su propósito es facilitar el flujo de información entre todas las funciones empresariales y gestionar las conexiones con las partes interesadas externas."},{"i":"SW-ING-078","k":"3.1","d":"Avanzado","q":"Un equipo ágil practica la 'programación en parejas' y mantiene un 'ritmo sostenible' para evitar el agotamiento. Además, priorizan la 'simplicidad' en el diseño y practican la 'integración continua'. ¿Qué metodología ágil están siguiendo con mayor probabilidad?","o":["Scrum","Kanban","XP"],"a":2,"h":"Esta metodología se distingue por su enfoque en prácticas técnicas de ingeniería de software para mejorar la calidad.","e":"La programación en parejas, la integración continua, el ritmo sostenible y la simplicidad son algunas de las prácticas centrales de XP (Extreme Programming). Mientras que Scrum se enfoca en el marco de gestión del proyecto, XP se enfoca en las prácticas de ingeniería que conducen a un software de alta calidad."},{"i":"SW-ING-079","k":"3.1","d":"Medio","q":"El director de un hospital necesita un panel de control para visualizar en tiempo real métricas clave como el número de pacientes ingresados, la ocupación de camas y el tiempo de espera en urgencias. ¿Qué herramienta de gestión de la información le permitiría lograr esto?","o":["Un sistema transaccional (OLTP)","Un sistema de gestión documental (ECM)","Un Dashboard de Business Intelligence"],"a":2,"h":"Esta herramienta se especializa en la visualización de datos y la presentación de indicadores clave de rendimiento (KPIs).","e":"Un Dashboard es una herramienta de visualización de datos que muestra métricas y KPIs importantes para una organización. Su propósito es proporcionar una vista rápida y fácil de entender del rendimiento actual, lo que permite a los gerentes tomar decisiones informadas."},{"i":"SW-ING-080","k":"3.1","d":"Avanzado","q":"Un sistema de control de tráfico aéreo sufre una caída de energía. Se necesita verificar que, tras restaurar la energía, el sistema reinicia correctamente, obtiene su estado previo y vuelve a operar sin pérdida de datos críticos. ¿Qué tipo de prueba no funcional valida este comportamiento?","o":["Prueba de Recuperación","Prueba de Resistencia","Prueba de Volumen"],"a":0,"h":"Este tipo de prueba evalúa la capacidad de una aplicación para recuperarse de fallos, caídas o desastres.","e":"La Prueba de Recuperación es una prueba no funcional que fuerza al sistema a fallar de diversas maneras (ej. cortando la red, reiniciando el servidor) y verifica si es capaz de recuperarse adecuadamente y volver a un estado operativo normal, asegurando la integridad de los datos."},{"i":"SW-ING-081","k":"3.1","d":"Medio","q":"Un cliente solicita el desarrollo de una aplicación móvil, pero no tiene claros todos los requisitos. Para mitigar el riesgo, el equipo de desarrollo decide construir una versión funcional pero limitada de la app para que el cliente pueda interactuar con ella y definir mejor sus necesidades. ¿Qué metodología están aplicando?","o":["RAD (Rapid Application Development)","Desarrollo por Prototipos","Modelo en V"],"a":1,"h":"Esta metodología se centra en crear modelos o maquetas funcionales de un sistema para la validación temprana de los requisitos.","e":"El desarrollo por Prototipos es ideal cuando los requisitos no están claros. Al crear un prototipo, los usuarios pueden ver, tocar y experimentar con una versión preliminar del sistema, lo que facilita la obtención de retroalimentación precisa y la clarificación de los requisitos antes de invertir en el desarrollo completo."},{"i":"SW-ING-082","k":"3.1","d":"Avanzado","q":"Una organización necesita definir un lenguaje común para modelar sus sistemas de software. Quieren utilizar un estándar abierto, gestionado por un consorcio sin fines de lucro, que sea ampliamente reconocido en la industria. ¿A qué organización y estándar se están refiriendo?","o":["Microsoft y .NET","Oracle y Java","OMG (Object Management Group) y UML"],"a":2,"h":"Esta organización es responsable de mantener y desarrollar estándares tecnológicos, incluyendo el lenguaje de modelado más popular.","e":"El Object Management Group (OMG) es un consorcio internacional que crea y mantiene estándares para la industria de la tecnología. Uno de sus estándares más conocidos es UML (Unified Modeling Language), que es el lenguaje de modelado visual estándar para especificar, visualizar, construir y documentar los artefactos de un sistema de software."},{"i":"SW-ING-083","k":"3.1","d":"Avanzado","q":"Una aplicación de streaming de video necesita ser probada para asegurar que puede funcionar de manera continua durante 72 horas bajo una carga de usuarios considerable sin que se produzcan fugas de memoria (memory leaks) o una degradación del rendimiento. ¿Qué tipo de prueba no funcional es la más adecuada?","o":["Prueba de Resistencia","Prueba de Picos","Prueba de Humo"],"a":0,"h":"También conocida como 'soak testing', esta prueba verifica la estabilidad y el rendimiento del sistema durante un período prolongado.","e":"La Prueba de Resistencia (Endurance Testing) tiene como objetivo evaluar cómo se comporta un sistema cuando se somete a una carga significativa durante un largo período de tiempo. Es fundamental para detectar problemas como fugas de memoria, agotamiento de recursos o degradación del rendimiento que solo se manifiestan tras un uso continuado."},{"i":"SW-ING-084","k":"3.1","d":"Medio","q":"Un equipo de desarrollo está construyendo un sistema de gestión de documentos para un bufete de abogados. El sistema debe permitir almacenar, versionar, indexar y buscar miles de documentos de forma segura. ¿Qué categoría de sistema empresarial se necesita?","o":["ERP","CRM","ECM"],"a":2,"h":"Este tipo de sistema se especializa en las estrategias, métodos y herramientas utilizadas para capturar, gestionar, almacenar, preservar y entregar contenido y documentos.","e":"Un sistema de Gestión de Contenido Empresarial (ECM) está diseñado para manejar el ciclo de vida completo del contenido no estructurado, como documentos de Word, PDFs, correos electrónicos e imágenes. Es la solución ideal para organizaciones que necesitan gestionar grandes volúmenes de documentos de manera eficiente y segura."},{"i":"SW-ING-085","k":"3.1","d":"Avanzado","q":"Un proyecto de software tiene un cronograma muy ajustado de 4 meses y requisitos bien definidos. Se decide utilizar un enfoque de desarrollo que se basa en la creación de prototipos, la reutilización de componentes y entregas incrementales para acelerar el proceso. ¿Qué metodología se alinea mejor con este enfoque?","o":["RAD","RUP","Scrum"],"a":0,"h":"Esta metodología prioriza la velocidad de entrega sobre la planificación exhaustiva, haciendo un uso intensivo de prototipos y herramientas CASE.","e":"El modelo de Desarrollo Rápido de Aplicaciones (RAD) es un enfoque adaptativo que enfatiza la entrega rápida y de alta calidad. Se basa en ciclos de desarrollo muy cortos, el uso de prototipos, la participación activa del usuario y la reutilización de componentes para comprimir el tiempo de desarrollo, siendo ideal para proyectos con plazos ajustados y requisitos claros."},{"i":"SW-ING-086","k":"3.1","d":"Medio","q":"Se debe probar la nueva interfaz de usuario de una aplicación para asegurar que sea intuitiva y fácil de usar para el público objetivo. Se recluta a un grupo de usuarios finales para que realicen tareas específicas mientras un observador toma notas sobre sus dificultades y comentarios. ¿Qué tipo de prueba no funcional se está llevando a cabo?","o":["Prueba de Aceptación","Prueba de Compatibilidad","Prueba de Usabilidad"],"a":2,"h":"Este tipo de prueba se enfoca en la experiencia del usuario (UX) y la facilidad con la que puede interactuar con el software.","e":"La Prueba de Usabilidad evalúa qué tan fácil de usar es un producto de software. Se observa a usuarios reales interactuando con el sistema para identificar problemas de diseño, flujos confusos o cualquier barrera que impida una experiencia de usuario satisfactoria y eficiente."},{"i":"SW-ING-087","k":"3.1","d":"Avanzado","q":"En un proyecto Scrum, al final de un Sprint, el equipo presenta el incremento de producto funcional a los stakeholders para obtener su retroalimentación. Posteriormente, el equipo tiene una reunión interna para reflexionar sobre su proceso y decidir qué mejoras pueden implementar en el siguiente Sprint. ¿Qué dos eventos de Scrum se describen?","o":["Backlog Refinement y Sprint Review","Sprint Review y Sprint Retrospective","Sprint Planning y Daily Scrum"],"a":1,"h":"El primer evento se centra en el 'qué' (el producto) y el segundo en el 'cómo' (el proceso del equipo).","e":"La Sprint Review es la reunión donde el equipo de desarrollo muestra lo que se ha logrado durante el Sprint y colabora con los stakeholders sobre los próximos pasos. La Sprint Retrospective es una reunión para que el equipo se inspeccione a sí mismo y cree un plan de mejoras que se abordarán durante el próximo Sprint."},{"i":"SW-PROG-001","k":"3.2","d":"Básico","q":"¿Cuál es la complejidad temporal promedio de búsqueda en una tabla hash bien dimensionada?","o":["O(1)","O(log n)","O(n)"],"a":0,"h":"Promedio con baja colisión","e":"Con buena función hash y factor de carga, la búsqueda esperada es O(1); peor caso es O(n)."},{"i":"SW-PROG-002","k":"3.2","d":"Medio","q":"¿Qué política de planificación de CPU puede causar inanición si no se controla?","o":["Round Robin","SJF (Shortest Job First)","FIFO"],"a":1,"h":"Tareas largas postergadas","e":"SJF favorece trabajos cortos; si llegan continuamente, tareas largas pueden esperar indefinidamente."},{"i":"SW-PROG-003","k":"3.2","d":"Medio","q":"El mecanismo de protección que aísla procesos mediante tablas de páginas pertenece a…","o":["Gestión de memoria","Planificador de E/S","Gestor de archivos"],"a":0,"h":"MMU","e":"La memoria virtual con página/segmentación aísla espacios de direcciones por proceso."},{"i":"SW-PROG-004","k":"3.2","d":"Medio","q":"Una empresa de e-commerce experimenta un problema donde dos hilos intentan actualizar el stock de un producto simultáneamente, resultando en un inventario incorrecto. ¿Qué fenómeno de concurrencia está ocurriendo?","o":["Interbloqueo (Deadlock)","Condición de carrera (Race Condition)","Inanición (Starvation)"],"a":1,"h":"Ocurre cuando el resultado de una operación depende del orden impredecible de ejecución de hilos.","e":"Una condición de carrera sucede cuando múltiples hilos acceden a un recurso compartido (el stock) y al menos uno lo modifica, llevando a resultados inconsistentes."},{"i":"SW-PROG-005","k":"3.2","d":"Medio","q":"Un ingeniero está diseñando una API para una aplicación móvil que requiere bajo consumo de ancho de banda y respuestas fácilmente interpretables en el cliente. ¿Qué arquitectura de API sería la más adecuada?","o":["SOAP","RPC","REST"],"a":2,"h":"Esta arquitectura utiliza métodos HTTP estándar y formatos como JSON.","e":"REST es ideal para aplicaciones móviles por ser ligero, sin estado y usar formatos de datos como JSON, que son más eficientes en ancho de banda que el XML de SOAP."},{"i":"SW-PROG-006","k":"3.2","d":"Avanzado","q":"En una aplicación de software, se necesita una clase que defina una plantilla para subclases de 'Vehiculo', pero que también implemente un método concreto para 'registrarNumeroSerie()'. ¿Qué estructura de POO se debe utilizar?","o":["Interfaz","Clase Final","Clase Abstracta"],"a":2,"h":"Permite combinar métodos sin implementación (abstractos) con métodos ya implementados.","e":"Una clase abstracta es perfecta para este caso, ya que puede contener tanto métodos abstractos (que las subclases deben implementar) como métodos concretos (con funcionalidad compartida)."},{"i":"SW-PROG-007","k":"3.2","d":"Medio","q":"Un cliente requiere un sistema que pueda crear diferentes tipos de reportes (PDF, Excel, CSV) sin que el código principal conozca los detalles de la creación de cada formato. ¿Qué patrón de diseño GoF es el más apropiado?","o":["Facade","Adapter","Factory Method"],"a":2,"h":"Este patrón de creación delega la instanciación de objetos a las subclases.","e":"El patrón Factory Method permite que una clase delegue la responsabilidad de instanciar objetos a sus subclases, encapsulando la lógica de creación y desacoplando el cliente de las clases concretas."},{"i":"SW-PROG-008","k":"3.2","d":"Medio","q":"Un programador en un lenguaje como Java o C# no gestiona la liberación de memoria manualmente. ¿Qué componente del entorno de ejecución se encarga de esta tarea para prevenir fugas de memoria?","o":["Compilador","Garbage Collector","Scheduler"],"a":1,"h":"Este mecanismo automático identifica y libera objetos que ya no están en uso.","e":"El Garbage Collector es un proceso automático que gestiona la memoria, liberando los objetos que ya no son referenciados por ninguna parte del programa."},{"i":"SW-PROG-009","k":"3.2","d":"Básico","q":"Un desarrollador quiere asegurarse de que un recurso, como un archivo, se cierre siempre, incluso si ocurre un error durante su procesamiento. ¿Qué bloque de manejo de excepciones garantiza esta ejecución?","o":["finally","try","catch"],"a":0,"h":"Este bloque se ejecuta después del 'try' y 'catch', independientemente de si se lanzó una excepción.","e":"El bloque 'finally' está diseñado para contener código de limpieza (como cerrar archivos o conexiones) que debe ejecutarse sin importar si ocurrió un error o no."},{"i":"SW-PROG-010","k":"3.2","d":"Avanzado","q":"Un sistema operativo necesita ejecutar un proceso de 500 MB en una memoria RAM física de solo 256 MB. ¿Qué técnica de gestión de memoria permite esto, cargando solo las partes necesarias del proceso en memoria?","o":["Segmentación","Paginación por demanda","Asignación contigua"],"a":1,"h":"Técnica de memoria virtual que trae 'páginas' a la memoria solo cuando se necesitan.","e":"La paginación por demanda es una estrategia de memoria virtual que permite ejecutar procesos más grandes que la memoria física al cargar las páginas del disco a la RAM únicamente cuando son referenciadas."},{"i":"SW-PROG-011","k":"3.2","d":"Básico","q":"Un arquitecto de software está modelando la estructura estática de un sistema, mostrando entidades como 'Cliente', 'Pedido' y 'Producto' y sus relaciones (asociación, herencia). ¿Qué diagrama UML debería utilizar?","o":["Diagrama de Secuencia","Diagrama de Casos de Uso","Diagrama de Clases"],"a":2,"h":"Este diagrama es fundamental para visualizar la arquitectura de un sistema orientado a objetos.","e":"El Diagrama de Clases es el indicado para describir la estructura de un sistema mostrando sus clases, atributos, métodos y las relaciones estáticas entre ellos."},{"i":"SW-PROG-012","k":"3.2","d":"Medio","q":"En un sistema de gestión de empleados, se tiene la clase base 'Empleado' y la subclase 'Gerente'. Si 'Gerente' redefine el método 'calcularSalario()' de 'Empleado' para incluir un bono, ¿qué concepto de POO se está aplicando?","o":["Encapsulamiento","Sobrescritura","Abstracción"],"a":1,"h":"Permite a una subclase proporcionar una implementación específica para un método ya definido en su superclase.","e":"La sobrescritura (Override) es un pilar del polimorfismo que permite a una clase hija modificar el comportamiento de un método heredado de su clase padre."},{"i":"SW-PROG-013","k":"3.2","d":"Avanzado","q":"Un desarrollador de un sistema embebido para un dron debe elegir un lenguaje de programación. La velocidad de ejecución es crítica. ¿Qué tipo de traductor de lenguaje ofrecerá un mejor rendimiento en tiempo de ejecución?","o":["Intérprete","Compilador","Transpilador"],"a":1,"h":"Este traductor convierte todo el código fuente a código máquina antes de la primera ejecución.","e":"Un compilador traduce el código fuente a código máquina nativo, lo que resulta en una ejecución mucho más rápida en comparación con un intérprete, que traduce línea por línea en tiempo de ejecución."},{"i":"SW-PROG-014","k":"3.2","d":"Medio","q":"Una aplicación web necesita realizar una llamada a una API externa para obtener datos. Para evitar que la interfaz de usuario se congele mientras espera la respuesta, ¿qué tipo de función se debe utilizar?","o":["Función estática","Función recursiva","Función asíncrona"],"a":2,"h":"Estas funciones se ejecutan en segundo plano, permitiendo que el programa principal continúe su ejecución.","e":"Las funciones asíncronas (async/await) permiten realizar operaciones de larga duración (como peticiones de red) sin bloquear el hilo principal de ejecución, mejorando la responsividad de la aplicación."},{"i":"SW-PROG-015","k":"3.2","d":"Avanzado","q":"Un sistema operativo utiliza un algoritmo de planificación que asigna la CPU al proceso que ha esperado más tiempo. Sin embargo, se observa que procesos cortos tienen que esperar mucho si un proceso largo llegó primero. ¿Qué algoritmo se está usando?","o":["Shortest Job First (SJF)","Round Robin","First-Come, First-Served (FIFO)"],"a":2,"h":"Es el algoritmo de planificación más simple, pero puede generar un 'efecto convoy'.","e":"FIFO (o FCFS) es un algoritmo no apropiativo que puede causar que procesos cortos esperen detrás de procesos largos que acaparan la CPU, resultando en un tiempo de espera promedio elevado."},{"i":"SW-PROG-016","k":"3.2","d":"Básico","q":"Un desarrollador define una clase 'Calculadora' con un método 'sumar(a, b)' que no necesita acceder a ningún estado o atributo de una instancia de la clase. ¿Cómo debería declarar este método para optimizar su uso?","o":["Como método privado","Como método estático","Como método abstracto"],"a":1,"h":"Este tipo de método pertenece a la clase en sí, no a una instancia particular.","e":"Un método estático es apropiado cuando la funcionalidad no depende del estado de un objeto. Se puede llamar directamente desde la clase (ej. Calculadora.sumar()) sin necesidad de crear una instancia."},{"i":"SW-PROG-017","k":"3.2","d":"Medio","q":"En una empresa se desarrolla un sistema crítico donde los errores deben detectarse lo antes posible, durante la fase de desarrollo. ¿Qué tipo de sistema de tipado es más conveniente para este proyecto?","o":["Tipado dinámico","Tipado débil","Tipado estático"],"a":2,"h":"Las comprobaciones de tipo se realizan en tiempo de compilación, no de ejecución.","e":"El tipado estático (como en Java o C++) permite al compilador verificar la coherencia de tipos antes de ejecutar el programa, capturando muchos errores comunes de forma temprana."},{"i":"SW-PROG-018","k":"3.2","d":"Avanzado","q":"Un software intermediario (middleware) se instala para facilitar la comunicación entre una aplicación web legada y un nuevo sistema de análisis de datos. ¿Cuál es la función principal de este software?","o":["Traducir el código fuente a código máquina.","Gestionar el acceso directo al hardware del servidor.","Proveer interoperabilidad entre aplicaciones heterogéneas."],"a":2,"h":"Actúa como un 'pegamento' o puente entre diferentes componentes de software.","e":"El middleware está diseñado para conectar sistemas de software dispares, ofreciendo servicios de mensajería, autenticación, gestión de transacciones y comunicación, ocultando la complejidad de las plataformas subyacentes."},{"i":"SW-PROG-019","k":"3.2","d":"Básico","q":"Un programador define una clase 'Usuario' y oculta el atributo 'contraseña' haciéndolo privado, permitiendo su modificación solo a través de un método 'cambiarContraseña()'. ¿Qué pilar de la POO se está aplicando?","o":["Herencia","Polimorfismo","Encapsulamiento"],"a":2,"h":"Consiste en agrupar datos y los métodos que operan sobre ellos, ocultando los detalles internos.","e":"El encapsulamiento protege la integridad de los datos de un objeto al restringir el acceso directo a sus atributos y exponer solo una interfaz pública (métodos) para interactuar con ellos."},{"i":"SW-PROG-020","k":"3.2","d":"Medio","q":"En el proceso de compilación, una fase se encarga de verificar que la secuencia de tokens (ej. 'int x = y +;') siga las reglas gramaticales del lenguaje. ¿Cuál es esta fase?","o":["Análisis sintáctico","Análisis léxico","Análisis semántico"],"a":0,"h":"Construye un árbol de derivación o árbol de sintaxis abstracta (AST) a partir de los tokens.","e":"El análisis sintáctico (parsing) comprueba si la estructura del código es gramaticalmente correcta según las reglas del lenguaje, organizando los tokens en una estructura jerárquica."},{"i":"SW-PROG-021","k":"3.2","d":"Medio","q":"Un ingeniero necesita que varias clases no relacionadas ('Impresora', 'EmailNotifier', 'Logger') implementen un método 'notificar(mensaje)'. ¿Qué estructura de POO debería usar para garantizar que todas tengan este método?","o":["Una clase abstracta","Una interfaz 'Notificable'","Un método estático global"],"a":1,"h":"Define un contrato de comportamiento que las clases pueden implementar sin necesidad de herencia.","e":"Una interfaz es la herramienta ideal para definir un contrato que múltiples clases pueden cumplir, garantizando que implementen ciertos métodos, sin imponer una relación de herencia entre ellas."},{"i":"SW-PROG-022","k":"3.2","d":"Avanzado","q":"En un sistema de gestión de memoria, las variables locales de una función, que tienen un tiempo de vida corto y predecible, se almacenan típicamente en una región de memoria de acceso rápido. ¿Cuál es esta región?","o":["Heap (Montículo)","BSS (Block Started by Symbol)","Stack (Pila)"],"a":2,"h":"Esta región de memoria sigue una estructura LIFO (Last-In, First-Out) para la gestión de llamadas a funciones.","e":"La pila (Stack) es una región de memoria utilizada para almacenar variables locales y el contexto de las llamadas a funciones. Es muy eficiente porque la asignación y liberación de memoria es simplemente mover un puntero."},{"i":"SW-PROG-023","k":"3.2","d":"Medio","q":"Una aplicación requiere una única instancia de la clase 'AppConfig' para toda la ejecución, que gestione la configuración global. ¿Qué patrón de diseño GoF asegura que solo exista un objeto de esta clase?","o":["Singleton","Prototype","Builder"],"a":0,"h":"Este patrón creacional restringe la instanciación de una clase a un solo objeto.","e":"El patrón Singleton garantiza que una clase solo tenga una instancia y proporciona un punto de acceso global a ella. Es útil para gestionar recursos compartidos como configuraciones o conexiones a bases de datos."},{"i":"SW-PROG-024","k":"3.2","d":"Medio","q":"Un programa necesita leer datos de configuración desde un archivo de texto al iniciar. ¿Qué componente del software base es el responsable de gestionar el acceso y la lectura de esta información en el disco?","o":["El planificador de CPU","El gestor de memoria","El sistema de archivos del SO"],"a":2,"h":"Abstrae los detalles del dispositivo de almacenamiento y presenta una vista lógica de archivos y directorios.","e":"El sistema de archivos es un componente del sistema operativo que se encarga de organizar, almacenar, recuperar y gestionar los archivos en los dispositivos de almacenamiento."},{"i":"SW-PROG-025","k":"3.2","d":"Avanzado","q":"Según los principios GRASP, se debe asignar una responsabilidad a la clase que tiene la información necesaria para cumplirla. Un cliente pide implementar el cálculo del total de una 'Orden', que conoce sus 'LineaDeOrden'. ¿A qué clase se debe asignar esta responsabilidad?","o":["A la clase 'Cliente'","A la clase 'Orden'","A una nueva clase 'CalculadorTotal'"],"a":1,"h":"Este principio se conoce como 'Experto en Información'.","e":"El principio GRASP de Experto en Información sugiere que la responsabilidad debe recaer en la clase que posee los datos necesarios. Como 'Orden' conoce sus líneas de detalle y sus precios, es la experta para calcular su propio total."},{"i":"SW-PROG-026","k":"3.2","d":"Básico","q":"Una desarrolladora está escribiendo un programa en JavaScript. Declara una variable con 'let x = 10;' y luego le asigna un string 'x = \"hola\";'. El programa funciona sin errores. ¿Qué característica del lenguaje lo permite?","o":["Tipado dinámico","Tipado estático","Programación funcional"],"a":0,"h":"El tipo de una variable se determina en tiempo de ejecución, no en compilación.","e":"JavaScript es un lenguaje de tipado dinámico, lo que significa que una misma variable puede contener valores de diferentes tipos a lo largo de la ejecución del programa."},{"i":"SW-PROG-027","k":"3.2","d":"Medio","q":"En un sistema, un objeto 'Factura' puede ser enviado a diferentes destinos ('Impresora', 'Email', 'PDFGenerator'). Se implementa una función 'enviarDocumento(doc, destino)' que funciona diferente según el tipo de 'destino'. ¿Qué pilar de POO permite este comportamiento?","o":["Abstracción","Herencia","Polimorfismo"],"a":2,"h":"Significa 'muchas formas' y permite que un mismo método se comporte de manera diferente según el objeto que lo invoca.","e":"El polimorfismo permite tratar objetos de diferentes clases de manera uniforme. La función 'enviarDocumento' puede invocar un método 'imprimir()' en el objeto 'destino', y la acción correcta se ejecutará dependiendo de si el destino es una Impresora, un Email, etc."},{"i":"SW-PROG-028","k":"3.2","d":"Medio","q":"Al encender una computadora, un software fundamental se encarga de inicializar el hardware y cargar el gestor de arranque del sistema operativo. ¿Cómo se llama este software almacenado en la placa base?","o":["Kernel","BIOS/UEFI","Shell"],"a":1,"h":"Actúa como la primera capa de software que se ejecuta al arrancar el sistema.","e":"El BIOS (Basic Input/Output System) o su sucesor UEFI es el firmware que se ejecuta al encender el PC. Realiza pruebas de hardware (POST) y luego carga el sistema operativo desde un dispositivo de almacenamiento."},{"i":"SW-PROG-029","k":"3.2","d":"Avanzado","q":"Un equipo de desarrollo está migrando una funcionalidad que procesa colecciones de datos. El código original usa bucles 'for' con múltiples variables de estado. Para mejorar la legibilidad y evitar efectos secundarios, proponen usar funciones como map(), filter() y reduce(). ¿Qué paradigma de programación están adoptando?","o":["Programación Imperativa","Programación Orientada a Objetos","Programación Funcional"],"a":2,"h":"Este paradigma trata la computación como la evaluación de funciones matemáticas y evita el estado mutable.","e":"La programación funcional favorece el uso de funciones puras y de orden superior para procesar datos, lo que reduce la complejidad y los errores asociados al estado mutable que es común en la programación imperativa."},{"i":"SW-PROG-030","k":"3.2","d":"Medio","q":"Un desarrollador que trabaja en C++ debe gestionar la memoria para un objeto grande. Si olvida liberar la memoria asignada con 'new' usando 'delete', ¿qué problema grave se introduce en la aplicación?","o":["Error de compilación","Fuga de memoria (Memory Leak)","Excepción de puntero nulo (Null Pointer Exception)"],"a":1,"h":"Ocurre cuando la memoria asignada dinámicamente ya no es necesaria pero no se libera.","e":"En lenguajes con manejo manual de memoria como C++, no liberar la memoria asignada provoca una fuga de memoria, donde el programa consume cada vez más memoria del sistema hasta agotarla o ser terminado por el SO."},{"i":"SW-PROG-031","k":"3.2","d":"Avanzado","q":"Un sistema de software tiene una clase 'InterfazUsuario' que realiza llamadas directas a la clase 'BaseDeDatos'. Un cambio en la base de datos obliga a modificar la interfaz de usuario. Según los principios GRASP, ¿qué principio se está violando?","o":["Bajo Acoplamiento (Low Coupling)","Alta Cohesión","Creador (Creator)"],"a":0,"h":"Este principio busca reducir la dependencia entre módulos.","e":"Se viola el principio de Bajo Acoplamiento, que promueve la independencia entre clases. Una dependencia directa entre la UI y la BD crea un alto acoplamiento; lo ideal sería introducir una capa de servicio intermedia."},{"i":"SW-PROG-032","k":"3.2","d":"Medio","q":"Un servidor web necesita atender múltiples peticiones de clientes de forma concurrente. El sistema operativo crea unidades de ejecución ligeras que comparten el mismo espacio de memoria para gestionar estas peticiones eficientemente. ¿Qué son estas unidades?","o":["Procesos","Hilos (Threads)","Sockets"],"a":1,"h":"Son conocidos como 'procesos ligeros' y su creación es más rápida que la de los procesos pesados.","e":"Los hilos son unidades de ejecución adecuadas para este escenario, ya que comparten recursos como la memoria, lo que permite una comunicación rápida y reduce la sobrecarga de creación y cambio de contexto en comparación con los procesos."},{"i":"SW-PROG-033","k":"3.2","d":"Avanzado","q":"Se requiere integrar un sistema bancario que expone sus servicios a través de una API con un contrato estricto, seguridad robusta (WS-Security) y transaccionalidad garantizada. ¿Qué tecnología de API es la más apropiada para estos requisitos?","o":["REST","GraphQL","SOAP"],"a":2,"h":"Esta tecnología se basa en XML y tiene estándares bien definidos para operaciones complejas y seguridad.","e":"SOAP es la elección para sistemas empresariales que requieren un contrato formal (WSDL), transacciones distribuidas y características de seguridad avanzadas, a pesar de ser más verboso que REST."},{"i":"SW-PROG-034","k":"3.2","d":"Medio","q":"Un ingeniero de software está diseñando una clase 'Coche'. En lugar de que la clase 'Coche' herede de una clase 'Motor', decide incluir una instancia de la clase 'Motor' como un atributo. ¿Qué principio de diseño se está favoreciendo?","o":["Composición sobre herencia","Herencia sobre composición","Encapsulamiento de datos"],"a":0,"h":"Este principio promueve la flexibilidad y evita las jerarquías de clases rígidas.","e":"Se favorece la 'Composición sobre herencia'. La composición ('tiene un' - un Coche tiene un Motor) es más flexible que la herencia ('es un'), ya que permite cambiar el comportamiento en tiempo de ejecución y reduce el acoplamiento entre clases."},{"i":"SW-PROG-035","k":"3.2","d":"Avanzado","q":"Un desarrollador de una aplicación en un lenguaje como Java o C# nota que el programa se ejecuta lentamente al inicio, pero su rendimiento mejora significativamente después de un tiempo. ¿Qué tipo de traductor de lenguaje explica este comportamiento?","o":["Compilador Just-In-Time (JIT)","Intérprete puro","Compilador Ahead-Of-Time (AOT)"],"a":0,"h":"Compila el bytecode a código máquina nativo en tiempo de ejecución para las partes del código que se usan con más frecuencia.","e":"El compilador JIT, parte de la máquina virtual, identifica el código 'caliente' (hot code) y lo compila a código nativo mientras la aplicación se ejecuta. Esto causa una sobrecarga inicial pero resulta en un rendimiento optimizado a largo plazo."},{"i":"SW-PROG-036","k":"3.2","d":"Medio","q":"Un programa debe procesar un archivo de video de 4 GB. Para evitar cargar todo el archivo en memoria RAM de una sola vez y agotar los recursos, se decide leerlo en pequeños bloques de datos. ¿Cómo se llama esta técnica de manejo de archivos?","o":["Acceso directo","Lectura en búfer (Buffered Reading)","Mapeo de memoria (Memory Mapping)"],"a":1,"h":"Utiliza una memoria intermedia para reducir el número de costosas llamadas al sistema de E/S.","e":"La lectura en búfer consiste en leer porciones de un archivo en una memoria temporal (el búfer). Esto es mucho más eficiente para archivos grandes, ya que minimiza el consumo de RAM y las operaciones de disco."},{"i":"SW-PROG-037","k":"3.2","d":"Avanzado","q":"En un sistema de reservas de vuelos, se debe asegurar que solo un hilo a la vez pueda modificar el número de asientos disponibles en un vuelo para evitar sobreventas. ¿Qué mecanismo de sincronización es el más adecuado para proteger esta operación crítica?","o":["Una variable booleana 'ocupado'","Un mutex (cerrojo de exclusión mutua)","Un bucle de espera activa (spin-lock)"],"a":1,"h":"Este mecanismo garantiza que una sección crítica del código sea ejecutada por un solo hilo a la vez.","e":"Un mutex es el primitivo de sincronización estándar para garantizar la exclusión mutua. Un hilo adquiere el cerrojo antes de entrar a la sección crítica (actualizar asientos) y lo libera al salir, bloqueando a otros hilos que intenten entrar."},{"i":"SW-PROG-038","k":"3.2","d":"Medio","q":"Un programador Java está utilizando una función para abrir un archivo. El compilador le obliga a envolver la llamada en un bloque try-catch o a declarar que su método lanza una 'IOException'. ¿Qué tipo de excepción es 'IOException'?","o":["Excepción verificada (Checked Exception)","Excepción no verificada (Unchecked Exception)","Error"],"a":0,"h":"Estas excepciones deben ser manejadas obligatoriamente por el programador en tiempo de compilación.","e":"Las excepciones verificadas en Java (como IOException) representan condiciones de error recuperables que un programa debe anticipar y manejar. El compilador impone esta regla para crear código más robusto."},{"i":"SW-PROG-039","k":"3.2","d":"Avanzado","q":"En un sistema de notificaciones, un cliente necesita enviar una notificación con formato simple, pero en el futuro podría necesitar añadir cifrado y compresión sin modificar el código original del notificador. ¿Qué patrón de diseño GoF permite añadir estas responsabilidades dinámicamente?","o":["Adapter","Decorator","Facade"],"a":1,"h":"Este patrón estructural envuelve un objeto para proporcionarle una funcionalidad adicional.","e":"El patrón Decorator es ideal para añadir funcionalidades a objetos de forma dinámica y transparente, envolviendo el objeto original con otros objetos que añaden el comportamiento deseado (ej. CifradoDecorator, CompresionDecorator)."},{"i":"SW-PROG-040","k":"3.2","d":"Medio","q":"Un desarrollador crea un objeto 'Cliente' con 'new Cliente()'. Este objeto contiene datos que deben persistir mientras otras partes del programa lo referencien. ¿En qué segmento de memoria se almacena este objeto?","o":["Stack (Pila)","Data Segment","Heap (Montículo)"],"a":2,"h":"Es la región de memoria para la asignación dinámica, gestionada por el programador o un recolector de basura.","e":"Los objetos creados dinámicamente (con 'new' o 'malloc') se almacenan en el Heap. A diferencia del Stack, su tiempo de vida no está ligado al de la función que los creó, sino que depende de cuándo dejen de ser referenciados."},{"i":"SW-PROG-041","k":"3.2","d":"Avanzado","q":"En un diagrama de clases UML, se modela una 'Universidad' y sus 'Departamentos'. Si la Universidad es destruida, los Departamentos también lo son. ¿Qué tipo de relación representa este fuerte vínculo de 'parte-todo'?","o":["Asociación","Agregación","Composición"],"a":2,"h":"Es una forma fuerte de agregación donde el ciclo de vida de la parte depende del todo.","e":"La Composición es la relación UML que modela una dependencia existencial. La parte (Departamento) no puede existir sin el todo (Universidad). Se representa con un rombo relleno del lado del contenedor."},{"i":"SW-PROG-042","k":"3.2","d":"Medio","q":"En una aplicación multi-hilo, se comparte un objeto de configuración que, una vez creado, nunca debe cambiar. ¿Qué propiedad debe tener este objeto para garantizar su seguridad en un entorno concurrente sin necesidad de cerrojos (locks)?","o":["Debe ser abstracto","Debe ser inmutable","Debe ser serializable"],"a":1,"h":"Un objeto con esta propiedad no puede ser modificado después de su creación.","e":"La inmutabilidad es una estrategia poderosa para la programación concurrente. Si un objeto no puede cambiar de estado, múltiples hilos pueden leerlo simultáneamente sin riesgo de condiciones de carrera, eliminando la necesidad de sincronización."},{"i":"SW-PROG-043","k":"3.2","d":"Avanzado","q":"Un cliente de una API REST realiza una petición 'PUT /productos/123' con los mismos datos dos veces seguidas. El estado del recurso en el servidor no cambia después de la primera petición. ¿Qué propiedad del método HTTP se está demostrando?","o":["Seguridad (Safety)","Idempotencia","Cacheabilidad"],"a":1,"h":"Esta propiedad garantiza que múltiples peticiones idénticas tienen el mismo efecto que una sola.","e":"La idempotencia es una propiedad clave de los métodos HTTP como PUT y DELETE. Significa que repetir la operación no produce un resultado diferente, lo que hace las APIs más robustas frente a fallos de red."},{"i":"SW-PROG-044","k":"3.2","d":"Medio","q":"Una empresa define un 'ContratoDeServicio' que especifica los métodos que cualquier proveedor de servicios debe implementar, pero no quiere proporcionar ninguna implementación por defecto. ¿Qué construcción de lenguaje es la más apropiada para definir este contrato?","o":["Clase Abstracta con solo métodos abstractos","Interfaz","Clase Final"],"a":1,"h":"Es un tipo de referencia puramente abstracto; una clase puede implementar múltiples de ellas.","e":"Una Interfaz es la herramienta perfecta para definir un contrato estricto de comportamiento (API) sin ninguna implementación. Permite desacoplar completamente la definición del comportamiento de su ejecución concreta."},{"i":"SW-PROG-045","k":"3.2","d":"Medio","q":"Durante la compilación de un programa, una fase inicial lee el código fuente como una secuencia de caracteres y lo convierte en una secuencia de componentes léxicos llamados 'tokens' (ej. palabras clave, identificadores, operadores). ¿Cómo se llama esta fase?","o":["Análisis Sintáctico","Generación de Código","Análisis Léxico"],"a":2,"h":"También se le conoce como 'scanner' o 'tokenizador'.","e":"El Análisis Léxico es la primera fase del compilador. Su función es agrupar los caracteres en unidades con significado propio (tokens), que serán la entrada para la siguiente fase, el análisis sintáctico."},{"i":"SW-PROG-046","k":"3.2","d":"Medio","q":"Un sistema operativo interactivo ejecuta varios procesos de usuario. Para asegurar que ningún proceso monopolice la CPU y que todos tengan una respuesta rápida, el planificador le asigna a cada proceso un pequeño intervalo de tiempo. ¿Qué algoritmo de planificación es este?","o":["First-Come, First-Served (FCFS)","Shortest Job First (SJF)","Round Robin"],"a":2,"h":"Utiliza una cola circular y un 'quantum' de tiempo.","e":"Round Robin es un algoritmo de planificación apropiativo diseñado para sistemas de tiempo compartido. Asigna a cada proceso un pequeño 'quantum' de tiempo de CPU; si el proceso no termina, se mueve al final de la cola, garantizando la equidad."},{"i":"SW-PROG-047","k":"3.2","d":"Avanzado","q":"Una aplicación de mapas necesita calcular rutas para coches, bicicletas y peatones. En lugar de usar un 'if/else' gigante en la clase 'CalculadorRuta', se decide encapsular cada algoritmo de cálculo en su propia clase. ¿Qué patrón de diseño permite intercambiar estos algoritmos en tiempo de ejecución?","o":["Strategy","Observer","Template Method"],"a":0,"h":"Este patrón de comportamiento define una familia de algoritmos y los hace intercambiables.","e":"El patrón Strategy es perfecto para este caso. Permite definir una familia de algoritmos (RutaCoche, RutaBici), encapsular cada uno en una clase separada y hacer que sus objetos sean intercambiables, desacoplando el cliente de la implementación concreta del algoritmo."},{"i":"SW-PROG-048","k":"3.2","d":"Avanzado","q":"En un sistema concurrente, un hilo escribe en una variable compartida mientras otros hilos la leen. Para asegurar que los cambios hechos por el escritor sean inmediatamente visibles para los lectores, sin usar un cerrojo (lock), ¿qué palabra clave se puede usar en lenguajes como Java o C++?","o":["static","volatile","final"],"a":1,"h":"Garantiza que las lecturas y escrituras de una variable se realicen directamente desde la memoria principal.","e":"La palabra clave 'volatile' previene que el compilador o la CPU realicen optimizaciones como el cacheo de la variable en registros, asegurando que cada lectura vea el valor más reciente escrito por cualquier hilo."},{"i":"SW-PROG-049","k":"3.2","d":"Avanzado","q":"Un sistema de base de datos sufre un corte de energía inesperado. Al reiniciar, el sistema puede recuperar un estado consistente rápidamente, evitando la corrupción de datos. ¿Qué característica del sistema de archivos moderno permite esto?","o":["Fragmentación","Journaling","Compresión de archivos"],"a":1,"h":"Mantiene un registro de los cambios que aún no se han completado en el sistema de archivos.","e":"Un sistema de archivos con journaling (como ext4, NTFS) escribe los cambios en un registro (journal) antes de aplicarlos a la estructura principal del sistema de archivos. En caso de fallo, puede 'reproducir' el journal para restaurar la consistencia."},{"i":"SW-PROG-050","k":"3.2","d":"Medio","q":"Se tiene un arreglo de objetos de tipo 'Figura', que contiene instancias de 'Circulo' y 'Cuadrado'. Al iterar y llamar al método 'dibujar()' en cada objeto, se ejecuta la implementación correcta para cada forma específica. ¿Cómo se llama este mecanismo de POO?","o":["Enlace estático (Static Binding)","Enlace dinámico (Dynamic Binding)","Sobrecarga (Overloading)"],"a":1,"h":"La decisión de qué método ejecutar se toma en tiempo de ejecución, no en compilación.","e":"El enlace dinámico (o despacho dinámico) es el mecanismo que implementa el polimorfismo. La Máquina Virtual o el runtime determina en tiempo de ejecución qué versión específica de un método (el de Círculo o el de Cuadrado) debe ser invocada, basándose en el tipo real del objeto."},{"i":"SW-PROG-051","k":"3.2","d":"Medio","q":"En una aplicación de larga duración, un objeto 'Listener' se registra a un objeto 'FuenteDeEventos'. Más tarde, la 'FuenteDeEventos' se mantiene activa pero el 'Listener' ya no es necesario. Si el programador no anula el registro del 'Listener', ¿qué problema puede ocurrir?","o":["Condición de carrera","Fuga de memoria","Interbloqueo"],"a":1,"h":"El objeto 'FuenteDeEventos' mantiene una referencia al 'Listener', impidiendo que sea recolectado por el Garbage Collector.","e":"Este es un caso clásico de fuga de memoria en lenguajes con recolección de basura. Aunque el 'Listener' ya no se usa lógicamente, la referencia que mantiene la 'FuenteDeEventos' evita que el Garbage Collector lo elimine, consumiendo memoria innecesariamente."},{"i":"SW-PROG-052","k":"3.2","d":"Medio","q":"Un cliente de una aplicación web realiza una acción que desencadena una operación larga en el servidor. En lugar de recibir el resultado directamente, la aplicación recibe un objeto que representa el resultado eventual de esa operación. ¿Cómo se conoce a este objeto en la programación asíncrona?","o":["Callback","Promesa o Futuro","Generador (Generator)"],"a":1,"h":"Este objeto actúa como un marcador de posición para un valor que se resolverá en el futuro.","e":"Las Promesas o Futuros son un pilar de la programación asíncrona moderna. Encapsulan una operación pendiente y permiten encadenar acciones (.then(), .catch()) que se ejecutarán cuando la operación se complete con éxito o falle."},{"i":"SW-PROG-053","k":"3.2","d":"Avanzado","q":"Se está revisando una clase 'GestorDeTodo' que se encarga de la lógica de negocio, el acceso a datos y la presentación de la interfaz de usuario. Según los principios GRASP, esta clase viola un principio fundamental. ¿Cuál es?","o":["Bajo Acoplamiento","Controlador (Controller)","Alta Cohesión (High Cohesion)"],"a":2,"h":"Este principio establece que las responsabilidades de una clase deben estar fuertemente relacionadas y enfocadas.","e":"La clase viola el principio de Alta Cohesión. Una clase cohesiva tiene un conjunto de responsabilidades bien definidas y relacionadas. Una clase que 'hace de todo' tiene baja cohesión, es difícil de entender, mantener y reutilizar."},{"i":"DATA-ALG-001","k":"3.3","d":"Básico","q":"Una base de datos con propiedades ACID asegura, entre otras, que las transacciones…","o":["Sean opcionalmente atómicas","Sean consistentes y durables","No requieran aislamiento"],"a":1,"h":"Atomicidad, Consistencia, Aislamiento, Durabilidad","e":"ACID: atomicidad, consistencia, aislamiento y durabilidad. Son principios clave del modelo transaccional."},{"i":"DATA-ALG-002","k":"3.3","d":"Medio","q":"¿Qué índice mejora consultas por prefijo de texto (p. ej., LIKE 'abc%')?","o":["Árbol B+","Índice hash puro","Bitmap"],"a":0,"h":"Ordenado y apto para rangos","e":"Árboles B/B+ mantienen orden y son excelentes para rangos/prefijos; hash no soporta rangos eficientemente."},{"i":"DATA-ALG-003","k":"3.3","d":"Medio","q":"El costo temporal del Quicksort promedio es…","o":["O(n log n)","O(n)","O(n^2)"],"a":0,"h":"Particionamiento recursivo","e":"Quicksort promedio O(n log n); peor caso O(n^2) con pivote muy desequilibrado."},{"i":"DATA-ALG-004","k":"3.3","d":"Básico","q":"En un sistema de la industria financiera se deben ejecutar alrededor de 15 operaciones de `insert` y `update` sobre la tabla de saldos de clientes, y se desea que todas las operaciones funcionen como una unidad. ¿Cuál es el módulo del DBMS que permite este comportamiento?","o":["Transacciones","DML","Optimizador"],"a":0,"h":"Piensa en las propiedades ACID que garantizan la integridad de los datos.","e":"Una transacción agrupa múltiples operaciones en una sola unidad de trabajo lógica. Si una operación falla, todas las operaciones anteriores se revierten, asegurando que la base de datos permanezca en un estado consistente."},{"i":"DATA-ALG-005","k":"3.3","d":"Medio","q":"Se tiene la tabla `colonia` (`cve_colonia`, `colonia`) y se necesita agregar el campo para el código postal. ¿Cuál es la instrucción DDL que se debe de realizar?","o":["ALTER TABLE colonia ADD COLUMN cp VARCHAR2(5);","INSERT INTO colonia(cve_colonia, colonia, cp) VALUES (1,'Escandón', 11320);","ALTER TABLE colonia ADD cp VARCHAR2(5);"],"a":2,"h":"Recuerda que DDL (Lenguaje de Definición de Datos) se usa para modificar la estructura de la base de datos, no los datos en sí.","e":"La sintaxis `ALTER TABLE nombre_tabla ADD nombre_columna TIPO_DATO;` se utiliza para agregar una nueva columna a una tabla existente. La opción A es incorrecta en algunas sintaxis de SQL (como Oracle) donde `COLUMN` no se especifica, y la B es una operación DML para insertar datos."},{"i":"DATA-ALG-006","k":"3.3","d":"Básico","q":"Al verificar la estructura de una base de datos, se encuentra una tabla duplicada (`tipo_cliente`) con un nombre diferente que debe ser eliminada por completo. ¿Cuál es la instrucción DDL que borra tanto la definición de la tabla como todo su contenido?","o":["DELETE FROM tipo_cliente;","DROP TABLE tipo_cliente;","ALTER TABLE tipo_cliente DROP COLUMN descr;"],"a":1,"h":"`DELETE` es parte de la manipulación de datos.","e":"`DROP TABLE` es una operación DDL que elimina permanentemente la estructura y todos los datos de una tabla. `DELETE FROM` es una operación DML que solo elimina las filas, pero la tabla sigue existiendo."},{"i":"DATA-ALG-007","k":"3.3","d":"Medio","q":"En un sistema de control vehicular, algunos usuarios ven solo datos del vehículo (marca, modelo) mientras que otros ven lo mismo además de los datos del propietario. La base de datos contiene ambos y un tercer dato que es el número de identificación del vehículo. ¿Qué propiedad de las bases de datos relacionales permite estas diferentes percepciones?","o":["Compartida","Integridad","Independencia"],"a":2,"h":"Se refiere a la capacidad de cambiar la estructura de la base de datos a un nivel sin afectar al nivel superior.","e":"La independencia lógico-física de los datos permite que diferentes usuarios o aplicaciones tengan vistas distintas (vistas lógicas) de los mismos datos almacenados (vista física), sin que los cambios en una afecten a la otra."},{"i":"DATA-ALG-008","k":"3.3","d":"Básico","q":"El Álgebra Relacional es la base teórica de las bases de datos relacionales. ¿Cuáles de las siguientes son dos de sus operaciones fundamentales?","o":["Suma y resta","Unión y reunión natural (Natural Join)","Intersección y Distribución"],"a":1,"h":"Piensa en operaciones de conjuntos aplicadas a tablas y en cómo se combinan tablas.","e":"La Unión (UNION) combina las filas de dos tablas con la misma estructura, mientras que la Reunión Natural (NATURAL JOIN) combina filas de dos tablas basándose en columnas con el mismo nombre y tipo de dato."},{"i":"DATA-ALG-009","k":"3.3","d":"Medio","q":"¿Qué condición es indispensable para poder efectuar la operación de Unión entre dos relaciones (tablas)?","o":["Que los grados (número de columnas) de las relaciones sean iguales y las columnas correspondientes compartan el mismo dominio (tipo de dato).","Que el conjunto de encabezados (nombres de columnas) sea exactamente igual.","Que la operación esté definida como parte del modelo relacional."],"a":0,"h":"Para que las filas de dos tablas se puedan apilar, deben 'encajar' perfectamente.","e":"La operación de Unión requiere que las dos relaciones sean compatibles en su estructura: deben tener el mismo número de atributos (columnas) y cada atributo correspondiente debe ser del mismo tipo de dato (dominio)."},{"i":"DATA-ALG-010","k":"3.3","d":"Medio","q":"¿Qué conjunto de operaciones del Álgebra Relacional comparte la misma restricción de compatibilidad de estructura para poderse ejecutar?","o":["Unión, Intersección y Diferencia","Unión, Intersección y Multiplicación (Producto Cartesiano)","Unión, Reunión y Resta"],"a":0,"h":"Estas tres operaciones provienen directamente de la teoría de conjuntos.","e":"Tanto la Unión como la Intersección y la Diferencia son operaciones binarias que requieren que las dos relaciones involucradas tengan el mismo número de columnas y que los tipos de datos de las columnas correspondientes sean compatibles."},{"i":"DATA-ALG-011","k":"3.3","d":"Medio","q":"El resultado de la multiplicación (Producto Cartesiano) de dos relaciones R1 y R2 origina:","o":["Una relación con un grado (número de columnas) igual a la suma de los grados de cada relación y una cardinalidad (número de filas) igual a la multiplicación de las dos cardinalidades.","Una relación con una cardinalidad (número de filas) igual a la suma de las dos cardinalidades y un grado (número de columnas) igual a la multiplicación de los grados.","Dos relaciones con el mismo grado y cardinalidad."],"a":0,"h":"El Producto Cartesiano combina cada fila de la primera tabla con cada fila de la segunda. Analiza qué pasa con las columnas.","e":"El grado de la relación resultante del producto cartesiano es la suma de los grados de las relaciones originales (Grado(R1) + Grado(R2)). La cardinalidad resultante es el producto de las cardinalidades (Cardinalidad(R1) * Cardinalidad(R2))."},{"i":"DATA-ALG-012","k":"3.3","d":"Medio","q":"En una base de datos relacional, ¿qué propiedad asegura que las transacciones se completen en su totalidad o no se apliquen en absoluto, manteniendo la integridad de los datos?","o":["Atomicidad","Consistencia","Durabilidad"],"a":0,"h":"Esta propiedad garantiza que una transacción es una unidad indivisible de trabajo.","e":"La Atomicidad es una de las propiedades ACID (Atomicidad, Consistencia, Aislamiento, Durabilidad) que asegura que todas las operaciones dentro de una transacción se completen exitosamente; si alguna falla, todas las operaciones se revierten, dejando la base de datos en su estado original."},{"i":"DATA-ALG-013","k":"3.3","d":"Medio","q":"En una base de datos relacional, ¿qué propiedad asegura que una vez que una transacción ha sido confirmada (commit), sus cambios son permanentes y sobreviven a fallos del sistema?","o":["Durabilidad","Aislamiento","Consistencia"],"a":0,"h":"Esta propiedad garantiza que los cambios realizados por una transacción confirmada no se pierdan.","e":"La Durabilid
